 Bus Boycott.","keywords":[["381","1956","supreme court","king","unconstitutional"]],"model":"After 381 days the Supreme Court ruled bus segregation unconstitutional (1956), and King became a national leader."}]},"flashcards":[{"id":"f1","s":"s1","q":"How was the North different from the South?","a":"No legal segregation, but discrimination in jobs and housing created ghettos.","hint":"De facto."},{"id":"f2","s":"s2","q":"Why was Brown v Board important?","a":"It made school segregation unconstitutional — but 'all deliberate speed' allowed delay.","hint":"1954."},{"id":"f3","s":"s3","q":"Why was the Montgomery boycott significant?","a":"Showed peaceful mass protest could work; desegregated buses; made King a leader.","hint":"381 days."},{"id":"f4","s":"s3","q":"Why was Little Rock significant?","a":"The President used federal troops to enforce desegregation — but only reluctantly.","hint":"Eisenhower."},{"id":"f5","s":"s4","q":"Why was the 1957 Civil Rights Act limited?","a":"Weakened by southern senators; did little to increase black voting in practice.","hint":"Weak but first."}],"checklist":[{"id":"k1","level":"describe","text":"I can describe segregation and discrimination in the 1950s and the roles of the Supreme Court and Congress.","sections":["s1"]},{"id":"k2","level":"explain","text":"I can explain the importance of Brown v Board and the death of Emmett Till.","sections":["s2"]},{"id":"k3","level":"explain","text":"I can explain the key events and significance of Montgomery and Little Rock.","sections":["s3"]},{"id":"k4","level":"judge","text":"I can judge the significance of the 1957 Civil Rights Act and the revival of the KKK.","sections":["s4"]}],"exam":{"questions":[{"id":"q1","qtype":"p1b","label":"Teacher-created practice question","sections":["s3"],"q":"Explain two effects of the Montgomery Bus Boycott on the civil rights movement.","markscheme":null},{"id":"q2","qtype":"p1c","label":"Teacher-created practice question","sections":["s2","s3","s4"],"q":"‘The most important development for civil rights in the 1950s was the Brown v Board of Education decision.’\nHow far do you agree? Explain your answer.","prompts":["Brown v Board of Education","the Montgomery Bus Boycott"],"markscheme":null}]},"stretch":[{"id":"t1","kind":"Relative significance","task":"Courts or protest — which did more for civil rights in the 1950s?"},{"id":"t2","kind":"Evaluation","task":"Why did the federal government act so slowly in the 1950s? Give three reasons."}]},"y11-us-3":{"id":"y11-us-3","course":"y11","area":"us","kt":"Key topic 3","order":13,"title":"The impact of civil rights protests, 1960–74","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following 4HI1 Depth study 7, key topic 3."},"learn":{"intro":"In the 1960s sit-ins, Freedom Rides and mass marches forced the federal government to pass major civil rights laws. Later in the decade, frustration led many towards Black Power.","sections":[{"id":"s1","title":"1. Sit-ins, Freedom Riders and the Meredith case","blocks":[{"p":"Sit-ins: on 1 February 1960 four black students sat at a whites-only lunch counter in Greensboro, North Carolina, and refused to leave. Sit-ins spread across the South, and many lunch counters desegregated. The Student Nonviolent Coordinating Committee (SNCC) was set up in April 1960."},{"p":"Freedom Rides (1961): CORE sent black and white volunteers on buses through the South to test whether bus stations obeyed the law against segregation. At Anniston, Alabama, a bus was firebombed (May 1961); in Birmingham riders were beaten. The government eventually enforced desegregation of bus terminals."},{"p":"Voting rights and the Meredith case: in 1962 James Meredith tried to enrol at the University of Mississippi. Riots broke out and two people were killed; President Kennedy sent federal marshals and troops, and Meredith graduated in 1963."}],"terms":["sit-in","SNCC","CORE","Freedom Riders"],"evidence":["1 February 1960: Greensboro sit-in.","May 1961: Anniston bus firebombing.","1962: James Meredith at the University of Mississippi."]},{"id":"s2","title":"2. Martin Luther King's methods and campaigns","blocks":[{"p":"King believed in non-violent direct action: peaceful protest that would provoke a violent response from racists, which the media would show to the world, forcing the government to act."},{"p":"Birmingham, Alabama (1963): police chief 'Bull' Connor used dogs and fire hoses on protesters, including children. Television pictures shocked the nation and President Kennedy proposed a civil rights bill."},{"p":"The March on Washington (28 August 1963): about 250,000 people marched; King gave his 'I have a dream' speech, showing the movement's huge support."},{"p":"Mississippi Freedom Summer (1964): volunteers registered black voters; three workers — James Chaney, Andrew Goodman and Michael Schwerner — were murdered. The Civil Rights Act (July 1964) banned segregation in public places and discrimination in jobs."},{"p":"Selma (1965): marchers for voting rights were attacked by police on 'Bloody Sunday' (7 March). Shocked by the pictures, Congress passed the Voting Rights Act (August 1965), banning literacy tests."}],"terms":["non-violent direct action","March on Washington","Freedom Summer","Civil Rights Act 1964","Voting Rights Act 1965"],"evidence":["1963: Birmingham campaign.","28 August 1963: March on Washington, about 250,000.","July 1964: Civil Rights Act.","7 March 1965: Bloody Sunday.","August 1965: Voting Rights Act."]},{"id":"s3","title":"3. The Nation of Islam, Malcolm X and Black Power","blocks":[{"p":"The Nation of Islam called for black separation, not integration. Its best-known speaker, Malcolm X, criticised King's non-violence and argued black people should defend themselves 'by any means necessary'. He left the Nation of Islam in 1964 and was assassinated in February 1965."},{"p":"Reasons for Black Power: slow progress in the North, poverty in the ghettos, police brutality, and anger at the violence used against peaceful protesters. In 1966 Stokely Carmichael of SNCC popularised the slogan 'Black Power', meaning black pride and black control of black communities."},{"p":"Race riots: in August 1965 riots in the Watts district of Los Angeles left 34 dead; more riots followed in other cities. The Black Panthers, founded in 1966 by Bobby Seale and Huey Newton, carried guns to monitor the police and ran community programmes such as free breakfasts for children."},{"p":"1968 Olympics: in Mexico City, US athletes Tommie Smith and John Carlos raised black-gloved fists on the medal podium — a Black Power salute seen around the world."}],"terms":["Nation of Islam","Black Power","Black Panthers","Watts riots"],"evidence":["February 1965: Malcolm X assassinated.","August 1965: Watts riots, 34 dead.","1966: 'Black Power' slogan; Black Panthers founded.","October 1968: Olympic salute."]}],"timeline":[{"date":"Feb 1960","event":"Greensboro sit-in"},{"date":"1961","event":"Freedom Rides; Anniston firebombing"},{"date":"1962","event":"James Meredith at the University of Mississippi"},{"date":"1963","event":"Birmingham campaign"},{"date":"Aug 1963","event":"March on Washington"},{"date":"1964","event":"Freedom Summer; Civil Rights Act"},{"date":"Feb 1965","event":"Malcolm X assassinated"},{"date":"March 1965","event":"Selma — 'Bloody Sunday'"},{"date":"Aug 1965","event":"Voting Rights Act; Watts riots"},{"date":"1966","event":"'Black Power' slogan; Black Panthers founded"},{"date":"Oct 1968","event":"Black Power salute at the Mexico City Olympics"}],"people":[{"name":"Martin Luther King","role":"Leader of non-violent protest; SCLC."},{"name":"James Meredith","role":"First black student at the University of Mississippi (1962)."},{"name":"Bull Connor","role":"Birmingham police chief, 1963."},{"name":"Malcolm X","role":"Nation of Islam spokesman; assassinated 1965."},{"name":"Stokely Carmichael","role":"SNCC leader who popularised 'Black Power'."},{"name":"Bobby Seale and Huey Newton","role":"Founders of the Black Panthers."},{"name":"Tommie Smith and John Carlos","role":"Olympic athletes who gave the Black Power salute, 1968."}],"vocab":[{"term":"Sit-in","def":"Occupying a segregated place peacefully as a protest."},{"term":"Freedom Riders","def":"Activists who rode buses to test desegregation."},{"term":"Black Power","def":"Black pride and self-reliance; sometimes self-defence."},{"term":"Ghetto","def":"A poor area where one group is forced to live."}],"misconceptions":[{"wrong":"Black Power was only about violence.","right":"It also meant pride, culture and community programmes like the Panthers' free breakfasts."},{"wrong":"Laws in 1964–65 ended racial inequality.","right":"They ended legal segregation and voting tests, but poverty and discrimination in the North continued."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"Where did the 1960 sit-ins begin?","options":["Montgomery","Greensboro","Selma","Birmingham"],"answer":1,"why":"1 February 1960."},{"id":"m2","s":"s1","q":"Which organisation ran the Freedom Rides?","options":["NAACP","CORE","Nation of Islam","Black Panthers"],"answer":1,"why":"1961."},{"id":"m3","s":"s2","q":"What happened at Birmingham in 1963?","options":["King was assassinated","Police used dogs and fire hoses on protesters","The Voting Rights Act passed","Meredith enrolled"],"answer":1,"why":"Under Bull Connor."},{"id":"m4","s":"s2","q":"Which law banned literacy tests?","options":["Civil Rights Act 1957","Civil Rights Act 1964","Voting Rights Act 1965","War Powers Act"],"answer":2,"why":"After Selma."},{"id":"m5","s":"s3","q":"Who popularised 'Black Power' in 1966?","options":["Malcolm X","Stokely Carmichael","Bobby Seale","King"],"answer":1,"why":"SNCC leader."},{"id":"m6","s":"s3","q":"Where were the 1965 riots that left 34 dead?","options":["Harlem","Watts, Los Angeles","Detroit","Chicago"],"answer":1,"why":"August 1965."}],"short":[{"id":"a1","s":"s1","q":"Who tried to enrol at the University of Mississippi in 1962?","accept":["james meredith","meredith"],"answer":"James Meredith"},{"id":"a2","s":"s2","q":"Where did 'Bloody Sunday' happen in 1965?","accept":["selma"],"answer":"Selma"},{"id":"a3","s":"s3","q":"Name one founder of the Black Panthers.","accept":["bobby seale","seale","huey newton","newton"],"answer":"Bobby Seale or Huey Newton"}],"chronology":[{"id":"c1","title":"Put these in order","items":["Greensboro sit-in","Freedom Rides","Meredith case","March on Washington","Civil Rights Act","Voting Rights Act","Black Panthers founded"]}],"matching":[{"id":"x1","title":"Match the protest to its result","pairs":[["Birmingham 1963","Kennedy proposes a civil rights bill"],["Selma 1965","Voting Rights Act"],["Greensboro 1960","Lunch counters desegregate; SNCC founded"],["Freedom Rides 1961","Bus terminals desegregated"]]}],"evidence":[{"id":"e1","s":"s2","q":"Give precise evidence that protest led to new laws.","keywords":[["birmingham","selma","1964","1965","civil rights act","voting rights act"]],"model":"Birmingham (1963) led Kennedy to propose what became the Civil Rights Act (1964); Selma (1965) led to the Voting Rights Act (August 1965)."}]},"flashcards":[{"id":"f1","s":"s1","q":"What did the sit-ins achieve?","a":"Many lunch counters desegregated; SNCC formed; young people drawn into the movement.","hint":"1960."},{"id":"f2","s":"s1","q":"What happened at Anniston in 1961?","a":"A Freedom Riders' bus was firebombed.","hint":"Alabama."},{"id":"f3","s":"s2","q":"How did King's non-violent methods work?","a":"Peaceful protest provoked violent responses, the media showed them, and the government was pressured to act.","hint":"Media."},{"id":"f4","s":"s2","q":"What did the Civil Rights Act 1964 do?","a":"Banned segregation in public places and discrimination in employment.","hint":"July 1964."},{"id":"f5","s":"s3","q":"Give three reasons for the growth of Black Power.","a":"Slow progress in the North; ghetto poverty; police brutality; Malcolm X's ideas; violence against peaceful protesters.","hint":"North."},{"id":"f6","s":"s3","q":"What did the Black Panthers do?","a":"Armed patrols to watch the police; community programmes such as free breakfasts.","hint":"1966."}],"checklist":[{"id":"k1","level":"describe","text":"I can describe the sit-ins, Freedom Riders, Anniston and the Meredith case.","sections":["s1"]},{"id":"k2","level":"explain","text":"I can explain King's methods and the Birmingham, Washington, Freedom Summer and Selma campaigns.","sections":["s2"]},{"id":"k3","level":"judge","text":"I can judge the impact of protest on 1960s civil rights laws.","sections":["s2"]},{"id":"k4","level":"explain","text":"I can explain the Nation of Islam, Malcolm X and the reasons for and impact of Black Power.","sections":["s3"]}],"exam":{"questions":[{"id":"q1","qtype":"p1c","label":"Teacher-created practice question","sections":["s2","s1"],"q":"‘The main reason for the passing of civil rights laws in the 1960s was the actions of Martin Luther King.’\nHow far do you agree? Explain your answer.","prompts":["the Birmingham campaign","Freedom Summer"],"markscheme":null},{"id":"q2","qtype":"p1b","label":"Teacher-created practice question","sections":["s3"],"q":"Explain two effects of the Black Power movement on the USA.","markscheme":null}]},"stretch":[{"id":"t1","kind":"Competing arguments","task":"King or Malcolm X: whose approach was more effective in the 1960s? Judge by what changed."},{"id":"t2","kind":"Causal links","task":"Show how television linked Birmingham, Selma and the new laws."}]},"y11-us-4":{"id":"y11-us-4","course":"y11","area":"us","kt":"Key topic 4","order":14,"title":"Other protest movements: students, women, anti-Vietnam","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following 4HI1 Depth study 7, key topic 4."},"learn":{"intro":"Inspired by the civil rights movement and angered by the Vietnam War, students and women organised their own protests in the 1960s and early 1970s — and provoked opposition.","sections":[{"id":"s1","title":"1. Why protest movements grew","blocks":[{"ul":["The baby boom: millions of young people, many at rapidly expanding universities.","The civil rights movement showed that protest could work and taught methods such as sit-ins and marches.","The Vietnam War: young men could be drafted (conscripted); television showed the war's horrors.","A new youth culture questioned traditional values."]}],"terms":["baby boom","draft","counter-culture"],"evidence":["Rapid growth of universities in the 1960s.","The draft for Vietnam."]},{"id":"s2","title":"2. The student movement and anti-Vietnam War protest","blocks":[{"p":"Students for a Democratic Society (SDS), founded in 1960, called for 'participatory democracy' and became a leading anti-war group. In 1964 the Berkeley Free Speech Movement at the University of California protested against a ban on political activity on campus, using sit-ins."},{"p":"As the war escalated from 1965, students held teach-ins, burned draft cards and organised huge marches. At Kent State University in May 1970, National Guard troops shot dead four students during an anti-war protest, shocking the nation."},{"p":"'Hippies' rejected mainstream society, promoting peace, love and alternative lifestyles; the Woodstock festival (1969) became a symbol of the counter-culture."}],"terms":["SDS","Free Speech Movement","teach-in","hippies","Kent State"],"evidence":["1964: Berkeley Free Speech Movement.","May 1970: Kent State — four students killed.","1969: Woodstock."]},{"id":"s3","title":"3. The women's movement","blocks":[{"p":"Eleanor Roosevelt chaired President Kennedy's Commission on the Status of Women (1961), whose 1963 report showed widespread discrimination. The Equal Pay Act (1963) required equal pay for equal work."},{"p":"Betty Friedan's book The Feminine Mystique (1963) described the frustration of many middle-class housewives. In 1966 she helped found the National Organization for Women (NOW), which campaigned for equal rights through the law and politics."},{"p":"The more radical women's liberation movement challenged traditional roles and beauty standards — for example the protest at the Miss America contest in 1968. In Roe v Wade (1973) the Supreme Court ruled that women had a right to abortion."}],"terms":["NOW","women's liberation","Equal Pay Act","Roe v Wade"],"evidence":["1963: The Feminine Mystique; Equal Pay Act.","1966: NOW founded.","1968: Miss America protest.","1973: Roe v Wade."]},{"id":"s4","title":"4. Opposition to the women's movement","blocks":[{"p":"Many Americans, including many women, opposed feminism. Phyllis Schlafly led the STOP ERA campaign (from 1972) against the Equal Rights Amendment, which Congress passed in 1972. She argued it would harm traditional families and remove protections for women, such as exemption from the draft. The ERA was never ratified by enough states."},{"p":"Religious and conservative groups also opposed abortion after Roe v Wade, and the 'pro-life' movement grew."}],"terms":["Equal Rights Amendment (ERA)","STOP ERA","pro-life"],"evidence":["1972: ERA passed by Congress; STOP ERA begins.","The ERA was never ratified."]}],"timeline":[{"date":"1960","event":"SDS founded"},{"date":"1961","event":"Commission on the Status of Women (Eleanor Roosevelt)"},{"date":"1963","event":"The Feminine Mystique; Equal Pay Act"},{"date":"1964","event":"Berkeley Free Speech Movement"},{"date":"1966","event":"NOW founded"},{"date":"1968","event":"Miss America protest"},{"date":"1969","event":"Woodstock festival"},{"date":"May 1970","event":"Kent State shootings"},{"date":"1972","event":"ERA passed by Congress; STOP ERA campaign"},{"date":"1973","event":"Roe v Wade"}],"people":[{"name":"Betty Friedan","role":"Author of The Feminine Mystique; co-founder of NOW."},{"name":"Eleanor Roosevelt","role":"Chaired the Commission on the Status of Women."},{"name":"Phyllis Schlafly","role":"Led opposition to the ERA."},{"name":"Mario Savio","role":"Leader of the Berkeley Free Speech Movement."}],"vocab":[{"term":"Draft","def":"Compulsory military service."},{"term":"Counter-culture","def":"A lifestyle rejecting mainstream values."},{"term":"Feminism","def":"The movement for women's equal rights."},{"term":"ERA","def":"Equal Rights Amendment — never ratified."}],"misconceptions":[{"wrong":"All women supported the women's movement.","right":"Many, led by Phyllis Schlafly, opposed it."},{"wrong":"Most students were radicals.","right":"Radical students were a minority, though a very visible one."}]},"quizzes":{"mcq":[{"id":"m1","s":"s2","q":"What happened at Kent State in May 1970?","options":["A music festival","National Guard shot dead four student protesters","NOW was founded","Draft cards were introduced"],"answer":1,"why":"During an anti-war protest."},{"id":"m2","s":"s3","q":"Who wrote The Feminine Mystique?","options":["Phyllis Schlafly","Betty Friedan","Eleanor Roosevelt","Gloria Steinem"],"answer":1,"why":"1963."},{"id":"m3","s":"s3","q":"What did Roe v Wade (1973) establish?","options":["Equal pay","A right to abortion","The ERA","Votes for 18-year-olds"],"answer":1,"why":"A Supreme Court ruling."},{"id":"m4","s":"s4","q":"What did Phyllis Schlafly campaign against?","options":["The Vietnam War","The Equal Rights Amendment","The draft","The Free Speech Movement"],"answer":1,"why":"STOP ERA."},{"id":"m5","s":"s1","q":"Which was a reason for the growth of protest movements?","options":["Falling university numbers","The example of the civil rights movement","The end of the draft","McCarthyism"],"answer":1,"why":"It showed protest could work."}],"short":[{"id":"a1","s":"s3","q":"What organisation did Betty Friedan help found in 1966?","accept":["now","national organization for women","national organisation for women"],"answer":"NOW"},{"id":"a2","s":"s2","q":"Which university's Free Speech Movement began in 1964?","accept":["berkeley","university of california berkeley","uc berkeley"],"answer":"Berkeley (University of California)"},{"id":"a3","s":"s2","q":"What does SDS stand for?","accept":["students for a democratic society"],"answer":"Students for a Democratic Society"}],"chronology":[{"id":"c1","title":"Put these in order","items":["The Feminine Mystique","Free Speech Movement","NOW founded","Woodstock","Kent State","Roe v Wade"]}],"matching":[{"id":"x1","title":"Match the person to their role","pairs":[["Friedan","The Feminine Mystique"],["Schlafly","STOP ERA"],["Eleanor Roosevelt","Commission on the Status of Women"],["Savio","Free Speech Movement"]]}],"evidence":[{"id":"e1","s":"s4","q":"Give precise evidence of opposition to the women's movement.","keywords":[["schlafly","stop era","era","1972","ratif","pro-life"]],"model":"Phyllis Schlafly's STOP ERA campaign from 1972 helped prevent the Equal Rights Amendment being ratified."}]},"flashcards":[{"id":"f1","s":"s1","q":"Give three reasons protest movements grew in the 1960s.","a":"Baby boom and more students; civil rights example; the Vietnam draft; youth culture.","hint":"Young, inspired, angry."},{"id":"f2","s":"s2","q":"What was the Berkeley Free Speech Movement?","a":"1964 student protest against a ban on political activity on campus.","hint":"California."},{"id":"f3","s":"s2","q":"How did students protest against the Vietnam War?","a":"Teach-ins, burning draft cards, marches; Kent State 1970.","hint":"Draft cards."},{"id":"f4","s":"s3","q":"What did NOW campaign for?","a":"Equal rights for women through the law and politics.","hint":"1966."},{"id":"f5","s":"s3","q":"Give two legal changes for women.","a":"Equal Pay Act 1963; Civil Rights Act 1964 banned sex discrimination at work; Roe v Wade 1973.","hint":"Pay, jobs, abortion."},{"id":"f6","s":"s4","q":"Why did Schlafly oppose the ERA?","a":"She argued it would harm traditional families and remove protections such as exemption from the draft.","hint":"Family."}],"checklist":[{"id":"k1","level":"explain","text":"I can explain the reasons for the growth of protest movements.","sections":["s1"]},{"id":"k2","level":"describe","text":"I can describe the student and anti-Vietnam War movements, including Berkeley, SDS and hippies.","sections":["s2"]},{"id":"k3","level":"explain","text":"I can explain the work of Friedan, Eleanor Roosevelt, NOW and women's liberation, including abortion.","sections":["s3"]},{"id":"k4","level":"judge","text":"I can judge the main consequences of the women's movement, including opposition from Schlafly.","sections":["s4"]}],"exam":{"questions":[{"id":"q1","qtype":"p1c","label":"Past paper: 4HI1/01, June 2025, Q7(c)(ii)","sections":["s3","s4"],"q":"‘The main consequence of the women's movement was the creation of opposition to their own movement.’\nHow far do you agree? Explain your answer.","prompts":["opposition","legal changes"],"markscheme":null},{"id":"q2","qtype":"p1b","label":"Teacher-created practice question","sections":["s2"],"q":"Explain two effects of the Vietnam War on the student movement.","markscheme":null}]},"stretch":[{"id":"t1","kind":"Relative significance","task":"Which protest movement changed the USA most by 1974: students, anti-war or women? Use legal changes as one criterion."},{"id":"t2","kind":"Causal links","task":"How did the civil rights movement shape the methods of the student and women's movements?"}]},"y11-us-5":{"id":"y11-us-5","course":"y11","area":"us","kt":"Key topic 5","order":15,"title":"Nixon and Watergate","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following 4HI1 Depth study 7, key topic 5."},"learn":{"intro":"A break-in at the Democratic Party's offices in 1972 grew into a scandal that forced President Nixon to resign in 1974 — the only US President ever to do so — and led to new laws limiting presidential power.","sections":[{"id":"s1","title":"1. Reasons for and key features of the scandal","blocks":[{"p":"Nixon was secretive and suspicious of opponents; he kept an 'enemies list' and his Committee for the Re-election of the President (nicknamed CREEP) used dirty tricks. On 17 June 1972 five men were arrested breaking into the Democratic National Committee's offices in the Watergate building in Washington, DC. They were linked to CREEP."},{"p":"Nixon won a landslide re-election in November 1972, but Washington Post journalists Bob Woodward and Carl Bernstein, helped by a secret source ('Deep Throat'), kept investigating. A Senate committee held televised hearings in 1973. White House counsel John Dean testified that Nixon was involved in a cover-up, and an aide revealed that Nixon secretly taped conversations in his office."},{"p":"Nixon refused to hand over the tapes. In October 1973 he had the special prosecutor, Archibald Cox, sacked (the 'Saturday Night Massacre'). In July 1974 the Supreme Court ruled unanimously in US v Nixon that he must release them, and the House Judiciary Committee approved articles of impeachment. One tape — the 'smoking gun' — showed he had ordered the cover-up. Nixon resigned on 9 August 1974."}],"terms":["CREEP","cover-up","impeachment","smoking gun"],"evidence":["17 June 1972: Watergate break-in.","November 1972: Nixon re-elected.","October 1973: Saturday Night Massacre.","July 1974: US v Nixon.","9 August 1974: Nixon resigns."]},{"id":"s2","title":"2. Impact on Nixon, US politics and new laws","blocks":[{"p":"Nixon became the first President to resign. Gerald Ford became President. On 8 September 1974 Ford gave Nixon a full pardon for any crimes — many Americans were angry, and it probably helped Ford lose the 1976 election."},{"p":"Trust in government fell sharply. Democrats made big gains in the 1974 congressional elections. The media's investigative role grew."},{"ul":["War Powers Act (1973): limited the President's power to send troops into action without Congress's approval.","Election Campaign Act (1974): limits on campaign donations and spending; a Federal Election Commission.","Privacy Act (1974): limited how the government could collect and use information about individuals.","Congressional Budget and Impoundment Control Act (1974): stopped the President refusing to spend money Congress had approved."]}],"terms":["pardon","War Powers Act","Federal Election Commission"],"evidence":["8 September 1974: Ford pardons Nixon.","1973: War Powers Act.","1974: Election Campaign Act; Privacy Act; Budget Control Act."]}],"timeline":[{"date":"17 June 1972","event":"Watergate break-in"},{"date":"Nov 1972","event":"Nixon re-elected in a landslide"},{"date":"May 1973","event":"Senate Watergate hearings begin on television"},{"date":"July 1973","event":"Secret White House tapes revealed"},{"date":"Oct 1973","event":"Saturday Night Massacre"},{"date":"Nov 1973","event":"War Powers Act passed"},{"date":"July 1974","event":"US v Nixon; impeachment articles approved"},{"date":"9 Aug 1974","event":"Nixon resigns; Ford becomes President"},{"date":"8 Sept 1974","event":"Ford pardons Nixon"}],"people":[{"name":"Richard Nixon","role":"President 1969–74; resigned."},{"name":"Gerald Ford","role":"President 1974–77; pardoned Nixon."},{"name":"Bob Woodward and Carl Bernstein","role":"Washington Post reporters."},{"name":"John Dean","role":"White House counsel who testified against Nixon."},{"name":"Archibald Cox","role":"Special prosecutor sacked in October 1973."}],"vocab":[{"term":"Impeachment","def":"Formal charges against a President by Congress."},{"term":"Cover-up","def":"Hiding wrongdoing."},{"term":"Pardon","def":"Official forgiveness of a crime."},{"term":"Special prosecutor","def":"Independent lawyer investigating the government."}],"misconceptions":[{"wrong":"Nixon was impeached and removed.","right":"He resigned before the full House voted on impeachment."},{"wrong":"Nixon planned the break-in personally.","right":"The proven offence was his role in the cover-up."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"Whose offices were broken into at the Watergate building?","options":["The FBI","The Democratic National Committee","The Washington Post","CREEP"],"answer":1,"why":"17 June 1972."},{"id":"m2","s":"s1","q":"What did US v Nixon (1974) decide?","options":["Nixon could keep the tapes","Nixon must release the tapes","Nixon was guilty of burglary","Ford must resign"],"answer":1,"why":"A unanimous Supreme Court ruling."},{"id":"m3","s":"s2","q":"What did the War Powers Act do?","options":["Increased presidential power","Limited the President's power to send troops without Congress","Ended the draft","Created the CIA"],"answer":1,"why":"1973."},{"id":"m4","s":"s2","q":"What did Ford do in September 1974?","options":["Impeached Nixon","Pardoned Nixon","Resigned","Released the tapes"],"answer":1,"why":"Many Americans were angry."}],"short":[{"id":"a1","s":"s1","q":"Name one Washington Post reporter who investigated Watergate.","accept":["woodward","bob woodward","bernstein","carl bernstein"],"answer":"Bob Woodward or Carl Bernstein"},{"id":"a2","s":"s1","q":"On what date did Nixon resign?","accept":["9 august 1974","9th august 1974","august 9 1974","9 august"],"answer":"9 August 1974"},{"id":"a3","s":"s1","q":"What does CREEP stand for?","accept":["committee to re-elect the president","committee to reelect the president","committee for the re-election of the president","committee for the reelection of the president"],"answer":"Committee for the Re-election of the President"}],"chronology":[{"id":"c1","title":"Put these in order","items":["Break-in","Nixon re-elected","Tapes revealed","Saturday Night Massacre","US v Nixon","Nixon resigns","Ford pardons Nixon"]}],"matching":[{"id":"x1","title":"Match the law to what it did","pairs":[["War Powers Act","Limited sending troops without Congress"],["Election Campaign Act","Limited donations; Federal Election Commission"],["Privacy Act","Protected personal information"],["Budget Control Act","Stopped the President refusing to spend approved money"]]}],"evidence":[{"id":"e1","s":"s2","q":"Give precise evidence of the effects of Watergate on US politics.","keywords":[["war powers","1973","1974","election campaign","privacy","pardon","trust","resign"]],"model":"Nixon resigned (9 August 1974); the War Powers Act (1973) and Election Campaign Act (1974) limited presidential power and campaign funding; trust in government fell."}]},"flashcards":[{"id":"f1","s":"s1","q":"Why did the Watergate scandal happen?","a":"Nixon's secrecy and suspicion of opponents; CREEP's dirty tricks; the attempted cover-up.","hint":"Enemies list."},{"id":"f2","s":"s1","q":"How was the cover-up exposed?","a":"Woodward and Bernstein's reporting; the Senate hearings; John Dean's evidence; the secret tapes; US v Nixon.","hint":"Press, Senate, tapes."},{"id":"f3","s":"s1","q":"What was the Saturday Night Massacre?","a":"October 1973: Nixon had special prosecutor Archibald Cox sacked.","hint":"Cox."},{"id":"f4","s":"s2","q":"Give two effects of Watergate on US politics.","a":"Nixon resigned; trust in government fell; Democrats gained in 1974; new laws limited presidential power.","hint":"Trust and laws."},{"id":"f5","s":"s2","q":"Why was Ford's pardon controversial?","a":"Nixon was never tried; many saw it as a deal; it damaged Ford.","hint":"1974."}],"checklist":[{"id":"k1","level":"explain","text":"I can explain the reasons for and key features of the Watergate scandal.","sections":["s1"]},{"id":"k2","level":"explain","text":"I can explain the impact of Watergate on Nixon and US politics.","sections":["s2"]},{"id":"k3","level":"describe","text":"I can describe the new laws of 1973–74 and Ford's pardon.","sections":["s2"]}],"exam":{"questions":[{"id":"q1","qtype":"p1b","label":"Past paper: 4HI1/01, June 2025, Q7(b)","sections":["s2"],"q":"Explain two effects of the Watergate scandal on US politics.","markscheme":null},{"id":"q2","qtype":"p1c","label":"Teacher-created practice question","sections":["s1"],"q":"‘The main reason why Nixon resigned in 1974 was the work of the media.’\nHow far do you agree? Explain your answer.","prompts":["the Washington Post","the White House tapes"],"markscheme":null}]},"stretch":[{"id":"t1","kind":"Relative significance","task":"Press, Congress or the Supreme Court — which did most to bring Nixon down?"},{"id":"t2","kind":"Change and continuity","task":"How far did the 1973–74 laws really limit presidential power?"}]},"y11-vn-1":{"id":"y11-vn-1","course":"y11","area":"vn","kt":"Key topic 1","order":31,"title":"The struggle against France for independence, 1945–54","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following 4HI1 Historical investigation A4, key topic 1. No class textbook uploaded for this option yet."},"learn":{"intro":"After the Second World War, Ho Chi Minh's Vietminh declared Vietnamese independence. France tried to take back its colony, leading to eight years of war that ended in French defeat at Dien Bien Phu.","sections":[{"id":"s1","title":"1. Origins of the First Indochina War and the aims of the Vietminh","blocks":[{"p":"Vietnam had been part of French Indochina since the late 1800s. During the Second World War Japan occupied it. In 1941 Ho Chi Minh, a communist and nationalist, set up the Vietminh (League for the Independence of Vietnam) to fight the Japanese and the French."},{"p":"When Japan surrendered, Ho declared Vietnamese independence in Hanoi on 2 September 1945, quoting the American Declaration of Independence. But France wanted its colony back. Talks failed, and after French ships shelled Haiphong in November 1946, full war began in December 1946."},{"p":"The Vietminh's aims: full independence from France, a united Vietnam, land for peasants, and a communist government. Their message of independence and land reform won wide peasant support."}],"terms":["Indochina","Vietminh","nationalism","communism"],"evidence":["1941: Vietminh founded.","2 September 1945: Ho declares independence.","December 1946: war begins."]},{"id":"s2","title":"2. General Giap's tactics and the search for a solution","blocks":[{"p":"General Vo Nguyen Giap commanded the Vietminh army. Following Mao's ideas, he used guerrilla warfare: small units, ambushes, hit-and-run attacks and support from villagers, avoiding large battles while the French were stronger. The aim was to wear the French down and only fight conventional battles once strong enough."},{"p":"After the communists won in China in 1949, the Vietminh received Chinese weapons, training and safe bases. The USA, fearing the spread of communism, paid an increasing share of France's war costs — by 1954 most of them."},{"p":"France looked for a way out. Peace talks began at the Geneva Conference in April 1954, while the decisive battle was being fought."}],"terms":["guerrilla warfare","ambush","Geneva Conference"],"evidence":["1949: communist victory in China brings aid to the Vietminh.","By 1954 the USA paid most of France's war costs."]},{"id":"s3","title":"3. Dien Bien Phu and its consequences","blocks":[{"p":"In November 1953 the French built a fortified base at Dien Bien Phu, in a valley near the Laos border, hoping to lure the Vietminh into a battle they would lose. Instead, Giap's forces dragged heavy artillery up the surrounding hills by hand and surrounded the base."},{"p":"The siege began on 13 March 1954. Vietminh artillery destroyed the airstrip, so the French could only be supplied by parachute. The base surrendered on 7 May 1954, and thousands of French troops were captured."},{"p":"Immediate consequences: France decided to leave Indochina. The Geneva Agreements (July 1954) recognised the independence of Vietnam, Laos and Cambodia and temporarily divided Vietnam at the 17th parallel — communist North under Ho, non-communist South — with national elections promised for 1956."}],"terms":["siege","artillery","17th parallel","Geneva Agreements"],"evidence":["November 1953: French base at Dien Bien Phu.","13 March – 7 May 1954: siege.","July 1954: Geneva Agreements — division at the 17th parallel; elections promised for 1956."]}],"timeline":[{"date":"1941","event":"Ho Chi Minh founds the Vietminh"},{"date":"2 Sept 1945","event":"Ho declares Vietnamese independence"},{"date":"Dec 1946","event":"First Indochina War begins"},{"date":"1949","event":"Communist victory in China; aid to the Vietminh"},{"date":"Nov 1953","event":"French build the base at Dien Bien Phu"},{"date":"13 March 1954","event":"Siege of Dien Bien Phu begins"},{"date":"7 May 1954","event":"French surrender at Dien Bien Phu"},{"date":"July 1954","event":"Geneva Agreements divide Vietnam"}],"people":[{"name":"Ho Chi Minh","role":"Communist nationalist leader of the Vietminh; later President of North Vietnam."},{"name":"Vo Nguyen Giap","role":"Vietminh military commander; victor at Dien Bien Phu."}],"vocab":[{"term":"Vietminh","def":"League for the Independence of Vietnam, led by Ho Chi Minh."},{"term":"Guerrilla warfare","def":"Small-unit hit-and-run fighting, avoiding big battles."},{"term":"17th parallel","def":"Line dividing North and South Vietnam from 1954."},{"term":"Colony","def":"A country ruled by another country."}],"misconceptions":[{"wrong":"The USA was not involved before 1954.","right":"It was paying most of France's war costs by 1954."},{"wrong":"The 1954 division was meant to be permanent.","right":"It was temporary, with elections promised for 1956."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"Who led the Vietminh?","options":["Ngo Dinh Diem","Ho Chi Minh","General Giap","Bao Dai"],"answer":1,"why":"Founded 1941."},{"id":"m2","s":"s1","q":"When did Ho declare independence?","options":["1941","2 September 1945","1946","1954"],"answer":1,"why":"In Hanoi, after Japan's surrender."},{"id":"m3","s":"s2","q":"Which event in 1949 helped the Vietminh?","options":["The Korean War ended","Communist victory in China","France left NATO","The Geneva Conference"],"answer":1,"why":"China supplied weapons and training."},{"id":"m4","s":"s3","q":"How did Giap win at Dien Bien Phu?","options":["Bombing from the air","Dragging artillery onto the surrounding hills","Naval landings","A surprise attack from Laos only"],"answer":1,"why":"The airstrip was destroyed and the base surrounded."},{"id":"m5","s":"s3","q":"Where was Vietnam divided in 1954?","options":["38th parallel","17th parallel","Mekong River","Hanoi"],"answer":1,"why":"Geneva Agreements, July 1954."}],"short":[{"id":"a1","s":"s3","q":"On what date did the French surrender at Dien Bien Phu?","accept":["7 may 1954","7th may 1954","may 7 1954","7 may"],"answer":"7 May 1954"},{"id":"a2","s":"s2","q":"Who commanded the Vietminh army?","accept":["giap","general giap","vo nguyen giap"],"answer":"General Vo Nguyen Giap"},{"id":"a3","s":"s3","q":"In which year were national elections promised?","accept":["1956"],"answer":"1956"}],"chronology":[{"id":"c1","title":"Put these in order","items":["Vietminh founded","Independence declared","War begins","Communist victory in China","Siege of Dien Bien Phu","Geneva Agreements"]}],"matching":[{"id":"x1","title":"Match the term to its meaning","pairs":[["Vietminh","Ho's independence movement"],["Guerrilla warfare","Hit-and-run fighting"],["17th parallel","Dividing line in 1954"],["Geneva Agreements","The 1954 peace settlement"]]}],"evidence":[{"id":"e1","s":"s3","q":"Give precise evidence about the siege of Dien Bien Phu.","keywords":[["13 march","7 may","1954","artillery","hills","airstrip"]],"model":"The siege lasted from 13 March to 7 May 1954; Giap's artillery on the hills destroyed the airstrip and the French surrendered."}]},"flashcards":[{"id":"f1","s":"s1","q":"What were the aims of the Vietminh?","a":"Independence from France, a united Vietnam, land for peasants and a communist government.","hint":"Independence + land."},{"id":"f2","s":"s2","q":"Describe Giap's tactics.","a":"Guerrilla warfare — small units, ambushes, hit-and-run, support from villagers; big battles only when strong enough.","hint":"Mao's ideas."},{"id":"f3","s":"s2","q":"How did the USA help France?","a":"Paid an increasing share of the war costs — most of them by 1954.","hint":"Money."},{"id":"f4","s":"s3","q":"Why did the French lose at Dien Bien Phu?","a":"Base in a valley; Giap's artillery on the hills destroyed the airstrip; supply only by parachute.","hint":"Valley."},{"id":"f5","s":"s3","q":"What did the Geneva Agreements decide?","a":"Independence for Vietnam, Laos and Cambodia; temporary division at the 17th parallel; elections in 1956.","hint":"July 1954."}],"checklist":[{"id":"k1","level":"explain","text":"I can explain the origins of the First Indochina War and the aims of the Vietminh.","sections":["s1"]},{"id":"k2","level":"describe","text":"I can describe Giap's tactics and the search for a diplomatic solution.","sections":["s2"]},{"id":"k3","level":"explain","text":"I can explain the French defeat at Dien Bien Phu and its immediate consequences.","sections":["s3"]}],"exam":{"questions":[{"id":"q1","qtype":"p2aa","label":"Teacher-created practice question","sections":["s2","s3"],"q":"Describe TWO features of EITHER the tactics of General Giap OR the siege of Dien Bien Phu.","markscheme":null}]},"stretch":[{"id":"t1","kind":"Relative significance","task":"Giap's tactics, Chinese aid or French mistakes — which mattered most for the French defeat?"},{"id":"t2","kind":"Causal links","task":"Explain how the communist victory in China in 1949 changed both sides' involvement in Vietnam."}]},"y11-vn-2":{"id":"y11-vn-2","course":"y11","area":"vn","kt":"Key topic 2","order":32,"title":"US policy and intervention, 1954–64","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following 4HI1 Historical investigation A4, key topic 2."},"learn":{"intro":"After Geneva, the USA backed a non-communist South Vietnam to stop the 'dominoes' falling. But Diem's government was unpopular, the NLF grew, and by 1964 the USA was on the edge of full-scale war.","sections":[{"id":"s1","title":"1. Geneva, the domino theory and the formation of South Vietnam","blocks":[{"p":"The Geneva Conference (1954) aimed to end the war and divide Vietnam temporarily, with elections in 1956. The USA did not sign the agreement; it feared Ho Chi Minh would win any election."},{"p":"President Eisenhower explained US policy with the domino theory (1954): if one country fell to communism, its neighbours would follow, like a row of dominoes. The USA set up SEATO (1954) and supported a separate state in the South."},{"p":"Ngo Dinh Diem became leader of South Vietnam (the Republic of Vietnam) after a rigged referendum in 1955. With US support he refused to hold the 1956 elections."}],"terms":["domino theory","containment","SEATO","Republic of Vietnam"],"evidence":["1954: Eisenhower's domino theory; SEATO.","1955: Diem wins a rigged referendum.","1956: elections not held."]},{"id":"s2","title":"2. Life in North and South Vietnam","blocks":[{"p":"North (Ho Chi Minh): a communist state. Land reform (1953–56) took land from landlords and gave it to peasants, but it was carried out brutally and thousands were killed; Ho later admitted mistakes. Industry and farming were brought under state control."},{"p":"South (Ngo Dinh Diem): Diem was a Catholic in a mainly Buddhist country and favoured Catholics and his own family; his brother Nhu ran the secret police. Land reform helped landlords more than peasants. Opponents were imprisoned and corruption was widespread, so the government lost support in the countryside."}],"terms":["land reform","corruption","Buddhist"],"evidence":["1953–56: brutal land reform in the North.","Diem favoured Catholics; his brother Nhu ran the secret police."]},{"id":"s3","title":"3. Ho's policies to unite Vietnam: the NLF and the Ho Chi Minh Trail","blocks":[{"p":"Ho was determined to unite Vietnam. In December 1960 the National Liberation Front (NLF) was set up in the South, with Northern backing, to overthrow Diem. Its fighters were called the Vietcong by their enemies. They used guerrilla tactics and won peasant support by redistributing land, though they also used terror against officials."},{"p":"The Ho Chi Minh Trail — a network of paths through Laos and Cambodia — carried soldiers and supplies from North to South. It was very hard to cut because it ran through jungle and neutral countries."}],"terms":["NLF","Vietcong","Ho Chi Minh Trail"],"evidence":["December 1960: NLF founded.","The Ho Chi Minh Trail ran through Laos and Cambodia."]},{"id":"s4","title":"4. The US response, the fall of Diem and the Gulf of Tonkin","blocks":[{"p":"The USA sent money, weapons and military advisers. Under President Kennedy the number of advisers rose from under 1,000 in 1961 to about 16,000 by 1963."},{"p":"The Strategic Hamlet Programme (1962) moved peasants into fortified villages to cut them off from the Vietcong. Peasants resented being moved from their land and ancestral graves; many hamlets were badly built and infiltrated, and the programme increased support for the NLF."},{"p":"In 1963 Buddhist protests grew; the monk Thich Quang Duc burned himself to death in Saigon in June, and the photographs shocked the world. With US approval, South Vietnamese generals overthrew Diem in November 1963; he and Nhu were killed. Unstable military governments followed."},{"p":"In August 1964 the US destroyer Maddox reported attacks by North Vietnamese boats in the Gulf of Tonkin (the second attack probably did not happen). Congress passed the Gulf of Tonkin Resolution, allowing President Johnson to take 'all necessary measures' — a blank cheque for war."}],"terms":["military advisers","Strategic Hamlet Programme","coup","Gulf of Tonkin Resolution"],"evidence":["Advisers: under 1,000 (1961) → about 16,000 (1963).","1962: Strategic Hamlet Programme.","November 1963: Diem overthrown and killed.","August 1964: Gulf of Tonkin Resolution."]}],"timeline":[{"date":"1954","event":"Geneva Conference; Eisenhower's domino theory; SEATO"},{"date":"1955","event":"Diem becomes leader of South Vietnam"},{"date":"1956","event":"Promised elections not held"},{"date":"Dec 1960","event":"NLF founded"},{"date":"1961","event":"Kennedy increases US advisers"},{"date":"1962","event":"Strategic Hamlet Programme"},{"date":"June 1963","event":"Thich Quang Duc's self-immolation"},{"date":"Nov 1963","event":"Diem overthrown and killed"},{"date":"Aug 1964","event":"Gulf of Tonkin incident and Resolution"}],"people":[{"name":"Dwight Eisenhower","role":"US President 1953–61; domino theory."},{"name":"John F. Kennedy","role":"US President 1961–63; increased advisers."},{"name":"Lyndon B. Johnson","role":"US President from November 1963."},{"name":"Ngo Dinh Diem","role":"Leader of South Vietnam 1955–63."},{"name":"Thich Quang Duc","role":"Buddhist monk who burned himself in protest, 1963."}],"vocab":[{"term":"Domino theory","def":"If one country fell to communism, its neighbours would follow."},{"term":"NLF / Vietcong","def":"Communist-led movement fighting the South Vietnamese government."},{"term":"Strategic hamlet","def":"Fortified village to separate peasants from the Vietcong."},{"term":"Military adviser","def":"Soldier sent to train and advise another army."}],"misconceptions":[{"wrong":"The US only got involved in 1965.","right":"It backed Diem from 1954 and had about 16,000 advisers by 1963."},{"wrong":"Diem was a popular leader.","right":"His favouritism, corruption and repression made him unpopular, especially with Buddhists and peasants."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"What did the domino theory claim?","options":["Wars spread like fires","If one country became communist, neighbours would follow","Vietnam was unimportant","France would win"],"answer":1,"why":"Eisenhower, 1954."},{"id":"m2","s":"s2","q":"Why was Diem unpopular?","options":["He was a communist","He favoured Catholics and his family and repressed opponents","He gave land to peasants","He held fair elections"],"answer":1,"why":"In a mainly Buddhist country."},{"id":"m3","s":"s3","q":"When was the NLF founded?","options":["1954","1956","December 1960","1964"],"answer":2,"why":"With Northern backing."},{"id":"m4","s":"s4","q":"Why did the Strategic Hamlet Programme fail?","options":["Peasants loved it","Peasants resented being moved and many hamlets were infiltrated","It was never started","The French ran it"],"answer":1,"why":"It increased support for the NLF."},{"id":"m5","s":"s4","q":"What did the Gulf of Tonkin Resolution allow?","options":["Peace talks","The President to take 'all necessary measures'","Withdrawal of advisers","Elections in Vietnam"],"answer":1,"why":"August 1964."}],"short":[{"id":"a1","s":"s2","q":"Who led South Vietnam from 1955 to 1963?","accept":["diem","ngo dinh diem"],"answer":"Ngo Dinh Diem"},{"id":"a2","s":"s3","q":"What was the supply route from North to South called?","accept":["ho chi minh trail","the ho chi minh trail"],"answer":"The Ho Chi Minh Trail"},{"id":"a3","s":"s4","q":"About how many US advisers were in Vietnam by 1963?","accept":["16000","16,000","about 16,000","16 000"],"answer":"About 16,000"}],"chronology":[{"id":"c1","title":"Put these in order","items":["Domino theory speech","Diem becomes leader","NLF founded","Strategic Hamlet Programme","Diem overthrown","Gulf of Tonkin Resolution"]}],"matching":[{"id":"x1","title":"Match the President to the policy","pairs":[["Eisenhower","Domino theory"],["Kennedy","More advisers; Strategic Hamlets"],["Johnson","Gulf of Tonkin Resolution"]]}],"evidence":[{"id":"e1","s":"s4","q":"Give precise evidence that US involvement increased under Kennedy.","keywords":[["16,000","16000","1,000","advisers","strategic hamlet","1962"]],"model":"US advisers rose from under 1,000 in 1961 to about 16,000 by 1963, and the USA backed the Strategic Hamlet Programme (1962)."}]},"flashcards":[{"id":"f1","s":"s1","q":"Why did the USA not sign the Geneva Agreements?","a":"It feared Ho Chi Minh would win the 1956 elections and Vietnam would become communist.","hint":"Elections."},{"id":"f2","s":"s2","q":"What was life like in North Vietnam?","a":"Communist state; brutal land reform (1953–56) took land from landlords; state control of industry.","hint":"Land reform."},{"id":"f3","s":"s3","q":"How did the NLF win support?","a":"Redistributing land, guerrilla tactics, anger at Diem — but also terror against officials.","hint":"Peasants."},{"id":"f4","s":"s4","q":"Why did the USA allow Diem's overthrow?","a":"His repression of Buddhists and unpopularity were undermining the war against the NLF.","hint":"Buddhist crisis."},{"id":"f5","s":"s4","q":"Why was the Gulf of Tonkin incident significant?","a":"It led to the Resolution giving Johnson power to escalate the war without a declaration of war.","hint":"Blank cheque."}],"checklist":[{"id":"k1","level":"explain","text":"I can explain the aims of Geneva, the US response and the domino theory.","sections":["s1"]},{"id":"k2","level":"describe","text":"I can describe life in North and South Vietnam under Ho and Diem.","sections":["s2"]},{"id":"k3","level":"explain","text":"I can explain the impact of the NLF and the Ho Chi Minh Trail.","sections":["s3"]},{"id":"k4","level":"judge","text":"I can judge how far US involvement increased under Kennedy and Johnson to 1964.","sections":["s4"]}],"exam":{"questions":[{"id":"q1","qtype":"p2ac","label":"Past paper: 4HI1/02, June 2025, A4(c) (Sources A, B and Extract C are in the paper)","sections":["s4"],"q":"Extract C suggests that US involvement in the Vietnam War increased massively under President Kennedy, in the years 1961–63.\nHow far do you agree with this interpretation? Use Extract C, Sources A and B and your own knowledge to explain your answer.","markscheme":null},{"id":"q2","qtype":"p2aa","label":"Teacher-created practice question","sections":["s4"],"q":"Describe TWO features of EITHER the Strategic Hamlet Programme OR the fall of Diem in 1963.","markscheme":null}]},"stretch":[{"id":"t1","kind":"Competing arguments","task":"Was the USA drawn into Vietnam by events, or did it choose escalation? Use the domino theory and Gulf of Tonkin."},{"id":"t2","kind":"Causal links","task":"How did Diem's policies help the NLF? Make a chain of three links."}]},"y11-vn-3":{"id":"y11-vn-3","course":"y11","area":"vn","kt":"Key topic 3","order":33,"title":"Increased US involvement in the war, 1964–68","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following 4HI1 Historical investigation A4, key topic 3."},"learn":{"intro":"After the Gulf of Tonkin Resolution, President Johnson turned an advisory mission into a full-scale war. Huge US firepower could not defeat the Vietcong's guerrilla tactics, and the Tet Offensive of 1968 became the turning point.","sections":[{"id":"s1","title":"1. Escalation: Rolling Thunder and US ground troops","blocks":[{"p":"In February 1965, after Vietcong attacks on US bases such as Pleiku, Johnson began Operation Rolling Thunder — a sustained bombing campaign against North Vietnam that lasted until 1968. Its aims were to destroy industry and supply routes, stop the flow of men and materials south, and force Hanoi to negotiate."},{"p":"In March 1965 the first US combat troops — Marines — landed at Da Nang to protect the air base. Numbers rose rapidly: about 184,000 by the end of 1965 and over 500,000 by 1968."},{"p":"Rolling Thunder did not achieve its aims. North Vietnam had little industry to destroy, supplies kept moving down the Ho Chi Minh Trail, and the bombing hardened Northern resistance."}],"terms":["escalation","Operation Rolling Thunder","combat troops"],"evidence":["February 1965: Rolling Thunder begins (to 1968).","March 1965: Marines land at Da Nang.","Over 500,000 US troops by 1968."]},{"id":"s2","title":"2. Vietcong tactics","blocks":[{"p":"The Vietcong avoided open battles with the much better-armed Americans. They used guerrilla tactics: ambushes, hit-and-run attacks, and booby traps such as punji sticks and tripwire mines, which caused many US casualties and destroyed morale."},{"p":"They built huge tunnel networks, such as at Cu Chi near Saigon, with living quarters, hospitals and storerooms, so they could hide and appear behind American lines. They mixed with the villagers, so US soldiers could not tell friend from enemy."},{"p":"'Hugging' tactics — fighting very close to US troops — meant the Americans could not call in air strikes or artillery without hitting their own men."}],"terms":["booby trap","tunnels","hugging tactics","ambush"],"evidence":["Cu Chi tunnels near Saigon.","Booby traps such as punji sticks."]},{"id":"s3","title":"3. US tactics: search and destroy, Agent Orange and napalm","blocks":[{"p":"General Westmoreland's strategy was attrition: kill enemy soldiers faster than they could be replaced. Search and destroy missions sent troops, often by helicopter, to find and kill Vietcong in villages. Success was measured by 'body counts', which encouraged soldiers to count any dead Vietnamese as Vietcong and turned villagers against the USA."},{"p":"Chemical weapons were used on a huge scale. Agent Orange, a defoliant, was sprayed to strip jungle cover and destroy crops; it caused long-term illness and birth defects. Napalm, a burning jelly dropped in bombs, killed and maimed civilians as well as fighters."},{"p":"US troops were often young conscripts serving one-year tours, unfamiliar with the country and under constant threat. Morale fell and drug use rose."}],"terms":["attrition","search and destroy","body count","Agent Orange","napalm"],"evidence":["Westmoreland's attrition strategy.","Agent Orange stripped jungle cover and crops.","One-year tours of duty for US conscripts."]},{"id":"s4","title":"4. The Tet Offensive, 1968","blocks":[{"p":"On 30–31 January 1968, during the Tet (Vietnamese New Year) holiday truce, about 80,000 Vietcong and North Vietnamese troops attacked over 100 towns and cities across South Vietnam, including Saigon, where they briefly got inside the US Embassy compound. The ancient city of Hue was held for nearly a month. The offensive followed a diversionary siege of the US base at Khe Sanh, which began on 21 January 1968."},{"p":"Militarily, Tet was a defeat for the communists: they suffered very heavy losses, the Vietcong was badly weakened, and the expected popular uprising in the South did not happen."},{"p":"Politically, it was a turning point. Americans had been told the war was being won; TV showed fighting in the US Embassy. Respected newsreader Walter Cronkite said the war was a stalemate. Westmoreland asked for 206,000 more troops and was refused. On 31 March 1968 Johnson announced a partial halt to the bombing and said he would not stand for re-election."},{"p":"In March 1968 US soldiers killed several hundred unarmed villagers at My Lai. The massacre was covered up and only became public in November 1969, further damaging support for the war."}],"terms":["Tet Offensive","credibility gap","stalemate","My Lai"],"evidence":["30–31 January 1968: Tet Offensive begins.","Khe Sanh siege from 21 January 1968.","31 March 1968: Johnson will not stand again.","My Lai: March 1968; made public November 1969."]}],"timeline":[{"date":"Feb 1965","event":"Operation Rolling Thunder begins"},{"date":"March 1965","event":"US Marines land at Da Nang"},{"date":"End 1965","event":"About 184,000 US troops in Vietnam"},{"date":"21 Jan 1968","event":"Siege of Khe Sanh begins"},{"date":"30–31 Jan 1968","event":"Tet Offensive"},{"date":"16 March 1968","event":"My Lai massacre"},{"date":"31 March 1968","event":"Johnson halts most bombing and will not stand again"}],"people":[{"name":"Lyndon B. Johnson","role":"US President 1963–69; escalated the war."},{"name":"William Westmoreland","role":"US commander in Vietnam 1964–68; attrition strategy."},{"name":"Walter Cronkite","role":"CBS newsreader who called the war a stalemate in 1968."}],"vocab":[{"term":"Escalation","def":"Making a war bigger or more intense."},{"term":"Attrition","def":"Wearing the enemy down by killing more than they can replace."},{"term":"Defoliant","def":"Chemical that strips leaves from plants (e.g. Agent Orange)."},{"term":"Credibility gap","def":"Difference between what the government said and what people saw."}],"misconceptions":[{"wrong":"The Tet Offensive was a military victory for the communists.","right":"It was a military defeat but a political and psychological victory."},{"wrong":"Rolling Thunder cut the supply lines.","right":"Supplies kept moving down the Ho Chi Minh Trail."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"What was Operation Rolling Thunder?","options":["A ground offensive","A bombing campaign against North Vietnam","A peace plan","A Vietcong attack"],"answer":1,"why":"1965–68."},{"id":"m2","s":"s1","q":"Where did the first US combat troops land in March 1965?","options":["Saigon","Hue","Da Nang","Hanoi"],"answer":2,"why":"Marines, to protect the air base."},{"id":"m3","s":"s2","q":"Why were 'hugging' tactics effective?","options":["They stopped US air strikes and artillery being used","They were quieter","They used tanks","They avoided villages"],"answer":0,"why":"Too close to call in fire support."},{"id":"m4","s":"s3","q":"How did the USA measure success in search and destroy?","options":["Land captured","Body counts","Villages built","Elections won"],"answer":1,"why":"Encouraged killing of civilians."},{"id":"m5","s":"s4","q":"Why was Tet a turning point?","options":["The communists won militarily","It destroyed US public belief that the war was being won","The USA withdrew immediately","China joined the war"],"answer":1,"why":"Political, not military, victory."}],"short":[{"id":"a1","s":"s4","q":"In which month and year did the Tet Offensive begin?","accept":["january 1968","jan 1968"],"answer":"January 1968"},{"id":"a2","s":"s3","q":"Name the defoliant sprayed on the jungle.","accept":["agent orange"],"answer":"Agent Orange"},{"id":"a3","s":"s3","q":"Who commanded US forces in Vietnam 1964–68?","accept":["westmoreland","general westmoreland","william westmoreland"],"answer":"General William Westmoreland"}],"chronology":[{"id":"c1","title":"Put these in order","items":["Rolling Thunder begins","Marines land at Da Nang","Khe Sanh siege begins","Tet Offensive","My Lai massacre","Johnson will not stand again"]}],"matching":[{"id":"x1","title":"Match the tactic to its description","pairs":[["Search and destroy","US raids on villages to kill Vietcong"],["Cu Chi","Vietcong tunnel network"],["Rolling Thunder","US bombing of the North"],["Hugging","Fighting too close for US air strikes"]]}],"evidence":[{"id":"e1","s":"s4","q":"Give precise evidence about the Tet Offensive.","keywords":[["1968","80,000","100","embassy","hue","saigon"]],"model":"On 30–31 January 1968 about 80,000 troops attacked over 100 towns, reaching the US Embassy compound in Saigon; Hue was held for nearly a month."}]},"flashcards":[{"id":"f1","s":"s1","q":"Why did Rolling Thunder fail?","a":"Little industry to destroy, supplies kept moving down the Ho Chi Minh Trail, bombing hardened resistance.","hint":"Trail."},{"id":"f2","s":"s2","q":"Name three Vietcong tactics.","a":"Ambushes and hit-and-run; booby traps; tunnels (Cu Chi); mixing with villagers; hugging.","hint":"Hide and strike."},{"id":"f3","s":"s3","q":"Why did search and destroy backfire?","a":"Body counts encouraged killing civilians, villages were burned, and peasants turned to the Vietcong.","hint":"Hearts and minds."},{"id":"f4","s":"s4","q":"What were the results of Tet?","a":"Military defeat for the communists but a political turning point: US opinion turned, Westmoreland's troop request refused, Johnson stood down.","hint":"Two sides."},{"id":"f5","s":"s4","q":"What happened at My Lai?","a":"In March 1968 US soldiers killed several hundred unarmed villagers; made public in November 1969.","hint":"Massacre."}],"checklist":[{"id":"k1","level":"describe","text":"I can describe Johnson's escalation: Rolling Thunder and US ground troops.","sections":["s1"]},{"id":"k2","level":"explain","text":"I can explain why Vietcong tactics were effective.","sections":["s2"]},{"id":"k3","level":"explain","text":"I can explain US tactics and why they failed.","sections":["s3"]},{"id":"k4","level":"judge","text":"I can judge the significance of the Tet Offensive.","sections":["s4"]}],"exam":{"questions":[{"id":"q1","qtype":"p2aa","label":"Past paper: 4HI1/02, June 2025, A4(a)","sections":["s4"],"q":"Describe TWO features of EITHER the siege of Khe Sanh OR Nixon's policy of Vietnamisation.","markscheme":null},{"id":"q2","qtype":"p2aa","label":"Teacher-created practice question","sections":["s2","s3"],"q":"Describe TWO features of EITHER Vietcong tactics OR the US policy of search and destroy.","markscheme":null}]},"stretch":[{"id":"t1","kind":"Interpretations","task":"Was Tet a defeat or a victory for the communists? Argue both sides, then decide."},{"id":"t2","kind":"Relative significance","task":"Rank Rolling Thunder, search and destroy and chemical weapons by how much they damaged the US war effort."}]},"y11-vn-4":{"id":"y11-vn-4","course":"y11","area":"vn","kt":"Key topic 4","order":34,"title":"The end of the war, 1969–75","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following 4HI1 Historical investigation A4, key topic 4."},"learn":{"intro":"Nixon promised 'peace with honour'. He withdrew US troops through Vietnamisation while widening the war into Cambodia and Laos. The Paris Peace Accords of 1973 ended US involvement, and Saigon fell to the North in 1975.","sections":[{"id":"s1","title":"1. Nixon and Vietnamisation","blocks":[{"p":"Richard Nixon became President in January 1969 promising to end the war with 'peace with honour'. His policy of Vietnamisation meant handing the fighting over to the South Vietnamese army (ARVN), which the USA would train and equip, while US troops gradually came home."},{"p":"US troop numbers fell from about 540,000 in 1969 to about 24,000 by the end of 1972. Conscription was replaced by a draft lottery (1969) and ended in 1973."},{"p":"Weaknesses: the ARVN had low morale and high desertion rates, and its officers were often corrupt. Without US ground troops and air power it struggled."}],"terms":["Vietnamisation","ARVN","peace with honour"],"evidence":["January 1969: Nixon becomes President.","US troops: about 540,000 (1969) → about 24,000 (end of 1972)."]},{"id":"s2","title":"2. Widening the war: Cambodia and Laos","blocks":[{"p":"To cut the Ho Chi Minh Trail and destroy communist bases, Nixon secretly bombed Cambodia from March 1969. In April 1970 US and ARVN troops invaded Cambodia. This caused huge protests in the USA, including at Kent State University, where National Guardsmen shot dead four students on 4 May 1970."},{"p":"In February 1971 the ARVN invaded Laos (Operation Lam Son 719) with US air support but no US ground troops. It was a failure and showed the weakness of Vietnamisation."},{"p":"In 1972 North Vietnam launched the Easter Offensive. Nixon responded with heavy bombing (Operation Linebacker), and in December 1972 the 'Christmas bombing' of Hanoi and Haiphong to push the North back to the negotiating table."}],"terms":["Cambodia","Laos","Kent State","Christmas bombing"],"evidence":["March 1969: secret bombing of Cambodia.","April 1970: invasion of Cambodia.","4 May 1970: Kent State shootings.","1971: ARVN invasion of Laos fails.","December 1972: Christmas bombing."]},{"id":"s3","title":"3. Peace talks and the Paris Peace Accords","blocks":[{"p":"Peace talks in Paris had begun in 1968. Henry Kissinger, Nixon's National Security Adviser, held secret talks with North Vietnam's Le Duc Tho. Nixon also improved relations with China and the USSR (visits in 1972), reducing their support for Hanoi."},{"p":"The Paris Peace Accords were signed on 27 January 1973. There would be a ceasefire; US troops would leave within 60 days; prisoners of war would be returned; but North Vietnamese troops could stay in the South. The last US combat troops left in March 1973."}],"terms":["Paris Peace Accords","ceasefire","prisoners of war"],"evidence":["27 January 1973: Paris Peace Accords.","March 1973: last US combat troops leave."]},{"id":"s4","title":"4. Communist victory, 1975","blocks":[{"p":"The ceasefire soon broke down. Nixon resigned in August 1974 over Watergate. His successor Gerald Ford asked Congress for more aid for South Vietnam, but Congress refused; it had already cut aid and passed the War Powers Act (1973) limiting the President's power to send troops."},{"p":"North Vietnam launched a final offensive in early 1975. The ARVN collapsed. Saigon fell on 30 April 1975 as the last Americans were evacuated by helicopter. Vietnam was reunified under communist rule in 1976, and Saigon was renamed Ho Chi Minh City."},{"p":"Reasons for US failure: the strengths of the North (determination, guerrilla tactics, the Ho Chi Minh Trail, support from China and the USSR); the weaknesses of the US military (tactics that turned peasants against them, low morale); the unpopular and corrupt South Vietnamese governments; and opposition to the war in the USA."}],"terms":["fall of Saigon","reunification","War Powers Act"],"evidence":["August 1974: Nixon resigns.","30 April 1975: fall of Saigon.","1976: Vietnam reunified."]}],"timeline":[{"date":"Jan 1969","event":"Nixon becomes President; Vietnamisation"},{"date":"March 1969","event":"Secret bombing of Cambodia begins"},{"date":"April 1970","event":"Invasion of Cambodia"},{"date":"4 May 1970","event":"Kent State shootings"},{"date":"Feb 1971","event":"ARVN invasion of Laos fails"},{"date":"Dec 1972","event":"Christmas bombing"},{"date":"27 Jan 1973","event":"Paris Peace Accords"},{"date":"Aug 1974","event":"Nixon resigns; Ford becomes President"},{"date":"30 April 1975","event":"Fall of Saigon"}],"people":[{"name":"Richard Nixon","role":"US President 1969–74; Vietnamisation."},{"name":"Henry Kissinger","role":"National Security Adviser; negotiated the Paris Accords."},{"name":"Le Duc Tho","role":"North Vietnam's chief negotiator in Paris."},{"name":"Gerald Ford","role":"US President 1974–77; Congress refused his aid request."}],"vocab":[{"term":"Vietnamisation","def":"Handing the fighting over to the South Vietnamese army while US troops withdrew."},{"term":"ARVN","def":"Army of the Republic of Vietnam — South Vietnam's army."},{"term":"Ceasefire","def":"Agreement to stop fighting."},{"term":"Reunification","def":"Joining North and South into one country."}],"misconceptions":[{"wrong":"Nixon simply withdrew from the war.","right":"He withdrew troops but widened the war with bombing and invasions of Cambodia and Laos."},{"wrong":"Saigon fell when US troops left in 1973.","right":"It fell two years later, in April 1975."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"What was Vietnamisation?","options":["Sending more US troops","Handing the fighting to the ARVN while US troops withdrew","Bombing Hanoi","Reuniting Vietnam"],"answer":1,"why":"Nixon from 1969."},{"id":"m2","s":"s2","q":"What happened at Kent State in May 1970?","options":["A peace treaty","Four students were shot dead by National Guardsmen","A Vietcong attack","Nixon resigned"],"answer":1,"why":"Protests against the invasion of Cambodia."},{"id":"m3","s":"s2","q":"Why did the 1971 invasion of Laos matter?","options":["It succeeded","Its failure showed the weakness of Vietnamisation","US troops led it","It ended the war"],"answer":1,"why":"ARVN without US ground troops."},{"id":"m4","s":"s3","q":"When were the Paris Peace Accords signed?","options":["1969","1971","27 January 1973","1975"],"answer":2,"why":"Ceasefire and US withdrawal."},{"id":"m5","s":"s4","q":"When did Saigon fall?","options":["1973","30 April 1975","1976","1968"],"answer":1,"why":"Final North Vietnamese offensive."}],"short":[{"id":"a1","s":"s3","q":"Who negotiated secretly for the USA in Paris?","accept":["kissinger","henry kissinger"],"answer":"Henry Kissinger"},{"id":"a2","s":"s1","q":"What does ARVN stand for?","accept":["army of the republic of vietnam"],"answer":"Army of the Republic of Vietnam"},{"id":"a3","s":"s4","q":"What was Saigon renamed?","accept":["ho chi minh city"],"answer":"Ho Chi Minh City"}],"chronology":[{"id":"c1","title":"Put these in order","items":["Nixon becomes President","Invasion of Cambodia","ARVN invasion of Laos","Christmas bombing","Paris Peace Accords","Fall of Saigon"]}],"matching":[{"id":"x1","title":"Match the person to the role","pairs":[["Nixon","Vietnamisation"],["Kissinger","Secret peace talks"],["Le Duc Tho","North Vietnam's negotiator"],["Ford","President when Saigon fell"]]}],"evidence":[{"id":"e1","s":"s1","q":"Give precise evidence about Vietnamisation.","keywords":[["540,000","540000","24,000","24000","arvn","1969","1972"]],"model":"US troops fell from about 540,000 in 1969 to about 24,000 by the end of 1972 as the ARVN took over the fighting."}]},"flashcards":[{"id":"f1","s":"s1","q":"Describe two features of Vietnamisation.","a":"Training and equipping the ARVN to fight; gradual withdrawal of US troops (about 540,000 → 24,000 by 1972).","hint":"ARVN + withdrawal."},{"id":"f2","s":"s2","q":"Why did Nixon invade Cambodia?","a":"To destroy communist bases and cut the Ho Chi Minh Trail.","hint":"Trail."},{"id":"f3","s":"s3","q":"What were the terms of the Paris Peace Accords?","a":"Ceasefire; US troops out within 60 days; POWs returned; North Vietnamese troops could stay in the South.","hint":"January 1973."},{"id":"f4","s":"s4","q":"Why did South Vietnam fall in 1975?","a":"ARVN weakness, corruption, Congress refusing more aid, and a determined Northern offensive.","hint":"No aid."},{"id":"f5","s":"s4","q":"Give four reasons for US failure.","a":"Northern strengths; US tactics and morale; weak South Vietnamese governments; opposition at home.","hint":"N, U, S, H."}],"checklist":[{"id":"k1","level":"describe","text":"I can describe Nixon's policy of Vietnamisation.","sections":["s1"]},{"id":"k2","level":"explain","text":"I can explain why Nixon widened the war into Cambodia and Laos.","sections":["s2"]},{"id":"k3","level":"describe","text":"I can describe the Paris Peace Accords.","sections":["s3"]},{"id":"k4","level":"judge","text":"I can judge the reasons for US failure in Vietnam.","sections":["s4"]}],"exam":{"questions":[{"id":"q1","qtype":"p2aa","label":"Past paper: 4HI1/02, June 2025, A4(a)","sections":["s1"],"q":"Describe TWO features of EITHER the siege of Khe Sanh OR Nixon's policy of Vietnamisation.","markscheme":null},{"id":"q2","qtype":"p2aa","label":"Teacher-created practice question","sections":["s3","s4"],"q":"Describe TWO features of EITHER the Paris Peace Accords of 1973 OR the fall of Saigon in 1975.","markscheme":null}]},"stretch":[{"id":"t1","kind":"Judgement","task":"Did Nixon achieve 'peace with honour'? Use evidence from 1969–75."},{"id":"t2","kind":"Relative significance","task":"Which reason for US failure was most important? Justify your ranking of all four."}]},"y11-vn-5":{"id":"y11-vn-5","course":"y11","area":"vn","kt":"Key topic 5","order":35,"title":"Reactions to the war in the USA and Vietnam","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following 4HI1 Historical investigation A4, key topic 5."},"learn":{"intro":"The war devastated Vietnamese civilians and divided American society. Media coverage, the draft and events such as My Lai fuelled a growing protest movement, while many Americans continued to support the war.","sections":[{"id":"s1","title":"1. The impact of the war on civilians in Vietnam","blocks":[{"p":"More bombs were dropped on Vietnam, Laos and Cambodia than by all sides in the Second World War. Villages were destroyed by search and destroy missions, napalm and bombing. Millions of Vietnamese became refugees, many moving into crowded camps and the slums of Saigon."},{"p":"Agent Orange destroyed crops and forests and caused cancers and birth defects for decades afterwards. Estimates of Vietnamese deaths vary widely, but they run into the millions, many of them civilians."},{"p":"Civilians were also caught between both sides: the Vietcong used terror against officials and those who helped the government, as in the killings in Hue during Tet in 1968."}],"terms":["refugees","civilian casualties","Agent Orange"],"evidence":["Millions of refugees.","Hue killings during Tet, 1968.","Long-term effects of Agent Orange."]},{"id":"s2","title":"2. Opposition to the war in the USA","blocks":[{"p":"The anti-war movement grew from 1965. Students held 'teach-ins' and marches; Students for a Democratic Society (SDS) organised protests. Young men burned their draft cards; the draft hit poorer and Black Americans hardest. Martin Luther King Jr spoke against the war in 1967, and the boxer Muhammad Ali refused the draft."},{"p":"The media was crucial: Vietnam was the first 'television war'. Images such as the Saigon police chief executing a Vietcong prisoner during Tet (1968) and reports of My Lai (published November 1969) shocked the public."},{"p":"Protest peaked in 1969–71: huge Moratorium demonstrations in October and November 1969; Kent State (May 1970); veterans throwing away their medals in 1971; and the Pentagon Papers (1971) revealing that governments had misled the public."}],"terms":["anti-war movement","draft","teach-in","Moratorium","Pentagon Papers"],"evidence":["1967: Martin Luther King speaks out.","October–November 1969: Moratorium protests.","1971: Pentagon Papers published."]},{"id":"s3","title":"3. Support for the war and the legacy","blocks":[{"p":"Not all Americans opposed the war. Many saw it as a fight against communism and saw protesters as unpatriotic. Nixon appealed to the 'silent majority' in November 1969. In May 1970 construction workers attacked anti-war students in New York (the 'Hard Hat Riot')."},{"p":"The war's legacy in the USA: about 58,000 Americans died; veterans often returned to a hostile or indifferent reception and many suffered long-term trauma; Congress passed the War Powers Act (1973) to limit the President's power to wage war; and trust in government fell."}],"terms":["silent majority","Hard Hat Riot","veterans"],"evidence":["November 1969: 'silent majority' speech.","May 1970: Hard Hat Riot.","About 58,000 US deaths."]}],"timeline":[{"date":"1965","event":"First teach-ins and large anti-war marches"},{"date":"1967","event":"Martin Luther King speaks against the war; Ali refuses the draft"},{"date":"Feb 1968","event":"Saigon execution photograph during Tet"},{"date":"Oct–Nov 1969","event":"Moratorium demonstrations"},{"date":"Nov 1969","event":"My Lai made public; 'silent majority' speech"},{"date":"May 1970","event":"Kent State shootings; Hard Hat Riot"},{"date":"1971","event":"Pentagon Papers published"},{"date":"1973","event":"War Powers Act"}],"people":[{"name":"Martin Luther King Jr","role":"Civil rights leader who opposed the war from 1967."},{"name":"Muhammad Ali","role":"Boxer who refused the draft in 1967."},{"name":"Richard Nixon","role":"Appealed to the 'silent majority' (1969)."}],"vocab":[{"term":"Draft","def":"Compulsory call-up for military service."},{"term":"Silent majority","def":"Nixon's term for Americans who quietly supported the war."},{"term":"Television war","def":"Vietnam was the first war shown widely on TV news."},{"term":"Pentagon Papers","def":"Secret government study leaked in 1971 showing the public had been misled."}],"misconceptions":[{"wrong":"All Americans opposed the war.","right":"Many supported it; Nixon appealed to the 'silent majority'."},{"wrong":"The protest movement was only students.","right":"It included civil rights leaders, veterans, celebrities and many ordinary people."}]},"quizzes":{"mcq":[{"id":"m1","s":"s2","q":"Why is Vietnam called the first 'television war'?","options":["It was filmed for films only","It was shown widely on TV news","Soldiers had TVs","It was broadcast live in Vietnam"],"answer":1,"why":"Images shaped opinion."},{"id":"m2","s":"s2","q":"What did the Pentagon Papers reveal?","options":["Plans for D-Day","That governments had misled the public about Vietnam","Vietcong tunnels","Peace terms"],"answer":1,"why":"Published 1971."},{"id":"m3","s":"s3","q":"Who were the 'silent majority'?","options":["Protesters","Americans who quietly supported the war","Vietnamese peasants","Congress"],"answer":1,"why":"Nixon, November 1969."},{"id":"m4","s":"s2","q":"Which civil rights leader spoke out against the war in 1967?","options":["Malcolm X","Martin Luther King Jr","Rosa Parks","Thurgood Marshall"],"answer":1,"why":"He linked the war to poverty and racism."},{"id":"m5","s":"s1","q":"What happened to millions of Vietnamese civilians?","options":["They emigrated to the USA","They became refugees","They joined the ARVN","Nothing"],"answer":1,"why":"Villages destroyed."}],"short":[{"id":"a1","s":"s3","q":"About how many Americans died in the war?","accept":["58000","58,000","about 58,000","58 000"],"answer":"About 58,000"},{"id":"a2","s":"s2","q":"Which boxer refused the draft?","accept":["muhammad ali","ali"],"answer":"Muhammad Ali"},{"id":"a3","s":"s2","q":"In which year were the Pentagon Papers published?","accept":["1971"],"answer":"1971"}],"chronology":[{"id":"c1","title":"Put these in order","items":["First teach-ins","King speaks against the war","Moratorium demonstrations","Kent State","Pentagon Papers","War Powers Act"]}],"matching":[{"id":"x1","title":"Match the event to its year","pairs":[["Moratorium","1969"],["Kent State","1970"],["Pentagon Papers","1971"],["War Powers Act","1973"]]}],"evidence":[{"id":"e1","s":"s2","q":"Give precise evidence of opposition to the war in the USA.","keywords":[["moratorium","1969","kent state","1970","pentagon papers","1971","draft"]],"model":"Millions joined the Moratorium protests in October–November 1969; four students were shot at Kent State in May 1970; the Pentagon
