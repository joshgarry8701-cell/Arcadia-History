<title>Mr Garry's History Revision Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one centred reading column (max 1040px) under a sticky bar; course colour carried by each year's accent.
   Faces: Bricolage Grotesque for display, Atkinson Hyperlegible for reading (designed for legibility), IBM Plex Mono for dates. */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --sunk: #e9edf4;
  --ink: #17202f;
  --muted: #566176;
  --line: #d9dee8;
  --accent: #22468e;
  --accent-ink: #ffffff;
  --course: #22468e;
  --red: #b83227;
  --amber: #a8670c;
  --green: #2c7a4b;
  --red-bg: #fbe9e7;
  --amber-bg: #fdf1dc;
  --green-bg: #e3f3e9;
  --focus: #f0a400;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131b; --surface: #171d28; --sunk: #1d2433; --ink: #e7ebf2; --muted: #a0aabb; --line: #2b3446;
    --accent: #8eb0f2; --accent-ink: #0f131b; --course: #8eb0f2;
    --red: #f08a7e; --amber: #f0b45a; --green: #74c99a; --red-bg: #3a1d1b; --amber-bg: #3a2c14; --green-bg: #17331f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131b; --surface: #171d28; --sunk: #1d2433; --ink: #e7ebf2; --muted: #a0aabb; --line: #2b3446;
  --accent: #8eb0f2; --accent-ink: #0f131b; --course: #8eb0f2;
  --red: #f08a7e; --amber: #f0b45a; --green: #74c99a; --red-bg: #3a1d1b; --amber-bg: #3a2c14; --green-bg: #17331f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.8rem, 4.5vw, 2.6rem); font-weight: 700; }
h2 { font-size: 1.45rem; font-weight: 650; }
h3 { font-size: 1.15rem; font-weight: 650; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.eyebrow { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- top bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1072px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; margin-right: auto; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.brand svg { flex: none; }
.brand b { font-family: var(--display); font-size: 1.05rem; line-height: 1.1; display: block; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; height: 40px; min-width: 40px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
.iconbtn:hover { background: var(--sunk); }
.brand span { font-size: .78rem; color: var(--muted); display: block; font-weight: 700; }
.brand i { font-style: normal; font-weight: 400; }
@media (max-width: 560px) { .hide-sm { display: none; } .brand b { font-size: 1rem; } }

main { max-width: 1072px; margin: 0 auto; padding-block: 20px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; }
.notice { border: 1px solid var(--line); border-left: 4px solid var(--amber); background: var(--amber-bg); border-radius: 8px; padding: 10px 14px; font-size: .92rem; }
.notice.info { border-left-color: var(--accent); background: var(--sunk); }
.notice.bad { border-left-color: var(--red); background: var(--red-bg); }

.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .9rem; color: var(--muted); }
.crumbs button { background: none; border: 0; padding: 4px 2px; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- home ---------- */
.hero { display: grid; gap: 8px; padding-block: 8px 4px; }
.hero p { max-width: 62ch; color: var(--muted); }
.years { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.year { --course: var(--accent); display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: start; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; cursor: pointer; color: inherit; }
.year:hover { border-color: var(--course); }
.year .num { grid-row: span 3; font-family: var(--display); font-weight: 800; font-size: 3.2rem; line-height: .9; color: var(--course); font-variant-numeric: tabular-nums; min-width: 2.1ch; }
.year h3 { font-size: 1.05rem; }
.year .enq { color: var(--muted); font-size: .92rem; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--sunk); color: var(--muted); width: fit-content; }
.chip.ok { background: var(--green-bg); color: var(--green); }
.chip.warn { background: var(--amber-bg); color: var(--amber); }
.chip.bad { background: var(--red-bg); color: var(--red); }
.chip.lvl-describe { background: var(--red-bg); color: var(--red); }
.chip.lvl-explain { background: var(--amber-bg); color: var(--amber); }
.chip.lvl-judge { background: var(--green-bg); color: var(--green); }

/* ---------- panels ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: grid; gap: 14px; min-width: 0; }
.panel.flat { background: transparent; border: 0; padding: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 14px; }
.course-head { display: grid; gap: 6px; border-left: 6px solid var(--course); padding-left: 16px; }

.acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 12px; }
.act { display: grid; gap: 6px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; cursor: pointer; color: inherit; }
.act:hover { border-color: var(--course); }
.act b { font-family: var(--display); font-size: 1.08rem; }
.act .meter { margin-top: 6px; }

.meter { height: 8px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--course); border-radius: 99px; }
.stat { display: grid; gap: 2px; }
.stat b { font-family: var(--display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.good { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.btn.bad { background: var(--red-bg); border-color: var(--red); color: var(--red); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: .9rem; }

/* ---------- topic tabs ---------- */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.tabs button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; cursor: pointer; font-weight: 700; font-size: .92rem; color: var(--muted); }
.tabs button[aria-current="page"] { background: var(--course); border-color: var(--course); color: var(--accent-ink); }

/* ---------- learn ---------- */
.learn { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; align-items: start; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); display: grid; gap: 2px; font-size: .92rem; }
.toc button { text-align: left; background: none; border: 0; padding: 6px 10px; border-left: 3px solid var(--line); cursor: pointer; color: var(--muted); }
.toc button:hover { color: var(--ink); border-left-color: var(--course); }
@media (max-width: 820px) { .learn { grid-template-columns: minmax(0, 1fr); } .toc { position: static; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
.prose { display: grid; gap: 12px; max-width: 68ch; }
.prose ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.section { display: grid; gap: 12px; scroll-margin-top: 90px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
.terms { display: flex; flex-wrap: wrap; gap: 6px; }
.evidence { background: var(--sunk); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; font-size: .95rem; }
.evidence ul { margin: 0; padding-left: 1.1em; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.timeline li { display: grid; grid-template-columns: 8.5em 1fr; gap: 14px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.timeline .d { font-family: var(--mono); font-size: .88rem; color: var(--course); font-weight: 600; font-variant-numeric: tabular-nums; }
@media (max-width: 480px) { .timeline li { grid-template-columns: 1fr; gap: 0; } }
.people, .vocab { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 10px; }
.people > div, .vocab > div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; font-size: .93rem; }
.myth { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-size: .93rem; }
.myth > div { padding: 10px 12px; }
.myth .w { background: var(--red-bg); } .myth .r { background: var(--green-bg); }
@media (max-width: 560px) { .myth { grid-template-columns: 1fr; } }
.source { border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 6px; font-size: .93rem; }
.source dl { display: grid; grid-template-columns: 7em 1fr; gap: 4px 10px; margin: 0; }
.source dt { font-weight: 700; color: var(--muted); }
.source dd { margin: 0; }
.figure { border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; background: var(--surface); }
.figure svg { display: block; width: 100%; min-width: 520px; height: auto; }
.figure svg text { fill: var(--ink); font-family: var(--body); }
.figure .route-h { stroke: var(--red); } .figure .route-w { stroke: var(--accent); }
.figure .place { fill: var(--surface); stroke: var(--ink); }
.figure .sea { fill: var(--sunk); }

/* ---------- quiz & cards ---------- */
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: grid; gap: 14px; }
.qcard .q { font-size: 1.15rem; font-weight: 700; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px 14px; cursor: pointer; min-height: 48px; }
.opt:hover { background: var(--sunk); }
.opt.right { background: var(--green-bg); border-color: var(--green); }
.opt.wrong { background: var(--red-bg); border-color: var(--red); }
.feedback { border-radius: 8px; padding: 10px 14px; font-size: .95rem; }
.feedback.right { background: var(--green-bg); }
.feedback.wrong { background: var(--red-bg); }
input[type=text], input[type=password], input[type=number], textarea, select { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; min-height: 44px; }
textarea { min-height: 220px; line-height: 1.6; resize: vertical; }
label { font-weight: 700; font-size: .92rem; display: grid; gap: 6px; }
.order { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.order li { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px 6px 12px; background: var(--surface); }
.order li span { flex: 1; min-width: 0; }
.order li.right { border-color: var(--green); background: var(--green-bg); }
.order li.wrong { border-color: var(--red); background: var(--red-bg); }
.match { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 8px 12px; align-items: center; }
@media (max-width: 560px) { .match { grid-template-columns: 1fr; } }

.flash { min-height: 260px; display: grid; place-items: center; text-align: center; background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--course); border-radius: var(--radius); padding: 28px 22px; cursor: pointer; }
.flash .face { display: grid; gap: 12px; max-width: 46ch; }
.flash .face b { font-family: var(--display); font-size: 1.35rem; line-height: 1.25; }
.flash .ans { font-size: 1.12rem; }
.pin { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: .9rem; }
.pin[aria-pressed="true"] { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); font-weight: 700; }

/* ---------- checklist ---------- */
.check { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.check .txt { display: grid; gap: 4px; }
.rag { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.rag button { border: 0; background: var(--surface); padding: 8px 12px; cursor: pointer; font-weight: 700; font-size: .85rem; min-height: 40px; color: var(--muted); }
.rag button + button { border-left: 1px solid var(--line); }
.rag button[aria-pressed="true"][data-v="red"] { background: var(--red); color: #fff; }
.rag button[aria-pressed="true"][data-v="amber"] { background: var(--amber); color: #fff; }
.rag button[aria-pressed="true"][data-v="green"] { background: var(--green); color: #fff; }
@media (max-width: 560px) { .check { grid-template-columns: 1fr; } }

/* ---------- exam ---------- */
details.fold { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details.fold > summary { cursor: pointer; padding: 12px 14px; font-weight: 700; list-style-position: inside; }
details.fold > div { padding: 0 14px 14px; display: grid; gap: 8px; }
details.fold ul, details.fold ol { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.model { display: grid; gap: 10px; }
.model .seg { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 12px; }
.model .seg p { background: var(--sunk); padding: 8px 12px; border-radius: 6px; }
.model .seg em { font-style: normal; font-size: .88rem; color: var(--muted); border-left: 3px solid var(--course); padding-left: 10px; }
@media (max-width: 640px) { .model .seg { grid-template-columns: 1fr; } }
.frame { display: grid; gap: 6px; background: var(--sunk); border-radius: 8px; padding: 12px 14px; font-size: .95rem; }
.frame ol { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.seg-ctl { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg-ctl button { border: 0; background: var(--surface); padding: 8px 12px; cursor: pointer; font-weight: 700; font-size: .88rem; }
.seg-ctl button + button { border-left: 1px solid var(--line); }
.seg-ctl button[aria-pressed="true"] { background: var(--course); color: var(--accent-ink); }
.grid-plan { width: 100%; border-collapse: collapse; font-size: .92rem; }
.grid-plan th, .grid-plan td { border: 1px solid var(--line); padding: 6px; vertical-align: top; text-align: left; }
.grid-plan textarea { min-height: 70px; border: 0; padding: 4px; background: transparent; }
.scroll-x { overflow-x: auto; }
.fb { display: grid; gap: 12px; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; background: var(--surface); }
.fb h4 { font-size: 1rem; }
.fb ul, .fb ol { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.markbox { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; }
.markbox b { font-family: var(--display); font-size: 2rem; font-variant-numeric: tabular-nums; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.compare > div { background: var(--sunk); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; font-size: .92rem; min-width: 0; }
@media (max-width: 640px) { .compare { grid-template-columns: 1fr; } }

/* ---------- search overlay ---------- */
.overlay { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, var(--ink) 45%, transparent); display: grid; place-items: start center; padding-top: calc(env(safe-area-inset-top, 0px) + 60px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.overlay .box { width: min(640px, 100%); background: var(--surface); border-radius: var(--radius); border: 1px solid var(--line); padding: 14px; display: grid; gap: 10px; max-height: 75vh; overflow: auto; }
.results { display: grid; gap: 4px; }
.results button { text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; display: grid; gap: 2px; }
.results button:hover, .results button:focus-visible { background: var(--sunk); }

/* ---------- tables (teacher) ---------- */
table.data { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.data th, table.data td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.data th { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
pre.code { white-space: pre-wrap; font-family: var(--mono); font-size: .85rem; background: var(--sunk); padding: 10px; border-radius: 6px; margin: 0; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 50; font-weight: 700; max-width: calc(100% - 32px); }
.login { max-width: 420px; margin: 6vh auto 0; }

@media (prefers-reduced-motion: no-preference) {
  .flash, .opt, .btn, .act, .year { transition: background-color .15s, border-color .15s, transform .15s; }
  .act:hover, .year:hover { transform: translateY(-1px); }
}

/* ---------- additions: teacher photo, quotations, level tables ---------- */
.hero-photo { grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 20px; }
.hero-photo > div { display: grid; gap: 8px; min-width: 0; }
.teacher { width: 132px; height: 132px; border-radius: 50%; object-fit: cover; object-position: 50% 20%; background: var(--sunk); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
@media (max-width: 560px) { .hero-photo { grid-template-columns: 1fr; } .teacher { width: 96px; height: 96px; } }
blockquote { margin: 0; padding: 10px 14px; border-left: 4px solid var(--course); background: var(--sunk); border-radius: 0 6px 6px 0; font-size: .97rem; white-space: pre-line; }
table.levels td:first-child, table.levels td:nth-child(2) { white-space: nowrap; }

</style>

 end-of-unit task"]},{"id":"y11","year":"Year 11","title":"International GCSE History","enquiry":"Germany 1918–45 · Civil rights in the USA 1945–74 · The Vietnam Conflict 1945–75 · Changes in medicine c1848–c1948","stage":"International GCSE","accent":"#1f5f8b","separation_note":"Year 11 Germany is the International GCSE depth study. It is kept separate from Year 12 Germany (International A Level Unit 1), which has different questions and mark schemes.","areas":[{"id":"de","title":"Germany: development of dictatorship, 1918–45","paper":"Paper 1 · Depth study 3"},{"id":"us","title":"A divided union: civil rights in the USA, 1945–74","paper":"Paper 1 · Depth study 7"},{"id":"vn","title":"A4: The Vietnam Conflict, 1945–75","paper":"Paper 2 · Section A historical investigation"},{"id":"med","title":"Changes in medicine, c1848–c1948","paper":"Paper 2 · Breadth study B2"}],"exam":{"verified":true,"board":"Pearson Edexcel","qualification":"International GCSE in History (9–1)","codes":"4HI1 · Paper 1 4HI1/01 · Paper 2 4HI1/02","specification_version":"Issue 4, March 2022 (your uploaded copy). Pearson's website now shows Issue 5, February 2026 — check what changed.","papers":[{"code":"4HI1/01","title":"Paper 1: Depth Studies","duration":"1 hour 30 minutes","marks":60,"weighting":"50%","structure":"One 30-mark question on each of two depth studies (about 45 minutes each). Each question has parts (a) 6 marks, (b) 8 marks and a choice of (c)(i) or (c)(ii) 16 marks.","qtypes":["p1a","p1b","p1c"]},{"code":"4HI1/02","title":"Paper 2: Investigation and Breadth Studies","duration":"1 hour 30 minutes","marks":60,"weighting":"50%","structure":"Section A: historical investigation A4 Vietnam (30 marks): (a) 6, (b) 8, (c) 16 — sources and an extract are in the paper. Section B: breadth study B2 Medicine (30 marks): (a) 6, (b) 8 and a choice of (c)(i) or (c)(ii) 16. Breadth-study (c) questions focus on the themes and normally draw on two or more key topics.","qtypes":["p2aa","p2ab","p2ac","p2ba","p2bb","p2bc"]}],"aos":[{"ao":"AO1","text":"Demonstrate knowledge and understanding of the key features and characteristics of the periods studied","weight":"34% (Paper 1 18%, Paper 2 16%)"},{"ao":"AO2","text":"Explain, analyse and make judgements about historical events and periods studied using second-order historical concepts","weight":"36% (Paper 1 22%, Paper 2 14%)"},{"ao":"AO3","text":"Use a range of source material to comprehend, interpret and cross-refer sources","weight":"15% (Paper 2 only)"},{"ao":"AO4","text":"Analyse and evaluate historical interpretations in the context of historical events studied","weight":"15% (Paper 1 10%, Paper 2 5%)"}],"sources":[{"title":"Pearson Edexcel International GCSE in History (4HI1) specification, Issue 4, March 2022","note":"Uploaded by Mr Garry — content, papers, AO weightings"},{"title":"Specification Issue 5, February 2026 (Pearson website)","url":"https://qualifications.pearson.com/content/dam/pdf/International GCSE/History/2017/specification-and-sample-assessments/int-gcse-history-specification.pdf"},{"title":"4HI1/01 mark scheme, June 2025 — question structure and level ranges","url":"https://pmt.physicsandmathstutor.com/download/History/GCSE/Past-Papers/Edexcel-IGCSE/Spec-4HI1/Paper-1/June%202025%20MS%20-%20Paper%201%20Edexcel%20History%20IGCSE.pdf"},{"title":"4HI1/02 mark scheme, June 2025 — Section A investigation structure and level ranges (same document as above)","note":"(a) describe two features; (b) how far does Source A support Source B; (c) Extract C interpretation"},{"title":"4HI1/02 mark scheme, June 2025 — breadth study structure and level ranges","url":"https://pmt.physicsandmathstutor.com/download/History/GCSE/Past-Papers/Edexcel-IGCSE/Spec-4HI1/Paper-2/June%202025%20MS%20-%20Paper%202%20Edexcel%20History%20IGCSE.pdf"},{"title":"Arcadia IGCSE model paragraphs (uploaded)","note":"Department paragraph models used in the question-type guides"}],"open_questions":["Pearson also publishes 4WHI1 papers. Confirm which entry code Arcadia uses (4HI1 assumed).","The (c)(i)/(c)(ii) choice is inferred from the marks (6 + 8 + 16 = 30 per question); confirm on a current paper's rubric."]},"qtypes":{"p1a":{"label":"Paper 1 (a) — interpretation impression","paper":"Paper 1","marks":6,"minutes":8,"ao":"AO4","requires_sources":true,"template":"What impression does the author give about …? You must use Extract X to explain your answer.","asks":"Work out the overall impression (the author's view or tone) about the named issue, then prove it with two pieces of the extract's wording or detail and explain what each shows.","steps":["Read the question focus and underline it.","Read the extract twice; decide the overall impression in a few words (e.g. 'well-organised and controlled').","Pick two short quotations or details that create that impression.","For each: quote it, then explain how the word choice or detail creates the impression.","Finish with one sentence restating the impression."],"plan":"About 8 minutes: 1 minute deciding the impression, 6 minutes writing, 1 minute checking you used the extract.","success":["States a clear impression that answers the question","Supports it with selected words or details from the extract","Explains how those details create the impression (analysis of the author's language/choice of detail)"],"mistakes":["Summarising the extract instead of identifying an impression","Bringing in lots of own knowledge — this question rewards analysis of the extract","Quoting long passages without explaining them"],"frame":{"full":["The author gives the impression that …","Firstly, the extract says “…”, which suggests that …","Also, the author describes … as “…”, which shows …","Therefore, the impression the author gives is that …"],"some":["Impression","Quote 1 + what it suggests","Quote 2 + what it shows","Restate the impression"]},"model":[{"t":"The author gives the impression that life in Nazi Germany was extremely well-organised and controlled.","n":"Topic sentence with the impression stated (department model)."},{"t":"Firstly, the extract describes people who “marched in neat rows at the rally”, which suggests the Nazis created a disciplined and united image.","n":"Quotation + explanation of what the detail suggests."},{"t":"Therefore, the impression the author gives is that Nazi Germany appeared united, disciplined and loyal to Hitler.","n":"Restates the impression to close."}],"model_note":"Adapted from the Arcadia IGCSE model paragraphs. The quoted words illustrate the technique; they are not from a real published extract.","markscheme":{"verified":false,"source":"Paraphrased from the 4HI1/01 June 2025 mark scheme (generic levels for (a)). Check the wording against your copy, then tick verified.","max_marks":6,"ao_separate":false,"levels":[{"level":"1","marks":"1–2","descriptor":"A simple impression is identified, with little or no support from the extract."},{"level":"2","marks":"3–4","descriptor":"An impression is identified and supported with some relevant detail from the extract, with some analysis of how it is created."},{"level":"3","marks":"5–6","descriptor":"The impression is clearly analysed, supported by well-selected detail from the extract, showing how the author's choices create it."}]}},"p1b":{"label":"Paper 1 (b) — explain two effects","paper":"Paper 1","marks":8,"minutes":12,"ao":"AO1 (4) + AO2 (4)","template":"Explain two effects of … on …","asks":"Explain two different consequences of the event. Each needs precise knowledge and an explanation of how the event led to that effect.","steps":["Underline the event and what it affected (e.g. 'on the Nazi Party').","Choose two clearly different effects.","Paragraph 1: name the effect, give precise evidence (date, number, name, law), explain how the event caused it.","Paragraph 2: same pattern for a second effect.","Keep each paragraph on 'effect' — not a story of the event."],"plan":"About 12 minutes: 1 minute planning two effects, 5 minutes per paragraph, 1 minute checking.","success":["Two different effects identified","Each supported with accurate, specific knowledge","Each explained — how the event led to the effect"],"mistakes":["Writing only one effect (the mark scheme caps this at 4 marks, with no access to Level 3)","Describing the event instead of its effects","Two effects that are really the same point"],"frame":{"full":["One important effect of … was … For example, … As a result, …","Another important effect of … was … For instance, … This meant that …"],"some":["Effect 1: name it + evidence + 'as a result'","Effect 2: name it + evidence + 'this meant'"]},"model":[{"t":"One important effect of the Wall Street Crash was mass unemployment.","n":"Topic sentence naming the effect."},{"t":"By 1932 over 6 million Germans were unemployed.","n":"Precise evidence (statistic)."},{"t":"As a result, many people lost faith in the Weimar government because it seemed unable to solve the crisis.","n":"Explaining connective + consequence."}],"model_note":"From the Arcadia IGCSE model paragraphs. A full answer needs a second effect in the same pattern.","markscheme":{"verified":false,"source":"Paraphrased from the 4HI1/01 June 2025 mark scheme (generic levels for (b)). Check, then tick verified.","max_marks":8,"ao_separate":false,"levels":[{"level":"1","marks":"1–2","descriptor":"A simple or generalised answer, lacking development; limited knowledge of the topic."},{"level":"2","marks":"3–5","descriptor":"Features of the period are analysed to explain at least one effect; some accurate and relevant knowledge supports it. Maximum 4 marks if only one effect is explained."},{"level":"3","marks":"6–8","descriptor":"Two effects are explained with developed analysis; accurate and relevant knowledge shows good understanding. Level 3 is not available if only one effect is explained."}],"notes":"One effect only: maximum 4 marks, no access to Level 3."}},"p1c":{"label":"Paper 1 (c) — how far do you agree","paper":"Paper 1","marks":16,"minutes":24,"ao":"AO1 (7) + AO2 (9)","template":"‘[Statement].’ How far do you agree? Explain your answer. You may use the following in your answer: [two prompts]. You must also use information of your own.","asks":"Weigh the factor in the statement against others and reach a supported judgement. You must go beyond the two prompts with at least one point of your own.","steps":["Underline the factor in the statement and the dates.","Plan three paragraphs: the stated factor, the second prompt, and one point of your own.","Open with your judgement ('To a large/some/limited extent …').","Write each paragraph: point, precise evidence, explanation, link back to the statement.","Conclude by comparing the factors using a criterion (e.g. which lasted longest, affected most people, caused the most change)."],"plan":"About 24 minutes: 3 minutes planning three aspects, 18 minutes writing, 3 minutes conclusion and check.","success":["Covers three aspects including one beyond the prompts","Precise, accurate knowledge throughout","Analysis explains how each aspect relates to the statement","Clear judgement with a reason in the conclusion"],"mistakes":["Only using the two prompts (caps the mark: Level 2 max 6, Level 3 max 10, no Level 4)","Describing instead of explaining how the factor mattered","Ending without a judgement or with 'they were all important'"],"frame":{"full":["Introduction: I agree to a large / some / limited extent that … because …","The most significant reason … was … Firstly, in [date], … This meant that … This was highly significant because …","However, another important reason was … For example, … This shows that …","Furthermore, [your own point] … For instance, … As a result, …","Overall, … was the most important because it lasted longest / affected the most people / caused the biggest change, whereas …"],"some":["Judgement","Factor in the statement","Second prompt","Your own point","Conclusion using a criterion"]},"model":[{"t":"The most significant reason life was difficult for German Jews was the impact of the Nuremberg Laws.","n":"Topic sentence with a qualifier."},{"t":"Firstly, in 1935 these laws banned marriages between Jews and non-Jews and stripped Jews of German citizenship.","n":"Time connective + precisely selected evidence."},{"t":"This meant that Jews were legally excluded from German society and lost protection under the law.","n":"Explaining connective."},{"t":"This was highly significant because it created long-term legal discrimination, so the Nuremberg Laws were a turning point because they made discrimination official government policy.","n":"Criteria to justify (duration, impact)."}],"model_note":"Adapted from the Arcadia IGCSE model paragraphs (last sentence lightly corrected).","markscheme":{"verified":false,"source":"Paraphrased from the 4HI1/01 June 2025 mark scheme (generic levels for (c)). Check, then tick verified.","max_marks":16,"ao_separate":false,"levels":[{"level":"1","marks":"1–4","descriptor":"A simple or generalised answer with limited analysis; limited knowledge; judgement asserted."},{"level":"2","marks":"5–8","descriptor":"An explanation is given, showing limited analysis and organisation; some accurate knowledge; an overall judgement is given but its justification is undeveloped. Maximum 6 marks if it does not go beyond the aspects in the prompts."},{"level":"3","marks":"9–12","descriptor":"An explanation is given, showing some analysis, generally directed at the question; accurate and relevant knowledge; overall judgement given with some justification. Maximum 10 marks if it does not go beyond the prompts."},{"level":"4","marks":"13–16","descriptor":"An analytical explanation directed consistently at the question; accurate, relevant knowledge used to support it; criteria for the judgement are justified and applied. Not available if the answer does not go beyond the prompts."}],"notes":"Three aspects needed (at least one beyond the prompts) to reach Level 4."}},"p2ba":{"label":"Paper 2 B (a) — explain two similarities or differences","paper":"Paper 2 Section B","marks":6,"minutes":9,"ao":"AO1 (2) + AO2 (4)","template":"Explain TWO ways in which … was similar to / different from …","asks":"Compare two named situations or periods and explain two specific similarities or differences, with evidence from both sides of the comparison.","steps":["Underline both things being compared and the dates.","Choose two clear similarities (or differences).","For each: state it, give evidence for BOTH sides, explain why that is a similarity/difference.","Keep it to two developed points — no introduction needed."],"plan":"About 9 minutes: 1 minute choosing two points, 4 minutes per point.","success":["Two distinct similarities/differences","Evidence from both sides of each comparison","Explanation of the similarity/difference"],"mistakes":["Describing one period, then the other, without comparing","Only one similarity/difference (maximum 3 marks)","Using evidence outside the dates"],"frame":{"full":["One way in which … was different from … was … In [period 1], … whereas in [period 2], … This shows that …","A second difference was … In [period 1], … However, by [period 2], … Therefore …"],"some":["Comparison 1: both sides + explanation","Comparison 2: both sides + explanation"]},"markscheme":{"verified":false,"source":"Paraphrased from the 4HI1/02 June 2025 mark scheme (breadth study (a)). Check, then tick verified.","max_marks":6,"ao_separate":false,"levels":[{"level":"1","marks":"1–2","descriptor":"Simple or generalised comment; limited knowledge."},{"level":"2","marks":"3–4","descriptor":"Similarity/difference explained with some analysis and supporting knowledge. Maximum 3 marks if only one is explained."},{"level":"3","marks":"5–6","descriptor":"Two similarities/differences explained with developed analysis, supported by accurate, relevant knowledge."}]}},"p2bb":{"label":"Paper 2 B (b) — explain two causes","paper":"Paper 2 Section B","marks":8,"minutes":12,"ao":"AO1 (4) + AO2 (4)","template":"Explain TWO causes of …","asks":"Explain two different reasons why something happened, each supported by precise evidence and an explanation of how it caused the outcome.","steps":["Underline the outcome and the dates.","Choose two distinct causes.","For each: name the cause, give precise evidence, then explain how it led to the outcome ('As a result…').","Do not tell the story of the outcome itself."],"plan":"About 12 minutes: 1 minute planning, 5 minutes per cause, 1 minute checking.","success":["Two different causes","Precise supporting knowledge for each","Clear explanation of how each caused the outcome"],"mistakes":["Only one cause (maximum 4 marks, no Level 3)","Describing events without saying how they caused the outcome","Using a cause outside the date range"],"frame":{"full":["One important cause of … was … Firstly, in [date], … As a result, … because …","A second cause was … For example, … This led to … because …"],"some":["Cause 1 + evidence + how it caused the outcome","Cause 2 + evidence + how it caused the outcome"]},"markscheme":{"verified":false,"source":"Paraphrased from the 4HI1/02 June 2025 mark scheme (breadth study (b)). Check, then tick verified.","max_marks":8,"ao_separate":false,"levels":[{"level":"1","marks":"1–2","descriptor":"Simple or generalised answer; limited knowledge."},{"level":"2","marks":"3–5","descriptor":"At least one cause explained with some analysis and supporting knowledge. Maximum 4 marks for one cause."},{"level":"3","marks":"6–8","descriptor":"Two causes explained with developed analysis, supported by accurate and relevant knowledge. Not available for one cause."}]}},"p2bc":{"label":"Paper 2 B (c) — how far (themes)","paper":"Paper 2 Section B","marks":16,"minutes":24,"ao":"AO1 (7) + AO2 (9)","template":"How far … in the years …? Explain your answer. You may use the following in your answer: [two prompts]. You must also use information of your own.","asks":"Make a judgement about change, continuity or the importance of a factor across a long period, using the two prompts and at least one point of your own from a different part of the period.","steps":["Underline the concept (change, turning point, main reason) and the dates.","Plan three aspects spread across the date range — at least one beyond the prompts.","Open with a judgement.","In each paragraph, explain how far that aspect shows change (or importance), with precise evidence.","Conclude with a criterion-based judgement across the whole period."],"plan":"About 24 minutes: 3 minutes planning, 18 minutes writing, 3 minutes conclusion and check.","success":["Three aspects across the period, one beyond the prompts","Precise knowledge, correctly dated","Analysis of change/continuity or significance","Supported overall judgement"],"mistakes":["Covering only the start of the period","Only using the prompts (caps the mark)","Narrative with no judgement"],"frame":{"full":["To a large / some / limited extent … because …","Firstly, [prompt 1, with date] … This shows … because …","Secondly, [prompt 2] … However, … which suggests …","Furthermore, [own point from a different part of the period] …","Overall, … because [criterion: how much changed, how many people were affected, how long it lasted]."],"some":["Judgement","Aspect 1","Aspect 2","Own aspect","Conclusion with criterion"]},"model":[{"t":"The discovery of penicillin was a turning point to a large extent because it transformed the treatment of infection.","n":"Topic sentence with qualifier."},{"t":"Firstly, Alexander Fleming identified penicillin in 1928, the first effective antibiotic. This shows that treatment could now kill bacteria rather than just manage symptoms.","n":"Time connective + precise evidence + explanation."},{"t":"Secondly, in the 1940s Florey and Chain developed ways to mass-produce penicillin, which saved thousands of lives during the Second World War.","n":"Second piece of evidence, later in the period."},{"t":"This was significant because it marked a permanent change in the treatment of disease, making bacterial infections curable rather than fatal.","n":"Criteria to justify (impact, duration)."}],"model_note":"From the Arcadia IGCSE model paragraphs.","markscheme":{"verified":false,"source":"Paraphrased from the 4HI1/02 June 2025 mark scheme (breadth study (c)). Check, then tick verified.","max_marks":16,"ao_separate":false,"levels":[{"level":"1","marks":"1–4","descriptor":"Simple or generalised answer with limited analysis; limited knowledge; judgement asserted."},{"level":"2","marks":"5–8","descriptor":"Limited analysis and organisation; some accurate knowledge; judgement with undeveloped justification. Maximum 6 marks if it does not go beyond the prompts."},{"level":"3","marks":"9–12","descriptor":"Some analysis directed at the question; accurate, relevant knowledge; judgement with some justification. Maximum 10 marks if it does not go beyond the prompts."},{"level":"4","marks":"13–16","descriptor":"Analytical explanation consistently directed at the question; accurate knowledge supports it; justified criteria applied to the judgement. Requires going beyond the prompts."}]}},"p2aa":{"label":"Paper 2 A (a) — describe two features","paper":"Paper 2 Section A","marks":6,"minutes":8,"ao":"AO1","template":"Describe TWO features of EITHER [X] OR [Y].","asks":"Choose one of the two topics and describe two separate features of it, each with precise supporting detail. No explanation of importance is needed.","steps":["Pick the option you know more about.","Identify two different features (things that happened or characteristics).","For each: a topic sentence naming the feature, then one or two precise supporting details.","Keep it short — this is a 6-mark describe question."],"plan":"About 8 minutes: 1 minute choosing, 3–4 minutes per feature.","success":["Two different features identified","Each supported with accurate, specific detail"],"mistakes":["Describing only one feature (maximum 3 marks)","Writing about both options instead of choosing one","Explaining causes or consequences at length instead of describing"],"frame":{"full":["One important feature was … Firstly, … This shows that …","Another important feature was … Secondly, … This meant that …"],"some":["Feature 1 + detail","Feature 2 + detail"]},"model":[{"t":"One important feature was the use of tunnels. The Vietcong built underground bases to hide fighters and supplies from US bombing.","n":"Topic sentence with the feature + precise detail."},{"t":"Another important feature was ambushes. Vietcong troops used booby traps such as punji sticks and carried out hit-and-run attacks, so US troops lived in constant fear of attack.","n":"Second, different feature + detail."}],"model_note":"Adapted from the Arcadia IGCSE model paragraphs.","markscheme":{"verified":false,"source":"Paraphrased from the 4HI1/02 June 2025 mark scheme (Section A (a)). Check, then tick verified.","max_marks":6,"ao_separate":false,"levels":[{"level":"1","marks":"1–2","descriptor":"Simple or generalised comment; limited knowledge."},{"level":"2","marks":"3–4","descriptor":"Features described with some supporting knowledge. Maximum 3 marks if only one feature is described."},{"level":"3","marks":"5–6","descriptor":"Two features described, each supported by accurate and relevant knowledge."}],"notes":"One feature only: maximum 3 marks."}},"p2ab":{"label":"Paper 2 A (b) — how far does Source A support Source B","paper":"Paper 2 Section A","marks":8,"minutes":12,"ao":"AO3","requires_sources":true,"template":"How far does Source A support the evidence of Source B about …? Explain your answer.","asks":"Compare what the two sources say about the named issue. Find where they agree and where they differ, quote both, and reach a judgement on how far A supports B.","steps":["Underline the issue in the question.","Read both sources and highlight points on that issue only.","Paragraph 1: agreement — quote/paraphrase both sources.","Paragraph 2: difference — quote/paraphrase both sources.","Judgement: supports to a large / some / limited extent, with a reason (e.g. the main point agrees but details differ)."],"plan":"About 12 minutes: 2 minutes reading, 9 minutes writing, 1 minute judgement.","success":["Identifies agreement between the sources, with reference to both","Identifies difference between the sources, with reference to both","Reaches a supported judgement on how far they agree"],"mistakes":["Describing each source separately without comparing","Only finding agreement (or only difference) — both are needed for Level 2 and above","Bringing in lots of own knowledge or provenance — this question is about comparing content"],"frame":{"full":["Source A supports Source B to a large / some / limited extent.","Both sources suggest that … Source A says “…” and Source B shows “…”.","However, they differ because Source A says “…” whereas Source B …","Overall, Source A supports Source B … because …"],"some":["Judgement","Agreement (both sources)","Difference (both sources)","Overall"]},"markscheme":{"verified":false,"source":"Paraphrased from the 4HI1/02 June 2025 mark scheme (Section A (b)). Check, then tick verified.","max_marks":8,"ao_separate":false,"levels":[{"level":"1","marks":"1–2","descriptor":"Simple comparison; limited reference to the sources."},{"level":"2","marks":"3–5","descriptor":"Agreement and/or difference identified with some support from both sources. Agreement and difference must both be identified to reach 5 marks."},{"level":"3","marks":"6–8","descriptor":"Agreement and difference explained with well-selected support from both sources; a judgement on the extent of support."}],"notes":"Both agreement and difference are needed for 5 marks or more."}},"p2ac":{"label":"Paper 2 A (c) — how far do you agree with Extract C","paper":"Paper 2 Section A","marks":16,"minutes":25,"ao":"AO3 (10) + AO4 (6)","requires_sources":true,"template":"Extract C suggests that … How far do you agree with this interpretation? Use Extract C, Sources A and B and your own knowledge to explain your answer.","asks":"Evaluate the historian's interpretation in Extract C: test it against Sources A and B and your own knowledge, show where it is convincing and where it is not, and reach a judgement.","steps":["Underline the interpretation in the question.","Explain what Extract C argues, quoting it.","Use Source A and/or B and own knowledge to SUPPORT the interpretation.","Use Source A and/or B and own knowledge to CHALLENGE it.","Judgement: how far you agree, and why."],"plan":"About 25 minutes: 3 minutes reading and planning, 19 minutes writing, 3 minutes judgement.","success":["Analyses the interpretation in Extract C","Uses Sources A and B to support and challenge it","Uses accurate own knowledge to test it","Reaches a supported judgement"],"mistakes":["Ignoring one of the sources or the extract","Only agreeing (or only disagreeing)","Using own knowledge as a separate story rather than to test the interpretation"],"frame":{"full":["To a large / some / limited extent, I agree that … Extract C states “…”.","Firstly, this is supported by Source A, which … My own knowledge also shows that …","However, Source B suggests … Furthermore, [own knowledge] …","Therefore, this interpretation is only partially / largely valid because …"],"some":["Judgement + Extract C","Support (sources + knowledge)","Challenge (sources + knowledge)","Conclusion"]},"model":[{"t":"To a large extent, Extract C is convincing when it states that bombing destroyed villages but not the spirit of the Vietcong.","n":"Topic sentence with qualifier, using the extract."},{"t":"Firstly, this is supported by Source A, which highlights how Vietcong fighters used guerrilla tactics and the Ho Chi Minh Trail to keep fighting despite US bombing.","n":"Support from a source + own knowledge."},{"t":"However, Source B emphasises that the South Vietnamese government was corrupt and unpopular, which meant the USA could not rely on strong allies. Therefore, the view is only partially valid: bombing was important, but political weakness in the South also played a decisive role.","n":"Challenge + judgement."}],"model_note":"Adapted from the Arcadia IGCSE model paragraphs. The extract and source wording is illustrative, not from a real paper.","markscheme":{"verified":false,"source":"Paraphrased from the 4HI1/02 June 2025 mark scheme (Section A (c)). Check, then tick verified.","max_marks":16,"ao_separate":false,"levels":[{"level":"1","marks":"1–4","descriptor":"Simple judgement on the interpretation; limited use of the extract, sources and knowledge."},{"level":"2","marks":"5–8","descriptor":"Some analysis of the interpretation, with some use of the sources and knowledge to support or challenge it; judgement with limited support."},{"level":"3","marks":"9–12","descriptor":"Analysis of the interpretation using the extract, sources and knowledge to support and challenge it; judgement with some justification."},{"level":"4","marks":"13–16","descriptor":"Sustained evaluation of the interpretation, integrating the extract, both sources and precise knowledge; well-justified judgement."}]}}},"resources_received":["Specification Issue 4 (PDF)","Arcadia IGCSE model paragraphs (PPTX)"],"resources_needed":["Vietnam source packs or past-paper source booklets (Sources A–B and Extract C) so source questions can be marked","Class textbook or lesson decks for Germany, USA 1945–74 and Medicine (to align explanations and page references)","Recent 4HI1 mark schemes you use in class (to tick the question-type mark schemes as verified)","Teacher-marked Year 11 answers (to check AI feedback)"]},{"id":"y12","year":"Year 12","title":"International A Level History — Germany and China","enquiry":"Unit 1 · Germany, 1918–45 · Unit 2 · China, 1900–76","stage":"International A Level (IAS)","accent":"#7a2e3a","separation_note":"Unit 1 Germany here is the IAL course; Year 11 Germany (International GCSE) is separate. Unit 2 Russia (1C) was taken by last year's cohort and is not included.","areas":[{"id":"de","title":"Option 1C: Germany, 1918–45","paper":"Unit 1 (WHI01/1C)"},{"id":"cn","title":"Option 1B: China, 1900–76","paper":"Unit 2 (WHI02/1B)"}],"exam":{"verified":true,"board":"Pearson Edexcel","qualification":"International Advanced Subsidiary / Advanced Level in History (XHI01 / YHI01)","codes":"Unit 1: WHI01/1C · Unit 2: WHI02/1B","specification_version":"Issue 6, July 2021","papers":[{"code":"WHI01/1C","title":"Unit 1: Depth Study with Interpretations — Option 1C: Germany, 1918–45","duration":"2 hours","marks":50,"weighting":"50% of IAS; 25% of IAL","structure":"Four questions; answer TWO 25-mark essays. Each assesses AO1 (10 marks) and AO3 (15 marks) together with one set of levels (best fit). About 60 minutes per essay.","qtypes":["u1"]},{"code":"WHI02/1B","title":"Unit 2: Breadth Study with Source Evaluation — Option 1B: China, 1900–76","duration":"2 hours","marks":50,"weighting":"50% of IAS; 25% of IAL","structure":"Section A: Question 1, compulsory, in two parts on two sources — (a) value of Source 1, 10 marks; (b) weight of Source 2, 15 marks (AO2). Section B: ONE essay from a choice of three, 25 marks (AO1).","qtypes":["u2a","u2b","u2c"]}],"aos":[{"ao":"AO1","text":"Demonstrate, organise and communicate knowledge and understanding to analyse and evaluate the key features related to the periods studied, making substantiated judgements and exploring concepts of cause, consequence, change, continuity, similarity, difference and significance","weight":"10 of 25 marks per Unit 1 essay"},{"ao":"AO3","text":"Analyse and evaluate, in relation to the historical context, different ways in which aspects of the past have been interpreted","weight":"15 of 25 marks per Unit 1 essay"},{"ao":"AO2","text":"Analyse and evaluate appropriate source material, primary and/or contemporary to the period, within its historical context","weight":"Unit 2 Section A (25 marks)"}],"sources":[{"title":"IAL History specification, Issue 6, July 2021","url":"https://qualifications.pearson.com/content/dam/pdf/International%20Advanced%20Level/history/2015/specification-and-sample-assessments/IAL-History-Specification.pdf"},{"title":"WHI01/1C question paper, 15 May 2025","url":"https://pmt.physicsandmathstutor.com/download/History/A-level/Past-Papers/Edexcel-IAL/Paper-1/Option-1C/QP/June%202025%20(IAL)%20QP%201C.pdf"},{"title":"WHI01/1C mark scheme, June 2025 (AO1 10 + AO3 15, best fit)","url":"https://pmt.physicsandmathstutor.com/download/History/A-level/Past-Papers/Edexcel-IAL/Paper-1/Option-1C/MS/June%202025%20(IAL)%20MS%201C.pdf"},{"title":"Getting Ready to Teach IAL History Module 2 delegate booklet (uploaded) — generic Unit 1 mark scheme"},{"title":"WHI01 exemplars with examiner commentaries, Issue 1, January 2018 (uploaded) — three marking strands"},{"title":"Factor-question structure sheet and Germany model-answers deck (uploaded)"},{"title":"WHI02/1B question paper, 21 May 2025","url":"https://pmt.physicsandmathstutor.com/download/History/A-level/Past-Papers/Edexcel-IAL/Paper-2/Option-1B/QP/June%202025%20(IAL)%20QP%201B.pdf"},{"title":"WHI02/1B question paper, January 2025","url":"https://pmt.physicsandmathstutor.com/download/History/A-level/Past-Papers/Edexcel-IAL/Paper-2/Option-1B/QP/January%202025%20(IAL)%20QP%201B.pdf"},{"title":"WHI02/1B mark scheme, June 2025 — level ranges","url":"https://pmt.physicsandmathstutor.com/download/History/A-level/Past-Papers/Edexcel-IAL/Paper-2/Option-1B/MS/June%202025%20(IAL)%20MS%201B.pdf"},{"title":"How to answer WHI02/1C exam questions (your deck) — steps, starters and timings, applied to China"}],"conflicts":["AO split: the 2018 exemplar pack says Unit 1 assesses AO1 20 marks and AO3 5 marks. The June 2025 mark scheme and Pearson's 2024 training slides give AO1 10 and AO3 15. The site uses the newer figures. Both mark the essay with one best-fit level, so this does not change how answers are marked.","Your model-answers deck shows AO1 20% and AO3 30%: these match the AO weightings for the whole IAS (AO1 45%, AO2 25%, AO3 30%) only loosely; treat the 10/15 split as correct for each Unit 1 essay.","Option title: the specification calls it 'Germany, 1918–45'. 'Development of dictatorship' is the International GCSE title.","Your WHI02 deck suggests PEEL paragraphs for Section B; the site uses PEEJ to match your saved preference and the rest of the department's frames."],"open_questions":[],"source_focus":{"title":"China Section A sources come from these nominated areas (bold italics in the specification)","items":["The significance of the Long March; the failure to crush the Communists and the emergence of Mao Zedong; the civil war and the reasons for its outcome 1946–49","The origins and consequences of the Hundred Flowers Campaign","The Boxer Rising, its origins and impact","The origins and impact on China of the Manchurian crisis 1931–33","The significance of improving communications – railways, telegraphy and river traffic","The Great Leap Forward and its consequences; recovery and chaos 1962–76","The promotion of change by the new Communist regime 1949–66, including the Marriage Law of 1950","The Cultural Revolution 1966–76 and its significance"]}},"qtypes":{"u1":{"label":"Unit 1 essay — assess this view (interpretations)","paper":"Unit 1","marks":25,"minutes":60,"ao":"AO1 (10) + AO3 (15), marked together","template":"Historians differ in their judgements about … ‘[Statement].’ Assess this view using your own knowledge of the issue.","asks":"Treat the statement as one historian's interpretation. Explore it, explore the alternative views, and reach a substantiated judgement on which view is most convincing, using valid criteria.","steps":["Plan (10 minutes): underline the stated view, the concept (cause, consequence, significance) and the dates. List the stated factor plus 2–3 alternatives.","Introduction: 'Some historians argue that … whilst others argue that …' Name your criteria (duration, scope, effectiveness, impact) and give your judgement.","Explore the stated view first, with precise evidence (statistics, key people, events, dates, acts/laws).","Make sure about half the essay explores other views — each paragraph weighs its factor against your criteria.","Link back to the wording of the question in every paragraph.","Conclusion: rank the factors and show why one view is more convincing than the others, using your criteria."],"plan":"60 minutes per essay: 10 minutes planning, about 45 minutes writing, 5 minutes checking. You answer two essays in 2 hours.","success":["Strand 1 — key issues raised by the view are analysed and explored as issues of interpretation","Strand 2 — sufficient, accurate knowledge meets most of the question's demands","Strand 3 — valid criteria are established and applied to reach a supported overall judgement"],"mistakes":["Not focusing on the exact view in the opening paragraph (examiners note this in Level 2 answers)","Considering other views only near the end of the essay","Narrative description of events instead of analysis of their importance","A conclusion that lists factors ('… was important too') without showing why one is more significant","Going outside the dates in the question"],"frames":[{"name":"Department factor-question frame","full":["Introduction: Some historians argue that … Whilst others argue that … In assessing [topic], key criteria such as [duration / scope / effectiveness / impact] will be employed to argue that … [your judgement]","Not the most important factor: Despite my judgement, it could be argued that X was the most important … For example, … This meant that … (2–3 pieces of evidence) However, this argument is weak because … [against a criterion] Thus we must assert that …","Most important factor: In line with my judgement, … For example, … This meant that … (2–3 pieces of evidence) A dissenting view might point to … because … On the balance however, … Thus we must assert that …","Conclusion: In conclusion, I agree/disagree with the view that … The most important reason was … because … The second most important was … because … it is less important than the first because … The least important was … because …"],"some":["Introduction: views + criteria + judgement","Factor not most important: point, evidence + impact ×2–3, weakness against criteria, sustain judgement","Most important factor: point, evidence + impact ×2–3, dissenting view, why it still wins, sustain judgement","Conclusion: ranked factors linked to criteria"]}],"criteria_list":["Duration — which factor was important for the longest time?","Scope — which factor affected the most people or things?","Effectiveness — which factor achieved most?","Impact — which factor led to the most fundamental change?"],"evidence_tip":"When selecting evidence think SPEDA: statistics, key people, events, dates and acts/laws.","frame_note":"The department expects the factor-question frame: introduction with views and criteria (duration, scope, effectiveness, impact), paragraphs on weaker factors that weigh them against the criteria, a paragraph on the strongest factor with a dissenting view, and a conclusion that ranks factors and links back to the criteria. Evidence: statistics, key people, events, dates and acts/laws.","markscheme":{"verified":false,"source":"Pearson generic mark scheme for Unit 1 (copied from the Getting Ready to Teach Module 2 delegate booklet; matches the June 2025 WHI01 mark scheme ranges). Tick verified once you are happy.","max_marks":25,"ao_separate":false,"levels":[{"level":"1","marks":"1–6","descriptor":"Simple or generalised statements are made about the view presented in the question. Some accurate and relevant knowledge is included, but it lacks range and depth and does not directly address the issue in the question. Judgement on the view is assertive, with little supporting evidence."},{"level":"2","marks":"7–12","descriptor":"Some understanding of the issue raised by the question is shown and analysis is attempted by describing some points that are relevant. Mostly accurate knowledge is included, but it lacks range or depth and only has implicit links to issues relevant to the question. A judgement on the view is given, but with limited support and the criteria for judgement are left implicit."},{"level":"3","marks":"13–18","descriptor":"Understanding and some analysis of the issue raised by the question is shown by selecting and explaining some key points of view that are relevant. Knowledge is included to demonstrate some understanding of the issues raised by the question, but material lacks range or depth. Attempts are made to establish criteria for judgement on the view and to relate the overall judgement to them, although with weak substantiation."},{"level":"4","marks":"19–25","descriptor":"Key issues relevant to the question are explored by analysing and explaining the issues of interpretation raised by the claim. Sufficient knowledge is deployed to demonstrate understanding of the issues raised by the question and to meet most of its demands. Valid criteria by which the view can be judged are established and applied in the process of coming to a judgement. Although some of the evaluations may only be partly substantiated, the overall judgement is supported."}],"notes":"Best fit across three strands: (1) analysis of the issues raised by the view, (2) selection and deployment of knowledge, (3) substantiated evaluation and judgement. One mark out of 25 — AO1 and AO3 are not marked separately."}},"u2a":{"label":"Section A (a) — value of a source","paper":"Unit 2 Section A","marks":10,"minutes":22,"ao":"AO2","requires_sources":true,"template":"Why is Source 1 valuable to the historian for an enquiry into …? Explain your answer using the source, the information given about it and your own knowledge of the historical context.","asks":"Explain what the source can tell a historian about the specific enquiry — its value only. Make developed inferences, support them with context and use the provenance to explain why the source is valuable.","steps":["Decode the enquiry — underline exactly what the historian is investigating.","Identify 2–3 developed inferences from the source that are relevant to the enquiry.","Support each inference with precise contextual knowledge.","Use provenance (author, purpose, audience, timing) to explain value.","Do not discuss limitations — they are not rewarded in (a).","Conclude briefly: 'Overall, the source is valuable because …'"],"plan":"About 20–25 minutes (from your WHI02 timing plan).","success":["Developed inferences relevant to the enquiry","Context used to explain or support the inferences","Value explained through the nature, purpose or author's position"],"mistakes":["Summarising instead of making inferences","Discussing limitations (not rewarded in (a))","Adding context as a separate block","Stereotypical provenance comments"],"frame":{"full":["The source suggests that … This is supported by …","It also reveals that … which my own knowledge confirms because …","The author's position makes it valuable because …","Overall, the source is valuable for this enquiry because …"],"some":["Inference 1 + context","Inference 2 + context","Provenance → value","Overall"]},"markscheme":{"verified":false,"source":"Pearson generic mark scheme (training booklet), ranges match the June 2025 WHI02/1B mark scheme. Tick verified once checked.","ao_separate":false,"max_marks":10,"levels":[{"level":"1","marks":"1–3","descriptor":"Demonstrates surface level comprehension of the source material without analysis, selecting some material relevant to the question, but in the form of direct quotations or paraphrases. Some relevant contextual knowledge is included but presented as information rather than applied to the source material. Evaluation of the source material is assertive with little substantiation. The concept of value may be addressed, but by making stereotypical judgements."},{"level":"2","marks":"4–6","descriptor":"Demonstrates some understanding of the source material and attempts analysis by selecting and summarising information and making inferences relevant to the question. Contextual knowledge is added to information from the source material, but mainly to expand or confirm matters of detail. Evaluation of the source material is related to the specified enquiry and with some substantiation for assertions of value. The concept of value is addressed mainly by noting aspects of source provenance and some judgements may be based on questionable assumptions."},{"level":"3","marks":"7–10","descriptor":"Demonstrates understanding of the source material and shows some analysis by selecting key points relevant to the question, explaining their meaning and selecting material to support valid developed inferences. Sufficient knowledge of the historical context is deployed to explain or support inferences, as well as to expand or confirm matters of detail. Evaluation of the source material is related to the specified enquiry and based on valid criteria although justification is not fully substantiated. Explanation of value takes into account relevant considerations such as the nature or purpose of the source material or the position of the author."}],"notes":"Limitations are not rewarded in (a)."}},"u2b":{"label":"Section A (b) — weight of a source","paper":"Unit 2 Section A","marks":15,"minutes":33,"ao":"AO2","requires_sources":true,"template":"How much weight do you give to the evidence of Source 2 for an enquiry into …? Explain your answer using the source, the information given about it and your own knowledge of the historical context.","asks":"Judge how far the source can be trusted and used for the enquiry: support and challenge its claims with context, weigh author, purpose and audience, separate fact from opinion, and reach a judgement on its weight.","steps":["Identify the source's key claims linked to the enquiry.","Use contextual knowledge to support AND challenge those claims.","Analyse author, purpose and audience — how do they shape reliability?","Distinguish fact from opinion.","Note significant omissions and why they matter.","End with a balanced overall judgement on the weight it can bear."],"plan":"About 30–35 minutes (from your WHI02 timing plan).","success":["Interrogates the evidence, separating information from claim or opinion","Uses well-selected context to test and show the limits of the source","Shows awareness of the values and concerns of the society it comes from","Reaches a judgement on weight using justified criteria"],"mistakes":["Treating 'weight' as just what the source says","Only strengths or only limitations","Ignoring provenance or audience","Generic comments on bias without evidence"],"frame":{"full":["The claim that … is supported by … However, the purpose of the author suggests …","The source states … which is a claim rather than fact because …","While the source omits …, this affects its weight because …","Overall, I give the source considerable / some / limited weight for this enquiry because …"],"some":["Claim + support","Claim + challenge","Provenance and omissions","Judgement on weight"]},"markscheme":{"verified":false,"source":"Pearson generic mark scheme (training booklet), ranges match the June 2025 WHI02/1B mark scheme. Tick verified once checked.","ao_separate":false,"max_marks":15,"levels":[{"level":"1","marks":"1–3","descriptor":"Demonstrates surface level comprehension of the source material without analysis, selecting some material relevant to the question, but in the form of direct quotations or paraphrases. Some relevant contextual knowledge is included, but presented as information rather than applied to the source material. Evaluation of the source material is assertive with little supporting evidence. The concept of reliability may be addressed, but by making stereotypical judgements."},{"level":"2","marks":"4–7","descriptor":"Demonstrates some understanding of the source material and attempts analysis, by selecting and summarising information and making inferences relevant to the question. Contextual knowledge is added to information from the source material but mainly to expand, confirm or challenge matters of detail. Evaluation of the source material is related to the specified enquiry but with limited support for judgement. The concept of reliability is addressed mainly by noting aspects of source provenance and some judgements may be based on questionable assumptions."},{"level":"3","marks":"8–11","descriptor":"Demonstrates understanding of the source material and shows some analysis by selecting key points relevant to the question, explaining their meaning and selecting material to support valid developed inferences. Detailed knowledge of the historical context is deployed to explain or support inferences as well as to expand, confirm or challenge matters of detail. Evaluation of the source material is related to the specified enquiry and explanation of weight takes into account relevant considerations such as nature or purpose of the source material or the position of the author. Judgements are based on valid criteria, with some justification."},{"level":"4","marks":"12–15","descriptor":"Analyses the source material, interrogating the evidence to make reasoned inferences and to show a range of ways the material can be used, for example by distinguishing between information and claim or opinion. Deploys well-selected knowledge of the historical context, but mainly to illuminate or discuss the limitations of what can be gained from the content of the source material. Displays some understanding of the need to interpret source material in the context of the values and concerns of the society from which it is drawn. Evaluation of the source material uses valid criteria which are justified and applied, although some of the evaluation may not be fully substantiated. Evaluation takes into account the weight the evidence will bear as part of coming to a judgement."}]}},"u2c":{"label":"Section B — breadth essay","paper":"Unit 2 Section B","marks":25,"minutes":60,"ao":"AO1","template":"How accurate is it to say that …? / How significant was …? / To what extent …?","asks":"Write a sustained, analytical argument across a broad period, weighing the stated factor or change against alternatives and reaching a criteria-based judgement.","steps":["Unpack the command words ('How accurate', 'How significant').","Identify the time frame and stay within it.","Plan 3–4 analytical paragraphs (factors or phases), not a narrative.","Introduction: line of argument + criteria.","PEEJ paragraphs with precise evidence (dates, names, policies), comparing periods or factors.","Conclude with a criteria-based final judgement."],"plan":"About 60 minutes: 5 minutes planning, 45–50 minutes writing, 5 minutes checking (from your WHI02 timing plan).","success":["Key issues explored by analysing relationships between key features of the period","Sufficient accurate knowledge across the date range","Valid criteria established and applied to a supported judgement","Well organised, logical argument"],"mistakes":["Narrative instead of analysis","Ignoring part of the time frame","Forgetting an overall judgement"],"frames":[{"name":"Department factor-question frame","full":["Introduction: Some historians argue that … Whilst others argue that … In assessing [topic], key criteria such as [duration / scope / effectiveness / impact] will be employed to argue that … [your judgement]","Not the most important factor: Despite my judgement, it could be argued that X was the most important … For example, … This meant that … (2–3 pieces of evidence) However, this argument is weak because … [against a criterion] Thus we must assert that …","Most important factor: In line with my judgement, … For example, … This meant that … (2–3 pieces of evidence) A dissenting view might point to … because … On the balance however, … Thus we must assert that …","Conclusion: In conclusion, I agree/disagree with the view that … The most important reason was … because … The second most important was … because … it is less important than the first because … The least important was … because …"],"some":["Introduction: views + criteria + judgement","Factor not most important: point, evidence + impact ×2–3, weakness against criteria, sustain judgement","Most important factor: point, evidence + impact ×2–3, dissenting view, why it still wins, sustain judgement","Conclusion: ranked factors linked to criteria"]}],"criteria_list":["Duration — which factor was important for the longest time?","Scope — which factor affected the most people or things?","Effectiveness — which factor achieved most?","Impact — which factor led to the most fundamental change?"],"evidence_tip":"When selecting evidence think SPEDA: statistics, key people, events, dates and acts/laws.","frame_note":"The department expects the factor-question frame: introduction with views and criteria (duration, scope, effectiveness, impact), paragraphs on weaker factors that weigh them against the criteria, a paragraph on the strongest factor with a dissenting view, and a conclusion that ranks factors and links back to the criteria. Evidence: statistics, key people, events, dates and acts/laws.","markscheme":{"verified":false,"source":"Pearson generic mark scheme (training booklet), ranges match the June 2025 WHI02/1B mark scheme. Tick verified once checked.","ao_separate":false,"max_marks":25,"levels":[{"level":"1","marks":"1–6","descriptor":"Simple or generalised statements are made about the topic. Some accurate and relevant knowledge is included, but it lacks range and depth and does not directly address the question. The overall judgement is missing or asserted. There is little, if any, evidence of attempts to structure the answer, and the answer overall lacks coherence and precision."},{"level":"2","marks":"7–12","descriptor":"There is some analysis of some key features of the period relevant to the question, but descriptive passages are included that are not clearly shown to relate to the focus of the question. Mostly accurate and relevant knowledge is included but lacks range or depth and has only implicit links to the demands and conceptual focus of the question. An overall judgement is given but with limited support and the criteria for judgement are left implicit. The answer shows some attempts at organisation, but most of the answer is lacking in coherence, clarity and precision."},{"level":"3","marks":"13–18","descriptor":"There is some analysis of, and attempt to explain links between, the relevant key features of the period and the question, although some mainly descriptive passages may be included. Mostly accurate and relevant knowledge is included to demonstrate some understanding of the demands and conceptual focus of the question, but material lacks range or depth. Attempts are made to establish criteria for judgement and to relate the overall judgement to them, although with weak substantiation. The answer shows some organisation. The general trend of the argument is clear, but parts of it lack logic, coherence or precision."},{"level":"4","marks":"19–25","descriptor":"Key issues relevant to the question are explored by an analysis of the relationships between key features of the period. Sufficient knowledge is deployed to demonstrate understanding of the demands and conceptual focus of the question and to meet most of its demands. Valid criteria by which the question can be judged are established and applied in the process of coming to a judgement. Although some of the evaluations may be only partly substantiated, the overall judgement is supported. The answer is generally well organised. The argument is logical and is communicated with clarity, although in a few places it may lack coherence or precision."}]}}},"resources_received":["Factor-question structure sheet (DOCX)","Germany model-answers deck (PPTX)","WHI01 exemplars with examiner commentaries (PDF)","Getting Ready to Teach IAL History Module 2 booklet and slides","How to answer WHI02/1C (PPTX)","IAL History specification Issue 6 (PDF)"],"resources_needed":["Class textbook or lesson decks for Unit 2 China (to add page references)","Past-paper source booklets for WHI02/1B (so Section A practice can use real sources)","Class textbook or lesson decks for Unit 1 Germany (to align explanations and add page references)","Teacher-marked Year 12 essays (to check AI feedback)"]},{"id":"y13","year":"Year 13","title":"International A Level History — Civil Rights and Superpowers","enquiry":"Unit 3 · Civil Rights 1865–2009 · Unit 4 · Superpower Relations 1943–90 (to confirm)","stage":"International A Level (IA2)","accent":"#8a6a12","separation_note":"This is IAL Unit 3. Year 11 civil rights (International GCSE, 1945–74) is a separate course with different questions.","areas":[{"id":"cr","title":"Option 1D: Civil Rights and Race Relations in the USA, 1865–2009","paper":"Unit 3 (WHI03/1D)"},{"id":"sp","title":"Option 1C: The World Divided: Superpower Relations, 1943–90 (to confirm)","paper":"Unit 4 (WHI04/1C)"}],"exam":{"verified":true,"board":"Pearson Edexcel","qualification":"International Advanced Level in History (YHI01)","codes":"Unit 3: WHI03/1D · Unit 4: WHI04/1C (to confirm)","specification_version":"Issue 6, July 2021","papers":[{"code":"WHI03/1D","title":"Unit 3: Thematic Study with Source Evaluation — Option 1D","duration":"2 hours","marks":50,"weighting":"50% of IA2; 25% of IAL","structure":"Section A: Question 1, compulsory, 25 marks (AO2) — use two sources together. Section B: answer ONE of Questions 2 and 3, 25 marks (AO1) — essays across the themes and periods.","qtypes":["u3a","u3b"]},{"code":"WHI04/1C","title":"Unit 4: International Study with Historical Interpretations — Option 1C: The World Divided: Superpower Relations, 1943–90","duration":"2 hours
