 Papers (1971) showed the public had been misled."}]},"flashcards":[{"id":"f1","s":"s1","q":"Describe the impact of the war on Vietnamese civilians.","a":"Villages destroyed; millions of refugees; Agent Orange illnesses and birth defects; terror from both sides.","hint":"Refugees."},{"id":"f2","s":"s2","q":"Why did opposition grow in the USA?","a":"TV images, the draft, rising US casualties, My Lai, Kent State, the Pentagon Papers.","hint":"Media + draft."},{"id":"f3","s":"s2","q":"Why did the draft cause anger?","a":"It hit poorer and Black Americans hardest; students could often defer.","hint":"Fairness."},{"id":"f4","s":"s3","q":"Give evidence of support for the war.","a":"Nixon's 'silent majority' speech (1969); the Hard Hat Riot (May 1970).","hint":"Silent majority."},{"id":"f5","s":"s3","q":"What was the War Powers Act?","a":"A 1973 law limiting the President's power to send troops without Congress.","hint":"1973."}],"checklist":[{"id":"k1","level":"describe","text":"I can describe the impact of the war on civilians in Vietnam.","sections":["s1"]},{"id":"k2","level":"explain","text":"I can explain why opposition to the war grew in the USA.","sections":["s2"]},{"id":"k3","level":"judge","text":"I can judge how far American attitudes to the war changed.","sections":["s2","s3"]}],"exam":{"questions":[{"id":"q1","qtype":"p2aa","label":"Teacher-created practice question","sections":["s2"],"q":"Describe TWO features of EITHER the role of the media in the Vietnam War OR the Kent State shootings of 1970.","markscheme":null}]},"stretch":[{"id":"t1","kind":"Relative significance","task":"Did the media, the draft or rising casualties do most to turn Americans against the war?"},{"id":"t2","kind":"Source thinking","task":"Why might a 1969 TV news report and a 'silent majority' speech give different views of American attitudes?"}]},"y12-cn-1":{"id":"y12-cn-1","course":"y12","area":"cn","kt":"Key topic 1","order":11,"title":"Order and disorder, 1900–76","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following the IAL specification (Issue 6), Option 1B key topic 1. No class textbook for China uploaded yet; figures are widely cited textbook figures and should be checked against your resources."},"learn":{"intro":"China moved from imperial collapse through warlord chaos, Guomindang rule and civil war to Mao's communist 'new dynasty'. Unit 2 essays often ask whether one factor or one period was the most significant cause of disorder — or how far Mao's control was ever secure.","sections":[{"id":"s1","title":"1. The downfall of the Qing and resulting chaos, 1900–27","blocks":[{"p":"Reformers and revolutionaries: after the Boxer disaster the Qing tried late reforms — the traditional civil-service examinations were abolished in 1905 and provincial assemblies were promised. But reform raised expectations it could not meet. Revolutionaries led by Sun Yat-sen formed the Tongmenghui (Revolutionary Alliance) in 1905."},{"p":"The 1911–12 revolution began with an army mutiny at Wuchang on 10 October 1911; province after province declared independence. Sun Yat-sen became provisional President, but the military strongman Yuan Shikai negotiated the abdication of the child emperor Puyi (February 1912) and took the presidency himself."},{"p":"The failure of Yuan Shikai: he crushed the Guomindang (GMD) after its election success (its leader Song Jiaoren was assassinated in 1913), accepted most of Japan's 21 Demands (1915), and declared himself emperor in December 1915. Provinces revolted, he abandoned the monarchy, and he died in June 1916."},{"p":"The warlord era (1916–28): regional military leaders controlled their own areas, taxed peasants heavily and fought each other; the central government in Beijing had little real power."},{"p":"The May 4th Movement (1919): students protested in Beijing when the Treaty of Versailles gave Germany's rights in Shandong to Japan. It became a wider movement against Confucian tradition and for science and democracy, and inspired many future communists. The Chinese Communist Party (CCP) was founded in 1921."},{"p":"Sun Yat-sen and the GMD in the 1920s: Sun's Three Principles of the People were nationalism, democracy and people's livelihood. With Soviet help he reorganised the GMD, formed the First United Front with the CCP (1923–24) and set up the Whampoa Military Academy (1924) under Chiang Kai-shek. Sun died in March 1925."}],"terms":["Qing","Tongmenghui","warlord","May 4th Movement","Guomindang","United Front"],"evidence":["10 October 1911: Wuchang uprising.","February 1912: Puyi abdicates.","December 1915: Yuan declares himself emperor; dies June 1916.","4 May 1919: Beijing student protests.","1921: CCP founded.","1924: Whampoa Military Academy."]},{"id":"s2","title":"2. Chiang Kai-shek and the attempt to restore order, 1927–49","blocks":[{"p":"Emergence of Chiang and the break with the Communists: Chiang led the Northern Expedition (from 1926) against the warlords. In April 1927 he turned on his allies, massacring Communists and union members in Shanghai. The GMD set up a national government at Nanjing in 1928, though many warlords only nominally accepted it."},{"p":"The Communists retreated to rural bases such as the Jiangxi Soviet. Chiang launched five encirclement campaigns (1930–34); the fifth, using blockhouses and blockade, forced the CCP to break out."},{"p":"The Long March (October 1934 – October 1935): roughly 80,000–90,000 set out from Jiangxi; fewer than 10,000 reached Shaanxi in the north-west. At the Zunyi Conference (January 1935) Mao Zedong gained a leading role. The March was a military disaster but became a powerful propaganda legend, and the CCP survived."},{"p":"The failure to crush the Communists: in the Xi'an Incident (December 1936) Chiang was kidnapped by his own commander Zhang Xueliang and forced into a Second United Front against Japan. During the war the CCP grew from its Yan'an base through guerrilla warfare, moderate land policies and discipline."},{"p":"The civil war 1946–49 and its outcome: despite US aid, the GMD lost. Reasons include GMD corruption and hyperinflation, the damage of the war against Japan, poor generalship, CCP land reform winning peasant support, CCP discipline and morale, captured Japanese weapons in Manchuria, and decisive campaigns such as Huaihai (1948–49). Mao proclaimed the People's Republic on 1 October 1949; Chiang fled to Taiwan."}],"terms":["Northern Expedition","Shanghai massacre","encirclement campaigns","Long March","Xi'an Incident","civil war"],"evidence":["April 1927: Shanghai massacre.","October 1934 – October 1935: Long March.","January 1935: Zunyi Conference.","December 1936: Xi'an Incident.","1 October 1949: People's Republic proclaimed."]},{"id":"s3","title":"3. Mao and the new dynasty, 1949–76","blocks":[{"p":"Establishing communist control 1949–57: land reform (1950–52) gave land to peasants and destroyed the landlord class, with mass 'speak bitterness' meetings and very many killings. The Three Antis and Five Antis campaigns (1951–52) targeted corruption among officials and businessmen. The campaign against counter-revolutionaries and the Korean War atmosphere tightened control."},{"p":"The Hundred Flowers Campaign (1956–57): Mao invited criticism — 'let a hundred flowers bloom'. Intellectuals criticised the Party sharply. In June 1957 it was replaced by the Anti-Rightist Campaign, in which hundreds of thousands were labelled 'rightists' and many were sent to labour camps. Historians debate whether it was a trap or a genuine invitation that went wrong."},{"p":"The Chairman and his critics: Peng Dehuai criticised the Great Leap Forward at the Lushan Conference (1959) and was purged. After the famine, Liu Shaoqi and Deng Xiaoping led recovery from 1962 and Mao stepped back. Lin Biao built Mao's cult in the army (the Little Red Book, 1964). Mao launched the Cultural Revolution (1966) to regain control: Liu died in custody (1969) and Deng was sent to work in a tractor factory."},{"p":"Supporters and survivors: Lin Biao was named Mao's successor in 1969 but died in a plane crash in September 1971 after an alleged coup plot. Zhou Enlai survived every purge and managed government and diplomacy until his death in January 1976. Jiang Qing (Mao's wife) led the radical Gang of Four. Mao died on 9 September 1976; the Gang of Four were arrested a month later."}],"terms":["land reform","Hundred Flowers","Anti-Rightist Campaign","Lushan Conference","Cultural Revolution","Gang of Four"],"evidence":["1950–52: land reform.","1956–57: Hundred Flowers; June 1957 Anti-Rightist Campaign.","1959: Peng Dehuai purged at Lushan.","1966: Cultural Revolution.","September 1971: Lin Biao dies.","9 September 1976: Mao dies."]}],"timeline":[{"date":"1905","event":"Examinations abolished; Tongmenghui founded"},{"date":"10 Oct 1911","event":"Wuchang uprising"},{"date":"Feb 1912","event":"Puyi abdicates; Yuan Shikai President"},{"date":"1916–28","event":"Warlord era"},{"date":"4 May 1919","event":"May 4th Movement"},{"date":"April 1927","event":"Chiang's Shanghai massacre"},{"date":"1934–35","event":"Long March"},{"date":"Dec 1936","event":"Xi'an Incident"},{"date":"1 Oct 1949","event":"People's Republic of China proclaimed"},{"date":"1956–57","event":"Hundred Flowers and Anti-Rightist Campaign"},{"date":"1966","event":"Cultural Revolution begins"},{"date":"Sept 1976","event":"Death of Mao"}],"people":[{"name":"Sun Yat-sen","role":"Revolutionary leader; founder of the GMD; Three Principles of the People."},{"name":"Yuan Shikai","role":"General who became President in 1912 and tried to become emperor."},{"name":"Chiang Kai-shek","role":"GMD leader 1927–49."},{"name":"Mao Zedong","role":"CCP leader from the 1930s; Chairman of the PRC."},{"name":"Peng Dehuai","role":"Marshal purged in 1959 for criticising the Great Leap Forward."},{"name":"Liu Shaoqi","role":"Head of State; led recovery after 1962; died in custody 1969."},{"name":"Zhou Enlai","role":"Premier 1949–76; survived every purge."},{"name":"Deng Xiaoping","role":"Led recovery with Liu; purged in the Cultural Revolution."},{"name":"Lin Biao","role":"Defence Minister; built Mao's cult; died 1971."},{"name":"Jiang Qing","role":"Mao's wife; leader of the Gang of Four."}],"vocab":[{"term":"Warlord","def":"Regional military leader ruling an area by force."},{"term":"United Front","def":"Alliance between the GMD and CCP (1923–27; 1937–45)."},{"term":"Rectification","def":"Party campaign to correct members' thinking."},{"term":"Rightist","def":"Label given to critics of the Party after 1957."}],"misconceptions":[{"wrong":"The 1911 revolution created a stable republic.","right":"Power passed to Yuan Shikai and then to warlords; China fragmented."},{"wrong":"The Long March was a military success.","right":"Most marchers were lost; its value was survival and propaganda."},{"wrong":"Mao held unchallenged power throughout 1949–76.","right":"He was sidelined after 1962 and used the Cultural Revolution to regain control."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"Where did the 1911 revolution begin?","options":["Beijing","Wuchang","Shanghai","Nanjing"],"answer":1,"why":"Army mutiny, 10 October 1911."},{"id":"m2","s":"s1","q":"What triggered the May 4th Movement?","options":["Yuan's death","Versailles giving Shandong rights to Japan","The Boxer Rising","The Long March"],"answer":1,"why":"1919 student protests."},{"id":"m3","s":"s2","q":"What happened in Shanghai in April 1927?","options":["A Japanese invasion","Chiang massacred Communists and union members","The CCP was founded","Sun Yat-sen died"],"answer":1,"why":"End of the First United Front."},{"id":"m4","s":"s2","q":"What was the result of the Xi'an Incident (1936)?","options":["Chiang was executed","A Second United Front against Japan","The Long March began","Civil war ended"],"answer":1,"why":"Chiang kidnapped by Zhang Xueliang."},{"id":"m5","s":"s3","q":"Who criticised the Great Leap Forward at Lushan in 1959?","options":["Lin Biao","Peng Dehuai","Jiang Qing","Zhou Enlai"],"answer":1,"why":"He was purged."},{"id":"m6","s":"s3","q":"What followed the Hundred Flowers Campaign?","options":["The Long March","The Anti-Rightist Campaign","Land reform","The Korean War"],"answer":1,"why":"From June 1957."}],"short":[{"id":"a1","s":"s1","q":"Who declared himself emperor in December 1915?","accept":["yuan shikai","yuan"],"answer":"Yuan Shikai"},{"id":"a2","s":"s2","q":"At which conference did Mao gain a leading role in 1935?","accept":["zunyi","zunyi conference"],"answer":"Zunyi"},{"id":"a3","s":"s3","q":"Who led the Gang of Four?","accept":["jiang qing"],"answer":"Jiang Qing"}],"chronology":[{"id":"c1","title":"Put these in order","items":["Wuchang uprising","Yuan declares himself emperor","May 4th Movement","Shanghai massacre","Long March","People's Republic proclaimed","Hundred Flowers","Cultural Revolution"]}],"matching":[{"id":"x1","title":"Match the person to their fate","pairs":[["Peng Dehuai","Purged after Lushan, 1959"],["Liu Shaoqi","Died in custody, 1969"],["Lin Biao","Died in a plane crash, 1971"],["Jiang Qing","Arrested with the Gang of Four, 1976"]]}],"evidence":[{"id":"e1","s":"s1","q":"Give precise evidence that the downfall of the Qing led to chaos.","keywords":[["1911","1912","yuan","1915","1916","warlord"]],"model":"After Puyi abdicated in 1912, Yuan Shikai crushed the GMD and tried to become emperor (1915); after his death in 1916 the warlord era fragmented China until 1928."},{"id":"e2","s":"s3","q":"Give precise evidence that Mao's control was challenged after 1959.","keywords":[["lushan","peng","1962","liu","deng"]],"model":"Peng Dehuai attacked the Great Leap at Lushan (1959); after 1962 Liu Shaoqi and Deng Xiaoping ran recovery policies while Mao stepped back."}]},"flashcards":[{"id":"f1","s":"s1","q":"Why did Yuan Shikai fail?","a":"He crushed parliament, accepted most of the 21 Demands and tried to become emperor (1915); provinces revolted and he died in 1916.","hint":"Emperor."},{"id":"f2","s":"s1","q":"Why was the May 4th Movement significant?","a":"Nationalist anger at Versailles; attack on Confucian tradition; inspired the founding generation of the CCP.","hint":"1919."},{"id":"f3","s":"s2","q":"Why was the Long March significant?","a":"The CCP survived; Mao rose (Zunyi 1935); it became a legend of heroism for propaganda.","hint":"Survival + myth."},{"id":"f4","s":"s2","q":"Why did the CCP win the civil war?","a":"GMD corruption and hyperinflation; war damage; CCP land reform and peasant support; discipline; Manchurian weapons; good generalship.","hint":"GMD weakness + CCP strength."},{"id":"f5","s":"s3","q":"How did Mao establish control 1949–57?","a":"Land reform, Three/Five Antis, campaigns against counter-revolutionaries, Anti-Rightist Campaign.","hint":"Campaigns."},{"id":"f6","s":"s3","q":"Why did Mao launch the Cultural Revolution?","a":"To regain power from Liu and Deng, purge 'capitalist roaders' and renew revolutionary spirit.","hint":"1966."}],"checklist":[{"id":"k1","level":"explain","text":"I can explain why the Qing fell and why chaos followed, 1900–27.","sections":["s1"]},{"id":"k2","level":"explain","text":"I can explain the significance of the Long March and why Chiang failed to crush the Communists.","sections":["s2"]},{"id":"k3","level":"judge","text":"I can judge the reasons for the outcome of the civil war 1946–49.","sections":["s2"]},{"id":"k4","level":"explain","text":"I can explain the origins and consequences of the Hundred Flowers Campaign.","sections":["s3"]},{"id":"k5","level":"judge","text":"I can judge the significance of Mao's critics and supporters, 1962–76.","sections":["s3"]}],"exam":{"questions":[{"id":"q1","qtype":"u2c","label":"Past paper: WHI02/1B, May 2025, Q2","sections":["s1"],"q":"How accurate is it to say that the downfall of the Qing dynasty in 1912 was the most significant factor causing chaos in China in the years 1900–27?","markscheme":null},{"id":"q2","qtype":"u2a","label":"Past paper: WHI02/1B, January 2025, Q1(a) — question stem only; Source 1 is in the paper","sections":["s3"],"q":"Why is Source 1 valuable to the historian for an enquiry into responses to the Hundred Flowers Campaign? Explain your answer using the source, the information given about it and your own knowledge of the historical context.","markscheme":null},{"id":"q3","qtype":"u2c","label":"Teacher-created practice question","sections":["s2"],"q":"How significant was the Long March in explaining the Communist victory in the civil war of 1946–49?","markscheme":null}]},"stretch":[{"id":"t1","kind":"Relative significance","task":"Qing collapse, Yuan Shikai or the warlords: which did most to cause disorder 1900–27? Use the department factor frame (duration, scope, effectiveness, impact)."},{"id":"t2","kind":"Historiography","task":"Was the Hundred Flowers Campaign a deliberate trap? Outline the two interpretations and the evidence each relies on."},{"id":"t3","kind":"Synoptic","task":"Compare the ways Chiang (1927–49) and Mao (1949–76) tried to impose order. Which was more successful, and by what criteria?"}]},"y12-cn-2":{"id":"y12-cn-2","course":"y12","area":"cn","kt":"Key topic 2","order":12,"title":"The impact of the world on China, 1900–76","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following the IAL specification (Issue 6), Option 1B key topic 2. Figures to be checked against class resources."},"learn":{"intro":"From the humiliation of the Boxer Protocol to Nixon's handshake with Mao, outside powers shaped China's politics and its sense of itself. Essays ask about change over time: was China always a victim, or did it learn to use the great powers?","sections":[{"id":"s1","title":"1. Weakness and humiliation, 1900–19","blocks":[{"p":"The Boxer Rising (1899–1901) — origins: the Boxers (Society of Righteous and Harmonious Fists) were a peasant movement in Shandong, angered by foreign concessions, Christian missionaries and converts, and drought and floods that brought hunger. Their slogan became 'Support the Qing, destroy the foreigners'."},{"p":"Impact: in June 1900 the Boxers besieged the foreign legations in Beijing and the Empress Dowager Cixi declared war on the foreign powers. An Eight-Nation Alliance relieved the legations in August 1900 and looted Beijing. The Boxer Protocol (September 1901) imposed a huge indemnity of 450 million taels and allowed foreign troops in Beijing. The Qing were humiliated, which pushed them into late reforms and strengthened revolutionaries."},{"p":"British power in Shanghai and the Yangtze: Britain dominated the Shanghai International Settlement, controlled much trade and shipping in the Yangtze Valley, and ran the Chinese Maritime Customs. Foreigners had extraterritoriality — they were tried in their own courts, not Chinese ones."},{"p":"Japan and the 21 Demands (January 1915): with the European powers busy in the First World War, Japan demanded control of Shandong, rights in Manchuria, and (in a final group of demands) Japanese advisers in the Chinese government. Yuan Shikai accepted most of them in May 1915, except the last group. At Versailles (1919), Germany's Shandong rights were given to Japan, triggering the May 4th Movement."}],"terms":["Boxers","legations","indemnity","extraterritoriality","21 Demands"],"evidence":["June–August 1900: siege of the legations.","September 1901: Boxer Protocol — 450 million taels.","January 1915: 21 Demands; most accepted May 1915.","1919: Versailles gives Shandong rights to Japan."]},{"id":"s2","title":"2. Japan's impact, 1931–45","blocks":[{"p":"Origins and impact of the Manchurian crisis (1931–33): Japan had railway and economic interests in Manchuria and wanted its resources. On 18 September 1931 Japanese officers staged an explosion on the South Manchuria Railway near Mukden and used it as an excuse to occupy Manchuria. In 1932 Japan created the puppet state of Manchukuo with Puyi as head. The League of Nations' Lytton Report condemned Japan, which left the League in 1933. The Tanggu Truce (May 1933) confirmed Japanese control."},{"p":"Chiang's policy of 'first internal pacification, then external resistance' — fighting the Communists before Japan — was unpopular and led to the Xi'an Incident (1936)."},{"p":"Full-scale war from 1937: a clash at the Marco Polo Bridge near Beijing on 7 July 1937 escalated into all-out war. Japan took Shanghai after heavy fighting and captured Nanjing in December 1937, where its troops committed a massacre of civilians and prisoners. The GMD moved its capital to Chongqing."},{"p":"Initial Japanese success came from a modern army, air power and control of the coast. By 1938–39 there was stalemate: Japan held the cities and railways but could not control the vast interior, and the CCP built guerrilla bases behind Japanese lines."},{"p":"The role of the USA: after Pearl Harbor (December 1941) the USA supplied the GMD by air over 'the Hump' and the Burma Road, sent General Stilwell as Chiang's chief of staff, and recognised China as one of the 'Big Four'. Friction between Stilwell and Chiang, and US frustration at GMD corruption, grew."}],"terms":["Mukden Incident","Manchukuo","Lytton Report","Marco Polo Bridge","Nanjing massacre","stalemate"],"evidence":["18 September 1931: Mukden Incident.","1932: Manchukuo created.","1933: Japan leaves the League.","7 July 1937: Marco Polo Bridge.","December 1937: fall of Nanjing."]},{"id":"s3","title":"3. The impact on China of the Cold War","blocks":[{"p":"The Soviet alliance: Mao visited Moscow and signed the Sino-Soviet Treaty of Friendship (February 1950). The USSR provided loans, thousands of advisers and help with around 150 major industrial projects, which were central to the First Five-Year Plan (1953–57)."},{"p":"The Korean War (1950–53): when UN forces approached the Yalu River, China sent the Chinese People's Volunteers (October 1950). Losses were very heavy — Mao's own son was killed — but China fought the USA to a standstill, gaining prestige. At home the war justified mass campaigns against 'counter-revolutionaries'. The US Seventh Fleet now protected Taiwan, ending hopes of taking it."},{"p":"Origins of the Sino-Soviet split: Khrushchev's 1956 'secret speech' attacking Stalin and his policy of peaceful coexistence; Soviet criticism of the Great Leap Forward; disputes over nuclear help; and rivalry for leadership of world communism. In 1960 the USSR withdrew its advisers, leaving projects unfinished. Border clashes on the Ussuri River (Zhenbao Island, March 1969) raised fears of war."},{"p":"Impact and the beginnings of détente: fearing the USSR, China turned to the West. 'Ping-pong diplomacy' (April 1971) was followed by Kissinger's secret visit (July 1971), China's admission to the UN in place of Taiwan (October 1971) and President Nixon's visit in February 1972 (the Shanghai Communiqué). Other Western statesmen, such as British Prime Minister Edward Heath (1974), followed."}],"terms":["Sino-Soviet Treaty","Chinese People's Volunteers","Sino-Soviet split","détente","ping-pong diplomacy"],"evidence":["February 1950: Sino-Soviet Treaty.","October 1950: China enters the Korean War.","1960: Soviet advisers withdrawn.","March 1969: Zhenbao Island clash.","February 1972: Nixon visits China."]}],"timeline":[{"date":"1900","event":"Boxer siege of the Beijing legations"},{"date":"1901","event":"Boxer Protocol"},{"date":"1915","event":"Japan's 21 Demands"},{"date":"1919","event":"Versailles: Shandong to Japan"},{"date":"1931","event":"Mukden Incident; Japan occupies Manchuria"},{"date":"1937","event":"Marco Polo Bridge; full-scale war; Nanjing massacre"},{"date":"1950","event":"Sino-Soviet Treaty; China enters the Korean War"},{"date":"1960","event":"Soviet advisers withdrawn"},{"date":"1969","event":"Sino-Soviet border clashes"},{"date":"1972","event":"Nixon visits China"}],"people":[{"name":"Cixi","role":"Empress Dowager; backed the Boxers in 1900."},{"name":"Puyi","role":"Last Qing emperor; head of Manchukuo from 1932."},{"name":"Joseph Stilwell","role":"US general; Chiang's chief of staff in the Second World War."},{"name":"Nikita Khrushchev","role":"Soviet leader whose policies helped cause the split."},{"name":"Richard Nixon","role":"US President who visited China in 1972."}],"vocab":[{"term":"Concession","def":"Area of a Chinese city controlled by a foreign power."},{"term":"Extraterritoriality","def":"Right of foreigners to be tried under their own laws."},{"term":"Puppet state","def":"Nominally independent state controlled by another power."},{"term":"Détente","def":"Easing of tension between rivals."}],"misconceptions":[{"wrong":"The Sino-Soviet split happened suddenly in 1960.","right":"Tensions built from 1956; 1960 was when advisers were withdrawn."},{"wrong":"China was only ever a victim of foreign powers.","right":"By the 1970s China used superpower rivalry to its own advantage."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"What did the Boxer Protocol impose?","options":["Independence for Shanghai","A 450 million tael indemnity","Japanese control of Manchuria","The end of the Qing"],"answer":1,"why":"September 1901."},{"id":"m2","s":"s1","q":"Why did Japan issue the 21 Demands in 1915?","options":["Europe was distracted by the First World War","China had attacked Japan","The Boxers had attacked Tokyo","The USA asked it to"],"answer":0,"why":"Opportunity."},{"id":"m3","s":"s2","q":"What was Manchukuo?","options":["A Chinese province","Japan's puppet state in Manchuria","A Soviet republic","A GMD army"],"answer":1,"why":"1932, under Puyi."},{"id":"m4","s":"s2","q":"What began at the Marco Polo Bridge in July 1937?","options":["The Long March","Full-scale war with Japan","The civil war","The Korean War"],"answer":1,"why":"Escalated from a clash."},{"id":"m5","s":"s3","q":"When did the USSR withdraw its advisers?","options":["1953","1956","1960","1972"],"answer":2,"why":"Projects left unfinished."},{"id":"m6","s":"s3","q":"What did 'ping-pong diplomacy' lead to?","options":["War with the USA","Nixon's visit in 1972","The Korean War","The Soviet alliance"],"answer":1,"why":"Détente."}],"short":[{"id":"a1","s":"s2","q":"Which report condemned Japan over Manchuria?","accept":["lytton report","lytton","the lytton report"],"answer":"The Lytton Report"},{"id":"a2","s":"s2","q":"To which city did the GMD move its capital?","accept":["chongqing","chungking"],"answer":"Chongqing"},{"id":"a3","s":"s3","q":"In which year did Nixon visit China?","accept":["1972"],"answer":"1972"}],"chronology":[{"id":"c1","title":"Put these in order","items":["Boxer Protocol","21 Demands","Mukden Incident","Marco Polo Bridge","Sino-Soviet Treaty","Soviet advisers withdrawn","Zhenbao Island clash","Nixon's visit"]}],"matching":[{"id":"x1","title":"Match the power to its impact","pairs":[["Britain","Dominance in Shanghai and the Yangtze"],["Japan","Manchukuo and full-scale invasion"],["USSR","Aid for the First Five-Year Plan"],["USA","Détente and Nixon's 1972 visit"]]}],"evidence":[{"id":"e1","s":"s3","q":"Give precise evidence that China's relations with the superpowers changed 1949–76.","keywords":[["1950","treaty","1960","advisers","1969","1971","1972","nixon"]],"model":"China allied with the USSR (treaty, February 1950) and fought the USA in Korea, but after Soviet advisers left in 1960 and border clashes in 1969 it welcomed Nixon in 1972."}]},"flashcards":[{"id":"f1","s":"s1","q":"What were the origins of the Boxer Rising?","a":"Anger at foreign concessions, missionaries and converts; drought and floods; hunger in Shandong.","hint":"Foreigners + famine."},{"id":"f2","s":"s1","q":"What was the impact of the Boxer Rising?","a":"Foreign occupation of Beijing; Boxer Protocol indemnity; Qing humiliated and pushed into reform; revolutionaries strengthened.","hint":"Humiliation."},{"id":"f3","s":"s2","q":"Why did Japan succeed at first after 1937 and then reach stalemate?","a":"Modern army, air power, control of the coast; but could not control the vast interior; CCP guerrilla bases.","hint":"Cities vs countryside."},{"id":"f4","s":"s3","q":"How did the Korean War affect China?","a":"Heavy losses but prestige; justified repression at home; US protection of Taiwan.","hint":"1950–53."},{"id":"f5","s":"s3","q":"What caused the Sino-Soviet split?","a":"De-Stalinisation, peaceful coexistence, Soviet criticism of the Great Leap, nuclear disputes, rivalry for leadership.","hint":"1956 onward."}],"checklist":[{"id":"k1","level":"explain","text":"I can explain the origins and impact of the Boxer Rising.","sections":["s1"]},{"id":"k2","level":"describe","text":"I can describe British influence and the significance of the 21 Demands and Versailles.","sections":["s1"]},{"id":"k3","level":"explain","text":"I can explain the origins and impact of the Manchurian crisis and the war with Japan.","sections":["s2"]},{"id":"k4","level":"judge","text":"I can judge how far the impact of the Cold War on China changed 1949–76.","sections":["s3"]}],"exam":{"questions":[{"id":"q1","qtype":"u2c","label":"Past paper: WHI02/1B, May 2025, Q3","sections":["s3"],"q":"How accurate is it to say that the impact of the Cold War on China changed during the years 1949–76?","markscheme":null},{"id":"q2","qtype":"u2c","label":"Past paper: WHI02/1B, January 2025, Q3","sections":["s2"],"q":"How accurate is it to say that, in the years 1931–45, the main consequence of Japanese expansion in China was the strengthening of the Chinese Communist Party?","markscheme":null},{"id":"q3","qtype":"u2a","label":"Past paper: WHI02/1B, May 2025, Q1(a) — question stem only; Source 1 is in the paper","sections":["s2"],"q":"Why is Source 1 valuable to the historian for an enquiry into responsibility for the outbreak of the crisis in Manchuria in 1931? Explain your answer using the source, the information given about it and your own knowledge of the historical context.","markscheme":null},{"id":"q4","qtype":"u2b","label":"Past paper: WHI02/1B, January 2025, Q1(b) — question stem only; Source 2 is in the paper","sections":["s1"],"q":"How much weight do you give to the evidence of Source 2 for an enquiry into the reasons for the Boxer Rising in 1900? Explain your answer using the source, the information given about it and your own knowledge of the historical context.","markscheme":null}]},"stretch":[{"id":"t1","kind":"Change and continuity","task":"Draw a line graph of China's 'humiliation' from 1900 to 1976. Mark and justify each turning point."},{"id":"t2","kind":"Relative significance","task":"Which foreign power had the greatest impact on China 1900–76? Apply the department factor frame to Japan and the USSR."}]},"y12-cn-3":{"id":"y12-cn-3","course":"y12","area":"cn","kt":"Key topic 3","order":13,"title":"Economic changes, 1900–76","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following the IAL specification (Issue 6), Option 1B key topic 3. Production and death-toll figures vary between historians; check against class resources."},"learn":{"intro":"China's economy grew in patches before 1949 — railways, Shanghai's mills, Japanese Manchuria — but war and civil strife held it back. Mao then tried to force the pace, with Soviet-style planning, the disaster of the Great Leap Forward, recovery and renewed chaos.","sections":[{"id":"s1","title":"1. Growth and development, 1900–27","blocks":[{"p":"Improving communications: railways expanded rapidly, often built with foreign loans and control — for example the Beijing–Hankou line (completed 1906). Railways moved goods and troops faster and linked inland areas to ports, but foreign ownership caused resentment: protests over railway nationalisation helped spark the 1911 revolution."},{"p":"The telegraph linked cities and allowed faster government and business communication — and the rapid spread of news, for example during the 1911 revolution."},{"p":"River traffic: steamships on the Yangtze and other rivers, many foreign-owned, carried most bulk trade. Rivers remained cheaper for heavy goods than rail, so historians debate which mattered more."},{"p":"Native industry: during the First World War European imports fell, giving Chinese-owned cotton mills and flour mills a 'golden age' of growth. Shanghai became China's main industrial and financial centre, with foreign and Chinese factories, banks and a growing working class — which made it a centre of labour protest in the 1920s."}],"terms":["railway","telegraph","river traffic","textile industry","Shanghai"],"evidence":["1906: Beijing–Hankou railway completed.","1911: railway protests help spark revolution.","1914–18: 'golden age' for Chinese-owned industry."]},{"id":"s2","title":"2. Economic performance, 1927–49","blocks":[{"p":"Industry in Japanese-controlled Manchuria: Japan invested heavily in Manchukuo — coal, steel (for example at Anshan), railways and power. By the late 1930s Manchuria was the most industrialised part of China, but it served Japan's war economy, not Chinese needs."},{"p":"T. V. Soong, finance minister for the Nanjing government, set up the Central Bank of China (1928), won back control over tariffs from the foreign powers, and tried to balance the budget. The China Development Finance Corporation (1934) was meant to channel investment into industry and infrastructure. Successes were limited: military spending on the anti-communist campaigns swallowed most revenue."},{"p":"The negative impact of war and civil strife: the Japanese invasion from 1937 destroyed much coastal industry and cut the GMD off from its tax base. Printing money to pay for war caused hyperinflation in the 1940s; the gold yuan currency introduced in 1948 collapsed within months. Peasants suffered heavy taxes, conscription and famine (for example in Henan in 1942–43)."}],"terms":["Manchukuo","T. V. Soong","tariff autonomy","hyperinflation"],"evidence":["1928: Central Bank of China.","1934: China Development Finance Corporation.","1937 onward: war destroys coastal industry.","1948: gold yuan collapses."]},{"id":"s3","title":"3. Forcing the pace, 1949–76","blocks":[{"p":"Collectivisation: after land reform gave peasants land, the Party moved them step by step into mutual aid teams, then cooperatives, then larger collectives by 1956–57. The First Five-Year Plan (1953–57), with Soviet help, focused on heavy industry; steel, coal and electricity output rose sharply, though agriculture lagged."},{"p":"The Great Leap Forward (1958–62): Mao aimed to overtake Britain's industrial output within 15 years. Peasants were organised into huge people's communes with communal kitchens; millions worked on backyard furnaces producing mostly useless iron; Lysenko-inspired farming methods such as close planting failed. Officials, fearful after the Anti-Rightist Campaign, reported fictional harvests, so grain was taken from starving villages."},{"p":"Consequences: the famine of 1959–61 killed tens of millions — estimates range from about 15 million to over 40 million. Industry and agriculture were badly damaged and the Sino-Soviet split removed aid. Peng Dehuai's criticism at Lushan (1959) was punished, which prolonged the disaster."},{"p":"Recovery and chaos 1962–76: Liu Shaoqi and Deng Xiaoping allowed private plots, rural markets and material incentives — Deng's phrase that it does not matter whether a cat is black or white, so long as it catches mice. Output recovered. The Cultural Revolution (from 1966) disrupted industry and transport, especially in 1966–68, and the 'Third Front' moved industry inland for defence at great cost. The economy grew in the 1970s but remained poor and inefficient."}],"terms":["collectivisation","Five-Year Plan","Great Leap Forward","people's commune","backyard furnace","Third Front"],"evidence":["1953–57: First Five-Year Plan.","1958: Great Leap Forward; communes.","1959–61: famine — estimates from about 15 to over 40 million deaths.","1962: recovery under Liu and Deng."]}],"timeline":[{"date":"1906","event":"Beijing–Hankou railway completed"},{"date":"1914–18","event":"Growth of Chinese-owned industry"},{"date":"1928","event":"Central Bank of China (T. V. Soong)"},{"date":"1932","event":"Manchukuo: Japanese industrial development"},{"date":"1937","event":"War with Japan damages coastal industry"},{"date":"1948","event":"Gold yuan collapses"},{"date":"1953–57","event":"First Five-Year Plan"},{"date":"1958","event":"Great Leap Forward begins"},{"date":"1959–61","event":"Great Famine"},{"date":"1962","event":"Recovery under Liu and Deng"},{"date":"1966","event":"Cultural Revolution disrupts the economy"}],"people":[{"name":"T. V. Soong","role":"GMD finance minister; Central Bank and China Development Finance Corporation."},{"name":"Mao Zedong","role":"Launched the Great Leap Forward."},{"name":"Liu Shaoqi","role":"Led recovery from 1962."},{"name":"Deng Xiaoping","role":"Pragmatic recovery policies; 'black cat, white cat'."},{"name":"Peng Dehuai","role":"Criticised the Great Leap at Lushan, 1959."}],"vocab":[{"term":"Collectivisation","def":"Joining private farms into collective farms."},{"term":"People's commune","def":"Huge rural unit combining farming, industry and local government (1958)."},{"term":"Hyperinflation","def":"Extremely rapid rise in prices."},{"term":"Material incentives","def":"Rewards such as wages or private plots to boost output."}],"misconceptions":[{"wrong":"China had no industrial growth before 1949.","right":"Shanghai and Manchuria grew significantly, though unevenly."},{"wrong":"The famine was caused only by bad weather.","right":"Policy, false reporting and grain requisitioning were the main causes."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"Why did Chinese-owned industry grow during 1914–18?","options":["Government subsidies","European imports fell during the First World War","Japan invested","The Boxers protected it"],"answer":1,"why":"Less competition."},{"id":"m2","s":"s2","q":"Where was China's most industrialised region by the late 1930s?","options":["Tibet","Japanese-controlled Manchuria","Sichuan","Jiangxi"],"answer":1,"why":"Japanese investment."},{"id":"m3","s":"s2","q":"What caused hyperinflation in the 1940s?","options":["Printing money to pay for war","Too much gold","Soviet loans","Land reform"],"answer":0,"why":"War spending."},{"id":"m4","s":"s3","q":"What did the First Five-Year Plan focus on?","options":["Consumer goods","Heavy industry","Tourism","Private farming"],"answer":1,"why":"Soviet model, 1953–57."},{"id":"m5","s":"s3","q":"Why did officials report false harvests during the Great Leap?","options":["To get bonuses only","Fear of being labelled rightists","Orders from Moscow","Mistakes in counting"],"answer":1,"why":"After the Anti-Rightist Campaign."}],"short":[{"id":"a1","s":"s2","q":"Which finance minister set up the Central Bank of China?","accept":["t v soong","tv soong","t. v. soong","soong"],"answer":"T. V. Soong"},{"id":"a2","s":"s3","q":"In which year did the Great Leap Forward begin?","accept":["1958"],"answer":"1958"},{"id":"a3","s":"s3","q":"Which two leaders led recovery after 1962?","accept":["liu and deng","liu shaoqi and deng xiaoping","deng and liu"],"answer":"Liu Shaoqi and Deng Xiaoping"}],"chronology":[{"id":"c1","title":"Put these in order","items":["Beijing–Hankou railway","Central Bank of China","Manchukuo created","Gold yuan collapses","First Five-Year Plan","Great Leap Forward","Recovery under Liu and Deng"]}],"matching":[{"id":"x1","title":"Match the period to the economic feature","pairs":[["1900–27","Railways, telegraphy and river traffic"],["1927–49","Hyperinflation and war damage"],["1953–57","Soviet-style Five-Year Plan"],["1958–62","Communes and backyard furnaces"]]}],"evidence":[{"id":"e1","s":"s3","q":"Give precise evidence about the consequences of the Great Leap Forward.","keywords":[["famine","1959","1961","million","lushan","backyard"]],"model":"The famine of 1959–61 killed tens of millions (estimates range from about 15 to over 40 million); backyard furnaces produced useless iron; Peng Dehuai was purged at Lushan in 1959."}]},"flashcards":[{"id":"f1","s":"s1","q":"How significant were railways 1900–27?","a":"Linked inland to ports and moved troops, but foreign-owned and caused resentment; rivers still carried much bulk trade.","hint":"Compare with rivers."},{"id":"f2","s":"s2","q":"What did T. V. Soong achieve?","a":"Central Bank (1928), tariff autonomy, China Development Finance Corporation (1934) — limited by military spending.","hint":"Finance."},{"id":"f3","s":"s2","q":"How did war damage the economy 1937–49?","a":"Coastal industry lost; tax base cut; hyperinflation; famine; gold yuan collapse 1948.","hint":"Inflation."},{"id":"f4","s":"s3","q":"Why did the Great Leap Forward fail?","a":"Unrealistic targets, communes, backyard furnaces, false reporting, grain requisitioning, purge of critics.","hint":"Fear + targets."},{"id":"f5","s":"s3","q":"How did the economy recover after 1962?","a":"Private plots, rural markets, material incentives under Liu and Deng.","hint":"Black cat, white cat."}],"checklist":[{"id":"k1","level":"judge","text":"I can judge the significance of railways, telegraphy and river traffic 1900–27.","sections":["s1"]},{"id":"k2","level":"explain","text":"I can explain economic performance 1927–49, including Manchuria and T. V. Soong.","sections":["s2"]},{"id":"k3","level":"describe","text":"I can describe collectivisation and the First Five-Year Plan.","sections":["s3"]},{"id":"k4","level":"judge","text":"I can judge the consequences of the Great Leap Forward and the recovery of 1962–76.","sections":["s3"]}],"exam":{"questions":[{"id":"q1","qtype":"u2c","label":"Past paper: WHI02/1B, January 2025, Q2","sections":["s1"],"q":"How accurate is it to say that river traffic was more significant than railways in the development of China's economy in the years 1900–27?","markscheme":null},{"id":"q2","qtype":"u2b","label":"Past paper: WHI02/1B, May 2025, Q1(b) — question stem only; Source 2 is in the paper","sections":["s3"],"q":"How much weight do you give to the evidence of Source 2 for an enquiry into the consequences of the Great Leap Forward? Explain your answer using the source, the information given about it and your own knowledge of the historical context.","markscheme":null},{"id":"q3","qtype":"u2c","label":"Teacher-created practice question","sections":["s2"],"q":"How far was war the main reason for China's weak economic performance in the years 1927–49?","markscheme":null}]},"stretch":[{"id":"t1","kind":"Change and continuity","task":"Was 1949 a turning point in China's economic development? Compare 1927–49 and 1949–76."},{"id":"t2","kind":"Historiography","task":"Why do estimates of famine deaths range so widely? What sources would historians use?"}]},"y12-cn-4":{"id":"y12-cn-4","course":"y12","area":"cn","kt":"Key topic 4","order":14,"title":"Social and cultural changes, 1900–76","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following the IAL specification (Issue 6), Option 1B key topic 4. Figures to be checked against class resources."},"learn":{"intro":"Women's lives, health, education, belief and culture all changed between 1900 and 1976 — first through Western influence and the May 4th generation, then through the Communist regime's campaigns. Essays often ask how far change reached the countryside, or how significant one reform was.","sections":[{"id":"s1","title":"1. The changing status of women","blocks":[{"p":"Early 20th century: Western ideas, missionary schools and girls' education spread new views. Anti-foot-binding societies grew, and the new Republic discouraged the practice after 1912, though it continued in rural areas for years. The May 4th generation attacked arranged marriages and Confucian rules that made women subordinate to fathers and husbands."},{"p":"The Communist regime 1949–66: the Marriage Law of 1 May 1950 banned arranged marriages, child marriage, concubinage and the sale of brides, and gave women the right to divorce and to own property. Many women used it to escape bad marriages — divorce cases rose sharply in the early 1950s — but there was violent resistance in some villages, and many women were killed or took their own lives in disputes."},{"p":"Patterns of change 1950–76: women joined the workforce in large numbers, especially during the Great Leap Forward, and Mao's slogan said 'women hold up half the sky'. But women usually earned fewer work points, still did most housework, and were rare in senior Party posts. Change was much faster in cities than in the countryside, where traditional family structures persisted."}],"terms":["foot binding","arranged marriage","Marriage Law 1950","concubinage","work points"],"evidence":["1 May 1950: Marriage Law.","Divorce cases rose sharply in the early 1950s.","Urban–rural differences persisted to 1976."]},{"id":"s2","title":"2. Education and health provision","blocks":[{"p":"Early 20th century: missionaries founded schools, universities and hospitals that spread Western medicine and educational ideas; the Rockefeller-funded Peking Union Medical College opened in 1917. The abolition of the imperial examinations (1905) opened the way to modern schools. But provision was concentrated in cities and coastal areas."},{"p":"Growth of literacy after 1949: mass literacy campaigns, winter schools for peasants, simplified characters (from 1956) and pinyin romanisation (1958) helped literacy rise substantially. Education was used for political indoctrination, and the Cultural Revolution closed universities from 1966, with entrance exams not restored until after Mao's death."},{"p":"Health: Patriotic Health Campaigns attacked disease through mass sanitation and the 'Four Pests' campaign (1958) — killing sparrows contributed to insect damage to crops. From 1965 Mao demanded more rural healthcare, and 'barefoot doctors' — peasants with a few months' training — gave basic treatment, vaccinations and hygiene advice. Life expectancy rose sharply between 1949 and 1976. Failures: limited training, shortages of medicine, and the famine of 1959–61."}],"terms":["missionaries","literacy campaign","simplified characters","barefoot doctors","Patriotic Health Campaign"],"evidence":["1917: Peking Union Medical College.","1956: simplified characters; 1958: pinyin.","1958: Four Pests campaign.","From 1965: barefoot doctors."]},{"id":"s3","title":"3. Cultural and religious change","blocks":[{"p":"Christianity spread through missionary schools, hospitals and converts in the early 20th century; leading figures such as Sun Yat-sen and Chiang Kai-shek were Christians. Marxism spread after the Russian Revolution and May 4th; the CCP was founded in 1921."},{"p":"The May 4th generation and the New Culture Movement (e.g. Chen Duxiu's magazine New Youth) rejected Confucian thought as the cause of China's weakness, calling for 'Mr Science and Mr Democracy' and writing in vernacular Chinese."},{"p":"American culture influenced cities like Shanghai in the 1930s and 40s — Hollywood films, jazz, fashion and consumer goods — alongside a lively Chinese film and publishing industry."},{"p":"Attacks on religion under the Communists: foreign missionaries were expelled in the early 1950s, churches were placed under state-controlled bodies such as the Three-Self Patriotic Movement, Buddhist and Daoist institutions were restricted, and Tibet was occupied in 1950, with the Dalai Lama fleeing in 1959."},{"p":"The Cultural Revolution 1966–76 and its significance: Red Guards attacked the 'Four Olds' (old customs, culture, habits and ideas), destroying temples, books and art and persecuting teachers and intellectuals. Jiang Qing allowed only a few 'model operas'. From 1968 millions of urban youth were sent 'up to the mountains and down to the countryside'. Its significance: a 'lost generation' of education, deep distrust of the Party, and the destruction of much cultural heritage."}],"terms":["Christianity","Marxism","New Culture Movement","Confucianism","Four Olds","Red Guards"],"evidence":["1915 onward: New Youth magazine.","1921: CCP founded.","Early 1950s: missionaries expelled.","1966: Red Guards attack the Four Olds.","From 1968: 'up to the mountains and down to the countryside'."]}],"timeline":[{"date":"1905","event":"Imperial examinations abolished"},{"date":"1912","event":"Republic discourages foot binding"},{"date":"1915","event":"New Youth magazine; New Culture Movement"},{"date":"1917","event":"Peking Union Medical College opens"},{"date":"1921","event":"CCP founded"},{"date":"1 May 1950","event":"Marriage Law"},{"date":"Early 1950s","event":"Foreign missionaries expelled"},{"date":"1956–58","event":"Simplified characters and pinyin"},{"date":"1965","event":"Barefoot doctors expanded"},{"date":"1966","event":"Cultural Revolution: attack on the Four Olds"}],"people":[{"name":"Chen Duxiu","role":"Editor of New Youth; co-founder of the CCP."},{"name":"Jiang Qing","role":"Controlled culture during the Cultural Revolution; model operas."},{"name":"Mao Zedong","role":"'Women hold up half the sky'; launched the Cultural Revolution."}],"vocab":[{"term":"Foot binding","def":"Tradition of tightly binding girls' feet to keep them small."},{"term":"Barefoot doctor","def":"Peasant with basic medical training serving rural areas."},{"term":"Four Olds","def":"Old customs, culture, habits and ideas — targets of the Red Guards."},{"term":"Confucianism","def":"Traditional ethical system stressing hierarchy, family duty and order."}],"misconceptions":[{"wrong":"The Marriage Law brought immediate equality.","right":"It met resistance, especially in rural areas, and inequality persisted."},{"wrong":"Barefoot doctors were trained physicians.","right":"They had only a few months' training and gave basic care."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"What did the 1950 Marriage Law ban?","options":["Divorce","Arranged marriages and concubinage","Women working","Education for girls"],"answer":1,"why":"Also gave women the right to divorce."},{"id":"m2","s":"s1","q":"Where was change for women slowest?","options":["Shanghai","Beijing","Rural areas","Universities"],"answer":2,"why":"Traditional families persisted."},{"id":"m3","s":"s2","q":"Who were barefoot doctors?","options":["Western missionaries","Peasants with basic medical training","Army surgeons","Soviet advisers"],"answer":1,"why":"Expanded from 1965."},{"id":"m4","s":"s3","q":"What did the May 4th generation reject?","options":["Science","Confucian thought","Nationalism","Vernacular Chinese"],"answer":1,"why":"Blamed for China's weakness."},{"id":"m5","s":"s3","q":"What were the 'Four Olds'?","options":["Four elderly leaders","Old customs, culture, habits and ideas","Four ancient cities","Four religions"],"answer":1,"why":"Red Guard targets."}],"short":[{"id":"a1","s":"s1","q":"In what year was the Marriage Law passed?","accept":["1950"],"answer":"1950"},{"id":"a2","s":"s3","q":"Who edited New Youth?","accept":["chen duxiu"],"answer":"Chen Duxiu"},{"id":"a3","s":"s2","q":"Which romanisation system was introduced in 1958?","accept":["pinyin"],"answer":"Pinyin"}],"chronology":[{"id":"c1","title":"Put these in order","items":["Examinations abolished","New Youth founded","Peking Union Medical College","Marriage Law","Pinyin introduced","Barefoot doctors expanded","Attack on the Four Olds"]}],"matching":[{"id":"x1","title":"Match the change to its period","pairs":[["Missionary hospitals and schools","Early 20th century"],["Hollywood films in Shanghai","1930s–40s"],["Marriage Law","1950"],["Red Guards","1966"]]}],"evidence":[{"id":"e1","s":"s2","q":"Give precise evidence about barefoot doctors and health provision.","keywords":[["1965","barefoot","vaccination","life expectancy","training"]],"model":"From 1965 barefoot doctors with a few months' training gave basic care and vaccinations in rural areas; life expectancy rose sharply between 1949 and 1976."}]},"flashcards":[{"id":"f1","s":"s1","q":"What did the Marriage Law of 1950 do?","a":"Banned arranged and child marriage, concubinage and bride sales; allowed divorce and property rights for women.","hint":"1 May 1950."},{"id":"f2","s":"s1","q":"How far did women's status change 1950–76?","a":"More work and legal rights, but fewer work points, housework burden, few senior posts; slower change in rural areas.","hint":"Half the sky?"},{"id":"f3","s":"s2","q":"Successes and failures of healthcare under Mao?","a":"Successes: sanitation campaigns, barefoot doctors, rising life expectancy. Failures: limited training, shortages, the famine.","hint":"Both sides."},{"id":"f4","s":"s3","q":"How did the Communists attack religion?","a":"Expelled missionaries; state-controlled churches (Three-Self); restricted Buddhism and Daoism; Red Guards destroyed temples.","hint":"Control + destruction."},{"id":"f5","s":"s3","q":"What was the significance of the Cultural Revolution?","a":"Destroyed heritage, closed universities, sent youth to the countryside, created a 'lost generation' and distrust of the Party.","hint":"1966–76."}],"checklist":[{"id":"k1","level":"judge","text":"I can judge how far the status of women changed 1900–76, including the Marriage Law.","sections":["s1"]},{"id":"k2","level":"explain","text":"I can explain changes in education and literacy 1900–76.","sections":["s2"]},{"id":"k3","level":"judge","text":"I can judge the significance of barefoot doctors in health provision.","sections":["s2"]},{"id":"k4","level":"explain","text":"I can explain cultural and religious change, including the Cultural Revolution.","sections":["s3"]}],"exam":{"questions":[{"id":"q1","qtype":"u2c","label":"Past paper: WHI02/1B, May 2025, Q4","sections":["s2"],"q":"How significant were barefoot doctors in the development of health provision in China in the years 1949–76?","markscheme":null},{"id":"q2","qtype":"u2c","label":"Past paper: WHI02/1B, January 2025, Q4","sections":["s3"],"q":"How accurate is it to say that the main consequence of the Cultural Revolution (1966–76) was the strengthening of Mao's control over China?","markscheme":null},{"id":"q3","qtype":"u2c","label":"Teacher-created practice question","sections":["s1"],"q":"How far did the status of women in China change in the years 1900–76?","markscheme":null}]},"stretch":[{"id":"t1","kind":"Change and continuity","task":"Urban vs rural: create a two-column comparison of women's lives in 1976. Where was change real?"},{"id":"t2","kind":"Synoptic","task":"Link the Cultural Revolution to key topic 1 (Mao's control) and key topic 3 (economic chaos). Which consequence was most significant?"}]},"y12-de-1":{"id":"y12-de-1","course":"y12","area":"de","kt":"Key topic 1","order":1,"title":"The democratic experiment, 1918–29","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following the IAL specification (Issue 6) key topic 1. Read-more references are to Layton, From Kaiser to Führer (Access to History)."},"learn":{"intro":"How did Germany move from empire to democracy in 1918–19, and how did the new Weimar Republic survive crisis after crisis before enjoying its 'Golden Years'? Unit 1 essays often ask you to weigh the importance of one factor — Versailles, hyperinflation, Stresemann — against others.","sections":[{"id":"s1","title":"1. Collapse of the Second Reich and creation of the Republic, 1918–19","blocks":[{"p":"The 'revolution from above': on 29 September 1918 Ludendorff and Hindenburg told the Kaiser the war was lost and urged a government based on the Reichstag majority, partly so that the civilian parties, not the army, would carry the blame for seeking peace. Prince Max of Baden became Chancellor in October and the October Reforms made the Chancellor responsible to the Reichstag."},{"p":"The 'revolution from below': the naval mutiny at Kiel (late October–early November) spread into workers' and soldiers' councils across Germany; Bavaria was declared a republic on 7–8 November. On 9 November the Kaiser's abdication was announced, Philipp Scheidemann proclaimed a republic, and Friedrich Ebert (SPD) became Chancellor. The armistice followed on 11 November."},{"p":"Ebert's priority was order. The Ebert–Groener pact (10 November) secured army support for the government against the radical left, and the Stinnes–Legien agreement (15 November) won employers' recognition of trade unions and the eight-hour day. Critics argue this left the old elites — army officers, judges, civil servants, industrialists — in place."},{"p":"The Spartacist rising in Berlin (January 1919) was crushed by regular troops and Freikorps; Rosa Luxemburg and Karl Liebknecht were murdered. Elections on 19 January 1919 gave the parties of the 'Weimar coalition' (SPD, Centre, DDP) about three-quarters of the vote. The National Assembly met at Weimar and the constitution was signed in August 1919."}],"terms":["revolution from above","revolution from below","Ebert–Groener pact","Freikorps","Weimar coalition"],"evidence":["29 September 1918: High Command admits defeat.","9 November 1918: abdication announced; republic proclaimed.","10 November 1918: Ebert–Groener pact.","January 1919: Spartacist rising crushed; Luxemburg and Liebknecht killed.","19 January 1919: National Assembly elections."],"refs":["Layton, From Kaiser to Führer, ch. 4 §3–4"]},{"id":"s2","title":"2. The Weimar constitution and the parties","blocks":[{"p":"The constitution created a highly democratic system: a Reichstag elected every four years by proportional representation, with votes for men and women over 20; a President directly elected every seven years; a Chancellor appointed by the President but needing Reichstag support; a Reichsrat representing the states; and a long list of fundamental rights."},{"p":"Its weaknesses are a classic essay theme. Proportional representation encouraged many small parties and short-lived coalitions. Article 48 let the President rule by emergency decree — used constructively by Ebert in 1923, but later by Hindenburg to bypass the Reichstag. The constitution left the old institutions of army, judiciary and civil service largely untouched."},{"ul":["SPD — moderate socialists; largest party until July 1932; supported the Republic.","Centre (Zentrum) — Catholic party; in almost every coalition. BVP — its Bavarian sister party.","DDP — liberal democrats; strong in 1919, declined fast.","DVP — business-friendly liberals; Stresemann's party; accepted the Republic pragmatically.","DNVP — nationalists and monarchists; hostile to the Republic for most of the 1920s.","KPD — communists; sought a Soviet-style revolution. NSDAP — Hitler's party from 1920."]}],"terms":["proportional representation","Article 48","coalition government","Reichstag","Reichsrat"],"evidence":["Constitution signed August 1919.","President elected every 7 years; Reichstag every 4.","Article 48: rule by emergency decree."],"refs":["Layton, ch. 5 §1 and §6"]},{"id":"s3","title":"3. Crises and survival, 1919–24","blocks":[{"p":"The Treaty of Versailles (signed 28 June 1919) took about 13 per cent of Germany's European territory, including Alsace-Lorraine, Posen and West Prussia (the 'Polish corridor'), and later part of Upper Silesia; removed all colonies; limited the army to 100,000 men with no conscription, tanks or air force; demilitarised the Rhineland; and through Article 231 blamed Germany for the war. Reparations were fixed in 1921 at 132 billion gold marks. Many Germans called it a Diktat, and the 'stab-in-the-back' myth attached the defeat to the 'November criminals' who founded the Republic."},{"p":"The extreme left: the Spartacist rising (January 1919), the Bavarian Soviet Republic (April–May 1919), the Ruhr workers' uprising after the Kapp Putsch (1920), the March Action (1921) and the Hamburg rising (October 1923). All were crushed, usually by the army and Freikorps."},{"p":"The extreme right: the Kapp Putsch (March 1920) seized Berlin; the army would not fire on the rebels, but a general strike defeated it within days. Right-wing assassins killed Matthias Erzberger (1921) and Walther Rathenau (1922); of 376 political murders in 1919–22, 354 were committed by the right, and few killers were convicted. Hitler's Munich Putsch (November 1923) failed."},{"p":"Hyperinflation: the war had been paid for by borrowing and printing money; reparations and budget deficits added pressure; the Franco-Belgian occupation of the Ruhr (January 1923) and the government's policy of paying striking workers for 'passive resistance' turned inflation into hyperinflation. By November 1923 one US dollar bought about 4.2 trillion marks. Savers, pensioners and those on fixed incomes lost most; debtors and some big industrialists gained."},{"p":"Why did the Republic survive? Stresemann's 'hundred days' as Chancellor (August–November 1923) ended passive resistance and introduced the Rentenmark; the army stayed loyal against the left; Ebert used Article 48 decisively; its opponents were divided and badly organised; and the Dawes Plan (1924) brought foreign money. Historians debate whether survival owed more to the Republic's strengths or to its enemies' weaknesses."}],"terms":["Diktat","stab-in-the-back myth","Kapp Putsch","passive resistance","hyperinflation","Rentenmark"],"evidence":["Reparations: 132 billion gold marks (1921).","Army limited to 100,000.","376 political murders 1919–22, 354 by the right.","Ruhr occupied January 1923.","November 1923: $1 = about 4.2 trillion marks."],"refs":["Layton, ch. 5 §2–5; ch. 6"]},{"id":"s4","title":"4. The 'Golden Years', 1924–29","blocks":[{"p":"Gustav Stresemann, Foreign Minister from 1923 until his death in October 1929, pursued 'fulfilment': co-operating with the Allies to win revisions. The Dawes Plan (1924) rescheduled reparations and brought American loans; the Locarno Treaties (1925) accepted Germany's western borders; Germany joined the League of Nations in 1926; it signed the Kellogg–Briand Pact (1928); and the Young Plan (1929) reduced the total owed and promised early Allied withdrawal from the Rhineland."},{"p":"Paul von Hindenburg was elected President in 1925 after Ebert's death. A monarchist war hero, he acted constitutionally in the 1920s, which reassured conservatives — but his election also showed how far German voters still looked to the old order."},{"p":"Prosperity rested on foreign loans, especially from the USA, a stable currency and rationalisation of industry; industrial production regained its pre-war level by 1928. Social reforms extended the welfare state, including unemployment insurance (1927), and house-building expanded. Women had the vote and constitutional equality, and more worked in offices and shops, though traditional attitudes stayed strong."},{"p":"Underlying weaknesses remained. Unemployment never fell below about 1.3 million; agriculture was in depression from the late 1920s, with falling prices and rising debt; the economy depended on short-term American loans; coalitions remained fragile; and the DNVP and Nazis stayed hostile. The 'Golden Years' are often described as stability on the surface rather than real strength."}],"terms":["fulfilment","Dawes Plan","Locarno","Young Plan","rationalisation"],"evidence":["Dawes Plan 1924; Locarno 1925; League of Nations 1926; Kellogg–Briand 1928; Young Plan 1929.","Hindenburg elected President 1925.","Unemployment never fell below about 1.3 million.","Stresemann died 3 October 1929."],"refs":["Layton, ch. 7 §1–3 and §5"]},{"id":"s5","title":"5. Weimar culture","blocks":[{"p":"The relaxation of censorship and the energy of Berlin produced remarkable culture. Expressionist and 'New Objectivity' (Neue Sachlichkeit) artists such as Otto Dix and George Grosz painted war-wounded veterans, profiteers and city life with savage realism."},{"p":"German cinema was among the most innovative in the world: The Cabinet of Dr Caligari (1920) and Fritz Lang's Metropolis (1927). In theatre, Bertolt Brecht and Kurt Weill's The Threepenny Opera (1928) mocked bourgeois society. The Bauhaus, founded by Walter Gropius in Weimar in 1919 and moved to Dessau in 1925, combined art, craft and industrial design."},{"p":"Culture divided opinion. To many conservatives and Nazis it was 'decadent' and 'un-German' — evidence that the Republic was undermining traditional values. Its significance in essays is often how it widened the gap between modern urban Germany and conservative, rural and religious Germany."}],"terms":["Expressionism","New Objectivity","Bauhaus","cultural pessimism"],"evidence":["The Cabinet of Dr Caligari (1920); Metropolis (1927).","The Threepenny Opera (1928).","Bauhaus: Weimar 1919, Dessau 1925."],"refs":["Layton, ch. 7 §4"]}],"timeline":[{"date":"29 Sept 1918","event":"Ludendorff and Hindenburg admit the war is lost"},{"date":"Oct 1918","event":"Prince Max of Baden becomes Chancellor; October Reforms"},{"date":"9 Nov 1918","event":"Kaiser's abdication announced; republic proclaimed"},{"date":"10 Nov 1918","event":"Ebert–Groener pact"},{"date":"Jan 1919","event":"Spartacist rising crushed"},{"date":"28 June 1919","event":"Treaty of Versailles signed"},{"date":"Aug 1919","event":"Weimar constitution signed"},{"date":"March 1920","event":"Kapp Putsch defeated by a general strike"},{"date":"June 1922","event":"Foreign Minister Walther Rathenau assassinated"},{"date":"Jan 1923","event":"France and Belgium occupy the Ruhr"},{"date":"Nov 1923","event":"Munich Putsch; Rentenmark introduced"},{"date":"1924","event":"Dawes Plan"},{"date":"1925","event":"Hindenburg elected President; Locarno Treaties"},{"date":"1926","event":"Germany joins the League of Nations"},{"date":"1929","event":"Young Plan; death of Stresemann"}],"people":[{"name":"Friedrich Ebert","role":"SPD leader; Chancellor 1918–19; President 1919–25."},{"name":"Gustav Stresemann","role":"DVP; Chancellor Aug–Nov 1923; Foreign Minister 1923–29."},{"name":"Paul von Hindenburg","role":"War hero; President from 1925."},{"name":"Wilhelm Groener","role":"General who agreed the pact with Ebert in November 1918."},{"name":"Rosa Luxemburg and Karl Liebknecht","role":"Spartacist leaders murdered in January 1919."},{"name":"Wolfgang Kapp","role":"Led the right-wing putsch of March 1920."},{"name":"Walther Rathenau","role":"Foreign Minister assassinated by right-wing extremists, 1922."},{"name":"Walter Gropius","role":"Founder of the Bauhaus (1919)."}],"vocab":[{"term":"Proportional representation","def":"Seats shared in proportion to votes — led to many parties and coalitions."},{"term":"Article 48","def":"Emergency powers letting the President rule by decree."},{"term":"Diktat","def":"A dictated peace — how many Germans saw Versailles."},{"term":"Freikorps","def":"Right-wing volunteer units of ex-soldiers used against the left."},{"term":"Passive resistance","def":"Refusing to work for the occupiers in the Ruhr, 1923."},{"term":"Fulfilment","def":"Stresemann's policy of meeting treaty terms to win revisions."},{"term":"Rentenmark","def":"Temporary currency of November 1923 that ended hyperinflation."},{"term":"Neue Sachlichkeit","def":"'New Objectivity' — realistic, critical art of the mid-1920s."}],"misconceptions":[{"wrong":"Hyperinflation was caused simply by reparations.","right":"War debt and money printing began the inflation; the Ruhr occupation and passive resistance turned it into hyperinflation in 1923."},{"wrong":"The Golden Years proved Weimar was secure.","right":"Stability depended on short-term US loans; unemployment, agricultural depression and anti-republican parties remained."},{"wrong":"The Kapp Putsch was defeated by the army.","right":"The army refused to act; a general strike by workers defeated it."},{"wrong":"Germany paid all the reparations it was asked for.","right":"Payments were rescheduled by the Dawes and Young Plans and suspended in the Depression."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"What was the 'revolution from above' in 1918?","options":["The High Command pushing for a government based on the Reichstag","The Kiel mutiny","The Spartacist rising","The Kapp Putsch"],"answer":0,"why":"Ludendorff and Hindenburg wanted civilian politicians to take responsibility for peace."},{"id":"m2","s":"s1","q":"What did the Ebert–Groener pact secure?","options":["An eight-hour day","Army support for the new government","Reparations reductions","Votes for women"],"answer":1,"why":"The army backed Ebert against the radical left; in return the officer corps kept its position."},{"id":"m3","s":"s2","q":"Which feature of the constitution let the President rule by decree?","options":["Article 231","Article 48","The Reichsrat","Proportional representation"],"answer":1,"why":"Article 48 — used by Ebert in 1923 and heavily by Hindenburg from 1930."},{"id":"m4","s":"s3","q":"How was the Kapp Putsch defeated?","options":["The army attacked the rebels","A general strike","French intervention","Hindenburg's decree"],"answer":1,"why":"Workers' general strike paralysed Berlin; the army would not fire on fellow soldiers."},{"id":"m5","s":"s3","q":"What turned inflation into hyperinflation in 1923?","options":["The Dawes Plan","The occupation of the Ruhr and passive resistance","The Wall Street Crash","The Young Plan"],"answer":1,"why":"Lost production plus printing money to pay strikers."},{"id":"m6","s":"s3","q":"At what level were reparations fixed in 1921?","options":["50 billion gold marks","132 billion gold marks","6 billion gold marks","1 trillion marks"],"answer":1,"why":"The London Schedule of Payments, 1921."},{"id":"m7","s":"s4","q":"Which agreement accepted Germany's western borders?","options":["Locarno Treaties 1925","Kellogg–Briand Pact 1928","Treaty of Rapallo 1922","Young Plan 1929"],"answer":0,"why":"Locarno guaranteed the Franco-German and Belgian-German borders."},{"id":"m8","s":"s4","q":"Which was a weakness during the 'Golden Years'?","options":["Hyperinflation","Dependence on short-term US loans","The Ruhr occupation","The Spartacist rising"],"answer":1,"why":"Loans could be recalled — as happened after 1929."},{"id":"m9","s":"s5","q":"Who founded the Bauhaus?","options":["Fritz Lang","Walter Gropius","Bertolt Brecht","Otto Dix"],"answer":1,"why":"Gropius founded it in Weimar in 1919."},{"id":"m10","s":"s4","q":"Who became President in 1925?","options":["Stresemann","Hindenburg","Brüning","Ebert"],"answer":1,"why":"Hindenburg was elected after Ebert died in February 1925."}],"short":[{"id":"a1","s":"s1","q":"Which SPD leader became Chancellor on 9 November 1918?","accept":["ebert","friedrich ebert"],"answer":"Friedrich Ebert"},{"id":"a2","s":"s3","q":"Which article of the Treaty of Versailles is known as the 'war guilt clause'?","accept":["231","article 231"],"answer":"Article 231"},{"id":"a3","s":"s3","q":"Which new currency ended hyperinflation in November 1923?","accept":["rentenmark","the rentenmark"],"answer":"The Rentenmark"},{"id":"a4","s":"s3","q":"Which Foreign Minister was assassinated in 1922?","accept":["rathenau","walther rathenau","walter rathenau"],"answer":"Walther Rathenau"},{"id":"a5","s":"s4","q":"Which 1924 plan rescheduled reparations and brought US loans?","accept":["dawes","dawes plan","the dawes plan"],"answer":"The Dawes Plan"},{"id":"a6","s":"s5","q":"Name Fritz Lang's 1927 science-fiction film.","accept":["metropolis"],"answer":"Metropolis"}],"chronology":[{"id":"c1","title":"Put these crises in order","items":["Spartacist rising","Treaty of Versailles signed","Kapp Putsch","Assassination of Rathenau","Occupation of the Ruhr","Munich Putsch"]},{"id":"c2","title":"Put Stresemann's foreign-policy achievements in order","items":["Dawes Plan","Locarno Treaties","Germany joins the League of Nations","Kellogg–Briand Pact","Young Plan"]}],"matching":[{"id":"x1","title":"Match the party to its description","pairs":[["SPD","Moderate socialists; largest party in the 1920s"],["Centre","Catholic party in most coalitions"],["DVP","Business-friendly; Stresemann's party"],["DNVP","Nationalists and monarchists"],["KPD","Communists seeking revolution"]]}],"evidence":[{"id":"e1","s":"s3","q":"Give precise evidence that the threat from the right was treated more leniently than the threat from the left.","keywords":[["354","376","convict","judges","lenient","hitler","sentence","kapp"]],"model":"Of 376 political murders in 1919–22, 354 were by the right, yet few right-wing killers were convicted; Hitler served only about nine months after the Munich Putsch."},{"id":"e2","s":"s4","q":"Give precise evidence of Stresemann's success in foreign policy.","keywords":[["dawes","locarno","league","kellogg","young"]],"model":"Dawes Plan (1924), Locarno (1925), League of Nations membership (1926), Kellogg–Briand (1928) and the Young Plan (1929)."},{"id":"e3","s":"s4","q":"Give precise evidence that the 'Golden Years' were fragile.","keywords":[["loan","1.3 million","unemploy","agricultur","farm","coalition"]],"model":"The economy relied on short-term American loans, unemployment never fell below about 1.3 million and agriculture was in depression."}]},"flashcards":[{"id":"f1","s":"s1","q":"Why did the High Command support a parliamentary government in autumn 1918?","a":"To make civilian politicians responsible for seeking peace — laying the ground for the stab-in-the-back myth.","hint":"Who would take the blame?"},{"id":"f2","s":"s1","q":"What happened at Kiel in late October–early November 1918?","a":"A naval mutiny that spread into workers' and soldiers' councils — the revolution from below.","hint":"Sailors."},{"id":"f3","s":"s1","q":"What did the Stinnes–Legien agreement give workers?","a":"Recognition of trade unions and the eight-hour day (15 November 1918).","hint":"Employers and unions."},{"id":"f4","s":"s1","q":"Which parties made up the Weimar coalition?","a":"SPD, Centre and DDP.","hint":"Three parties."},{"id":"f5","s":"s2","q":"Give two weaknesses of the Weimar constitution.","a":"Proportional representation encouraged unstable coalitions; Article 48 allowed rule by decree; old elites left in place.","hint":"Voting system + emergency power."},{"id":"f6","s":"s3","q":"Give three military terms of Versailles.","a":"Army of 100,000; no conscription, tanks or air force; Rhineland demilitarised.","hint":"Army, weapons, region."},{"id":"f7","s":"s3","q":"What was the stab-in-the-back myth?","a":"The false claim that the army was undefeated and betrayed by politicians at home — the 'November criminals'.","hint":"Dolchstoss."},{"id":"f8","s":"s3","q":"Name three left-wing risings 1919–23.","a":"Spartacist rising 1919; Bavarian Soviet Republic 1919; Ruhr uprising 1920; March Action 1921; Hamburg 1923.","hint":"Berlin, Munich, Ruhr…"},{"id":"f9","s":"s3","q":"Who gained and who lost from hyperinflation?","a":"Lost: savers, pensioners, fixed incomes. Gained: debtors, some industrialists and those with real assets.","hint":"Savers vs debtors."},{"id":"f10","s":"s3","q":"Give three reasons the Republic survived 1919–24.","a":"Army loyalty against the left; divided opponents; Stresemann's 100 days and the Rentenmark; Article 48; Dawes Plan.","hint":"Army, enemies, Stresemann."},{"id":"f11","s":"s4","q":"What did the Young Plan (1929) do?","a":"Reduced the reparations total and lengthened the payment period; Allied troops to leave the Rhineland early.","hint":"Reparations again."},{"id":"f12","s":"s4","q":"Why was Hindenburg's election in 1925 significant?","a":"A monarchist war hero as President reassured conservatives but showed loyalty to the old order.","hint":"Old order."},{"id":"f13","s":"s4","q":"Give two signs of economic weakness 1924–29.","a":"Dependence on short-term US loans; unemployment never below about 1.3 million; agricultural depression.","hint":"Loans, jobs, farms."},{"id":"f14","s":"s5","q":"Why did Weimar culture matter politically?","a":"Conservatives and Nazis saw it as decadent and un-German, deepening hostility to the Republic.","hint":"Who hated it?"},{"id":"f15","s":"s5","q":"Name two Weimar artists of New Objectivity.","a":"Otto Dix and George Grosz.","hint":"D and G."}],"checklist":[{"id":"k1","level":"explain","text":"I can explain the revolutions from above and below in 1918 and their impact.","sections":["s1"]},{"id":"k2","level":"judge","text":"I can assess the strengths and weaknesses of the Weimar constitution.","sections":["s2"]},{"id":"k3","level":"describe","text":"I can describe the parties and where each stood on the Republic.","sections":["s2"]},{"id":"k4","level":"explain","text":"I can explain the nature and impact of the Treaty of Versailles.","sections":["s3"]},{"id":"k5","level":"explain","text":"I can explain the challenges from the extreme left and right, 1919–23.","sections":["s3"]},{"id":"k6","level":"explain","text":"I can explain the causes and impact of hyperinflation in 1922–23.","sections":["s3"]},{"id":"k7","level":"judge","text":"I can reach a judgement on why the Republic survived 1919–24.","sections":["s3"]},{"id":"k8","level":"judge","text":"I can judge how far 1924–29 were really 'Golden Years', including the roles of Stresemann and Hindenburg.","sections":["s4"]},{"id":"k9","level":"explain","text":"I can explain the significance of Weimar culture, including the Bauhaus.","sections":["s5"]}],"exam":{"questions":[{"id":"q1","qtype":"u1","label":"Past paper: WHI01/1C, May 2025, Q1","sections":["s3"],"q":"Historians differ in their judgements about the impact of the Treaty of Versailles on Germany.\n‘In the years 1919–23, the most damaging consequence of the Treaty of Versailles for Germany was territorial loss.’\nAssess this view using your own knowledge of the issue.","markscheme":null},{"id":"q2","qtype":"u1","label":"Teacher-created practice question","sections":["s3","s1"],"q":"Historians differ in their judgements about why the Weimar Republic survived the crises of 1919–23.\n‘The Weimar Republic survived the crises of 1919–23 mainly because of the weaknesses of its opponents.’\nAssess this view using your own knowledge of the issue.","model":[{"t":"Some historians argue that the Republic survived mainly because its enemies were divided and incompetent, whilst others stress the actions of its own leaders — Ebert's use of Article 48 and the army, and Stresemann's response to 1923. In assessing the Republic's survival, the criteria of effectiveness and impact will be employed to argue that decisive government action mattered more, although it worked only because opponents could not unite.","n":"Introduction from the department frame: both views named, criteria named, judgement given."},{"t":"Despite my judgement, it could be argued that the opponents' weaknesses were most important. The Kapp Putsch of March 1920 collapsed within days when a general strike paralysed Berlin, and the Munich Putsch of November 1923 was badly planned and quickly dispersed by police.","n":"Weaker factor: point and precise evidence (events, dates)."},{"t":"However, this argument is weak when judged by effectiveness, because the left-wing risings of 1919–23 did not simply fail on their own: the Spartacists in 1919 and the Hamburg rising in 1923 were defeated by government forces. Thus we must assert that the enemies' weaknesses made survival possible, but government action made it happen.","n":"Weakness against a named criterion, then the judgement sustained."}],"model_note":"Teacher-written model extract using the department factor-question frame.","markscheme":null}]},"stretch":[{"id":"t1","kind":"Competing arguments","task":"Was the German Revolution of 1918–19 a 'limited revolution'? Use the Ebert–Groener pact and the survival of old elites to argue both sides, then decide."},{"id":"t2","kind":"Relative significance","task":"Rank Versailles, hyperinflation and the constitution as threats to the Republic by 1923. Change one ranking when you judge by duration instead of immediate impa
