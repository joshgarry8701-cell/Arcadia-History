ct."},{"id":"t3","kind":"Causal links","task":"Show how the Ruhr occupation, passive resistance, hyperinflation and the Munich Putsch were connected in a single chain."},{"id":"t4","kind":"Change and continuity","task":"How much really changed for German society in the 'Golden Years'? Consider women, workers and farmers separately."}]},"y12-de-2":{"id":"y12-de-2","course":"y12","area":"de","kt":"Key topic 2","order":2,"title":"The rise of the Nazis, 1919–33","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following IAL key topic 2. Read-more references are to Layton, From Kaiser to Führer."},"learn":{"intro":"From a tiny Munich party in 1919 to government in 1933: why did the Nazis fail in the 1920s, break through after 1929, and how did Hitler — who never won a majority in a free election — become Chancellor?","sections":[{"id":"s1","title":"1. Origins of the NSDAP to 1923","blocks":[{"p":"The German Workers' Party (DAP) was founded in Munich in January 1919 by Anton Drexler. Hitler, then an army political informant, joined in September 1919 and quickly became its star speaker. In February 1920 the party announced its 25-point programme — nationalist, anti-Semitic, anti-Versailles and vaguely anti-capitalist — and renamed itself the National Socialist German Workers' Party (NSDAP)."},{"p":"In July 1921 Hitler became party leader with near-total authority. The SA (Sturmabteilung) grew from the party's stewards in 1921; Ernst Röhm, an army officer with links to the Bavarian authorities and Freikorps, was vital in building it into a paramilitary force. The party bought its own newspaper, the Völkischer Beobachter, in 1920."},{"p":"The Munich (Beer Hall) Putsch of 8–9 November 1923 tried to exploit the crisis year, copying Mussolini's march on Rome. Hitler counted on the Bavarian leaders Kahr, Lossow and Seisser, but they turned against him; the march through Munich was dispersed by police gunfire and 16 Nazis were killed. The failure taught Hitler that power would have to be won through the system."}],"terms":["25-point programme","SA","Munich Putsch","Führerprinzip"],"evidence":["January 1919: DAP founded by Drexler.","February 1920: 25-point programme; renamed NSDAP.","July 1921: Hitler becomes leader.","8–9 November 1923: Munich Putsch."],"refs":["Layton, ch. 8 §1–3"]},{"id":"s2","title":"2. Failure and survival, 1924–28","blocks":[{"p":"Hitler's trial (February–March 1924) gave him national publicity, and sympathetic judges gave him a five-year sentence of which he served about nine months in Landsberg prison. There he wrote Mein Kampf, setting out his ideas on race, Lebensraum and leadership, and decided on the 'legal path' to power."},{"p":"The party was refounded in February 1925. At the Bamberg Conference (February 1926) Hitler defeated the northern, more socialist wing led by Gregor Strasser, establishing the Führerprinzip and his control of the programme. Joseph Goebbels switched to Hitler's side and became Gauleiter of Berlin."},{"p":"A national organisation developed: regional Gaue, the Hitler Youth (1926), the SS as a personal bodyguard, and specialist groups for farmers, students and professions. But in the stable conditions of the mid-1920s the party struggled: in the Reichstag election of May 1928 it won only 2.6 per cent and 12 seats. It began to shift attention to rural, Protestant northern Germany, where agricultural depression was already hurting."}],"terms":["Mein Kampf","legal path","Bamberg Conference","Gau / Gauleiter"],"evidence":["Sentence of 5 years; served about 9 months.","Bamberg Conference, February 1926.","May 1928: 2.6% of the vote, 12 seats."],"refs":["Layton, ch. 8 §4"]},{"id":"s3","title":"3. Breakthrough and Weimar's collapse, 1929–32","blocks":[{"p":"In 1929 the Nazis joined Alfred Hugenberg's DNVP and other nationalists in a campaign against the Young Plan. The referendum failed, but Hugenberg's newspapers gave Hitler national publicity and respectability with the conservative right."},{"p":"The Wall Street Crash (October 1929) led American lenders to recall loans. German industrial output fell sharply and unemployment reached 6.1 million by January 1932. The Grand Coalition collapsed in March 1930 over unemployment-insurance contributions; Heinrich Brüning's government then governed increasingly through Article 48 decrees, and his deflationary cuts deepened the misery."},{"p":"The Nazi vote rose to 18.3 per cent (107 seats) in September 1930 and 37.3 per cent (230 seats, the largest party) in July 1932. Goebbels's propaganda, mass rallies, Hitler's flights across Germany in 1932 and targeted messages to farmers, the middle classes and young voters were combined with SA intimidation and street violence. The Nazis drew support from across society, though most heavily from Protestant, rural and middle-class Germany."},{"p":"The Communist vote also grew — reaching 16.9 per cent and 100 seats in November 1932 — which frightened the middle classes, industrialists and the elites, and made the Nazis look like the barrier against Bolshevism. In the Reichstag, Nazis and Communists together formed a negative majority that made parliamentary government almost impossible."}],"terms":["presidential government","deflation","negative majority","Young Plan campaign"],"evidence":["Unemployment 6.1 million, January 1932.","Sept 1930: 18.3%, 107 seats.","July 1932: 37.3%, 230 seats.","Nov 1932: KPD 16.9%, 100 seats."],"refs":["Layton, ch. 9; ch. 10 §1–2"]},{"id":"s4","title":"4. Coming to power, November 1932–March 1933","blocks":[{"p":"Hindenburg had replaced Brüning with Franz von Papen (June 1932), who lifted the ban on the SA and called the July election. Hitler refused anything less than the chancellorship. In November 1932 the Nazi vote fell to 33.1 per cent (196 seats), funds were low and the party seemed to have peaked."},{"p":"General Kurt von Schleicher became Chancellor in December 1932 and tried to split the Nazis by offering Gregor Strasser the vice-chancellorship. Papen, seeking revenge, met Hitler in January 1933 and persuaded Hindenburg that a cabinet with Hitler as Chancellor, but only three Nazis, could be controlled by conservatives. Hitler was appointed on 30 January 1933."},{"p":"Hitler then used state power to win support and crush opponents. On 3 February he reassured army leaders; on 20 February leading industrialists pledged money for the election campaign. Göring, as Prussian Interior Minister, enrolled SA and SS men as auxiliary police. After the Reichstag Fire (27 February), blamed on the Communist Marinus van der Lubbe, the Decree for the Protection of the People and the State (28 February) suspended civil liberties. In the election of 5 March the Nazis won 43.9 per cent (288 seats) — still not a majority without the DNVP."},{"p":"The historians' debate: was Hitler's appointment the product of Nazi popularity and propaganda, of the economic crisis, of the structural weaknesses of Weimar, or — the most common emphasis — of the 'backstairs intrigue' of a small group of conservatives around Hindenburg who thought they could use him?"}],"terms":["backstairs intrigue","auxiliary police","Reichstag Fire Decree","Hindenburg's camarilla"],"evidence":["Nov 1932: 33.1%, 196 seats.","30 January 1933: Hitler appointed; three Nazis in cabinet.","20 February 1933: industrialists fund the campaign.","27–28 February 1933: Reichstag Fire and emergency decree.","5 March 1933: 43.9%, 288 seats."],"refs":["Layton, ch. 10 §3–5"]}],"timeline":[{"date":"Jan 1919","event":"German Workers' Party (DAP) founded by Anton Drexler"},{"date":"Feb 1920","event":"25-point programme; party renamed NSDAP"},{"date":"July 1921","event":"Hitler becomes party leader"},{"date":"Nov 1923","event":"Munich Putsch fails"},{"date":"Feb 1926","event":"Bamberg Conference"},{"date":"May 1928","event":"Nazis win 2.6% and 12 seats"},{"date":"Oct 1929","event":"Wall Street Crash"},{"date":"March 1930","event":"Brüning becomes Chancellor; presidential government begins"},{"date":"Sept 1930","event":"Nazis win 18.3% and 107 seats"},{"date":"July 1932","event":"Nazis win 37.3% and 230 seats — largest party"},{"date":"Nov 1932","event":"Nazi vote falls to 33.1%"},{"date":"30 Jan 1933","event":"Hitler appointed Chancellor"},{"date":"27 Feb 1933","event":"Reichstag Fire"},{"date":"5 March 1933","event":"Nazis win 43.9% and 288 seats"}],"people":[{"name":"Anton Drexler","role":"Founder of the DAP, 1919."},{"name":"Ernst Röhm","role":"Built up the SA; SA chief of staff from 1931."},{"name":"Gregor Strasser","role":"Leader of the party's northern, socialist wing; resigned December 1932."},{"name":"Joseph Goebbels","role":"Gauleiter of Berlin; head of Nazi propaganda."},{"name":"Alfred Hugenberg","role":"DNVP leader and media owner; ally against the Young Plan."},{"name":"Heinrich Brüning","role":"Chancellor 1930–32; governed by decree; deflation."},{"name":"Franz von Papen","role":"Chancellor 1932; helped persuade Hindenburg to appoint Hitler."},{"name":"Kurt von Schleicher","role":"General; Chancellor December 1932–January 1933."}],"vocab":[{"term":"Völkisch","def":"Racial-nationalist ideas about the German 'people'."},{"term":"Lebensraum","def":"'Living space' — expansion into eastern Europe."},{"term":"Führerprinzip","def":"The leader principle: absolute authority of the leader."},{"term":"Presidential government","def":"Chancellors governing through the President's decrees rather than the Reichstag."},{"term":"Deflation","def":"Cutting spending and wages to cut prices — Brüning's policy."},{"term":"Negative majority","def":"Anti-republican parties together blocking any working majority."}],"misconceptions":[{"wrong":"Hitler was elected Chancellor.","right":"He was appointed by Hindenburg. The Nazis never won a majority in a free election."},{"wrong":"The Nazi vote kept rising until 1933.","right":"It fell from 37.3% (July 1932) to 33.1% (November 1932)."},{"wrong":"Only the unemployed voted Nazi.","right":"Many unemployed voted KPD; Nazi support was strongest among the Protestant middle classes and rural voters."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"What did the Munich Putsch teach Hitler?","options":["To rely on the Bavarian leaders","That power would have to be won legally","To abandon anti-Semitism","To join the DNVP"],"answer":1,"why":"After 1924 he followed the 'legal path'."},{"id":"m2","s":"s2","q":"What did the Bamberg Conference (1926) settle?","options":["Hitler's control over the party and programme","A coalition with the DNVP","The creation of the Gestapo","The Young Plan"],"answer":0,"why":"Hitler defeated Strasser's northern wing and established the leader principle."},{"id":"m3","s":"s2","q":"What share of the vote did the Nazis win in May 1928?","options":["2.6%","18.3%","33.1%","37.3%"],"answer":0,"why":"12 seats — a poor result in stable times."},{"id":"m4","s":"s3","q":"Why was the campaign against the Young Plan important for the Nazis?","options":["The referendum succeeded","It gave them national publicity through Hugenberg's media","It ended reparations","It made Hitler Chancellor"],"answer":1,"why":"The referendum failed but the publicity and respectability mattered."},{"id":"m5","s":"s3","q":"How did Brüning govern?","options":["Through a Reichstag majority","Mainly through Article 48 decrees","Through the SA","Through the Reichsrat"],"answer":1,"why":"Presidential government began in 1930."},{"id":"m6","s":"s3","q":"Why did the growth of the KPD help the Nazis?","options":["The KPD supported Hitler","It frightened the middle classes and elites","It ended unemployment","It weakened the SA"],"answer":1,"why":"The Nazis posed as the barrier against communism."},{"id":"m7","s":"s4","q":"How many Nazis were in Hitler's first cabinet?","options":["One","Three","Eight","All"],"answer":1,"why":"Hitler, Frick and Göring — conservatives thought they could control him."},{"id":"m8","s":"s4","q":"Which decree followed the Reichstag Fire?","options":["Enabling Act","Decree for the Protection of the People and the State","Nuremberg Laws","Article 231"],"answer":1,"why":"28 February 1933 — suspended civil liberties."},{"id":"m9","s":"s4","q":"Who persuaded Hindenburg to appoint Hitler in January 1933?","options":["Brüning","Papen","Strasser","Stresemann"],"answer":1,"why":"Papen expected to control Hitler as Vice-Chancellor."}],"short":[{"id":"a1","s":"s1","q":"Who founded the German Workers' Party in 1919?","accept":["drexler","anton drexler"],"answer":"Anton Drexler"},{"id":"a2","s":"s2","q":"What book did Hitler write in Landsberg prison?","accept":["mein kampf","my struggle"],"answer":"Mein Kampf"},{"id":"a3","s":"s3","q":"What was the peak of unemployment, in millions, in January 1932?","accept":["6.1","6.1 million","6 million","six million"],"answer":"6.1 million"},{"id":"a4","s":"s3","q":"How many seats did the Nazis win in July 1932?","accept":["230"],"answer":"230"},{"id":"a5","s":"s4","q":"Who became Chancellor in December 1932?","accept":["schleicher","von schleicher","kurt von schleicher"],"answer":"Kurt von Schleicher"},{"id":"a6","s":"s4","q":"Who was blamed for the Reichstag Fire?","accept":["van der lubbe","marinus van der lubbe","lubbe"],"answer":"Marinus van der Lubbe"}],"chronology":[{"id":"c1","title":"Put the chancellors of 1930–33 in order","items":["Brüning","Papen","Schleicher","Hitler"]},{"id":"c2","title":"Put these events in order","items":["25-point programme","Munich Putsch","Bamberg Conference","Young Plan campaign","Nazis become largest party","Hitler appointed Chancellor","Reichstag Fire"]}],"matching":[{"id":"x1","title":"Match the election to the Nazi result","pairs":[["May 1928","2.6%, 12 seats"],["September 1930","18.3%, 107 seats"],["July 1932","37.3%, 230 seats"],["November 1932","33.1%, 196 seats"],["March 1933","43.9%, 288 seats"]]}],"evidence":[{"id":"e1","s":"s3","q":"Give precise evidence of the impact of the Depression on Germany.","keywords":[["6.1","6 million","unemploy","loans","output","brüning","bruning","deflation"]],"model":"US loans were recalled after October 1929, industrial output collapsed and unemployment reached 6.1 million by January 1932."},{"id":"e2","s":"s4","q":"Give precise evidence that Hitler's appointment depended on the elites.","keywords":[["papen","hindenburg","three","schleicher","cabinet","intrigue"]],"model":"Papen persuaded Hindenburg in January 1933 that Hitler could be controlled in a cabinet with only three Nazis; Schleicher's attempt to split the party had failed."},{"id":"e3","s":"s4","q":"Give precise evidence that the Nazis used state power before the March 1933 election.","keywords":[["auxiliary","göring","goring","decree","28 february","reichstag fire","industrialist","20 february"]],"model":"Göring made SA and SS men auxiliary police; the Reichstag Fire Decree of 28 February suspended civil liberties; industrialists funded the campaign on 20 February."}]},"flashcards":[{"id":"f1","s":"s1","q":"Name three ideas in the 25-point programme.","a":"Overturn Versailles; union of all Germans; anti-Semitic citizenship rules; land for expansion; some anti-capitalist demands.","hint":"Versailles, race, land."},{"id":"f2","s":"s1","q":"Why did the Munich Putsch fail?","a":"The Bavarian leaders Kahr, Lossow and Seisser turned against Hitler; poor planning; police fired on the march.","hint":"Who let him down?"},{"id":"f3","s":"s2","q":"How did Hitler benefit from his trial in 1924?","a":"National publicity; a lenient sentence served for about nine months; time to write Mein Kampf.","hint":"Publicity."},{"id":"f4","s":"s2","q":"Why did the Nazis do badly in 1924–28?","a":"Economic stability and the success of Stresemann's policies reduced the appeal of extremists.","hint":"Golden Years."},{"id":"f5","s":"s3","q":"What were Brüning's economic policies and their effect?","a":"Deflation — spending and wage cuts — which deepened unemployment and earned him the name 'hunger chancellor'.","hint":"Cuts."},{"id":"f6","s":"s3","q":"Give three Nazi methods of winning support 1930–32.","a":"Goebbels's propaganda; mass rallies and Hitler's flights; targeted messages to groups; SA marches and intimidation.","hint":"Propaganda + violence."},{"id":"f7","s":"s3","q":"Which groups voted Nazi most heavily?","a":"Protestant, rural and middle-class Germans; but support came from across society.","hint":"Not mainly the unemployed."},{"id":"f8","s":"s4","q":"What was Schleicher's plan in December 1932?","a":"To split the Nazis by offering Gregor Strasser a post and win union support — it failed.","hint":"Split the party."},{"id":"f9","s":"s4","q":"Why did Hindenburg finally appoint Hitler?","a":"Persuaded by Papen and his advisers that a cabinet with only three Nazis could control him, and to end the political deadlock.","hint":"Backstairs intrigue."},{"id":"f10","s":"s4","q":"What happened on 3 and 20 February 1933?","a":"3 Feb: Hitler reassured army leaders. 20 Feb: industrialists pledged money for the Nazi election campaign.","hint":"Army; big business."},{"id":"f11","s":"s4","q":"Why did the March 1933 election show the limits of Nazi support?","a":"Even with terror and propaganda the Nazis won 43.9% — not a majority without the DNVP.","hint":"Under 50%."},{"id":"f12","s":"s1","q":"What was Röhm's role?","a":"Built the SA into a paramilitary force using his army and Freikorps contacts.","hint":"The SA."}],"checklist":[{"id":"k1","level":"explain","text":"I can explain the origins and growth of the NSDAP to 1923, including the 25-point programme and the SA.","sections":["s1"]},{"id":"k2","level":"judge","text":"I can assess the significance of the Munich Putsch and Hitler's trial.","sections":["s1","s2"]},{"id":"k3","level":"explain","text":"I can explain the significance of Bamberg 1926 and the party's reorganisation.","sections":["s2"]},{"id":"k4","level":"explain","text":"I can explain how the Depression and the Young Plan campaign helped the Nazis.","sections":["s3"]},{"id":"k5","level":"judge","text":"I can judge the reasons for Nazi electoral success 1930–32, including the role of the Communists.","sections":["s3"]},{"id":"k6","level":"judge","text":"I can reach a judgement on why Hitler was appointed Chancellor in January 1933.","sections":["s4"]},{"id":"k7","level":"describe","text":"I can describe the events of February–March 1933 with precise dates.","sections":["s4"]}],"exam":{"questions":[{"id":"q1","qtype":"u1","label":"Teacher-created practice question","sections":["s4","s3"],"q":"Historians differ in their judgements about why Hitler became Chancellor in January 1933.\n‘Hitler became Chancellor in January 1933 mainly because of the political intrigue of the conservative elites.’\nAssess this view using your own knowledge of the issue.","model":[{"t":"In line with my judgement, the intrigue of the conservative elites was the decisive reason. In November 1932 the Nazi vote had fallen to 33.1 per cent and the party was short of money; it was Papen's meeting with Hitler in January 1933 and his persuasion of Hindenburg that turned a declining movement into a government.","n":"Most important factor: point linked to the judgement + precise evidence (statistic, people, date)."},{"t":"A dissenting view might point to the 37.3 per cent won in July 1932, arguing that without mass support no conservative would have considered Hitler at all.","n":"Dissenting view — the strongest counter-argument."},{"t":"On the balance however, mass support gave Hitler a claim to power but not power itself: Hindenburg refused him the chancellorship in August 1932 despite that result. Judged by effectiveness, only the elites could make the appointment. Thus we must assert that intrigue was the most important reason.","n":"Why it still wins + criterion + sustained judgement."}],"model_note":"Teacher-written model extract using the department factor-question frame.","markscheme":null},{"id":"q2","qtype":"u1","label":"Teacher-created practice question","sections":["s3"],"q":"Historians differ in their judgements about the reasons for Nazi electoral success in the years 1930–32.\n‘The main reason for Nazi electoral success in the years 1930–32 was the impact of the economic depression.’\nAssess this view using your own knowledge of the issue.","markscheme":null}]},"stretch":[{"id":"t1","kind":"Competing arguments","task":"'Hitler was jobbed into power.' Explain what this phrase means and assess it against the view that he was carried to power by popular support."},{"id":"t2","kind":"Counterfactual","task":"If Schleicher had succeeded in splitting the party in December 1932, could the Nazis have recovered? Use the November 1932 results and party finances."},{"id":"t3","kind":"Causal links","task":"Link the Depression, Brüning's deflation, presidential government and the rise of both extremes into one explanation."}]},"y12-de-3":{"id":"y12-de-3","course":"y12","area":"de","kt":"Key topic 3","order":3,"title":"Nazi Germany, 1933–39","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following IAL key topic 3. Read-more references are to Layton, From Kaiser to Führer."},"learn":{"intro":"How did the Nazis turn an appointment as Chancellor into a dictatorship within 18 months, how did they control and shape German society, and how successful were their economic policies? This key topic produces many Unit 1 questions.","sections":[{"id":"s1","title":"1. Establishing the dictatorship, 1933–34","blocks":[{"p":"The Enabling Act (23 March 1933) let the government make laws without the Reichstag for four years. It passed by 444 votes to 94: Communist deputies were already arrested or in hiding, SA men surrounded the building, and the Centre Party voted in favour after promises about the Catholic Church. Only the SPD voted against."},{"p":"Gleichschaltung (coordination) followed. The federal states were placed under Reich governors (April 1933) and their parliaments abolished (January 1934). Trade unions were broken up on 2 May 1933 and replaced by the German Labour Front (DAF). The SPD was banned in June, other parties dissolved themselves, and on 14 July 1933 the Nazis became the only legal party."},{"p":"The SA, now millions strong, wanted a 'second revolution' and Röhm hoped to merge it with the army. The army and big business were alarmed. In the Night of the Long Knives (30 June–2 July 1934) the SS murdered Röhm and other SA leaders, along with old enemies such as Schleicher, Gregor Strasser and Kahr. The army was reassured and the SS became the regime's main instrument of terror."},{"p":"When Hindenburg died on 2 August 1934, Hitler merged the offices of Chancellor and President as Führer. The army swore a personal oath of loyalty to Hitler, and a plebiscite on 19 August approved the change with about 90 per cent of the vote."}],"terms":["Enabling Act","Gleichschaltung","second revolution","Night of the Long Knives","Führer"],"evidence":["23 March 1933: Enabling Act passed 444–94.","2 May 1933: trade unions abolished.","14 July 1933: one-party state.","30 June–2 July 1934: Night of the Long Knives.","2 August 1934: Hindenburg dies; army oath to Hitler."],"refs":["Layton, ch. 11 §1–2"]},{"id":"s2","title":"2. The nature of Nazi government, 1934–39","blocks":[{"p":"Hitler's style of government was unusual. He disliked routine paperwork, spent long periods at his Bavarian retreat, and the cabinet met less and less, last meeting in 1938. Decisions were often given orally and many ministers rarely saw him."},{"p":"Power was spread between competing agencies — ministries, party offices, the SS, and special plenipotentiaries such as Göring for the Four-Year Plan. Historians call this polycracy. Intentionalist historians see Hitler deliberately dividing to rule; structuralists see a chaotic system in which officials competed by 'working towards the Führer' (Ian Kershaw's phrase), radicalising policy."},{"p":"The 'dual state' (Ernst Fraenkel, 1941): a 'normative state' of ordinary laws and courts continued to operate for most everyday matters, alongside a 'prerogative state' — the party, SS and police — which acted outside the law whenever the regime chose."}],"terms":["polycracy","working towards the Führer","dual state","intentionalist","structuralist"],"evidence":["Cabinet last met in 1938.","Göring made plenipotentiary for the Four-Year Plan (1936).","Fraenkel's 'dual state' (1941)."],"refs":["Layton, ch. 11 §3–4 and §8"]},{"id":"s3","title":"3. Repression and control","blocks":[{"p":"Heinrich Himmler built the terror apparatus. He took control of the political police across the states in 1934 and became Chief of the German Police in June 1936, uniting the police with the SS. The Gestapo (secret state police) and the SD (the SS intelligence service under Reinhard Heydrich) watched for opponents. The first concentration camp opened at Dachau in March 1933, and thousands were held in 'protective custody'."},{"p":"The Gestapo was small. Research on local records shows it relied heavily on denunciations from ordinary Germans, whose motives ranged from loyalty to personal grudges. Fear and consent overlapped."},{"p":"Joseph Goebbels's Ministry of Popular Enlightenment and Propaganda (March 1933) and the Reich Chamber of Culture (September 1933) controlled the press, radio, film and the arts. Cheap 'People's Receiver' radios, the Nuremberg rallies, the 1936 Berlin Olympics and films such as Triumph of the Will (1935) spread the Hitler myth."},{"p":"Opposition and dissent were limited and fragmented: underground SPD and KPD cells were broken up; the Confessing Church (Pastor Martin Niemöller) resisted Nazi control of the Protestant Church; some young people rejected the Hitler Youth; army officers plotted in 1938. Much dissent was 'non-conformity' — grumbling, listening to foreign radio, avoiding the Hitler salute — rather than active resistance."}],"terms":["Gestapo","SD","protective custody","denunciation","Reich Chamber of Culture","non-conformity"],"evidence":["March 1933: Dachau opens.","June 1936: Himmler Chief of the German Police.","September 1933: Reich Chamber of Culture.","1935: Triumph of the Will; 1936: Berlin Olympics."],"refs":["Layton, ch. 11 §5–6"]},{"id":"s4","title":"4. Shaping society: the Volksgemeinschaft","blocks":[{"p":"The Volksgemeinschaft (people's community) was meant to replace class and religious division with racial unity and loyalty to the Führer. It was built by including 'racially valuable' Germans and excluding everyone else."},{"p":"Women: Kinder, Küche, Kirche. Marriage loans (1933) were reduced for each child born; the Mother's Cross (1938) rewarded large families; women were pushed out of the higher civil service, law and medicine. Yet the demands of rearmament meant women's employment rose in the later 1930s. The Nazi women's organisations were led by Gertrud Scholtz-Klink."},{"p":"Workers: Robert Ley's German Labour Front (DAF) replaced unions. Its subsidiaries Strength through Joy (KdF) offered cheap holidays, sport and the Volkswagen savings scheme, and Beauty of Labour improved workplaces — compensation for longer hours and frozen wages."},{"p":"Youth and education: teachers had to join the Nazi Teachers' League; the curriculum emphasised race, history and physical education. The Hitler Youth and League of German Maidens became the official youth organisations in 1936, with membership made compulsory in 1939."},{"p":"Racial policy and the churches: the sterilisation law (July 1933), the boycott of Jewish shops (1 April 1933) and the exclusion of Jews from the civil service (April 1933), the Nuremberg Laws (September 1935) and the Kristallnacht pogrom (9–10 November 1938) escalated persecution. The Concordat with the Vatican (July 1933) was soon broken; the Pope's encyclical 'With Burning Concern' (1937) criticised the regime."}],"terms":["Volksgemeinschaft","Kinder, Küche, Kirche","DAF","Strength through Joy","Nuremberg Laws","Kristallnacht","Concordat"],"evidence":["1933: marriage loans; 1938: Mother's Cross.","1 April 1933: boycott; September 1935: Nuremberg Laws; 9–10 November 1938: Kristallnacht.","July 1933: Concordat; 1937: 'With Burning Concern'.","1936: Hitler Youth the official youth organisation; 1939: compulsory."],"refs":["Layton, ch. 13"]},{"id":"s5","title":"5. Economic policies","blocks":[{"p":"Hjalmar Schacht (Reichsbank President from 1933, Economics Minister 1934–37) financed recovery and rearmament through deficit spending and Mefo bills, which hid the cost of rearmament. His New Plan (1934) controlled imports and made bilateral trade deals, especially with south-eastern Europe."},{"p":"Unemployment fell from about 6 million in early 1933 to well under half a million by 1939, helped by public works such as the autobahns, the Reich Labour Service, conscription (from 1935), rearmament and statistical tricks that removed women and Jews from the figures."},{"p":"In 1936 Göring's Four-Year Plan aimed to make Germany ready for war within four years through autarky — synthetic oil and rubber, and state-run industries such as the Hermann Göring Works. Schacht, who warned about the cost, resigned in 1937. Most targets were missed."},{"p":"Living standards: jobs returned, but real wages only slowly recovered to late-1920s levels, hours were longer and food choice was limited ('guns or butter'). Farmers were promised protection through the Reich Food Estate and the Reich Entailed Farm Law (1933), but the drift from the land continued."}],"terms":["Mefo bills","New Plan","autarky","Four-Year Plan","guns or butter"],"evidence":["Unemployment about 6 million (1933) → under 0.5 million (1939).","1934: New Plan; 1935: conscription; 1936: Four-Year Plan.","Schacht resigned as Economics Minister in 1937."],"refs":["Layton, ch. 12"]}],"timeline":[{"date":"23 March 1933","event":"Enabling Act passed"},{"date":"1 April 1933","event":"Boycott of Jewish shops"},{"date":"2 May 1933","event":"Trade unions abolished; DAF set up"},{"date":"14 July 1933","event":"Germany becomes a one-party state"},{"date":"July 1933","event":"Concordat with the Vatican"},{"date":"30 June 1934","event":"Night of the Long Knives begins"},{"date":"2 Aug 1934","event":"Hindenburg dies; Hitler becomes Führer"},{"date":"March 1935","event":"Conscription reintroduced"},{"date":"Sept 1935","event":"Nuremberg Laws"},{"date":"June 1936","event":"Himmler becomes Chief of the German Police"},{"date":"1936","event":"Four-Year Plan launched under Göring"},{"date":"9–10 Nov 1938","event":"Kristallnacht"}],"people":[{"name":"Heinrich Himmler","role":"Reichsführer-SS; Chief of the German Police from 1936."},{"name":"Reinhard Heydrich","role":"Head of the SD; later of the Reich Security Main Office."},{"name":"Joseph Goebbels","role":"Minister of Propaganda from March 1933."},{"name":"Robert Ley","role":"Leader of the German Labour Front (DAF)."},{"name":"Hjalmar Schacht","role":"Reichsbank President; Economics Minister 1934–37."},{"name":"Hermann Göring","role":"Prussian Interior Minister; head of the Four-Year Plan from 1936."},{"name":"Ernst Röhm","role":"SA leader killed in the Night of the Long Knives."},{"name":"Martin Niemöller","role":"Pastor; leading figure in the Confessing Church."}],"vocab":[{"term":"Gleichschaltung","def":"Coordination — bringing institutions under Nazi control."},{"term":"Polycracy","def":"Many competing centres of power."},{"term":"Dual state","def":"Ordinary law alongside arbitrary party/SS power."},{"term":"Volksgemeinschaft","def":"The 'people's community' of racially valuable Germans."},{"term":"Autarky","def":"Economic self-sufficiency."},{"term":"Mefo bills","def":"Credit notes that disguised rearmament spending."},{"term":"Protective custody","def":"Detention without trial, often in camps."}],"misconceptions":[{"wrong":"The Gestapo had agents everywhere.","right":"It was small and relied on denunciations from ordinary Germans."},{"wrong":"Nazi policy kept women out of work.","right":"Women were pushed out of some professions, but female employment rose in the late 1930s as rearmament needed labour."},{"wrong":"Unemployment ended purely because of Nazi economic genius.","right":"Recovery had begun before 1933; conscription, rearmament and statistical exclusions also played a part."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"Which party voted against the Enabling Act?","options":["Centre","SPD","DNVP","DVP"],"answer":1,"why":"Communist deputies were already excluded; the SPD alone voted no."},{"id":"m2","s":"s1","q":"Who was killed in the Night of the Long Knives?","options":["Himmler","Röhm","Göring","Goebbels"],"answer":1,"why":"Röhm and other SA leaders, plus Schleicher, Strasser and Kahr."},{"id":"m3","s":"s1","q":"What happened after Hindenburg died in August 1934?","options":["Papen became President","Hitler combined the offices as Führer and the army swore an oath to him","The Reichstag elected a new President","The SA took control of the army"],"answer":1,"why":"Approved by a plebiscite on 19 August."},{"id":"m4","s":"s2","q":"What does 'working towards the Führer' describe?","options":["Labour service","Officials radicalising policy to win Hitler's approval","The Four-Year Plan","Propaganda campaigns"],"answer":1,"why":"Ian Kershaw's explanation of how a chaotic system produced radical policy."},{"id":"m5","s":"s3","q":"What did the Gestapo rely on most?","options":["Thousands of agents","Denunciations by ordinary Germans","Army intelligence","Foreign informers"],"answer":1,"why":"Local studies show most cases began with denunciations."},{"id":"m6","s":"s4","q":"Which organisation provided cheap holidays for workers?","options":["SD","Strength through Joy (KdF)","RAD","NSLB"],"answer":1,"why":"A subsidiary of Ley's DAF."},{"id":"m7","s":"s4","q":"When were the Nuremberg Laws passed?","options":["1933","1935","1938","1939"],"answer":1,"why":"September 1935."},{"id":"m8","s":"s5","q":"What were Mefo bills used for?","options":["Paying reparations","Hiding the cost of rearmament","Funding KdF","Buying farms"],"answer":1,"why":"Schacht's credit notes kept military spending off the books."},{"id":"m9","s":"s5","q":"What was the aim of the Four-Year Plan?","options":["Free trade","Autarky and readiness for war","Ending conscription","Paying reparations"],"answer":1,"why":"Göring's plan from 1936."}],"short":[{"id":"a1","s":"s1","q":"On what date was the Enabling Act passed?","accept":["23 march 1933","23rd march 1933","march 23 1933","23 march"],"answer":"23 March 1933"},{"id":"a2","s":"s3","q":"Where was the first concentration camp opened in March 1933?","accept":["dachau"],"answer":"Dachau"},{"id":"a3","s":"s4","q":"Who led the German Labour Front?","accept":["ley","robert ley"],"answer":"Robert Ley"},{"id":"a4","s":"s4","q":"What 1933 agreement did the Nazis make with the Vatican?","accept":["concordat","the concordat","reich concordat"],"answer":"The Concordat"},{"id":"a5","s":"s5","q":"Who ran the Four-Year Plan?","accept":["goring","göring","goering","hermann goring","hermann göring"],"answer":"Hermann Göring"},{"id":"a6","s":"s2","q":"Which historian described the 'dual state'?","accept":["fraenkel","ernst fraenkel","frankel"],"answer":"Ernst Fraenkel"}],"chronology":[{"id":"c1","title":"Put the steps to dictatorship in order","items":["Reichstag Fire Decree","Enabling Act","Trade unions abolished","One-party state","Night of the Long Knives","Hitler becomes Führer"]},{"id":"c2","title":"Put the persecution of Jews in order","items":["Boycott of Jewish shops","Jews excluded from the civil service","Nuremberg Laws","Kristallnacht"]}],"matching":[{"id":"x1","title":"Match the person to their role","pairs":[["Himmler","SS and police"],["Goebbels","Propaganda"],["Ley","German Labour Front"],["Schacht","Economics and Reichsbank"],["Göring","Four-Year Plan"]]}],"evidence":[{"id":"e1","s":"s1","q":"Give precise evidence that the Enabling Act was passed through intimidation as well as legal means.","keywords":[["sa","surround","communist","kpd","arrest","444","centre"]],"model":"SA men surrounded the Kroll Opera House, Communist deputies were arrested or in hiding, and the Centre Party was won over by promises; it passed 444–94."},{"id":"e2","s":"s5","q":"Give precise evidence about living standards under the Nazis.","keywords":[["real wage","wages","hours","butter","food","kdf","unemploy"]],"model":"Unemployment fell below 0.5 million, but real wages only slowly regained late-1920s levels and hours were longer; food choice was limited as rearmament took priority."},{"id":"e3","s":"s3","q":"Give precise evidence of the terror apparatus.","keywords":[["dachau","gestapo","sd","himmler","1936","protective custody","heydrich"]],"model":"Dachau opened in March 1933; Himmler became Chief of the German Police in June 1936; the Gestapo and Heydrich's SD watched for opponents; thousands held in protective custody."}]},"flashcards":[{"id":"f1","s":"s1","q":"Why did the Centre Party vote for the Enabling Act?","a":"Hitler promised to protect the Catholic Church's rights.","hint":"Church."},{"id":"f2","s":"s1","q":"Name three steps of Gleichschaltung in 1933.","a":"Reich governors over the states; unions abolished and DAF created; parties banned or dissolved; one-party law (14 July).","hint":"States, unions, parties."},{"id":"f3","s":"s1","q":"Why did Hitler purge the SA in 1934?","a":"To satisfy the army and big business, remove Röhm's 'second revolution' threat and secure the presidency after Hindenburg.","hint":"Army."},{"id":"f4","s":"s2","q":"Intentionalist vs structuralist — what's the difference?","a":"Intentionalists stress Hitler's plans and control; structuralists stress chaotic competition between agencies.","hint":"Hitler's will vs system."},{"id":"f5","s":"s2","q":"What is the 'dual state'?","a":"A normal legal 'normative state' alongside an arbitrary 'prerogative state' of party, SS and police.","hint":"Fraenkel."},{"id":"f6","s":"s3","q":"Give two of Goebbels's propaganda methods.","a":"Cheap People's Receiver radios; Nuremberg rallies; film (Triumph of the Will); control via the Reich Chamber of Culture; the 1936 Olympics.","hint":"Radio, rallies, film."},{"id":"f7","s":"s3","q":"What was the Confessing Church?","a":"Protestants, including Pastor Niemöller, who resisted Nazi control of the Protestant Church.","hint":"Niemöller."},{"id":"f8","s":"s4","q":"How did Nazi policy try to raise the birth rate?","a":"Marriage loans (1933) reduced for each child; the Mother's Cross (1938); propaganda for Kinder, Küche, Kirche.","hint":"Loans and medals."},{"id":"f9","s":"s4","q":"What did Strength through Joy offer?","a":"Cheap holidays, cruises, sport, theatre and a Volkswagen savings scheme.","hint":"Leisure."},{"id":"f10","s":"s4","q":"What did the Nuremberg Laws do?","a":"Removed Jews' citizenship and banned marriage and sexual relations between Jews and non-Jews.","hint":"Citizenship + marriage."},{"id":"f11","s":"s5","q":"Give three reasons unemployment fell after 1933.","a":"Public works (autobahns); Reich Labour Service; conscription and rearmament; women and Jews removed from the figures.","hint":"Roads, army, statistics."},{"id":"f12","s":"s5","q":"Why did Schacht resign in 1937?","a":"He disagreed with the cost and pace of rearmament under Göring's Four-Year Plan.","hint":"Guns vs balance sheets."}],"checklist":[{"id":"k1","level":"explain","text":"I can explain how the dictatorship was established in 1933–34 (Enabling Act, parties, unions, states).","sections":["s1"]},{"id":"k2","level":"judge","text":"I can assess the significance of the Night of the Long Knives and Hindenburg's death.","sections":["s1"]},{"id":"k3","level":"judge","text":"I can evaluate the nature of Nazi government, including Hitler's role and the dual state.","sections":["s2"]},{"id":"k4","level":"judge","text":"I can judge the extent of opposition and the roles of Goebbels and Himmler's terror apparatus.","sections":["s3"]},{"id":"k5","level":"explain","text":"I can explain the impact of Nazi policies on women, workers, youth, churches and Jews.","sections":["s4"]},{"id":"k6","level":"judge","text":"I can assess the significance of Schacht and Göring and the impact of economic policies.","sections":["s5"]}],"exam":{"questions":[{"id":"q1","qtype":"u1","label":"Past paper: WHI01/1C, May 2025, Q2","sections":["s1"],"q":"Historians differ in their judgements about the establishment of the Nazi dictatorship in the years 1933–34.\n‘In the years 1933–34, the main event in the establishment of the Nazi dictatorship was the Night of the Long Knives.’\nAssess this view using your own knowledge of the issue.","markscheme":null},{"id":"q2","qtype":"u1","label":"Past paper: WHI01/1C, May 2025, Q3","sections":["s4"],"q":"Historians differ in their judgements about the nature of Volksgemeinschaft in the years 1933–39.\n‘In the years 1933–39, education was the most significant feature in the creation of a Volksgemeinschaft in Germany.’\nAssess this view using your own knowledge of the issue.","markscheme":null},{"id":"q3","qtype":"u1","label":"From Pearson's WHI01 exemplar pack (January 2018)","sections":["s1"],"q":"Historians have different explanations for why the Nazis were able to establish a dictatorship in Germany in the years 1933–34.\n‘The impact of the Reichstag Fire was the main reason why the Nazis were able to establish a dictatorship in Germany in the years 1933–34.’\nAssess this view using your own knowledge of the issue.","mistakes":["Examiner comment on a Level 2 answer: the opening did not make clear what the question was about, and knowledge of the Reichstag Fire was relevant but insecure.","The same answer described other factors (Night of the Long Knives, Hindenburg's death) without explaining their importance or stating criteria for judgement.","Not focusing on the exact view in the opening paragraph","Considering other views only near the end of the essay","A conclusion that lists factors without showing why one is more significant"],"markscheme":null},{"id":"q4","qtype":"u1","label":"From Pearson's WHI01 exemplar pack (January 2018)","sections":["s4"],"q":"Historians differ in their judgements about the impact of Nazi policies on women in Germany in the years 1933–39.\n‘Nazi policies improved the life of women in Germany in the years 1933–39.’\nAssess this view using your own knowledge of the issue.","mistakes":["Examiner comment on a Level 1 answer: it described three areas of policy but never judged whether life 'improved' — the key word of the question.","Generalised statements without the detail expected in a depth study; weak chronology on women's employment.","Not focusing on the exact view in the opening paragraph"],"markscheme":null},{"id":"q5","qtype":"u1","label":"From your Germany model-answers deck","sections":["s1","s3"],"q":"Historians differ in their judgements on how the Nazis consolidated power.\n‘The Nazis were able to consolidate power 1933–36 because of repression.’\nAssess this view using your own knowledge of the issue.","model":[{"t":"Some historians argue that the Nazis consolidated power mainly through repression, whilst others stress legal methods such as the Enabling Act, the coordination of society and genuine popularity. In assessing consolidation in 1933–36, the criteria of scope and duration will be employed to argue that repression was most important, because it underpinned the other methods throughout the period.","n":"Introduction: both views, criteria, judgement — focused on the exact wording."},{"t":"Despite my judgement, it could be argued that legal processes were most important. The Enabling Act of 23 March 1933 gave the government power to make laws without the Reichstag, and Hindenburg's death in August 1934 let Hitler become Führer with the army's oath.","n":"Alternative view first, with precise evidence (acts, dates)."},{"t":"However, this argument is weak when judged by scope, because the 'legal' steps depended on repression: the Act passed only after the Reichstag Fire Decree had suspended civil liberties and while SA men surrounded the deputies. Thus we must assert that legality was the form, but repression the substance, of consolidation.","n":"Weakness against a criterion; sustained judgement linking the factors."}],"model_note":"Teacher-written model extract. The full student responses in your deck stay in class materials.","markscheme":null}]},"stretch":[{"id":"t1","kind":"Competing arguments","task":"Was Nazi Germany a 'chaotic polycracy' or a state efficient to the Führer's will? Use the Four-Year Plan and the SS as test cases."},{"id":"t2","kind":"Relative significance","task":"Rank terror, propaganda and material benefits (jobs, KdF) as reasons for the lack of opposition by 1939. Which ranking changes if you judge workers rather than the middle classes?"},{"id":"t3","kind":"Change and continuity","task":"How far did the Volksgemeinschaft change German society, and how far did class and religious loyalties survive?"},{"id":"t4","kind":"Evaluation","task":"Consent or coercion? Use the evidence about denunciations to argue that the line between them was blurred."}]},"y12-de-4":{"id":"y12-de-4","course":"y12","area":"de","kt":"Key topic 4","order":4,"title":"Germany at war, 1939–45","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following IAL key topic 4. Read-more references are to Layton, From Kaiser to Führer, ch. 14."},"learn":{"intro":"How did Nazi Germany organise its economy and control its people at war, how did the war become a racial war of genocide, and why did Germany lose? Questions here often ask you to weigh one reason — bombing, Speer, Hitler's mistakes — against others.","sections":[{"id":"s1","title":"1. Managing the war economy","blocks":[{"p":"Germany went to war short of oil, rubber and many metals, short of labour once millions were conscripted, and short of motor transport — the army that invaded the USSR in 1941 still relied heavily on horses. Production in 1939–41 was hampered by competing agencies, over-engineered weapons and the armed services' demands for custom designs."},{"p":"Fritz Todt became Minister of Armaments in 1940. After his death in a plane crash in February 1942, Albert Speer took over. Speer centralised planning, standardised designs, let industrialists run production committees and used mass-production methods; armaments output roughly tripled between early 1942 and mid-1944, despite bombing."},{"p":"Göring, as head of the Four-Year Plan and the Luftwaffe, lost influence through failures and inefficiency. Labour shortages were met above all with foreign workers and prisoners — about 7 million by 1944, many forced labourers treated brutally — rather than by fully mobilising German women, whom the regime was reluctant to conscript."},{"p":"German technological ingenuity was real — jet aircraft, the V-1 and V-2 rockets, synthetic fuel — but it often came too late, in too small numbers, or diverted scarce resources from weapons that could be mass-produced."}],"terms":["rationalisation","forced labour","total war economy","Speer's armaments miracle"],"evidence":["Todt Armaments Minister 1940–February 1942; Speer from February 1942.","Armaments output roughly tripled between 1942 and mid-1944.","About 7 million foreign workers and prisoners by 1944."],"refs":["Layton, ch. 14 §2"]},{"id":"s2","title":"2. Controlling the civilian population","blocks":[{"p":"Rationing began in August 1939. Living standards were cushioned in the early war years by plunder from occupied Europe, but rations were cut in 1942 and conditions worsened sharply as defeats mounted."},{"p":"Allied bombing intensified from 1942. The raids on Hamburg in July 1943 killed around 40,000 people; Dresden was devastated in February 1945. Millions of homes were destroyed and many civilians evacuated. Bombing hurt morale but did not produce the collapse the Allies hoped for."},{"p":"Goebbels sustained morale through radio, newsreels and films, and after Stalingrad proclaimed 'total war' in his Sportpalast speech of February 1943. Himmler, Interior Minister from August 1943, intensified repression: the People's Court handed down death sentences in rising numbers, and defeatism could be punished by death."},{"p":"Opposition grew but remained small and divided: the White Rose students in Munich (the Scholls, executed in 1943); the Edelweiss Pirates, some of whom were hanged in Cologne in 1944; Bishop von Galen's 1941 sermons against the murder of disabled people; the conservative Kreisau Circle; and the army officers' July Bomb Plot (20 July 1944), led by Stauffenberg, after which thousands were arrested and around 200 executed in direct connection."}],"terms":["total war","People's Court","White Rose","July Bomb Plot","Edelweiss Pirates"],"evidence":["August 1939: rationing.","July 1943: Hamburg raids, about 40,000 killed.","18 February 1943: 'total war' speech.","20 July 1944: Bomb Plot."],"refs":["Layton, ch. 14 §5–6"]},{"id":"s3","title":"3. The evolution of genocide","blocks":[{"p":"The conquest of Poland in 1939 brought about two million Jews under German rule. Himmler was made responsible for 'strengthening Germandom' — resettling ethnic Germans and expelling Poles and Jews. Jews were forced into ghettos such as Łódź and Warsaw (1940), where many died of starvation and disease."},{"p":"The invasion of the USSR (June 1941) was planned as a racial war of annihilation. Einsatzgruppen — SS mobile killing units — and police battalions shot Jews, communists and others in mass executions; hundreds of thousands were murdered in the first months, and millions of Soviet prisoners of war died of hunger and neglect."},{"p":"From late 1941 the regime moved to systematic murder by gas. The Wannsee Conference (20 January 1942), chaired by Heydrich, co-ordinated the 'Final Solution' across government agencies. Death camps — Chelmno, Belzec, Sobibor, Treblinka and Auschwitz-Birkenau — murdered millions. About six million Jews were killed in the Holocaust, along with Roma, disabled people and others."},{"p":"Historians debate whether genocide followed Hitler's long-held intention or evolved through 'cumulative radicalisation' as competing agencies, the war in the east and local initiatives escalated policy. Most now combine both: Hitler's ideology set the goal, the conditions of war shaped the timing and methods."}],"terms":["Einsatzgruppen","ghetto","Wannsee Conference","Final Solution","cumulative radicalisation"],"evidence":["1940: Łódź and Warsaw ghettos sealed.","June 1941: Operation Barbarossa; Einsatzgruppen killings.","20 January 1942: Wannsee Conference.","About six million Jews murdered."],"refs":["Layton, ch. 14 §3–4"]},{"id":"s4","title":"4. Losing the war","blocks":[{"p":"Balance of resources: once the USSR (June 1941) and the USA (December 1941) were at war with Germany, the Allies had far greater manpower, raw materials and industrial capacity. American and Soviet production of tanks and aircraft outstripped Germany's even at Speer's peak."},{"p":"Sea power: Allied navies blockaded Germany and kept Britain supplied. The U-boat campaign was defeated in the Battle of the Atlantic by May 1943, allowing American troops and supplies to cross for the invasions of Italy and France."},{"p":"Bombing: strategic bombing destroyed cities, transport and, in 1944, synthetic-oil plants. It also forced Germany to divert huge resources — fighters, anti-aircraft guns and soldiers — to air defence, a 'second front' in the air."},{"p":"Hitler's strategic mistakes: invading the USSR before defeating Britain; declaring war on the USA on 11 December 1941; refusing to allow retreats, most famously at Stalingrad, where the Sixth Army surrendered in February 1943; and diverting resources to prestige projects. Hitler killed himself on 30 April 1945 and Germany surrendered on 7–8 May."}],"terms":["balance of resources","Battle of the Atlantic","strategic bombing","Stalingrad"],"evidence":["22 June 1941: invasion of the USSR.","11 December 1941: Germany declares war on the USA.","February 1943: surrender at Stalingrad.","May 1943: U-boats withdrawn from the North Atlantic.","30 April 1945: Hitler's suicide; 8 May 1945: VE Day."],"refs":["Layton, ch. 14 §1 and §7"]}],"timeline":[{"date":"Aug 1939","event":"Rationing introduced"},{"date":"Sept 1939","event":"Invasion of Poland"},{"date":"1940","event":"Ghettos sealed in Łódź and Warsaw"},{"date":"22 June 1941","event":"Invasion of the USSR (Operation Barbarossa)"},{"date":"Aug 1941","event":"Bishop von Galen's sermons against the murder of disabled people"},{"date":"11 Dec 1941","event":"Germany declares war on the USA"},{"date":"20 Jan 1942","event":"Wannsee Conference"},{"date":"Feb 1942","event":"Speer replaces Todt as Armaments Minister"},{"date":"Feb 1943","event":"Surrender at Stalingrad; 'total war' speech; White Rose arrests"},{"date":"July 1943","event":"Hamburg firestorm"},{"date":"20 July 1944","event":"July Bomb Plot fails"},{"date":"30 April 1945","event":"Hitler's suicide"},{"date":"8 May 1945","event":"Germany's unconditional surrender takes effect"}],"people":[{"name":"Fritz Todt","role":"Armaments Minister 1940–42."},{"name":"Albert Speer","role":"Armaments Minister from 1942; raised production."},{"name":"Heinrich Himmler","role":"SS chief; Interior Minister from 1943; organiser of genocide."},{"name":"Reinhard Heydrich","role":"Chaired the Wannsee Conference."},{"name":"Joseph Goebbels","role":"Propaganda; 'total war' speech, 1943."},{"name":"Claus von Stauffenberg","role":"Planted the bomb on 20 July 1944."},{"name":"Hans and Sophie Scholl","role":"White Rose leaders, executed 1943."},{"name":"Clemens von Galen","role":"Bishop of Münster; preached against the murder of disabled people (1941)."}],"vocab":[{"term":"Total war","def":"Full mobilisation of society and economy for war."},{"term":"Einsatzgruppen","def":"SS mobile killing units in the east."},{"term":"Final Solution","def":"Nazi term for the planned murder of Europe's Jews."},{"term":"Cumulative radicalisation","def":"Policy becoming more extreme through competition and circumstances."},{"term":"Forced labour","def":"Foreign civilians and prisoners made to work for the German war economy."}],"misconceptions":[{"wrong":"Germany was fully mobilised for war from 1939.","right":"Full mobilisation came only from 1942–43; early production was inefficient."},{"wrong":"The Holocaust was planned in detail before the war.","right":"Persecution escalated through stages; systematic mass murder developed in 1941–42."},{"wrong":"Bombing destroyed German morale and caused collapse.","right":"It damaged morale and diverted resources, but the regime kept control until the end."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"Who replaced Todt as Armaments Minister in 1942?","options":["Göring","Speer","Schacht","Ley"],"answer":1,"why":"Speer centralised and rationalised production."},{"id":"m2","s":"s1","q":"How did Germany mainly meet labour shortages?","options":["Conscripting German women fully","Foreign workers and prisoners","Ending conscription","Automation"],"answer":1,"why":"About 7 million by 1944."},{"id":"m3","s":"s2","q":"What happened in February 1943?","options":["D-Day","Goebbels's 'total war' speech","Wannsee Conference","July Bomb Plot"],"answer":1,"why":"After Stalingrad — 18 February 1943."},{"id":"m4","s":"s2","q":"Who led the July Bomb Plot?","options":["Galen","Stauffenberg","Niemöller","Scholl"],"answer":1,"why":"Colonel Claus von Stauffenberg, 20 July 1944."},{"id":"m5","s":"s3","q":"What was decided at Wannsee in January 1942?","options":["The invasion of the USSR","Co-ordination of the Final Solution","Total war","Rationing"],"answer":1,"why":"Heydrich co-ordinated agencies for genocide."},{"id":"m6","s":"s3","q":"Who carried out mass shootings in the USSR from 1941?","options":["Einsatzgruppen","Hitler Youth","DAF","Volkssturm"],"answer":0,"why":"SS mobile killing units with police battalions."},{"id":"m7","s":"s4","q":"When did Germany declare war on the USA?","options":["September 1939","June 1941","December 1941","June 1944"],"answer":2,"why":"11 December 1941, after Pearl Harbor."},{"id":"m8","s":"s4","q":"Why was bombing a 'second front'?","options":["It opened a land front in France","It forced Germany to divert fighters, guns and men to air defence","It was in Italy","It was carried out by the USSR"],"answer":1,"why":"Huge resources went to defending the Reich."}],"short":[{"id":"a1","s":"s2","q":"Which student resistance group did the Scholls belong to?","accept":["white rose","the white rose","weisse rose"],"answer":"The White Rose"},{"id":"a2","s":"s2","q":"Which city suffered a firestorm in July 1943?","accept":["hamburg"],"answer":"Hamburg"},{"id":"a3","s":"s3","q":"Who chaired the Wannsee Conference?","accept":["heydrich","reinhard heydrich"],"answer":"Reinhard Heydrich"},{"id":"a4","s":"s4","q":"Where did the German Sixth Army surrender in February 1943?","accept":["stalingrad"],"answer":"Stalingrad"},{"id":"a5","s":"s1","q":"Who was Armaments Minister before Speer?","accept":["todt","fritz todt"],"answer":"Fritz Todt"}],"chronology":[{"id":"c1","title":"Put these events in order","items":["Invasion of Poland","Invasion of the USSR","War declared on the USA","Wannsee Conference","Surrender at Stalingrad","July Bomb Plot","Hitler's suicide"]}],"matching":[{"id":"x1","title":"Match the reason for defeat to its evidence","pairs":[["Balance of resources","USA and USSR outproduced Germany in tanks and aircraft"],["Sea power","U-boats defeated in the Atlantic by May 1943"],["Bombing","Fighters and anti-aircraft guns diverted to defend the Reich"],["Hitler's mistakes","'No retreat' at Stalingrad"]]}],"evidence":[{"id":"e1","s":"s1","q":"Give precise evidence of Speer's impact.","keywords":[["tripl","three","1942","1944","rationalis","standard","central"]],"model":"From February 1942 Speer centralised and standardised production; armaments output roughly tripled by mid-1944 despite bombing."},{"id":"e2","s":"s2","q":"Give precise evidence of opposition during the war.","keywords":[["white rose","scholl","stauffenberg","july","galen","edelweiss","kreisau"]],"model":"White Rose leaflets (executions 1943), Galen's sermons (1941), Edelweiss Pirates hanged in Cologne (1944), the July Bomb Plot (20 July 1944)."}]},"flashcards":[{"id":"f1","s":"s1","q":"Name three shortages that hampered the German war economy.","a":"Labour, raw materials (oil, rubber, metals) and motor transport.","hint":"Men, materials, motors."},{"id":"f2","s":"s1","q":"What did Speer change?","a":"Central planning, standardised designs, industrialists' committees, mass production — output roughly tripled 1942–44.","hint":"Rationalisation."},{"id":"f3","s":"s1","q":"Why didn't the regime fully mobilise German women?","a":"Ideology (women's place in the home) and fear of damaging morale; it used foreign forced labour instead.","hint":"Kinder, Küche, Kirche."},{"id":"f4","s":"s2","q":"How did Goebbels respond to Stalingrad?","a":"The 'total war' speech (February 1943) calling for full mobilisation.","hint":"Sportpalast."},{"id":"f5","s":"s2","q":"How did repression intensify after 1943?","a":"Himmler became Interior Minister; more People's Court death sentences; defeatism punished by death.","hint":"Himmler."},{"id":"f6","s":"s3","q":"What role did Himmler play in genocide?","a":"Head of the SS and police, organising resettlement, the Einsatzgruppen and the death camps.","hint":"SS."},{"id":"f7","s":"s3","q":"Intention or radicalisation — the Holocaust debate?","a":"Intentionalists: Hitler's long-held plan. Functionalists: escalation through war, competing agencies and local initiative. Most combine both.","hint":"Plan vs process."},{"id":"f8","s":"s4","q":"Give two of Hitler's strategic mistakes.","a":"Invading the USSR in 1941; declaring war on the USA; 'no retreat' orders at Stalingrad.","hint":"East, west, retreat."},{"id":"f9","s":"s4","q":"Why did sea power matter to Germany's defeat?","a":"Blockade starved Germany of resources; U-boat defeat in 1943 let US troops and supplies cross the Atlantic.","hint":"Atlantic."},{"id":"f10","s":"s2","q":"What happened on 20 July 1944?","a":"Stauffenberg's bomb failed to kill Hitler; thousands arrested, around 200 executed in direct connection.","hint":"Wolf's Lair."}],"checklist":[{"id":"k1","level":"explain","text":"I can explain the impact of shortages and the roles of Göring, Todt and Speer.","sections":["s1"]},{"id":"k2","level":"judge","text":"I can assess the impact of living standards and bombing, and the roles of Goebbels and Himmler.","sections":["s2"]},{"id":"k3","level":"judge","text":"I can judge the nature and extent of wartime opposition.","sections":["s2"]},{"id":"k4","level":"explain","text":"I can explain how genocide evolved, including the role of conquest in the east and of Himmler.","sections":["s3"]},{"id":"k5","level":"judge","text":"I can reach a judgement on the main reason for Germany's defeat.","sections":["s4"]}],"exam":{"questions":[{"id":"q1","qtype":"u1","label":"Past paper: WHI01/1C, May 2025, Q4","sections":["s2"],"q":"Historians differ in their judgements about Nazi control of the German civilian population in the years 1939–45.\n‘The Nazis were able to completely control the German civilian population in the years 1939–45.’\nAssess this view using your own knowledge of the issue.","markscheme":null},{"id":"q2","qtype":"u1","label":"Teacher-created practice question","sections":["s4","s1"],"q":"Historians differ in their judgements about the reasons for Germany's defeat in the Second World War.\n‘Germany was defeated in the years 1941–45 mainly because of Hitler's strategic mistakes.’\nAssess this view using your own knowledge of the issue.","markscheme":null}]},"stretch":[{"id":"t1","kind":"Competing arguments","task":"Was Speer's 'armaments miracle' a miracle at all? Consider what had been wasted before 1942 and the role of forced labour."},{"id":"t2","kind":"Relative significance","task":"Was the war lost in the factories or on the battlefield? Compare the balance of resources with Hitler's mistakes using effectiveness and impact."},{"id":"t3","kind":"Evaluation","task":"How can historians explain why so many ordinary Germans continued to work and fight until 1945?"}]},"y13-cr-1":{"id":"y13-cr-1","course":"y13","area":"cr","kt":"Key topic 1","order":1,"title":"'Free at last', 1865–77","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following IAL Unit 3 Option 1D key topic 1 (specification Issue 6)."},"learn":{"intro":"Emancipation freed about four million people. Reconstruction brought citizenship, the vote and black officeholders — and then a violent backlash and the federal government's retreat in 1877. Section B questions often compare this period with 1883–c1900 or 1933–45.","sections":[{"id":"s1","title":"1. The Thirteenth Amendment and the realities of freedom","blocks":[{"p":"The Thirteenth Amendment (ratified December 1865) abolished slavery throughout the United States, except as punishment for a crime. About four million people were freed."},{"p":"Economic position: freedpeople wanted land. General Sherman's Field Order No. 15 (January 1865) set aside coastal land in South Carolina and Georgia for black families, but President Andrew Johnson restored most confiscated land to former owners in 1865. Without land or capital, most freedpeople became wage labourers or sharecroppers — farming a landowner's land for a share of the crop — and the crop-lien system tied them to debt with local merchants."},{"p":"Freedom of movement mattered enormously: people travelled to find family members separated by sale, moved to towns, and left plantations. Black churches became independent centres of community life."},{"p":"Education: the Freedmen's Bureau (March 1865), northern missionary societies and black communities themselves set up schools; colleges such as Fisk (1866) and Howard (1867) were founded. Literacy was valued as a mark of freedom. White Southerners often met these changes with hostility and violence."}],"terms":["Thirteenth Amendment","Freedmen's Bureau","sharecropping","crop-lien system","freedpeople"],"evidence":["December 1865: Thirteenth Amendment ratified.","About 4 million people freed.","March 1865: Freedmen's Bureau created.","Fisk (1866) and Howard (1867) universities founded."]},{"id":"s2","title":"2. Johnson's response and the political settlement","blocks":[{"p":"Andrew Johnson, a Southern Democrat who became President after Lincoln's assassination in April 1865, offered lenient terms: pardons for most Confederates, and readmission once states abolished slavery and renounced secession. He showed no interest in black political rights."},{"p":"Southern legislatures passed Black Codes (1865–66) — for example in Mississippi and South Carolina — controlling black workers through vagrancy laws, annual labour contracts and restrictions on property and movement. Johnson vetoed the renewal of the Freedmen's Bureau and the Civil Rights Act of 1866; Congress overrode him. Riots in Memphis and New Orleans in 1866 killed dozens of black people and turned northern opinion towards the Radical Republicans in the 1866 elections."}],"terms":["Presidential Reconstruction","Black Codes","Radical Republicans","veto"],"evidence":["April 1865: Johnson becomes President.","1865–66: Black Codes.","1866: Civil Rights Act passed over Johnson's veto.","1866: Memphis and New Orleans riots."]},{"id":"s3","title":"3. Radical Reconstruction, 1867–77","blocks":[{"p":"The Reconstruction Acts (1867) divided ten southern states into five military districts and required them to write new constitutions with black male suffrage and to ratify the Fourteenth Amendment before readmission. Johnson's opposition led to his impeachment (1868); he was acquitted by one vote."},{"p":"The Fourteenth Amendment (1868) made all people born in the USA citizens and promised 'equal protection of the laws'. The Fifteenth Amendment (1870) banned denying the vote on grounds of 'race, color, or previous condition of servitude'. The Enforcement Acts (1870–71), including the Ku Klux Klan Act, let President Grant use federal force; in 1871 he suspended habeas corpus in parts of South Carolina. The Civil Rights Act of 1875 banned discrimination in public accommodations."},{"p":"Black Americans held office in large numbers for the first time: Hiram Revels (1870) and Blanche K. Bruce (1875) of Mississippi sat in the US Senate, black representatives sat in Congress, and hundreds served in state legislatures. Their presence showed what political rights could achieve — and provoked fierce white resistance."}],"terms":["Radical Reconstruction","Fourteenth Amendment","Fifteenth Amendment","Enforcement Acts","Civil Rights Act 1875"],"evidence":["1867: Reconstruction Acts — five military districts.","1868: Fourteenth Amendment.","1870: Fifteenth Amendment; Hiram Revels enters the Senate.","1871: Ku Klux Klan Act.","1875: Civil Rights Act."]},{"id":"s4","title":"4. The backlash and the end of Reconstruction","blocks":[{"p":"The Ku Klux Klan, founded in Tennessee in 1865–66, used terror against black voters, officeholders, teachers and their white allies. After the Enforcement Acts weakened the Klan, paramilitary groups such as the White League in Louisiana (1874) and the Red Shirts acted openly. At Colfax, Louisiana (April 1873), dozens of black men were massacred after a disputed election."},{"p":"Northern commitment faded: the economic depression after the Panic of 1873, corruption scandals and racism made voters tired of Reconstruction. The Supreme Court narrowed federal protection in the Slaughterhouse Cases (1873) and US v Cruikshank (1876). Democrats 'redeemed' one southern state after another, using violence and fraud, as in the 'Mississippi Plan' of 1875."},{"p":"The disputed presidential election of 1876 was resolved by the Compromise of 1877: Republican Rutherford B. Hayes became President and the last federal troops were withdrawn from the South. Reconstruction ended, leaving the amendments on paper but black rights in the South largely unprotected."}],"terms":["Ku Klux Klan","White League","Redemption","Compromise of 1877","lynching"],"evidence":["April 1873: Colfax massacre.","1874: White League formed.","1876: US v Cruikshank.","1877: Compromise; federal troops withdrawn."]}],"timeline":[{"date":"Jan 1865","event":"Sherman's Field Order No. 15"},{"date":"March 1865","event":"Freedmen's Bureau created"},{"date":"April 1865","event":"Lincoln assassinated; Johnson becomes President"},{"date":"Dec 1865","event":"Thirteenth Amendment ratified"},{"date":"1865–66","event":"Black Codes passed in southern states"},{"date":"1866","event":"Civil Rights Act passed over Johnson's veto"},{"date":"1867","event":"Reconstruction Acts: military districts"},{"date":"1868","event":"Fourteenth Amendment ratified; Johnson impeached"},{"date":"1870","event":"Fifteenth Amendment; Hiram Revels first black US Senator"},{"date":"1871","event":"Ku Klux Klan Act"},{"date":"April 1873","event":"Colfax massacre"},{"date":"1875","event":"Civil Rights Act (public accommodations)"},{"date":"1877","event":"Compromise of 1877; end of Reconstruction"}],"people":[{"name":"Andrew Johnson","role":"President 1865–69; lenient Presidential Reconstruction; impeached 1868."},{"name":"Ulysses S. Grant","role":"President 1869–77; enforced the Klan Act."},{"name":"Thaddeus Stevens and Charles Sumner","role":"Leading Radical Republicans in Congress."},{"name":"Hiram Revels","role":"First black US Senator (Mississippi, 1870)."},{"name":"Blanche K. Bruce","role":"Black US Senator for Mississippi from 1875."},{"name":"Rutherford B. Hayes","role":"President from 1877; withdrew federal troops."}],"vocab":[{"term":"Reconstruction","def":"Rebuilding the Union and defining freedpeople's rights, 1865–77."},{"term":"Black Codes","def":"Southern laws of 1865–66 controlling black labour and movement."},{"term":"Sharecropping","def":"Farming land for a share of the crop, often trapping families in debt."},{"term":"Redemption","def":"White Democrats regaining control of southern states."},{"term":"Habeas corpus","def":"The right not to be held without trial; suspended by Grant in parts of South Carolina."}],"misconceptions":[{"wrong":"Freedpeople received '40 acres and a mule'.","right":"A small number briefly received land under Sherman's order, but Johnson returned most of it to former owners."},{"wrong":"Reconstruction achieved nothing.","right":"It produced lasting constitutional amendments, black schools and churches, and hundreds of black officeholders — even though protection collapsed after 1877."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"What did the Thirteenth Amendment do?","options":["Gave black men the vote","Abolished slavery","Made freedpeople citizens","Banned segregation"],"answer":1,"why":"Ratified December 1865."},{"id":"m2","s":"s1","q":"Why did most freedpeople become sharecroppers?","options":["They preferred it","Johnson returned confiscated land to former owners, leaving them without land","The Freedmen's Bureau required it","The Fifteenth Amendment required it"],"answer":1,"why":"Without land or capital there were few alternatives."},{"id":"m3","s":"s2","q":"What were the Black Codes?","options":["Federal civil rights laws","Southern laws controlling black workers' labour and movement","Klan rules","Union army orders"],"answer":1,"why":"Passed 1865–66 under Presidential Reconstruction."},{"id":"m4","s":"s3","q":"What did the Reconstruction Acts of 1867 do?","options":["Withdrew troops","Divided the South into five military districts","Ended the Freedmen's Bureau","Created the KKK"],"answer":1,"why":"Readmission required black male suffrage and ratifying the Fourteenth Amendment."},{"id":"m5","s":"s3","q":"Which amendment promised 'equal protection of the laws'?","options":["Thirteenth","Fourteenth","Fifteenth","First"],"answer":1,"why":"Ratified 1868."},{"id":"m6","s":"s4","q":"What happened at Colfax in 1873?","options":["A black convention","A massacre of black men after a disputed election","A Supreme Court case","The end of Reconstruction"],"answer":1,"why":"One of the bloodiest episodes of Reconstruction violence."},{"id":"m7","s":"s4","q":"What did the Compromise of 1877 involve?","options":["Hayes became President and federal troops left the South","The Fifteenth Amendment","Johnson's impeachment","The Civil Rights Act"],"answer":0,"why":"It ended Reconstruction."}],"short":[{"id":"a1","s":"s3","q":"Who was the first black US Senator?","accept":["revels","hiram revels","hiram rhodes revels"],"answer":"Hiram Revels"},{"id":"a2","s":"s3","q":"In what year was the Fifteenth Amendment ratified?","accept":["1870"],"answer":"1870"},{"id":"a3","s":"s2","q":"Which President was impeached in 1868?","accept":["johnson","andrew johnson"],"answer":"Andrew Johnson"},{"id":"a4","s":"s4","q":"Which Louisiana paramilitary group formed in 1874?","accept":["white league","the white league"],"answer":"The White League"},{"id":"a5","s":"s1","q":"Which federal agency set up schools for freedpeople from 1865?","accept":["freedmens bureau","freedmen's bureau","the freedmens bureau","freedmen bureau"],"answer":"The Freedmen's Bureau"}],"chronology":[{"id":"c1","title":"Put these in order","items":["Thirteenth Amendment","Black Codes","Reconstruction Acts","Fourteenth Amendment","Fifteenth Amendment","Civil Rights Act 1875","Compromise of 1877"]}],"matching":[{"id":"x1","title":"Match the measure to what it did","pairs":[["Thirteenth Amendment","Abolished slavery"],["Fourteenth Amendment","Citizenship and equal protection"],["Fifteenth Amendment","Banned racial bars to voting"],["Klan Act 1871","Federal force against Klan violence"],["Civil Rights Act 1875","Equal access to public accommodations"]]}],"evidence":[{"id":"e1","s":"s3","q":"Give precise evidence of black political gains in Reconstruction.","keywords":[["revels","bruce","senat","legislature","fifteenth","1870","office"]],"model":"Hiram Revels (1870) and Blanche K. Bruce (1875) sat in the US Senate; black representatives sat in Congress and hundreds in state legislatures, after the Fifteenth Amendment (1870)."},{"id":"e2","s":"s4","q":"Give precise evidence of the federal retreat from Reconstruction.","keywords":[["1877","hayes","troops","cruikshank","slaughterhouse","1873"]],"model":"The Slaughterhouse Cases (1873) and US v Cruikshank (1876) narrowed federal protection; the Compromise of 1877 withdrew the last federal troops."}]},"flashcards":[{"id":"f1","s":"s1","q":"How did the economic position of ex-slaves change after 1865?","a":"Free but landless: most became wage labourers or sharecroppers, often trapped in debt by the crop-lien system.","hint":"Free but poor."},{"id":"f2","s":"s1","q":"Give two social opportunities of freedom.","a":"Reuniting families; independent black churches; schools and colleges; freedom to move.","hint":"Family, church, school."},{"id":"f3","s":"s2","q":"Why did Johnson's policies anger Radical Republicans?","a":"Lenient pardons, no black rights, tolerance of Black Codes, vetoes of the Freedmen's Bureau and Civil Rights Act 1866.","hint":"Veto."},{"id":"f4","s":"s3","q":"What was the significance of black officeholders in Reconstruction?","a":"Proved black political participation was possible and effective; provoked violent white backlash.","hint":"Revels, Bruce."},{"id":"f5","s":"s3","q":"How did Grant fight the Klan?","a":"Enforcement Acts and the Klan Act (1871); suspended habeas corpus in parts of South Carolina; federal prosecutions.","hint":"1871."},{"id":"f6","s":"s4","q":"Give three reasons Reconstruction ended.","a":"White violence (Klan, White League); northern fatigue after the Panic of 1873; Supreme Court rulings; Compromise of 1877.","hint":"Violence, North, Court."},{"id":"f7","s":"s4","q":"What was 'Redemption'?","a":"White Democrats regaining control of southern states, often by violence and fraud.","hint":"Democrats."},{"id":"f8","s":"s3","q":"What did the Civil Rights Act of 1875 promise?","a":"Equal access to inns, public transport and theatres — struck down by the Supreme Court in 1883.","hint":"Public accommodations."}],"checklist":[{"id":"k1","level":"explain","text":"I can explain the reasons for, and impact of, the Thirteenth Amendment, including sharecropping.","sections":["s1"]},{"id":"k2","level":"explain","text":"I can explain the social and educational opportunities of freedom and the tensions they caused.","sections":["s1"]},{"id":"k3","level":"judge","text":"I can assess Johnson's response and the need for a political settlement.","sections":["s2"]},{"id":"k4","level":"judge","text":"I can assess the significance of the Fourteenth and Fifteenth Amendments, the 1875 Act and black officeholders.","sections":["s3"]},{"id":"k5","level":"judge","text":"I can judge the impact of the Klan, the White League and Democrat 'Redemption' on the end of Reconstruction.","sections":["s4"]}],"exam":{"questions":[{"id":"q1","qtype":"u3b","label":"Teacher-created practice question","sections":["s3","s4"],"q":"‘The actions of the federal government were the main reason for the advancement of black civil rights in the years 1865–77 and 1954–68.’\nHow far do you agree with this statement?","markscheme":null}]},"stretch":[{"id":"t1","kind":"Competing arguments","task":"'Reconstruction was a splendid failure.' Argue for and against this phrase using political, economic and educational evidence."},{"id":"t2","kind":"Causal links","task":"How did economic dependence (sharecropping) make political rights harder to defend after 1870?"},{"id":"t3","kind":"Relative significance","task":"Which ended Reconstruction more: southern violence or northern indifference? Use duration and impact."}]},"y13-cr-2":{"id":"y13-cr-2","course":"y13","area":"cr","kt":"Key topic 2","order":2,"title":"The triumph of 'Jim Crow', 1883–c1900","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following IAL Unit 3 Option 1D key topic 2. Section A sources are real documents with checked provenance, shortened."},"learn":{"intro":"Between 1883 and about 1900 the Supreme Court removed federal protection, southern states built a legal system of segregation, and black men were stripped of the vote. How did black Americans respond?","sections":[{"id":"s1","title":"1. The role of the Supreme Court","blocks":[{"p":"The Civil Rights Cases (1883) struck down the public-accommodation sections of the Civil Rights Act of 1875 by eight votes to one. The Court ruled that the Fourteenth Amendment restricted discrimination by states, not by private individuals and businesses. Justice John Marshall Harlan dissented."},{"p":"Plessy v Ferguson (1896) upheld Louisiana's Separate Car Act of 1890. Homer Plessy, who was seven-eighths white, deliberately sat in a whites-only carriage in 1892 to test the law. The Court ruled 7–1 that 'separate but equal' facilities did not breach the Fourteenth Amendment. Harlan again dissented. Plessy gave constitutional approval to segregation until 1954."},{"p":"Williams v Mississippi (1898) upheld Mississippi's poll tax and literacy test because the laws did not mention race on their face — even though they were designed to exclude black voters. Cumming v Richmond County Board of Education (1899) allowed a Georgia county to close its black high school while keeping white schools open, showing that 'equal' would not be enforced."}],"terms":["Civil Rights Cases","separate but equal","state action","Plessy v Ferguson"],"evidence":["1883: Civil Rights Cases, 8–1.","1896: Plessy v Ferguson, 7–1; Harlan dissents.","1898: Williams v Mississippi.","1899: Cumming v Richmond County Board of Education."]},{"i
