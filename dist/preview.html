."}],"terms":["shield wall","housecarl","fyrd","feigned retreat","Senlac"],"evidence":["Battle of Hastings: 14 October 1066, lasted most of the day.","Harold's brothers Gyrth and Leofwine were also killed.","The Bayeux Tapestry shows William lifting his helmet to show he was alive."]},{"id":"s5","title":"5. Explaining William's victory","blocks":[{"p":"Historians group the reasons for William's victory into factors. Your job is not just to list them but to show how they link together and decide which mattered most."},{"ul":["William's leadership and preparation — a well-organised invasion force, ships, horses, papal support, and calm leadership during the battle (showing his face when rumours spread).","Norman army and tactics — a mix of archers, infantry and cavalry that could attack in different ways; possibly feigned retreats.","Harold's decisions — fighting quickly instead of waiting for more troops; possibly reacting to the raids on his lands.","English weaknesses — tired troops after Stamford Bridge; parts of the fyrd breaking the shield wall to chase the enemy.","Luck — the wind delaying William until Harold was in the north; Hardrada invading first; Harold being killed at a key moment."]},{"p":"Factors interact. For example, Hardrada's invasion was luck for William, but it only helped because Harold then rushed back south (a decision) with exhausted men (a weakness)."}],"terms":["factor","significance","judgement","interaction"],"evidence":["Three-day gap: Stamford Bridge (25 Sept) and William's landing (28 Sept).","English broke ranks to chase retreating Bretons.","Harold's death late in the day ended English resistance."]},{"id":"s6","title":"6. How do we know? The sources","blocks":[{"p":"Almost everything we know about 1066 comes from a small number of sources, most written by or for the winners. Always ask: who made it, when, and why?"},{"sources":true}],"terms":["source","provenance","bias","chronicle","reliability"],"evidence":["The Bayeux Tapestry was probably made in the 1070s, likely for Bishop Odo, William's half-brother.","William of Poitiers was William's chaplain."]},{"id":"s7","title":"7. After the battle","blocks":[{"p":"Victory at Hastings did not immediately make William king. In London the Witan chose Edgar Ætheling. William marched around London, burning land as he went, until the English leaders — including Edgar — submitted to him at Berkhamsted."},{"p":"William was crowned in Westminster Abbey on Christmas Day, 25 December 1066. It took years more fighting before the Normans fully controlled England."}],"terms":["submit","coronation"],"evidence":["William crowned 25 December 1066, Westminster Abbey."]}],"timeline":[{"date":"c.1051","event":"According to Norman writers, Edward promises the throne to William."},{"date":"c.1064","event":"Harold visits Normandy; Norman sources say he swears an oath to support William."},{"date":"5 Jan 1066","event":"Edward the Confessor dies without children."},{"date":"6 Jan 1066","event":"Harold Godwinson crowned king."},{"date":"Apr 1066","event":"Halley's Comet seen across Europe — later shown as an omen on the Bayeux Tapestry."},{"date":"Summer 1066","event":"Harold's army guards the south coast; William gathers his fleet."},{"date":"Early Sept 1066","event":"Harold sends his southern army home as supplies run low."},{"date":"20 Sept 1066","event":"Battle of Fulford: Hardrada and Tostig defeat Edwin and Morcar."},{"date":"25 Sept 1066","event":"Battle of Stamford Bridge: Harold defeats and kills Hardrada and Tostig."},{"date":"28 Sept 1066","event":"William lands at Pevensey."},{"date":"14 Oct 1066","event":"Battle of Hastings: Harold killed; William wins."},{"date":"25 Dec 1066","event":"William crowned at Westminster Abbey."}],"people":[{"name":"Edward the Confessor","role":"King of England 1042–1066. Died childless, triggering the succession crisis."},{"name":"Harold Godwinson","role":"Earl of Wessex, crowned January 1066. Won at Stamford Bridge; killed at Hastings."},{"name":"William, Duke of Normandy","role":"Claimed Edward promised him the throne. Invaded and won at Hastings; crowned Christmas Day 1066."},{"name":"Harald Hardrada","role":"King of Norway. Invaded the north; killed at Stamford Bridge."},{"name":"Tostig Godwinson","role":"Harold's exiled brother who joined Hardrada; killed at Stamford Bridge."},{"name":"Edgar Ætheling","role":"Edward's teenage great-nephew; chosen by the Witan after Hastings but submitted to William."},{"name":"Edwin and Morcar","role":"Northern earls defeated at Fulford."},{"name":"Bishop Odo of Bayeux","role":"William's half-brother; probably commissioned the Bayeux Tapestry."},{"name":"Pope Alexander II","role":"Gave William a papal banner, signalling support for the invasion."}],"vocab":[{"term":"Succession","def":"Who takes over as ruler next."},{"term":"Claimant","def":"A person who says they have the right to something — here, the throne."},{"term":"Witan","def":"The council of leading nobles and churchmen who advised the king and helped choose a new one."},{"term":"Earl","def":"A powerful Anglo-Saxon noble who governed a large region."},{"term":"Housecarl","def":"A professional, full-time soldier serving the king or an earl."},{"term":"Fyrd","def":"Part-time soldiers called up from the local area in times of war."},{"term":"Shield wall","def":"A line of soldiers standing close with overlapping shields to block attacks."},{"term":"Cavalry","def":"Soldiers who fight on horseback — the Norman knights."},{"term":"Feigned retreat","def":"Pretending to run away to trick the enemy into chasing and breaking formation."},{"term":"Papal banner","def":"A flag sent by the Pope to show the Church's support."},{"term":"Provenance","def":"Where a source comes from: who made it, when and why."},{"term":"Factor","def":"One reason or cause that helps explain an event."}],"misconceptions":[{"wrong":"The battle was fought in the town of Hastings.","right":"It was fought on a ridge about seven miles away, where the town of Battle now stands."},{"wrong":"Harold definitely died from an arrow in the eye.","right":"The Bayeux Tapestry is ambiguous and may have been altered by later repairs; one early account describes Harold being cut down by knights. We cannot be certain."},{"wrong":"The English army was just untrained peasants.","right":"The housecarls were highly trained professional soldiers. The fyrd was part-time, but many were experienced."},{"wrong":"William won quickly and easily.","right":"The battle lasted most of the day and could have gone either way."},{"wrong":"William became king as soon as the battle ended.","right":"The Witan chose Edgar Ætheling first; William was crowned on 25 December after the English leaders submitted."},{"wrong":"The Normans were simply 'the French'.","right":"Normandy was a duchy whose rulers descended from Viking settlers. The duke owed loyalty to the French king but acted largely independently."}],"sources":[{"id":"bayeux","title":"The Bayeux Tapestry","type":"Embroidered cloth (about 70 metres long)","date":"Probably 1070s","origin":"Probably commissioned by Bishop Odo of Bayeux, William's half-brother; likely embroidered in England.","purpose":"To tell the Norman story of 1066 and justify William's conquest — it emphasises Harold's oath.","usefulness":"Detailed images of weapons, ships and armour. Shows the Norman point of view; some scenes were restored centuries later."},{"id":"poitiers","title":"William of Poitiers, 'The Deeds of William' (Gesta Guillelmi)","type":"Written history (Latin)","date":"c.1071–1077","origin":"Written by William's own chaplain, a Norman who had once been a soldier. He was not at the battle.","purpose":"To praise William and show his claim was rightful.","usefulness":"The fullest early account of the battle, including the feigned retreats — but strongly pro-William."},{"id":"asc","title":"The Anglo-Saxon Chronicle","type":"Year-by-year record (Old English)","date":"Entries written during and after 1066; several versions","origin":"Kept by English monks in different monasteries.","purpose":"To record important events each year.","usefulness":"An English point of view; brief on the battle itself; different versions sometimes disagree."},{"id":"carmen","title":"The Song of the Battle of Hastings (Carmen de Hastingae Proelio)","type":"Latin poem","date":"Possibly c.1067 — the date and author are debated","origin":"Often linked to Guy, Bishop of Amiens.","purpose":"To celebrate William's victory in verse.","usefulness":"Possibly the earliest account; gives a different description of Harold's death. Poetic and uncertain in date."}],"figure":"hastings-route"},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"When did Edward the Confessor die?","options":["5 January 1066","14 October 1066","25 December 1066","25 September 1066"],"answer":0,"why":"Edward died on 5 January 1066; Harold was crowned the next day."},{"id":"m2","s":"s1","q":"What was the Witan?","options":["Harold's personal bodyguard","A council of leading nobles and churchmen","A Norman type of castle","The Pope's messengers"],"answer":1,"why":"The Witan advised the king and backed Harold as Edward's successor."},{"id":"m3","s":"s1","q":"Which claimant was Edward's closest blood relative?","options":["Harold Godwinson","William of Normandy","Edgar Ætheling","Harald Hardrada"],"answer":2,"why":"Edgar was Edward's great-nephew, but he was a teenager without an army or powerful backers."},{"id":"m4","s":"s1","q":"What did Norman writers claim Harold did in Normandy around 1064?","options":["Married William's daughter","Swore an oath to support William","Fought a battle against William","Was crowned by the Pope"],"answer":1,"why":"The oath gave William a reason to call Harold an oath-breaker — useful propaganda."},{"id":"m5","s":"s2","q":"Who joined Harald Hardrada's invasion?","options":["Edwin","Tostig","Odo","Edgar"],"answer":1,"why":"Tostig was Harold's exiled brother."},{"id":"m6","s":"s2","q":"What happened at Stamford Bridge on 25 September 1066?","options":["William landed in England","Harold defeated Hardrada","Edwin and Morcar were defeated","William was crowned"],"answer":1,"why":"Harold surprised the Norwegians; Hardrada and Tostig were killed."},{"id":"m7","s":"s3","q":"Where did William land on 28 September 1066?","options":["Dover","York","Pevensey","London"],"answer":2,"why":"Pevensey, on the Sussex coast — three days after Stamford Bridge."},{"id":"m8","s":"s3","q":"Why was the papal banner useful to William?","options":["It protected him from arrows","It showed the Church backed his cause, helping recruitment","It was a signal for his ships","It made the English surrender"],"answer":1,"why":"Church support made the invasion look just and encouraged men to join."},{"id":"m9","s":"s4","q":"Who were the housecarls?","options":["Norman archers","Part-time English farmers","Professional English soldiers","Viking sailors"],"answer":2,"why":"Housecarls were full-time, well-trained soldiers — often with two-handed axes."},{"id":"m10","s":"s4","q":"Where did the English army stand at the start of the battle?","options":["In a castle","On top of a ridge","On the beach","Inside Hastings town"],"answer":1,"why":"Harold's shield wall held the high ground, forcing the Normans to attack uphill."},{"id":"m11","s":"s4","q":"What is a feigned retreat?","options":["Running away for real","Pretending to flee to draw the enemy out","Retreating to get more arrows","A surrender"],"answer":1,"why":"Norman writers say this pulled English soldiers out of the shield wall. Historians debate how far it was planned."},{"id":"m12","s":"s4","q":"Why did William lift his helmet during the battle?","options":["To surrender","To cool down","To show his men he was alive","To signal a retreat"],"answer":2,"why":"A rumour of his death was spreading panic; showing his face steadied his army."},{"id":"m13","s":"s5","q":"Which is the best example of LUCK helping William?","options":["Building a fleet","The wind delaying him until Harold went north","Using archers","Getting a papal banner"],"answer":1,"why":"The timing was outside William's control and left the south coast undefended."},{"id":"m14","s":"s6","q":"Who probably commissioned the Bayeux Tapestry?","options":["Harold Godwinson","Bishop Odo","Edgar Ætheling","Harald Hardrada"],"answer":1,"why":"Odo was William's half-brother — so the Tapestry shows the Norman point of view."},{"id":"m15","s":"s7","q":"When was William crowned?","options":["14 October 1066","25 December 1066","6 January 1066","1 January 1067"],"answer":1,"why":"Christmas Day 1066, Westminster Abbey."}],"short":[{"id":"a1","s":"s1","q":"Which powerful earl was crowned king the day after Edward died?","accept":["harold","harold godwinson","harold godwineson","harold ii","king harold"],"answer":"Harold Godwinson"},{"id":"a2","s":"s1","q":"Name the King of Norway who claimed the throne.","accept":["harald hardrada","hardrada","harald","harold hardrada","harald sigurdsson"],"answer":"Harald Hardrada"},{"id":"a3","s":"s2","q":"In which battle did the northern earls Edwin and Morcar lose to Hardrada?","accept":["fulford","battle of fulford","gate fulford","fulford gate"],"answer":"The Battle of Fulford"},{"id":"a4","s":"s2","q":"Which city surrendered to Hardrada after Fulford?","accept":["york"],"answer":"York"},{"id":"a5","s":"s3","q":"Which Pope sent William a banner?","accept":["alexander","alexander ii","alexander 2","pope alexander","pope alexander ii"],"answer":"Pope Alexander II"},{"id":"a6","s":"s4","q":"What name do we give to English part-time soldiers?","accept":["fyrd","the fyrd","fyrdmen"],"answer":"The fyrd"},{"id":"a7","s":"s4","q":"What defensive formation did the English use?","accept":["shield wall","shieldwall","a shield wall","the shield wall"],"answer":"A shield wall"},{"id":"a8","s":"s4","q":"Name one of Harold's brothers killed at Hastings.","accept":["gyrth","leofwine"],"answer":"Gyrth or Leofwine"},{"id":"a9","s":"s6","q":"William of Poitiers had a job working for William. What was it?","accept":["chaplain","priest","his chaplain","williams chaplain"],"answer":"Chaplain (priest)"},{"id":"a10","s":"s7","q":"Where was William crowned?","accept":["westminster abbey","westminster","westminister abbey","westminster abby"],"answer":"Westminster Abbey"}],"chronology":[{"id":"c1","title":"Put the events of 1066 in order","items":["Edward the Confessor dies","Harold is crowned","Battle of Fulford","Battle of Stamford Bridge","William lands at Pevensey","Battle of Hastings","William is crowned"]},{"id":"c2","title":"Put the events of the battle day in order","items":["English form a shield wall on the ridge","Norman attacks uphill fail","Bretons fall back and some English chase them","Rumour that William is dead; he lifts his helmet","Harold is killed","The English line breaks"]}],"matching":[{"id":"x1","title":"Match each claimant to their claim","pairs":[["Harold Godwinson","Named by Edward on his deathbed, backed by the Witan"],["William of Normandy","Said Edward promised him the throne and Harold swore an oath"],["Harald Hardrada","Agreement between Magnus of Norway and Harthacnut"],["Edgar Ætheling","Closest blood relative, but young and without an army"]]},{"id":"x2","title":"Match the term to its meaning","pairs":[["Housecarl","Professional English soldier"],["Fyrd","Part-time English soldiers"],["Cavalry","Soldiers on horseback"],["Witan","Council of nobles and churchmen"],["Provenance","Who made a source, when and why"]]}],"evidence":[{"id":"e1","s":"s2","q":"Give a precise piece of evidence that Harold's army was tired by October 1066.","keywords":[["stamford","fulford","march","marched","185","250","north"]],"model":"They had fought at Stamford Bridge on 25 September, after marching about 185 miles north in a few days, then marched back south — about 250 miles — to face William."},{"id":"e2","s":"s3","q":"Give a piece of evidence that William prepared carefully.","keywords":[["fleet","ships","horses","banner","pope","brittany","flanders","soldiers"]],"model":"He built a large fleet that could carry horses, gathered soldiers from Normandy, Brittany and Flanders, and won a papal banner from Pope Alexander II."},{"id":"e3","s":"s4","q":"Give evidence that the shield wall was effective at first.","keywords":[["uphill","ridge","failed","held","morning","hours","all day"]],"model":"Early Norman attacks uphill failed against it, and the battle lasted most of the day."},{"id":"e4","s":"s5","q":"Give evidence that luck helped William.","keywords":[["wind","hardrada","three days","28","undefended","harold killed","north"]],"model":"The wind kept William in Normandy until Harold was in the north fighting Hardrada; he landed unopposed on 28 September, three days after Stamford Bridge."}]},"flashcards":[{"id":"f1","s":"s1","q":"When did Edward the Confessor die?","a":"5 January 1066","hint":"The very start of the year."},{"id":"f2","s":"s1","q":"Why was there a succession crisis in 1066?","a":"Edward died with no children, and there was no fixed rule about who should be king next.","hint":"Think about Edward's family."},{"id":"f3","s":"s1","q":"What was Harold Godwinson's claim?","a":"Edward named him on his deathbed (English sources); he was the most powerful earl and the Witan backed him.","hint":"Deathbed + Witan."},{"id":"f4","s":"s1","q":"What was William's claim?","a":"Norman writers said Edward promised him the throne and that Harold swore an oath to support him around 1064.","hint":"A promise and an oath."},{"id":"f5","s":"s1","q":"What was Harald Hardrada's claim?","a":"An earlier agreement between Magnus of Norway and Harthacnut of England.","hint":"An old Scandinavian agreement."},{"id":"f6","s":"s1","q":"Why was Edgar Ætheling not chosen in January 1066?","a":"He was a teenager with no army or powerful supporters.","hint":"Age and power."},{"id":"f7","s":"s1","q":"What was the Witan?","a":"A council of leading nobles and churchmen that advised the king.","hint":"A council."},{"id":"f8","s":"s1","q":"When was Harold crowned?","a":"6 January 1066","hint":"The day after Edward died."},{"id":"f9","s":"s2","q":"Why did Harold send his southern army home in September?","a":"Supplies were running out and men were needed for the harvest.","hint":"Food and farming."},{"id":"f10","s":"s2","q":"Who was Tostig?","a":"Harold's exiled brother, who joined Hardrada's invasion.","hint":"Family feud."},{"id":"f11","s":"s2","q":"What happened at Fulford (20 Sept 1066)?","a":"Hardrada and Tostig defeated the northern earls Edwin and Morcar.","hint":"A Viking win."},{"id":"f12","s":"s2","q":"What happened at Stamford Bridge (25 Sept 1066)?","a":"Harold surprised and defeated the Norwegians; Hardrada and Tostig were killed.","hint":"An English win."},{"id":"f13","s":"s2","q":"How did Stamford Bridge weaken Harold for Hastings?","a":"His army lost men, was exhausted, and had to march about 250 miles south.","hint":"Losses + distance."},{"id":"f14","s":"s3","q":"When and where did William land?","a":"Pevensey, 28 September 1066","hint":"Sussex coast, three days after Stamford Bridge."},{"id":"f15","s":"s3","q":"Why did William's landing go unopposed?","a":"Harold and his army were in the north after Stamford Bridge.","hint":"Where was Harold?"},{"id":"f16","s":"s3","q":"What did the papal banner show?","a":"That Pope Alexander II supported William's cause.","hint":"The Church."},{"id":"f17","s":"s3","q":"Why did William raid Sussex?","a":"It was Harold's family land, so it pressured Harold to fight quickly.","hint":"Whose land was it?"},{"id":"f18","s":"s4","q":"When was the Battle of Hastings?","a":"14 October 1066","hint":"Mid-October."},{"id":"f19","s":"s4","q":"Where was the battle actually fought?","a":"On a ridge about seven miles from Hastings, where the town of Battle now stands.","hint":"Not in Hastings itself."},{"id":"f20","s":"s4","q":"What were housecarls?","a":"Professional, full-time English soldiers, often armed with two-handed axes.","hint":"Full-time."},{"id":"f21","s":"s4","q":"What was the fyrd?","a":"Part-time English soldiers called up from the shires.","hint":"Part-time."},{"id":"f22","s":"s4","q":"What three types of soldier did William have?","a":"Archers, foot soldiers (infantry) and mounted knights (cavalry).","hint":"Bows, feet, horses."},{"id":"f23","s":"s4","q":"What happened when the Bretons fell back?","a":"Some English broke out of the shield wall to chase them and were cut off and killed.","hint":"A gap appears."},{"id":"f24","s":"s4","q":"What is a feigned retreat — and is it certain William used one?","a":"Pretending to flee to draw the enemy out. Norman writers say so; historians debate it.","hint":"Pretend."},{"id":"f25","s":"s4","q":"Which of Harold's brothers died at Hastings?","a":"Gyrth and Leofwine","hint":"Two names: G and L."},{"id":"f26","s":"s5","q":"Give two ways luck helped William.","a":"The wind delayed him until Harold was in the north; Hardrada invaded first; Harold was killed at a key moment.","hint":"Weather and timing."},{"id":"f27","s":"s5","q":"Give one mistake Harold may have made.","a":"Fighting quickly instead of waiting for more troops.","hint":"Speed."},{"id":"f28","s":"s6","q":"Why is the Bayeux Tapestry not a neutral source?","a":"It was probably made for Bishop Odo, William's half-brother, to tell the Norman story.","hint":"Who paid for it?"},{"id":"f29","s":"s6","q":"Who wrote 'The Deeds of William' and why might it be biased?","a":"William of Poitiers, William's chaplain — he wrote to praise William.","hint":"His job."},{"id":"f30","s":"s7","q":"When and where was William crowned?","a":"25 December 1066, Westminster Abbey","hint":"Christmas."}],"checklist":[{"id":"k1","level":"describe","text":"I can describe why England had a succession crisis in 1066.","sections":["s1"]},{"id":"k2","level":"describe","text":"I can describe the four claimants and the basis of each claim.","sections":["s1"]},{"id":"k3","level":"explain","text":"I can explain how Harold Godwinson became king.","sections":["s1"]},{"id":"k4","level":"describe","text":"I can describe the main events of 1066 in the correct order with dates.","sections":["s2","s3","s4","s7"]},{"id":"k5","level":"explain","text":"I can explain how the Battle of Stamford Bridge affected Harold's army.","sections":["s2"]},{"id":"k6","level":"explain","text":"I can explain how William prepared for his invasion.","sections":["s3"]},{"id":"k7","level":"describe","text":"I can describe the two armies and the tactics used at Hastings.","sections":["s4"]},{"id":"k8","level":"explain","text":"I can explain at least three reasons why William won, using precise evidence.","sections":["s5"]},{"id":"k9","level":"judge","text":"I can make a supported judgement about the most important reason William won.","sections":["s5"]},{"id":"k10","level":"judge","text":"I can use who made a source, when and why to judge how useful it is.","sections":["s6"]}],"exam":{"criteria_status":"missing","criteria_note":"Department KS3 assessment criteria have not been uploaded. The success criteria below are teacher-created drafts for Mr Garry to check; AI feedback gives no marks until a verified mark scheme is added for a question.","questions":[{"id":"q1","label":"Teacher-created practice question","type":"describe","q":"Describe two claims to the English throne in 1066.","minutes":8,"sections":["s1"],"asks":"Give accurate details about two different claimants and what their claim was based on. You do not need to explain who was most likely to win.","steps":["Pick the two claimants you know best.","For each: name them, say who they were, and say what their claim rested on.","Add one precise detail for each (a date, a person, an event)."],"plan":"1 minute planning: write two names and one detail beside each. 6 minutes writing. 1 minute checking names and dates.","success":["Two different claimants named","The basis of each claim stated accurately","At least one precise supporting detail for each"],"mistakes":["Describing the battle instead of the claims","Writing about four claimants briefly instead of two in detail","Mixing up Harold Godwinson and Harald Hardrada"],"markscheme":null,"model":[{"t":"One claim was Harold Godwinson's. He was Earl of Wessex, the most powerful noble in England, and English sources say Edward named him as successor on his deathbed in January 1066.","n":"Names the claimant, says who he was, gives the basis of the claim with a precise date."},{"t":"The Witan, the council of leading nobles and churchmen, supported him, and he was crowned on 6 January.","n":"Extra precise detail that strengthens the description."},{"t":"A second claim was William of Normandy's. Norman writers said Edward had promised him the throne, and that Harold had sworn an oath to support William while in Normandy around 1064.","n":"A different claimant; two parts to the claim; notes these come from Norman sources."}],"frame":{"full":["One claim to the throne was made by … He was …","His claim was based on …","A precise detail that supports this is …","A second claim was made by … He was …","His claim was based on …","A precise detail is …"],"some":["Claim 1: who + basis + detail","Claim 2: who + basis + detail"]}},{"id":"q2","label":"Teacher-created practice question","type":"explain","q":"Explain why the Battle of Stamford Bridge was important for the outcome of the Battle of Hastings.","minutes":12,"sections":["s2","s3","s5"],"asks":"Show how events in the north led to consequences in the south. Each paragraph needs a reason, evidence and an explanation of how it affected Hastings.","steps":["Identify two or three effects of Stamford Bridge (e.g. tiredness, losses, the south left undefended).","For each, give precise evidence.","Explain how that effect changed what happened at Hastings.","Finish by linking the effects together."],"plan":"2 minutes: list effects and evidence in the planning grid. 9 minutes: two PEEJ paragraphs. 1 minute: check every paragraph links back to Hastings.","success":["Identifies at least two consequences of Stamford Bridge","Supports each with precise evidence","Explains clearly how each affected Hastings","Shows a link between the consequences"],"mistakes":["Telling the story of Stamford Bridge without linking it to Hastings","Saying 'the army was tired' without evidence","Forgetting dates that prove the timing"],"markscheme":null,"model":[{"t":"Stamford Bridge was important because it left the south coast undefended when William arrived.","n":"POINT — answers the question directly."},{"t":"Harold was in the north defeating Hardrada on 25 September, and William landed at Pevensey on 28 September, just three days later.","n":"EVIDENCE — two precise dates show the timing."},{"t":"This meant William could land his army and horses safely and choose where to wait, instead of fighting on the beach while his men were still unloading.","n":"EXPLAIN — shows the consequence for William."},{"t":"So Stamford Bridge gave William a strong start before the battle even began.","n":"JUDGEMENT/LINK — ties the paragraph back to the outcome at Hastings."}],"frame":{"full":["POINT: One reason Stamford Bridge mattered was …","EVIDENCE: For example, …","EXPLAIN: This meant that … because …","JUDGEMENT: Therefore this helped William win at Hastings by …"],"some":["Point","Evidence","Explain","Judgement / link back"]}},{"id":"q3","label":"Teacher-created practice question (central enquiry)","type":"judge","q":"'William won the Battle of Hastings mainly because of luck.' How far do you agree?","minutes":25,"sections":["s3","s4","s5"],"asks":"Weigh luck against other factors (William's leadership, Norman tactics, Harold's decisions, English weaknesses) and reach a clear judgement about which mattered most.","steps":["Decide your judgement before you write — agree, partly agree or disagree.","Paragraph on luck, with evidence and explanation.","Paragraphs on one or two other factors.","Compare: which factor mattered most and why? Use the judgement questions.","Conclusion that answers 'how far' and explains your reasoning."],"plan":"4 minutes planning grid (factor / evidence / how it helped William / how decisive). 18 minutes writing. 3 minutes conclusion and check.","success":["Clear judgement in the introduction and conclusion","Luck explained with precise evidence","At least one other factor explained with precise evidence","Factors compared directly, not just listed","Conclusion gives a reason for the judgement"],"mistakes":["Only writing about luck","Listing factors without comparing them","A conclusion that sits on the fence with no reason","Retelling the story of 1066"],"markscheme":null,"judgementPrompts":["How long did this factor matter for? (duration)","How much of the battle and campaign did it affect? (scope)","How directly did it lead to the victory? (effectiveness)","What would have happened without it? (impact)"],"model":[{"t":"I partly agree: luck gave William important chances, but his leadership was what turned those chances into victory.","n":"Introduction states a clear, balanced judgement."},{"t":"Luck helped William because the wind delayed his crossing until Harold was fighting Hardrada in the north. He landed unopposed at Pevensey on 28 September, three days after Stamford Bridge.","n":"Luck paragraph — precise evidence."},{"t":"However, luck alone did not win the battle. When rumours spread that he had died, William lifted his helmet to show he was alive, stopping a panic that could have ended the battle.","n":"Counter-factor (leadership) with evidence."},{"t":"Leadership mattered more because it affected the whole day, whereas the lucky timing only decided where and when the battle started.","n":"Direct comparison using scope and duration."}],"frame":{"full":["Introduction: I agree / partly agree / disagree because …","Luck helped William because … For example, … This meant …","However, another important factor was … For example, … This meant …","Comparing them, … mattered more because it lasted longer / affected more of the battle / led more directly to victory …","Overall, …"],"some":["Judgement","Luck: P–E–E–J","Other factor: P–E–E–J","Compare (duration / scope / effectiveness / impact)","Conclusion"]}}]},"stretch":[{"id":"t1","kind":"Causal links","task":"Draw a chain of at least four links from 'Edward dies without children' to 'Harold is killed at Hastings'. For each arrow, write how one event caused the next."},{"id":"t2","kind":"Relative significance","task":"Rank the five factors from most to least important. Then move your top factor to the bottom and write the strongest argument you can for why it really belongs there. Has your view changed?"},{"id":"t3","kind":"Competing arguments","task":"Historians debate whether the feigned retreats were a deliberate tactic or a story told later by Norman writers. Using what you know about who wrote the sources, explain why we cannot be sure."},{"id":"t4","kind":"Counterfactual","task":"If the wind had changed in August and William had landed while Harold's army was still waiting on the south coast, who would have won? Use evidence about the two armies to justify your prediction."},{"id":"t5","kind":"Source evaluation","task":"The Bayeux Tapestry and the Anglo-Saxon Chronicle tell different stories about 1066. Using their origin and purpose, explain why they might disagree and which you would trust more for each of: Harold's oath; the course of the battle."},{"id":"t6","kind":"Change and continuity","task":"After Hastings, the Witan still chose Edgar Ætheling. What does this tell us about how much changed on 14 October, and how much stayed the same until Christmas?"}],"planning":{"title":"Planning grid: why did William win?","rows":["Luck","William's leadership","Norman tactics","Harold's decisions","English weaknesses"],"cols":["Precise evidence","How it helped William","How decisive? (how long, how much, how directly)"],"judgemen <script>
/* Mr Garry's History Revision Hub — client.
   Runs in two modes:
   - server mode (normal website): talks to /api, sign-in required, progress saved on the server.
   - preview mode (window.HUB_PREVIEW set): content bundled in the page, progress saved in this browser only,
     no sign-in, no teacher tools, no AI feedback. */
(() => {
'use strict';
const PREVIEW = !!window.HUB_PREVIEW;
const root = document.getElementById('app');

// ---------- tiny templating with escaping ----------
class Raw { constructor(s) { this.s = s; } }
const raw = (s) => new Raw(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (v) => v instanceof Raw ? v.s : Array.isArray(v) ? v.map(fmt).join('') : (v == null || v === false) ? '' : esc(v);
function html(strings, ...vals) { let o = ''; strings.forEach((s, i) => { o += s; if (i < vals.length) o += fmt(vals[i]); }); return raw(o); }
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const today = () => new Date().toISOString().slice(0, 10);
const pct = (r, w) => (r + w ? Math.round((100 * r) / (r + w)) : null);
const wordsIn = (t) => (String(t).trim().match(/\S+/g) || []).length;
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };

// ---------- data stores ----------
function ApiStore() {
  const call = async (method, url, body) => {
    const r = await fetch(url, { method, credentials: 'same-origin', headers: { 'content-type': 'application/json', 'x-hub': '1' }, body: body === undefined ? undefined : JSON.stringify(body) });
    let j = {}; try { j = await r.json(); } catch {}
    if (!r.ok) { const e = new Error(j.error || `Request failed (${r.status})`); e.status = r.status; throw e; }
    return j;
  };
  return {
    call,
    me: async () => (await call('GET', '/api/me')).user,
    login: async (u, s) => (await call('POST', '/api/login', { username: u, secret: s })).user,
    logout: () => call('POST', '/api/logout'),
    catalog: () => call('GET', '/api/catalog'),
    topic: async (id) => (await call('GET', '/api/topics/' + id)).topic,
    loadProgress: async () => (await call('GET', '/api/progress')).progress,
    saveProgress: (p) => call('PUT', '/api/progress', { progress: p }),
    submissions: () => call('GET', '/api/submissions'),
    submitSub: async (id) => (await call('POST', '/api/submissions/' + id + '/submit')).submission,
    createSub: async (b) => (await call('POST', '/api/submissions', b)).submission,
    updateSub: async (id, text) => (await call('PUT', '/api/submissions/' + id, { text })).submission,
    feedback: async (id) => (await call('POST', '/api/submissions/' + id + '/feedback')).submission,
    deleteSub: (id) => call('DELETE', '/api/submissions/' + id),
    myData: () => call('GET', '/api/my-data')
  };
}

function LocalStore() {
  const H = window.HUB_PREVIEW;
  const AI_REASON = 'AI feedback is not part of this preview. It works on the full website once a school API key is added.';
  const subs = () => lsGet('hub-preview-subs', []);
  const putSubs = (s) => { if (!lsSet('hub-preview-subs', s)) throw new Error('This browser blocked saving, so your writing was not saved. Copy it somewhere safe.'); };
  return {

// ---------- progress ----------
function P(path, init) { // get-or-create nested object in progress
  let o = S.progress;
  for (const k of path) { if (!o[k] || typeof o[k] !== 'object') o[k] = {}; o = o[k]; }
  return o;
}
function daily() {
  const d = S.progress.daily;
  if (!d || d.date !== today()) S.progress.daily = { date: today(), cards: 0, answers: 0 };
  return S.progress.daily;
}
let saveTimer = null;
function persist() {
  if (S.user && S.user.role === 'teacher') return;
  S.save = 'pending'; paintSave();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    S.save = 'saving'; paintSave();
    try { await Store.saveProgress(S.progress); S.save = 'saved'; }
    catch (e) { S.save = 'error'; S.saveError = e.message; setTimeout(persist, 10000); }
    paintSave();
  }, 700);
}
function paintSave() {
  const el = document.getElementById('savestate'); if (!el) return;
  const map = { saved: PREVIEW ? 'Saved in this browser' : 'Progress saved', pending: 'Saving…', saving: 'Saving…', error: 'Not saved — retrying' };
  el.textContent = map[S.save] || '';
  el.className = 'small hide-sm ' + (S.save === 'error' ? '' : 'muted');
  el.style.color = S.save === 'error' ? 'var(--red)' : '';
}
window.addEventListener('beforeunload', (e) => { if (S.save === 'pending' || S.save === 'saving') { e.preventDefault(); e.returnValue = ''; } });

// Leitner-style scheduling (days until next review per box)
const BOX_DAYS = [0, 1, 3, 7, 14, 30];
function cardState(tid, cid) { return P(['flash', tid])[cid] || null; }
function setCard(tid, cid, patch) { const f = P(['flash', tid]); f[cid] = { box: 0, due: 0, got: 0, miss: 0, pinned: false, ...(f[cid] || {}), ...patch }; persist(); }
function isDue(st) { return !st || !st.seen || st.due <= Date.now(); }

function recordAnswer(tid, id, ok) {
  const q = P(['quiz', tid]);
  const r = q[id] || { r: 0, w: 0 };
  ok ? r.r++ : r.w++;
  r.last = ok ? 1 : 0; r.at = Date.now();
  q[id] = r; daily().answers++; persist();
}
function sectionAccuracy(t, sid) {
  const q = (S.progress.quiz || {})[t.id] || {};
  let r = 0, w = 0;
  const all = [...t.quizzes.mcq, ...t.quizzes.short, ...t.quizzes.evidence];
  for (const it of all) if (it.s === sid && q[it.id]) { r += q[it.id].r; w += q[it.id].w; }
  return { r, w, p: pct(r, w) };
}
function topicStats(t) {
  const q = (S.progress.quiz || {})[t.id] || {};
  let r = 0, w = 0; for (const v of Object.values(q)) { r += v.r; w += v.w; }
  const f = (S.progress.flash || {})[t.id] || {};
  const mastered = t.flashcards.filter((c) => f[c.id] && f[c.id].box >= 3).length;
  const due = t.flashcards.filter((c) => isDue(f[c.id])).length;
  const ck = (S.progress.check || {})[t.id] || {};
  const rag = { red: 0, amber: 0, green: 0 }; for (const v of Object.values(ck)) if (rag[v] != null) rag[v]++;
  return { quiz: pct(r, w), answered: r + w, mastered, due, cards: t.flashcards.length, rag, rated: rag.red + rag.amber + rag.green };
}
function recommendations(t) {
  const ck = (S.progress.check || {})[t.id] || {};
  const out = [];
  for (const k of t.checklist) {
    const conf = ck[k.id];
    const acc = k.sections.map((s) => sectionAccuracy(t, s)).reduce((a, b) => ({ r: a.r + b.r, w: a.w + b.w }), { r: 0, w: 0 });
    const p = pct(acc.r, acc.w);
    let score = 0, why = '';
    if (conf === 'red') { score += 3; why = 'you rated it red'; }
    else if (conf === 'amber') { score += 2; why = 'you rated it amber'; }
    else if (!conf) { score += 1; why = 'not rated yet'; }
    if (p !== null && p < 60) { score += 2; why += (why ? ' and ' : '') + `quiz accuracy is ${p}%`; }
    if (conf === 'green' && p !== null && p < 60) why = `rated green, but quiz accuracy is only ${p}% — check it`;
    if (score >= 2 || (conf === 'green' && p !== null && p < 60)) out.push({ k, score, why });
  }
  return out.sort((a, b) => b.score - a.score).slice(0, 3);
}

// ---------- answer matching ----------
function norm(s) {
  return String(s).toLowerCase().replace(/æ/g, 'ae').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim().replace(/^(the|a|an) /, '');
}
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
function shortMatch(given, accept) {
  const g = norm(given); if (!g) return false;
  return accept.some((a) => { const n = norm(a); const tol = n.length <= 4 ? 0 : n.length <= 7 ? 1 : 2; return g === n || lev(g, n) <= tol || (n.length > 3 && (` ${g} `).includes(` ${n} `)); });
}

function resolveQ(course, q) {
  const base = (q && q.qtype && course && course.qtypes && course.qtypes[q.qtype]) || {};
  const out = { ...base };
  for (const [k, v] of Object.entries(q || {})) if (v !== null && v !== undefined) out[k] = v;
  if (q && q.markscheme === undefined && base.markscheme) out.markscheme = base.markscheme;
  if (!out.frames && out.frame) out.frames = [{ name: 'Writing frame', full: out.frame.full, some: out.frame.some }];
  if (q && q.model && q.model.length) out.model_note = q.model_note || null;
  return out;
}

// ---------- quizzes ----------
const QMODES = [['mcq', 'Multiple choice'], ['short', 'Short answer'], ['chronology', 'Chronology'], ['matching', 'Matching'], ['evidence', 'Evidence recall'], ['dates', 'Key dates'], ['mixed', 'Mixed (this topic)']];
function buildQuiz(topics, mode, n) {
  const items = [];
  for (const t of topics) {
    const Q = t.quizzes;
    const add = (type, arr) => (arr || []).forEach((it) => items.push({ type, it, tid: t.id }));
    if (mode === 'mcq' || mode === 'mixed' || mode === 'global') add('mcq', Q.mcq);
    if (mode === 'short' || mode === 'mixed' || mode === 'global') add('short', Q.short);
    if (mode === 'chronology' || mode === 'mixed') add('chronology', Q.chronology);
    if (mode === 'matching' || mode === 'mixed') add('matching', Q.matching);
    if (mode === 'evidence' || mode === 'mixed') add('evidence', Q.evidence);
  }
  if (mode === 'dates') items.push(...dateItems(topics));
  return shuffle(items).slice(0, n || items.length).map(prepItem);
}
function dateItems(topics) {
  const pool = [];
  for (const t of topics) for (const [i, e] of (t.learn.timeline || []).entries()) pool.push({ ...e, tid: t.id, i });
  const out = [];
  for (const e of pool) {
    const others = shuffle(pool.filter((o) => o.date !== e.date));
    if (others.length < 3) continue;
    if (Math.random() < 0.5) {
      const ds = [e.date, ...[...new Set(others.map((o) => o.date))].slice(0, 3)];
      out.push({ type: 'mcq', tid: e.tid, it: { id: `dt-${e.i}-a`, q: `When did this happen? ${e.event}`, options: ds, answer: 0, why: `${e.date}: ${e.event}` } });
    } else {
      const evs = [e.event, ...others.filter((o) => o.event !== e.event).slice(0, 3).map((o) => o.event)];
      out.push({ type: 'mcq', tid: e.tid, it: { id: `dt-${e.i}-b`, q: `What happened in ${e.date}?`, options: evs, answer: 0, why: `${e.date}: ${e.event}` } });
    }
  }
  return out;
}
function prepItem(x) {
  if (x.type === 'mcq') x.order = shuffle(x.it.options.map((_, i) => i));
  if (x.type === 'chronology') { let o; do { o = shuffle(x.it.items); } while (o.length > 2 && o.every((v, i) => v === x.it.items[i])); x.cur = o; }
  if (x.type === 'matching') x.rights = shuffle(x.it.pairs.map((p) => p[1]));
  x.done = false; x.ok = null;
  return x;
}
function startQuiz(scope, topics, mode, n) { S.ui.quiz = { scope, mode, items: buildQuiz(topics, mode, n), i: 0 }; render(); }

function viewQuizHome(t) {
  const qs = S.ui.quiz && S.ui.quiz.scope === t.id ? S.ui.quiz : null;
  if (qs) return topicFrame(t, 'quiz', quizRunner(qs));
  return topicFrame(t, 'quiz', html`
    <section class="panel"><h2>Choose a quiz</h2><p class="muted">Answers and explanations appear after each question. Missed questions can be retried at the end.</p>
      <div class="acts">${QMODES.filter(([m]) => quizCount(t, m) > 0).map(([m, l]) => html`<button class="act" data-act="quiz-start" data-mode="${m}"><b>${l}</b><span class="small muted">${quizCount(t, m)} items</span></button>`)}</div>
    </section>`);
}
const quizCount = (t, m) => m === 'mixed' ? Object.values(t.quizzes).reduce((a, b) => a + b.length, 0) : m === 'dates' ? (t.learn.timeline || []).length : (t.quizzes[m] || []).length;

function quizRunner(qs) {
  if (qs.i >= qs.items.length) {
    const right = qs.items.filter((x) => x.ok).length;
    const missed = qs.items.filter((x) => !x.ok);
    return html`<section class="qcard" aria-live="polite"><h2>Quiz complete</h2><p class="stat"><b>${right} / ${qs.items.length}</b><span class="muted">correct</span></p>
      <div class="row">${missed.length ? html`<button class="btn primary" data-act="quiz-retry">Retry the ${missed.length} I missed</button>` : html`<span class="chip ok">Full marks</span>`}<button class="btn" data-act="quiz-again">New quiz</button><button class="btn" data-act="quiz-exit">Back</button></div>
      ${missed.length ? html`<details class="fold"><summary>See the questions I missed</summary><div><ul>${missed.map((x) => html`<li>${itemPrompt(x)} — <b>${itemAnswer(x)}</b></li>`)}</ul></div></details>` : ''}
    </section>`;
  }
  const x = qs.items[qs.i];
  return html`<div class="row" style="justify-content:space-between"><span class="eyebrow">Question ${qs.i + 1} of ${qs.items.length}</span><button class="btn sm" data-act="quiz-exit">End quiz</button></div>
    <div class="meter" aria-hidden="true"><i style="width:${Math.round(100 * qs.i / qs.items.length)}%"></i></div>
    ${renderItem(x)}`;
}
const itemPrompt = (x) => x.type === 'chronology' || x.type === 'matching' ? x.it.title : x.it.q;
const itemAnswer = (x) => x.type === 'mcq' ? x.it.options[x.it.answer] : x.type === 'short' ? x.it.answer : x.type === 'chronology' ? x.it.items.join(' → ') : x.type === 'matching' ? x.it.pairs.map((p) => p[0] + ': ' + p[1]).join('; ') : x.it.model;

function renderItem(x) {
  const next = x.done ? html`<button class="btn primary" data-act="quiz-next" id="nextbtn">Next</button>` : '';
  if (x.type === 'mcq') {
    return html`<section class="qcard"><p class="q" id="qq">${x.it.q}</p><div class="opts" role="group" aria-labelledby="qq">
      ${x.order.map((i) => { const cls = x.done ? (i === x.it.answer ? 'right' : i === x.pick ? 'wrong' : '') : ''; return html`<button class="opt ${cls}" data-act="mcq" data-i="${i}" ${x.done ? raw('disabled') : ''}>${x.it.options[i]}</button>`; })}
      </div>${x.done ? html`<div class="feedback ${x.ok ? 'right' : 'wrong'}" role="status"><b>${x.ok ? 'Correct.' : 'Not quite.'}</b> ${x.it.why}</div>` : ''}${next}</section>`;
  }
  if (x.type === 'short') {
    return html`<form class="qcard" data-form="short"><label for="sa" class="q">${x.it.q}</label>
      <input type="text" id="sa" autocomplete="off" ${x.done ? raw('disabled') : ''} value="${x.given || ''}">
      ${x.done ? html`<div class="feedback ${x.ok ? 'right' : 'wrong'}" role="status"><b>${x.ok ? 'Correct.' : 'Not quite.'}</b> Answer: ${x.it.answer}</div>${next}` : html`<div class="row"><button class="btn primary" type="submit">Check</button><button class="btn" type="button" data-act="short-skip">I don't know</button></div>`}</form>`;
  }
  if (x.type === 'chronology') {
    return html`<section class="qcard"><p class="q">${x.it.title}</p><p class="small muted">Earliest at the top. Use the arrows to move events.</p>
      <ol class="order">${x.cur.map((ev, i) => html`<li class="${x.done ? (ev === x.it.items[i] ? 'right' : 'wrong') : ''}"><span>${ev}</span>${x.done ? '' : html`<button class="btn sm" data-act="move" data-i="${i}" data-d="-1" aria-label="Move ${ev} up" ${i === 0 ? raw('disabled') : ''}>↑</button><button class="btn sm" data-act="move" data-i="${i}" data-d="1" aria-label="Move ${ev} down" ${i === x.cur.length - 1 ? raw('disabled') : ''}>↓</button>`}</li>`)}</ol>
      ${x.done ? html`<div class="feedback ${x.ok ? 'right' : 'wrong'}" role="status"><b>${x.ok ? 'All in order.' : 'Some are out of place.'}</b> Correct order: ${x.it.items.join(' → ')}</div>${next}` : html`<button class="btn primary" data-act="chrono-check">Check order</button>`}</section>`;
  }
  if (x.type === 'matching') {
    return html`<form class="qcard" data-form="match"><p class="q">${x.it.title}</p><div class="match">
      ${x.it.pairs.map((p, i) => html`<label for="m${i}">${p[0]}</label><select id="m${i}" ${x.done ? raw('disabled') : ''}><option value="">Choose…</option>${x.rights.map((r) => html`<option ${x.picks && x.picks[i] === r ? raw('selected') : ''}>${r}</option>`)}</select>
        ${x.done && x.picks[i] !== p[1] ? html`<span></span><span class="small" style="color:var(--red)">Correct: ${p[1]}</span>` : ''}`)}
      </div>${x.done ? html`<div class="feedback ${x.ok ? 'right' : 'wrong'}" role="status"><b>${x.ok ? 'All matched.' : `${x.score} of ${x.it.pairs.length} matched.`}</b></div>${next}` : html`<button class="btn primary" type="submit">Check</button>`}</form>`;
  }
  // evidence recall
  return html`<form class="qcard" data-form="evidence"><label for="ev" class="q">${x.it.q}</label>
    <textarea id="ev" style="min-height:110px" ${x.done || x.revealed ? raw('disabled') : ''}>${x.given || ''}</textarea>
    ${x.revealed ? html`<div class="feedback ${x.hit ? 'right' : 'wrong'}"><b>${x.hit ? 'You used a key piece of evidence.' : 'Check your answer against the model.'}</b><br>Model: ${x.it.model}</div>
      ${x.done ? next : html`<p class="small">Did your answer include precise, accurate evidence like the model?</p><div class="row"><button class="btn good" type="button" data-act="ev-mark" data-ok="1">Yes, I had it</button><button class="btn bad" type="button" data-act="ev-mark" data-ok="0">No, I missed it</button></div>`}`
      : html`<button class="btn primary" type="submit">Check</button>`}</form>`;
}

  }

  return html`
    <div class="row" style="justify-content:space-between"><span class="eyebrow">Card ${fs.i + 1} of ${fs.queue.length}</span>
      <div class="row"><button class="pin" data-act="pin" data-id="${c.id}" aria-pressed="${st.pinned ? 'true' : 'false'}">${st.pinned ? 'Pinned' : 'Pin card'}</button><button class="btn sm" data-act="flash-exit">End</button></div></div>

function frameBlock(q, level, fi) {
  if (level === 'none') return html`<p class="small muted">No frame — independent practice. Plan first, then write.</p>`;
  const frames = q.frames || (q.frame ? [{ name: 'Writing frame', ...q.frame }] : []);
  if (!frames.length) return '';
  const f = frames[Math.min(fi || 0, frames.length - 1)];
  const lines = level === 'full' ? f.full : f.some;
  const prompts = q.judgementPrompts || q.criteria_list;
  return html`<div class="frame"><span class="eyebrow">${frames.length > 1 ? f.name + ' · ' : ''}${level === 'full' ? 'Sentence starters' : 'Paragraph headings'}</span><ol>${lines.map((l) => html`<li>${l}</li>`)}</ol>
    ${prompts ? html`<span class="eyebrow" style="margin-top:6px">Judgement criteria</span><ul style="margin:0;padding-left:1.1em">${prompts.map((x) => html`<li>${x}</li>`)}</ul>` : ''}

}

// ---------- search ----------
function searchIndex() {
  const out = [];
  for (const t of Object.values(S.topics)) {
    out.push({ label: 'Topic', title: t.title, text: t.learn.intro, to: t.id });
    for (const s of t.learn.sections) out.push({ label: 'Learn', title: s.title, text: s.blocks.map((b) => b.p || (b.ul || []).join(' ')).join(' ') + ' ' + (s.terms || []).join(' '), to: t.id + '.learn', scroll: s.id });
    for (const v of t.learn.vocab) out.push({ label: 'Key word', title: v.term, text: v.def, to: t.id + '.learn', scroll: 'vocab' });
    for (const p of t.learn.people) out.push({ label: 'Person', title: p.name, text: p.role, to: t.id + '.learn', scroll: 'people' });
    for (const e of t.learn.timeline) out.push({ label: 'Date', title: e.date, text: e.event, to: t.id + '.learn', scroll: 'tl' });
    for (const c of t.flashcards) out.push({ label: 'Flashcard', title: c.q, text: c.a, to: t.id + '.flash' });
  }
  return out;
}
function openSearch() {
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-label', 'Search');
  ov.innerHTML = '<div class="box"><label for="q" class="sr">Search</label><input type="text" id="q" placeholder="Search people, dates, key words…" autocomplete="off"><div class="results" id="res"><p class="small muted">Search people, dates, key words and flashcards across every topic.</p></div></div>';
  document.body.appendChild(ov);
  const idx = searchIndex();
  const input = ov.querySelector('#q'), res = ov.querySelector('#res');
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  ov.addEventListener('click', (e) => { if (e.target === ov) close(); const b = e.target.closest('[data-to]'); if (b) { close(); S.ui.scrollTo = b.dataset.scroll || null; go(b.dataset.to); } });
  input.addEventListener('input', () => {
    const q = norm(input.value); if (q.length < 2) { res.innerHTML = ''; return; }
    const terms = q.split(' ');
    const hits = idx.filter((x) => { const h = norm(x.title + ' ' + x.text); return terms.every((w) => h.includes(w)); }).slice(0, 12);
    res.innerHTML = hits.length ? hits.map((h) => fmt(html`<button data-to="${h.to}" data-scroll="${h.scroll || ''}"><span class="eyebrow">${h.label}</span><b>${h.title}</b><span class="small muted">${h.text.slice(0, 110)}${h.text.length > 110 ? '…' : ''}</span></button>`)).join('') : '<p class="small muted">No matches.</p>';
  });
  input.focus();
}

// ---------- render ----------
let lastTopicPromise = {};
async function ensureTopic(id) {
  if (S.topics[id]) return S.topics[id];
  if (!lastTopicPromise[id]) lastTopicPromise[id] = Store.topic(id).then((t) => { S.topics[id] = t; return t; }).catch((e) => { delete lastTopicPromise[id]; throw e; });
  return lastTopicPromise[id];
}
function render() {
  if (!S.user) { root.innerHTML = viewLogin(S.ui.loginError).s; return; }
  const r = parseRoute();
  let out;
  try {
    if (!r.a) out = viewHome();
    else if (r.a === 'mixed') out = viewMixed();
    else if (r.a === 'account') out = viewAccount();
    else if (r.a === 'teacher' && S.user.role === 'teacher') out = viewTeacher(r.b, r.c);
    else if (courseOf(r.a)) { const c = courseOf(r.a); out = r.b === 'guide' && c.qtypes ? viewGuide(c) : (r.b === 'mixed' || r.b === 'dates') ? viewCourseQuiz(c, r.b) : viewCourse(c); }
    else if (S.catalog.topics[r.a]) {
      const t = S.topics[r.a];
      if (!t) { ensureTopic(r.a).then(render, (e) => toast(e.message)); out = shell(html`<p class="muted">Loading…</p>`); }
      else if (!r.b) out = viewOverview(t);
      else if (r.b === 'learn') out = viewLearn(t);
      else if (r.b === 'quiz') out = viewQuizHome(t);
      else if (r.b === 'flash') out = viewFlash(t);
      else if (r.b === 'check') out = viewCheck(t);
      else if (r.b === 'exam') { const q = t.exam.questions.find((x) => x.id === r.c); out = q ? viewExamQ(t, q) : viewExamList(t); if (q && !S.subs) loadSubs(); }
      else if (r.b === 'frames') out = viewFrames(t);
      else if (r.b === 'stretch') out = viewStretch(t);
    }
    if (!out) out = shell(html`<section class="panel"><h1>Page not found</h1><button class="btn" data-act="go" data-to="">Go home</button></section>`);
  } catch (e) { console.error(e); out = shell(html`<div class="notice bad">Something went wrong showing this page: ${e.message}</div>`); }
  const y = window.scrollY;
  root.innerHTML = out.s;
  paintSave();
  if (S.ui.scrollTo) { const el = document.getElementById('sec-' + S.ui.scrollTo); S.ui.scrollTo = null; if (el) { el.scrollIntoView(); S.ui.scrollTop = false; return; } }
  if (S.ui.scrollTop) { window.scrollTo(0, 0); S.ui.scrollTop = false; const m = document.getElementById('main'); if (m) m.focus({ preventScroll: true }); } else window.scrollTo(0, y);
  if (S.ui.focus) { const el = document.getElementById(S.ui.focus); S.ui.focus = null; if (el) el.focus(); }
}
async function loadSubs() {
  if (S.user && S.user.role === 'teacher') { S.subs = []; S.ai = { available: false, reasons: ['You are signed in as the teacher — students write and request feedback here; their work appears in the Teacher area.'] }; render(); return; }
  try { const r = await Store.submissions(); S.subs = r.submissions; S.ai = r.ai; } catch (e) { S.subs = []; S.ai = { available: false, reasons: [e.message] }; }
  render();
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}
function download(name, data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function examMsg(m, bad) { const el = document.getElementById('exammsg'); if (el) el.innerHTML = fmt(html`<div class="notice ${bad ? 'bad' : 'info'}">${m}</div>`); }
function tmsg(m, bad) { const el = document.getElementById('tmsg'); if (el) el.innerHTML = fmt(html`<div class="notice ${bad ? 'bad' : 'info'}">${m}</div>`); else toast(m); }

// ---------- actions ----------
const curTopic = () => S.topics[parseRoute().a];
const A = {
  go: (el) => { if (el.dataset.scroll) S.ui.scrollTo = el.dataset.scroll; S.ui.quiz = null; S.ui.flash = null; go(el.dataset.to); },
  theme: () => {

  },

  'quiz-start': (el) => startQuiz(curTopic().id, [curTopic()], el.dataset.mode),
  'mixed-start': (el) => startQuiz('global', Object.values(S.topics), 'global', +el.dataset.n),

  'exam-frame': (el) => { S.ui.exam.frame = +el.dataset.v; render(); },
  'quiz-exit': () => { S.ui.quiz = null; render(); },
  'quiz-again': () => { const q = S.ui.quiz; S.ui.quiz = null; if (q.scope === 'global') startQuiz('global', Object.values(S.topics), 'global', q.items.length); else if (q.scope.startsWith('course:')) { const [, cid, mode] = q.scope.split(':'); const ts = courseTopics(courseOf(cid)).map((t) => S.topics[t.id]).filter(Boolean); startQuiz(q.scope, ts, mode === 'dates' ? 'dates' : 'global', q.items.length); } else render(); },
  'quiz-retry': () => { const q = S.ui.quiz; q.items = q.items.filter((x) => !x.ok).map((x) => prepItem({ type: x.type, it: x.it, tid: x.tid })); q.i = 0; render(); },
  'quiz-next': () => { S.ui.quiz.i++; S.ui.focus = 'nextfocus'; render(); const f = document.querySelector('.qcard .opt, .qcard input, .qcard textarea, .qcard select, .qcard .btn'); if (f) f.focus(); },
  mcq: (el) => { const x = S.ui.quiz.items[S.ui.quiz.i]; x.pick = +el.dataset.i; answerItem(x, x.pick === x.it.answer); render(); focusNext(); },
  'short-skip': () => { const x = S.ui.quiz.items[S.ui.quiz.i]; x.given = ''; answerItem(x, false); render(); focusNext(); },
  move: (el) => { const x = S.ui.quiz.items[S.ui.quiz.i]; const i = +el.dataset.i, j = i + +el.dataset.d; [x.cur[i], x.cur[j]] = [x.cur[j], x.cur[i]]; render(); const b = document.querySelectorAll('.order li')[j]?.querySelector(`[data-d="${el.dataset.d}"]`) || document.querySelectorAll('.order li')[j]?.querySelector('button'); if (b) b.focus(); },
  'chrono-check': () => { const x = S.ui.quiz.items[S.ui.quiz.i]; answerItem(x, x.cur.every((v, i) => v === x.it.items[i])); render(); focusNext(); },
  'ev-mark': (el) => { const x = S.ui.quiz.items[S.ui.quiz.i]; answerItem(x, el.dataset.ok === '1'); render(); focusNext(); },
  'flash-start': (el) => {
    const t = curTopic(); const st = P(['flash', t.id]); const set = el.dataset.set;
    let ids = t.flashcards.map((c) => c.id);
    if (set === 'due') ids = shuffle(ids.filter((id) => isDue(st[id]))).slice(0, 20);
    if (set === 'pinned') ids = ids.filter((id) => st[id] && st[id].pinned);
    if (set === 'missed') ids = ids.filter((id) => st[id] && st[id].lastMiss);
    if (set === 'all') ids = shuffle(ids);
    const h = document.getElementById('hintsOn'); if (h) S.ui.hints = h.checked;
    S.ui.flash = { tid: t.id, queue: ids, i: 0, flipped: false, hint: false, got: 0, missed: 0, missedOnce: {} }; render(); document.getElementById('flipbtn')?.focus();
  },
  'flash-exit': () => { S.ui.flash = null; render(); },
  flip: () => { const f = S.ui.flash; if (!f || f.flipped) return; f.flipped = true; render(); document.getElementById('gotbtn')?.focus(); },
  hint: () => { S.ui.flash.hint = true; render(); document.getElementById('flipbtn')?.focus(); },
  'flash-mark': (el) => {
    const f = S.ui.flash; const t = curTopic(); const id = f.queue[f.i]; const st = cardState(t.id, id) || { box: 0 };
    const ok = el.dataset.ok === '1';
    if (ok) {
      const box = f.missedOnce[id] ? 1 : Math.min((st.box || 0) + 1, 5);
      setCard(t.id, id, { box, due: Date.now() + BOX_DAYS[box] * 864e5 - 3600e3, got: (st.got || 0) + 1, seen: true, lastMiss: !!f.missedOnce[id] });
      if (!f.missedOnce[id]) f.got++;
    } else {
      setCard(t.id, id, { box: 0, due: Date.now(), miss: (st.miss || 0) + 1, seen: true, lastMiss: true });
      if (!f.missedOnce[id]) f.missed++;
      f.missedOnce[id] = true; f.queue.push(id);
    }
    daily().cards++; persist();
    f.i++; f.flipped = false; f.hint = false; render(); document.getElementById('flipbtn')?.focus();
  },
  pin: (el) => { const t = curTopic(); const st = cardState(t.id, el.dataset.id) || {}; setCard(t.id, el.dataset.id, { pinned: !st.pinned }); render(); document.querySelector('.pin')?.focus(); },
  rag: (el) => { const t = curTopic(); const ck = P(['check', t.id]); ck[el.dataset.id] = ck[el.dataset.id] === el.dataset.v ? undefined : el.dataset.v; if (!ck[el.dataset.id]) delete ck[el.dataset.id]; persist(); render(); document.querySelector(`[data-act="rag"][data-id="${el.dataset.id}"][data-v="${el.dataset.v}"]`)?.focus(); },
  'exam-mode': (el) => { S.ui.exam.mode = el.dataset.v; render(); },
  'exam-level': (el) => { S.ui.exam.level = el.dataset.v; render(); },
  'frame-level': (el) => { S.ui.frameLevel = el.dataset.v; render(); },
  timer: (el) => {
    clearInterval(S.ui.timerId); const end = Date.now() + +el.dataset.min * 60e3; S.ui.timer = { key: S.ui.exam.key, end };
    const tick = () => { const sp = document.getElementById('timer'); if (!sp) { clearInterval(S.ui.timerId); return; } const left = Math.max(0, end - Date.now()); sp.textContent = left ? `${Math.floor(left / 60000)}:${String(Math.floor(left / 1000) % 60).padStart(2, '0')} left` : 'Time is up — finish your sentence.'; if (!left) clearInterval(S.ui.timerId); };
    S.ui.timerId = setInterval(tick, 1000); tick();
  },
  'sub-save': () => saveAnswer(false),
  'sub-send': () => saveAnswer('send'),
  'sub-feedback': () => saveAnswer(true),
  'sub-load': (el) => { const s = S.subs.find((x) => x.id === el.dataset.id); Object.assign(S.ui.exam, { subId: s.id, parentId: s.parent_id, text: s.text }); render(); document.getElementById('answer')?.focus(); },
  'sub-redraft': (el) => { const s = S.subs.find((x) => x.id === el.dataset.id); Object.assign(S.ui.exam, { subId: null, parentId: s.id, text: s.text, mode: 'supported' }); render(); const a = document.getElementById('practice'); a?.scrollIntoView(); document.getElementById('answer')?.focus(); },
  'sub-del': async (el) => {
    const id = el.dataset.id; if (S.ui.confirmDel !== id) { S.ui.confirmDel = id; render(); return; }
    S.ui.confirmDel = null;
    try { await Store.deleteSub(id); S.subs = S.subs.filter((x) => x.id !== id); if (S.ui.exam && S.ui.exam.subId === id) S.ui.exam.subId = null; render(); toast('Deleted'); } catch (e) { toast(e.message); }
  },
  mydata: async () => { try { download('my-history-hub-data.json', await Store.myData()); } catch (e) { toast(e.message); } },
  'reset-preview': () => { if (!S.ui.confirmReset) { S.ui.confirmReset = true; render(); return; } S.ui.confirmReset = false; S.progress = {}; S.subs = []; try { localStorage.removeItem('hub-preview-progress'); localStorage.removeItem('hub-preview-subs'); } catch {} render(); toast('Preview progress erased'); },
  logout: async () => { try { await Store.logout(); } catch {} S.user = null; S.progress = {}; S.subs = null; S.teacher = {}; S.topics = {}; lastTopicPromise = {}; history.replaceState(null, '', location.pathname); render(); },
  // teacher
  trefresh: (el) => { S.teacher[el.dataset.k] = null; render(); },
  copy: async (el) => { const t = document.getElementById(el.dataset.src).textContent; try { await navigator.clipboard.writeText(t); toast('Copied'); } catch { const r = document.createRange(); r.selectNodeContents(document.getElementById(el.dataset.src)); getSelection().removeAllRanges(); getSelection().addRange(r); toast('Selected — press Ctrl+C to copy'); } },
  'reset-code': async (el) => { try { const r = await Store.call('POST', `/api/teacher/students/${el.dataset.id}/reset-code`); S.teacher.made = [r]; render(); } catch (e) { tmsg(e.message, true); } },
  'export-student': async (el) => { try { download(`student-${el.dataset.u}.json`, await Store.call('GET', `/api/teacher/students/${el.dataset.id}/export`)); } catch (e) { tmsg(e.message, true); } },
  'del-student': async (el) => {
    const id = el.dataset.id; if (S.ui.confirmDel !== id) { S.ui.confirmDel = id; render(); return; }
    S.ui.confirmDel = null; try { await Store.call('DELETE', `/api/teacher/students/${id}`); S.teacher.students = null; S.teacher.subs = null; render(); toast('Student and all their data deleted'); } catch (e) { tmsg(e.message, true); }
  },
  'edit-content': async (el) => { try { const r = await Store.call('GET', '/api/teacher/content/' + encodeURIComponent(el.dataset.id)); S.teacher.editing = r; render(); document.getElementById('cj')?.focus(); } catch (e) { tmsg(e.message, true); } },
  'edit-close': () => { S.teacher.editing = null; render(); },
  'export-content': async () => {
    try { const list = await Store.call('GET', '/api/teacher/content'); const items = []; for (const c of list.items) items.push(await Store.call('GET', '/api/teacher/content/' + encodeURIComponent(c.id))); download(`history-hub-content-${today()}.json`, { format: 'history-hub-content', exported_at: new Date().toISOString(), items }); } catch (e) { tmsg(e.message, true); }
  },
  'export-progress': async () => { try { download(`history-hub-progress-${today()}.json`, await Store.call('GET', '/api/teacher/progress')); } catch (e) { tmsg(e.message, true); } },
  backup: async () => { try { download(`history-hub-backup-${today()}.json`, await Store.call('GET', '/api/teacher/backup')); } catch (e) { tmsg(e.message, true); } },
  'restore-cancel': () => { S.teacher.pendingRestore = null; render(); },
  'restore-go': async () => { try { await Store.call('POST', '/api/teacher/restore', S.teacher.pendingRestore); S.teacher = {}; S.user = null; S.ui.loginError = 'Backup restored. Please sign in again.'; render(); } catch (e) { tmsg(e.message, true); } }
};
function focusNext() { document.getElementById('nextbtn')?.focus(); }

async function saveAnswer(withFeedback) {
  const ui = S.ui.exam; const [tid, , qid] = [parseRoute().a, null, parseRoute().c];
  const text = document.getElementById('answer').value;
  if (!text.trim()) { examMsg('Write your answer first.', true); return; }
  try {
    let sub;
    const existing = ui.subId && S.subs.find((x) => x.id === ui.subId);
    if (existing && (existing.status === 'draft' || existing.status === 'error')) sub = await Store.updateSub(ui.subId, text);
    else sub = await Store.createSub({ topic_id: tid, question_id: qid, text, parent_id: ui.parentId || undefined });
    S.subs = [sub, ...S.subs.filter((x) => x.id !== sub.id)];
    ui.subId = sub.id; ui.text = text;
    if (!withFeedback) { render(); examMsg(PREVIEW ? 'Saved in this browser.' : 'Draft saved. Only you can see it until you send it or ask for feedback.'); return; }
    if (withFeedback === 'send') {
      try { const sent = await Store.submitSub(sub.id); S.subs = [sent, ...S.subs.filter((x) => x.id !== sent.id)]; ui.subId = null; ui.parentId = null; ui.text = ''; lsSet('hub-draft-' + ui.key, ''); render(); examMsg('Sent to Mr Garry.'); }
      catch (e) { render(); examMsg(e.message, true); }
      return;
    }
    examMsg('Preparing feedback… this can take up to a minute. Your answer is already saved.');
    const btns = document.querySelectorAll('[data-act="sub-feedback"],[data-act="sub-save"]'); btns.forEach((b) => b.disabled = true);
    try {
      const marked = await Store.feedback(sub.id);
      S.subs = [marked, ...S.subs.filter((x) => x.id !== marked.id)];
      ui.subId = null; ui.parentId = null; ui.text = ''; lsSet('hub-draft-' + ui.key, '');
      render(); document.querySelector('.fb')?.scrollIntoView();
    } catch (e) {
      try { const r = await Store.submissions(); S.subs = r.submissions; S.ai = r.ai; } catch {}
      render(); examMsg(e.message, true);
    }
  } catch (e) { examMsg('Not saved: ' + e.message + ' Your text is still kept on this device.', true); }
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || !root.contains(el) && !el.closest('.overlay')) return;
  const fn = A[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase(); const typing = tag === 'input' || tag === 'textarea' || tag === 'select';
  if (e.key === '/' && !typing && S.user && !document.querySelector('.overlay')) { e.preventDefault(); openSearch(); }
  if (S.ui.flash && !typing && (e.key === ' ' || e.key === 'Enter') && e.target.classList.contains('flash')) { e.preventDefault(); A.flip(); }
});
let typeTimer = null;
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'answer') {
    S.ui.exam.text = el.value; lsSet('hub-draft-' + el.dataset.key, el.value);
    const wc = document.getElementById('wc'); if (wc) wc.textContent = `${wordsIn(el.value)} words · draft kept on this device as you type`;
  } else if (el.dataset.plan) { P(['notes', curTopic().id, 'plan'])[el.dataset.plan] = el.value; clearTimeout(typeTimer); typeTimer = setTimeout(persist, 600); }
  else if (el.dataset.stretch) { P(['notes', curTopic().id, 'stretch'])[el.dataset.stretch] = el.value; clearTimeout(typeTimer); typeTimer = setTimeout(persist, 600); }
  else if (el.id === 'hintsOn') S.ui.hints = el.checked;
});
document.addEventListener('change', async (e) => {
  const el = e.target;
  if (el.id === 'hintsOn') S.ui.hints = el.checked;
  if (el.id === 'imp' && el.files[0]) {
    try {
      const data = JSON.parse(await el.files[0].text());
      let id; if (Array.isArray(data.courses)) id = 'courses'; else if (data.id && data.course) id = 'topic:' + data.id; else throw new Error('This file is not a topic or course file.');
      await Store.call('PUT', '/api/teacher/content/' + encodeURIComponent(id), { data, status: 'draft' });
      S.teacher.content = null; render(); tmsg(`Imported ${id} as a draft. Publish it when ready.`);
    } catch (err) { tmsg('Import failed: ' + err.message, true); }
  }
  if (el.id === 'restore' && el.files[0]) {
    try { const b = JSON.parse(await el.files[0].text()); if (b.format !== 'history-hub-backup') throw new Error('Not a Revision Hub backup.'); S.teacher.pendingRestore = b; render(); } catch (err) { tmsg(err.message, true); }
  }
});
document.addEventListener('submit', async (e) => {
  const f = e.target; e.preventDefault();
  if (f.id === 'loginform') {
    try { S.user = await Store.login(f.querySelector('#lu').value, f.querySelector('#ls').value); S.ui.loginError = null; await boot(); }
    catch (err) { S.ui.loginError = err.message; render(); document.getElementById('lu')?.focus(); }
    return;
  }
  const kind = f.dataset.form; const qs = S.ui.quiz;
  if (kind === 'short') { const x = qs.items[qs.i]; x.given = f.querySelector('#sa').value; if (!x.given.trim()) return; answerItem(x, shortMatch(x.given, x.it.accept)); render(); focusNext(); }
  if (kind === 'match') { const x = qs.items[qs.i]; x.picks = x.it.pairs.map((_, i) => f.querySelector('#m' + i).value); x.score = x.it.pairs.filter((p, i) => x.picks[i] === p[1]).length; answerItem(x, x.score === x.it.pairs.length); render(); focusNext(); }
  if (kind === 'evidence') { const x = qs.items[qs.i]; x.given = f.querySelector('#ev').value; if (!x.given.trim()) return; const g = ' ' + norm(x.given) + ' '; x.hit = x.it.keywords.every((grp) => grp.some((k) => g.includes(norm(k)))); x.revealed = true; render(); document.querySelector('[data-act="ev-mark"]')?.focus(); }
  if (kind === 'review') {
    try {
      await Store.call('PUT', `/api/teacher/submissions/${f.dataset.id}/review`, { mark: f.querySelector('#rv-m').value, max: f.querySelector('#rv-x').value, level: f.querySelector('#rv-l').value, comment: f.querySelector('#rv-c').value, overrides_ai: f.querySelector('#rv-o').checked });
      S.teacher.subs = null; go('teacher'); toast('Review saved');
    } catch (err) { tmsg(err.message, true); }
  }
  if (kind === 'mkstudents') {
    const students = f.querySelector('#mk').value.split('\n').map((l) => l.split(',').map((x) => x.trim())).filter((x) => x[0]).map(([username, cls]) => ({ username, class: cls }));
    try { const r = await Store.call('POST', '/api/teacher/students', { students }); S.teacher.made = r.created; S.teacher.students = null; render(); } catch (err) { tmsg(err.message, true); }
  }
  if (kind === 'scheme') {
    const get = (n) => f.querySelector(`[name="${n}"]`);
    const parseScheme = () => {
      const levels = get('levels').value.split('\n').map((l) => l.split('|').map((x) => x.trim())).filter((x) => x[0]).map(([level, marks, ...d]) => ({ level, marks, descriptor: d.join(' | ') }));
      const max = get('max').value === '' ? null : +get('max').value;
      const verified = get('verified').checked;
      if (verified && (!Number.isFinite(max) || max <= 0 || !levels.length)) { tmsg('A verified mark scheme needs a maximum mark and at least one level.', true); return undefined; }
      const empty = !get('source').value && max == null && !levels.length;
      return empty ? null : { verified, source: get('source').value, max_marks: max, levels, notes: get('notes').value || undefined, indicative_content: get('indicative').value.split('\n').map((x) => x.trim()).filter(Boolean), ao_separate: get('ao').checked };
    };
    if (f.dataset.c) {
      const ms = parseScheme(); if (ms === undefined) return;
      try {
        const cur = await Store.call('GET', '/api/teacher/content/courses');
        const course = cur.data.courses.find((x) => x.id === f.dataset.c);
        course.qtypes[f.dataset.k].markscheme = ms;
        await Store.call('PUT', '/api/teacher/content/courses', { data: cur.data, status: cur.status });
        S.catalog = await Store.catalog(); render(); tmsg('Mark scheme saved.'); window.scrollTo(0, 0);
      } catch (err) { tmsg(err.message, true); }
      return;
    }
    const t = S.topics[f.dataset.t]; const q = t.exam.questions.find((x) => x.id === f.dataset.q);
    const levels = get('levels').value.split('\n').map((l) => l.split('|').map((x) => x.trim())).filter((x) => x[0]).map(([level, marks, ...d]) => ({ level, marks, descriptor: d.join(' | ') }));
    const max = get('max').value === '' ? null : +get('max').value;
    const verified = get('verified').checked;
    if (verified && (!Number.isFinite(max) || max <= 0 || !levels.length)) { tmsg('A verified mark scheme needs a maximum mark and at least one level.', true); return; }
    const empty = !get('source').value && max == null && !levels.length;
    q.markscheme = empty ? null : { verified, source: get('source').value, max_marks: max, levels, indicative_content: get('indicative').value.split('\n').map((x) => x.trim()).filter(Boolean), ao_separate: get('ao').checked };
    if (q.markscheme && verified) t.exam.criteria_status = t.exam.questions.every((x) => x.markscheme && x.markscheme.verified) ? 'verified' : t.exam.criteria_status;
    try {
      const cur = await Store.call('GET', '/api/teacher/content/' + encodeURIComponent('topic:' + t.id));
      await Store.call('PUT', '/api/teacher/content/' + encodeURIComponent('topic:' + t.id), { data: t, status: cur.status });
      tmsg('Mark scheme saved.'); window.scrollTo(0, 0);
    } catch (err) { tmsg(err.message, true); }
  }
  if (kind === 'content') {
    let data; try { data = JSON.parse(f.querySelector('#cj').value); } catch (err) { tmsg('That is not valid JSON: ' + err.message, true); return; }
    try { await Store.call('PUT', '/api/teacher/content/' + encodeURIComponent(f.dataset.id), { data, status: f.querySelector('#cs').value }); S.teacher.content = null; S.teacher.editing = null; S.topics = {}; lastTopicPromise = {}; S.catalog = await Store.catalog(); await loadAllTopics(); render(); tmsg('Saved.'); } catch (err) { tmsg(err.message, true); }
  }
  if (kind === 'settings') {
    const b = {}; f.querySelectorAll('input[name]').forEach((i) => { b[i.name] = i.type === 'checkbox' ? i.checked : i.type === 'number' ? (i.value === '' ? null : +i.value) : i.value; });
    try { S.teacher.settings = await Store.call('PUT', '/api/teacher/settings', b); render(); tmsg('Settings saved.'); } catch (err) { tmsg(err.message, true); }
  }
  if (kind === 'password') {
    try { await Store.call('POST', '/api/teacher/password', { current: f.querySelector('#pw1').value, next: f.querySelector('#pw2').value }); f.reset(); tmsg('Password changed.'); } catch (err) { tmsg(err.message, true); }
  }
});

// ---------- boot ----------
async function loadAllTopics() { await Promise.all(Object.keys(S.catalog.topics).map((id) => ensureTopic(id).catch(() => null))); }
async function boot() {
  try {
    if (!S.user) S.user = await Store.me();
    if (!S.user) { render(); return; }
    S.catalog = await Store.catalog(); S.ai = S.catalog.ai;
    if (S.user.role === 'student') S.progress = (await Store.loadProgress()) || {};
    await loadAllTopics();
    render();
  } catch (e) {
    root.innerHTML = fmt(html`<main><div class="notice bad">The Revision Hub could not load: ${e.message}. Check your connection and refresh.</div></main>`);
  }
}
const th = lsGet('hub-theme', null); if (th) document.documentElement.dataset.theme = th;
boot();
})();

</script>
