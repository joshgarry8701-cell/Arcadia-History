set up the dictatorship (Reichstag Fire, Enabling Act, Night of the Long Knives, Führer).","sections":["s1"]},{"id":"k2","level":"judge","text":"I can judge how successful Nazi methods of control were (police state, censorship, propaganda).","sections":["s2"]},{"id":"k3","level":"explain","text":"I can explain Nazi policies towards education, women, young people and the Churches and their impact.","sections":["s3"]},{"id":"k4","level":"explain","text":"I can explain Nazi racial policy and the increasing persecution of Jews.","sections":["s4"]},{"id":"k5","level":"explain","text":"I can explain policies to reduce unemployment, the Labour Service, the Labour Front and Strength Through Joy.","sections":["s5"]}],"exam":{"questions":[{"id":"q1","qtype":"p1b","label":"Past paper: 4HI1/01, June 2025, Q3(b)","sections":["s1"],"q":"Explain two effects of the Reichstag Fire on the Nazi Party.","markscheme":null},{"id":"q2","qtype":"p1c","label":"Teacher-created practice question","sections":["s2","s3","s5"],"q":"‘The main reason why there was little opposition to the Nazis in the years 1933–39 was the police state.’\nHow far do you agree? Explain your answer.","prompts":["the Gestapo","Strength Through Joy"],"markscheme":null}]},"stretch":[{"id":"t1","kind":"Competing arguments","task":"Fear or support? Use evidence about workers and young people to decide why most Germans did not oppose the Nazis."},{"id":"t2","kind":"Change and continuity","task":"How far did life change for German women in 1933–39? Think about what the Nazis wanted and what actually happened."}]},"y11-de-5":{"id":"y11-de-5","course":"y11","area":"de","kt":"Key topic 5","order":5,"title":"Germany and the occupied territories during the Second World War","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following 4HI1 Depth study 3, key topic 5. Figures checked against Payne, Pearson Edexcel International GCSE Germany, chapter 5 (pp. 93–110)."},"learn":{"intro":"During the war the Nazis murdered millions of Jews in the Holocaust. At home, Germans faced rationing, 'total war' and Allied bombing, and some began to resist. The Third Reich ended with Hitler's death in 1945.","sections":[{"id":"s1","title":"1. Nazi policies towards the Jews","blocks":[{"p":"Conquest brought millions more Jews under Nazi control — there were 3 million Jews in Poland alone. Jews were forced into ghettos, walled-off areas of cities such as Warsaw and Łódź, where many died from hunger and disease."},{"p":"After the invasion of the Soviet Union in June 1941, SS death squads (Einsatzgruppen) followed the army and shot Jews and others in mass killings."},{"p":"At the Wannsee Conference in January 1942, Nazi leaders organised the 'Final Solution' — the plan to murder all of Europe's Jews. Jews were transported to death camps such as Auschwitz-Birkenau and Treblinka and killed in gas chambers. Almost 6 million Jews were murdered in the Holocaust, along with millions of others, including Roma, disabled people and Soviet prisoners."}],"terms":["ghetto","death squads (Einsatzgruppen)","Final Solution","Holocaust","death camp"],"evidence":["3 million Jews in Poland in 1939.","June 1941: Einsatzgruppen killings begin.","January 1942: Wannsee Conference.","Almost 6 million Jews murdered."],"refs":["Payne, IGCSE Germany, ch. 5"]},{"id":"s2","title":"2. The Home Front","blocks":[{"p":"Rationing of food and clothing began in 1939. At first Germans were protected by food taken from occupied countries, but rations were cut as the war went badly, and shortages grew worse from 1942."},{"p":"Total war: after defeat at Stalingrad, Goebbels announced 'total war' in February 1943 — every part of the economy and society was to work for the war. Places of entertainment closed and more people were directed into war work."},{"p":"The changing role of women: Nazi ideas said women belonged at home, so at first the regime avoided conscripting them. As the labour shortage grew, more women were drawn into work — by mid-1943 half a million extra women were working in industry — though Germany relied heavily on foreign forced labourers and prisoners: about 7 million were working for German industry."},{"p":"Allied bombing: British and American bombing destroyed cities. Raids on Hamburg in July 1943 killed 42,600 civilians and forced around 1 million others to flee; Dresden was devastated in February 1945. Bombing damaged homes, factories and morale, and millions of children were evacuated to the countryside."}],"terms":["rationing","total war","evacuation","forced labour"],"evidence":["1939: rationing begins.","February 1943: 'total war'.","July 1943: Hamburg — 42,600 civilians killed.","About 7 million foreign workers and prisoners in German industry."],"refs":["Payne, IGCSE Germany, ch. 5"]},{"id":"s3","title":"3. The growth of opposition","blocks":[{"ul":["Edelweiss Pirates: groups of working-class young people who rejected the Hitler Youth, sang banned songs and attacked Hitler Youth patrols; some helped deserters. In 1944 thirteen members were publicly hanged in Cologne.","The White Rose: students at Munich University, including Hans and Sophie Scholl, who distributed leaflets calling for resistance. They were caught in February 1943 and executed.","The July Bomb Plot (20 July 1944): army officers led by Colonel Claus von Stauffenberg planted a bomb at Hitler's headquarters. Hitler survived; the plotters were executed and thousands of suspects arrested."]},{"p":"Opposition grew as Germany began to lose the war, but it never became a mass movement because of terror and the risk of execution."}],"terms":["Edelweiss Pirates","White Rose","July Bomb Plot"],"evidence":["February 1943: White Rose members executed.","20 July 1944: Bomb Plot.","1944: Edelweiss Pirates hanged in Cologne."],"refs":["Payne, IGCSE Germany, ch. 5"]},{"id":"s4","title":"4. The end of the Third Reich","blocks":[{"p":"By 1945 Soviet forces were advancing from the east and British and American forces from the west. Hitler stayed in his bunker in Berlin and killed himself on 30 April 1945 as Soviet troops reached the city. Germany surrendered on 7–8 May 1945."},{"p":"Millions of Germans fled or were expelled from the east, and Germany was occupied and divided by the Allies."}],"terms":["surrender","occupation"],"evidence":["30 April 1945: Hitler's suicide.","8 May 1945: VE Day."],"refs":["Payne, IGCSE Germany, ch. 5"]}],"timeline":[{"date":"Sept 1939","event":"Invasion of Poland; rationing introduced"},{"date":"1940","event":"Warsaw ghetto sealed"},{"date":"June 1941","event":"Invasion of the USSR; death squads begin mass shootings"},{"date":"Jan 1942","event":"Wannsee Conference plans the 'Final Solution'"},{"date":"Feb 1943","event":"Defeat at Stalingrad; 'total war'; White Rose arrests"},{"date":"July 1943","event":"Bombing of Hamburg"},{"date":"20 July 1944","event":"July Bomb Plot"},{"date":"Feb 1945","event":"Bombing of Dresden"},{"date":"30 April 1945","event":"Hitler kills himself"},{"date":"8 May 1945","event":"Germany's surrender"}],"people":[{"name":"Joseph Goebbels","role":"Announced 'total war' in 1943."},{"name":"Heinrich Himmler","role":"SS leader who organised the Holocaust."},{"name":"Hans and Sophie Scholl","role":"White Rose members executed in 1943."},{"name":"Claus von Stauffenberg","role":"Led the July Bomb Plot, 1944."}],"vocab":[{"term":"Ghetto","def":"Walled-off area where Jews were forced to live."},{"term":"Final Solution","def":"The Nazi plan to murder all of Europe's Jews."},{"term":"Total war","def":"Using all of a country's resources for the war."},{"term":"Home Front","def":"Life for civilians at home during the war."}],"misconceptions":[{"wrong":"German women were fully mobilised for war work from 1939.","right":"The regime was slow to use women because of its ideas; it relied on forced foreign labour."},{"wrong":"Nobody in Germany resisted.","right":"Groups like the White Rose, the Edelweiss Pirates and the July plotters did, at great risk."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"What was decided at the Wannsee Conference?","options":["Rationing","The organisation of the 'Final Solution'","Total war","The invasion of Poland"],"answer":1,"why":"January 1942."},{"id":"m2","s":"s1","q":"How many Jews were murdered in the Holocaust?","options":["About 600,000","Almost 6 million","About 60 million","About 1 million"],"answer":1,"why":"Along with millions of others."},{"id":"m3","s":"s2","q":"Who announced 'total war' in 1943?","options":["Himmler","Goebbels","Speer","Hitler"],"answer":1,"why":"After Stalingrad."},{"id":"m4","s":"s2","q":"How many civilians did the Hamburg raids of July 1943 kill?","options":["4,260","42,600","426,000","1 million"],"answer":1,"why":"About 1 million fled."},{"id":"m5","s":"s3","q":"Who were the White Rose?","options":["Army officers","Munich students who spread anti-Nazi leaflets","Working-class youths","Church leaders"],"answer":1,"why":"Including Hans and Sophie Scholl."},{"id":"m6","s":"s3","q":"What happened on 20 July 1944?","options":["Hitler's suicide","The July Bomb Plot","Hamburg bombed","Wannsee Conference"],"answer":1,"why":"Stauffenberg's bomb failed to kill Hitler."}],"short":[{"id":"a1","s":"s3","q":"Which youth group sang banned songs and fought the Hitler Youth?","accept":["edelweiss pirates","the edelweiss pirates"],"answer":"The Edelweiss Pirates"},{"id":"a2","s":"s1","q":"Name one Nazi death camp.","accept":["auschwitz","auschwitz-birkenau","birkenau","treblinka","sobibor","belzec","chelmno","majdanek"],"answer":"e.g. Auschwitz-Birkenau or Treblinka"},{"id":"a3","s":"s4","q":"When did Hitler kill himself?","accept":["30 april 1945","30th april 1945","april 30 1945","30 april"],"answer":"30 April 1945"}],"chronology":[{"id":"c1","title":"Put these in order","items":["Rationing begins","Death squads in the USSR","Wannsee Conference","Total war speech","Hamburg bombed","July Bomb Plot","Hitler's death"]}],"matching":[{"id":"x1","title":"Match the opposition group to its members","pairs":[["White Rose","Munich university students"],["Edelweiss Pirates","Working-class young people"],["July Bomb Plot","Army officers"]]}],"evidence":[{"id":"e1","s":"s2","q":"Give precise evidence of the impact of Allied bombing.","keywords":[["42,600","hamburg","1943","dresden","1 million","evacuat"]],"model":"Raids on Hamburg in July 1943 killed 42,600 civilians and forced around 1 million to flee; Dresden was devastated in February 1945."},{"id":"e2","s":"s2","q":"Give precise evidence about the role of women in the war economy.","keywords":[["half a million","500,000","1943","7 million","forced"]],"model":"By mid-1943 half a million extra women worked in industry, but the regime relied on about 7 million foreign workers and prisoners."}]},"flashcards":[{"id":"f1","s":"s1","q":"What were ghettos?","a":"Walled-off areas of cities like Warsaw where Jews were forced to live; many died from hunger and disease.","hint":"Warsaw."},{"id":"f2","s":"s1","q":"What did the death squads do?","a":"Followed the army into the USSR from 1941 and shot Jews and others in mass killings.","hint":"Einsatzgruppen."},{"id":"f3","s":"s2","q":"What was 'total war'?","a":"Goebbels's 1943 policy that the whole economy and society must work for the war.","hint":"After Stalingrad."},{"id":"f4","s":"s2","q":"How did rationing change during the war?","a":"Began in 1939; at first eased by goods from occupied countries; cut as the war went badly.","hint":"1939 → 1942."},{"id":"f5","s":"s3","q":"Why did opposition grow in the war?","a":"Defeats, bombing, hardship and knowledge of atrocities — but terror kept it small.","hint":"Losing."},{"id":"f6","s":"s3","q":"What happened to the July plotters?","a":"Stauffenberg and others were executed; thousands of suspects arrested.","hint":"1944."},{"id":"f7","s":"s4","q":"How did the Third Reich end?","a":"Allied armies invaded; Hitler killed himself on 30 April 1945; Germany surrendered on 7–8 May.","hint":"Bunker."}],"checklist":[{"id":"k1","level":"describe","text":"I can describe Nazi policies towards Jews, including ghettos, death squads and the Final Solution.","sections":["s1"]},{"id":"k2","level":"explain","text":"I can explain the impact of rationing, total war and Allied bombing on the Home Front.","sections":["s2"]},{"id":"k3","level":"explain","text":"I can explain how the role of women changed during the war.","sections":["s2"]},{"id":"k4","level":"describe","text":"I can describe opposition from the Edelweiss Pirates, the White Rose and the July Bomb Plot.","sections":["s3"]},{"id":"k5","level":"judge","text":"I can judge what had the biggest impact on the German Home Front.","sections":["s2"]}],"exam":{"questions":[{"id":"q1","qtype":"p1c","label":"Past paper: 4HI1/01, June 2025, Q3(c)(ii)","sections":["s2"],"q":"‘During the Second World War the most significant impact on the German Home Front came from Allied bombing.’\nHow far do you agree? Explain your answer.","prompts":["Allied bombing","rationing"],"markscheme":null},{"id":"q2","qtype":"p1b","label":"Teacher-created practice question","sections":["s3"],"q":"Explain two effects of the war on opposition to the Nazis in Germany.","markscheme":null}]},"stretch":[{"id":"t1","kind":"Relative significance","task":"Bombing, rationing or total war: which affected the most Germans for the longest time?"},{"id":"t2","kind":"Evaluation","task":"Why did opposition never become a mass movement? Give three reasons and rank them."}]},"y11-med-1":{"id":"y11-med-1","course":"y11","area":"med","kt":"Key topic 1","order":21,"title":"Progress in the mid-19th century: Nightingale, Chadwick, Snow and Simpson","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following 4HI1 Breadth study B2, key topic 1. No class textbook uploaded for this option yet."},"learn":{"intro":"In the mid-1800s nobody knew that germs caused disease. Even so, Nightingale improved hospitals, Simpson tackled pain in surgery, Chadwick pushed for public health reform and Snow linked cholera to dirty water.","sections":[{"id":"s1","title":"1. Barriers to progress","blocks":[{"p":"The biggest barrier was the lack of understanding of what caused disease. Most doctors believed in miasma — that disease spread through bad air from rotting matter. Some believed in spontaneous generation, the idea that microbes appeared from decaying material. Without knowing about germs, doctors could not prevent infection."},{"p":"Other barriers: cities were overcrowded with poor housing, little clean water and no proper sewers; governments believed in laissez-faire (not interfering in people's lives); and many doctors resisted new ideas."}],"terms":["miasma","spontaneous generation","laissez-faire"],"evidence":["Miasma theory widely believed.","Industrial towns overcrowded with poor sanitation."]},{"id":"s2","title":"2. Florence Nightingale and nursing","blocks":[{"p":"During the Crimean War, Florence Nightingale took 38 nurses to the army hospital at Scutari in 1854. She found filthy wards, poor food and overcrowding. She cleaned the hospital, improved hygiene, food and ventilation, and organised the nurses. The death rate among soldiers in the hospital fell dramatically."},{"p":"Back in Britain she used statistics to argue for reform, wrote Notes on Nursing (1859), and in 1860 opened the Nightingale School of Nursing at St Thomas' Hospital, London. Nursing became a respectable, trained profession for women. She also influenced hospital design, favouring airy 'pavilion' wards — although she believed in miasma rather than germs."}],"terms":["Scutari","Crimean War","pavilion hospital","Notes on Nursing"],"evidence":["1854: Nightingale arrives at Scutari with 38 nurses.","1859: Notes on Nursing.","1860: Nightingale School of Nursing."]},{"id":"s3","title":"3. Dangers in surgery and Simpson's chloroform","blocks":[{"p":"Surgery had three great dangers: pain, infection and bleeding. Without pain relief, surgeons had to operate very quickly; patients could die of shock."},{"p":"In 1847 James Simpson, an Edinburgh professor, discovered that chloroform was an effective anaesthetic. It became popular after Queen Victoria used it during childbirth in 1853. There was opposition: some patients died from overdoses (Hannah Greener died in 1848), and some people believed pain was natural or God-given."},{"p":"Anaesthetics solved pain, but surgeons now attempted longer, more complicated operations — so deaths from infection and bleeding could actually rise. This period is sometimes called the 'black period' of surgery."}],"terms":["anaesthetic","chloroform","infection","black period"],"evidence":["1847: Simpson discovers chloroform.","1848: Hannah Greener dies under chloroform.","1853: Queen Victoria uses chloroform."]},{"id":"s4","title":"4. Public health: Chadwick, the 1848 Act, cholera and Snow","blocks":[{"p":"Edwin Chadwick's Report on the Sanitary Condition of the Labouring Population (1842) showed that the poor in towns died much younger than the rich, and argued that cleaning up towns would save money by reducing illness."},{"p":"Cholera epidemics (1831–32, 1848–49, 1853–54) killed tens of thousands and frightened the government. The Public Health Act (1848) set up a General Board of Health and allowed towns to create local boards of health to improve water and sewers — but it was permissive (not compulsory), so many towns did nothing."},{"p":"In 1854 John Snow mapped cholera deaths in Soho, London, and showed they clustered around the Broad Street water pump. He had the pump handle removed and cases fell. He proved cholera spread through contaminated water, not miasma — though he could not identify the germ, and many ignored his findings at first."}],"terms":["public health","cholera","permissive","Broad Street pump"],"evidence":["1842: Chadwick's report.","1848: Public Health Act (permissive).","1854: Snow and the Broad Street pump."]}],"timeline":[{"date":"1842","event":"Chadwick's Report on sanitary conditions"},{"date":"1847","event":"Simpson discovers chloroform"},{"date":"1848","event":"Public Health Act; cholera epidemic"},{"date":"1853","event":"Queen Victoria uses chloroform in childbirth"},{"date":"1854","event":"Nightingale at Scutari; Snow and the Broad Street pump"},{"date":"1859","event":"Nightingale's Notes on Nursing"},{"date":"1860","event":"Nightingale School of Nursing opens"}],"people":[{"name":"Florence Nightingale","role":"Reformed nursing and hospitals."},{"name":"James Simpson","role":"Discovered chloroform as an anaesthetic (1847)."},{"name":"Edwin Chadwick","role":"Wrote the 1842 report on public health."},{"name":"John Snow","role":"Linked cholera to dirty water (1854)."}],"vocab":[{"term":"Miasma","def":"The belief that disease spread through bad air."},{"term":"Anaesthetic","def":"A drug that stops pain."},{"term":"Permissive act","def":"A law that allows but does not force action."},{"term":"Epidemic","def":"A disease spreading quickly to many people."}],"misconceptions":[{"wrong":"Nightingale knew about germs.","right":"She believed in miasma; her hygiene worked even though the theory was wrong."},{"wrong":"Anaesthetics made surgery safe straight away.","right":"They removed pain, but infection and bleeding remained — longer operations could increase deaths."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"What did miasma theory claim?","options":["Germs cause disease","Disease spreads through bad air","Disease is a punishment","Water spreads all disease"],"answer":1,"why":"Widely believed until germ theory."},{"id":"m2","s":"s2","q":"Where did Nightingale work in the Crimean War?","options":["Balaclava","Scutari","Edinburgh","Paris"],"answer":1,"why":"From 1854."},{"id":"m3","s":"s3","q":"What did Simpson discover in 1847?","options":["Ether","Chloroform as an anaesthetic","Carbolic acid","Penicillin"],"answer":1,"why":"In Edinburgh."},{"id":"m4","s":"s4","q":"Why did the 1848 Public Health Act have limited impact?","options":["It was compulsory","It was permissive — towns did not have to act","It banned sewers","It only covered London"],"answer":1,"why":"Many towns did nothing."},{"id":"m5","s":"s4","q":"What did John Snow show in 1854?","options":["Cholera spread through bad air","Cholera spread through contaminated water","Cholera was caused by a germ he identified","Cholera could be vaccinated against"],"answer":1,"why":"Broad Street pump."}],"short":[{"id":"a1","s":"s4","q":"Whose 1842 report showed the poor died younger?","accept":["chadwick","edwin chadwick"],"answer":"Edwin Chadwick"},{"id":"a2","s":"s4","q":"Which London pump did Snow link to cholera?","accept":["broad street","broad street pump","the broad street pump"],"answer":"The Broad Street pump"},{"id":"a3","s":"s2","q":"What book did Nightingale publish in 1859?","accept":["notes on nursing"],"answer":"Notes on Nursing"}],"chronology":[{"id":"c1","title":"Put these in order","items":["Chadwick's report","Simpson's chloroform","Public Health Act","Nightingale at Scutari","Nightingale School of Nursing"]}],"matching":[{"id":"x1","title":"Match the person to their contribution","pairs":[["Nightingale","Nursing and hospital hygiene"],["Simpson","Chloroform"],["Chadwick","1842 sanitary report"],["Snow","Cholera and water"]]}],"evidence":[{"id":"e1","s":"s4","q":"Give precise evidence of Snow's work.","keywords":[["1854","broad street","pump","map","soho","handle"]],"model":"In 1854 Snow mapped cholera deaths in Soho, linked them to the Broad Street pump and had its handle removed."}]},"flashcards":[{"id":"f1","s":"s1","q":"What was the main barrier to medical progress around 1848?","a":"No understanding of germs — belief in miasma and spontaneous generation.","hint":"Cause of disease."},{"id":"f2","s":"s2","q":"What did Nightingale change at Scutari?","a":"Cleanliness, ventilation, food, organised nursing — the death rate fell dramatically.","hint":"Hygiene."},{"id":"f3","s":"s2","q":"Why was Nightingale important after the war?","a":"Notes on Nursing; Nightingale School (1860); trained, respectable nursing; hospital design.","hint":"St Thomas'."},{"id":"f4","s":"s3","q":"What were the three problems of surgery?","a":"Pain, infection, bleeding.","hint":"P, I, B."},{"id":"f5","s":"s3","q":"Why was there opposition to chloroform?","a":"Overdose deaths (Hannah Greener 1848); belief pain was natural or God-given.","hint":"Safety and religion."},{"id":"f6","s":"s4","q":"What did the 1848 Public Health Act do?","a":"Set up a General Board of Health; allowed towns to improve water and sewers — but was not compulsory.","hint":"Permissive."}],"checklist":[{"id":"k1","level":"explain","text":"I can explain the barriers to progress, especially the lack of understanding of the causes of disease.","sections":["s1"]},{"id":"k2","level":"describe","text":"I can describe Nightingale's changes to nursing and hospitals at Scutari.","sections":["s2"]},{"id":"k3","level":"explain","text":"I can explain the dangers in surgery and the impact of Simpson and chloroform.","sections":["s3"]},{"id":"k4","level":"explain","text":"I can explain public health problems, Chadwick, the 1848 Act, cholera and Snow.","sections":["s4"]}],"exam":{"questions":[{"id":"q1","qtype":"p2bb","label":"Teacher-created practice question","sections":["s4"],"q":"Explain TWO causes of the Public Health Act of 1848.","markscheme":null},{"id":"q2","qtype":"p2ba","label":"Teacher-created practice question","sections":["s3"],"q":"Explain TWO ways in which surgery in the 1850s was different from surgery in the 1840s.","markscheme":null}]},"stretch":[{"id":"t1","kind":"Competing arguments","task":"Nightingale's methods worked even though her theory was wrong. Does that make her more or less significant than Snow?"},{"id":"t2","kind":"Causal links","task":"Why might chloroform have increased deaths from surgery at first? Explain the chain."}]},"y11-med-2":{"id":"y11-med-2","course":"y11","area":"med","kt":"Key topic 2","order":22,"title":"Discovery and development, 1860–75: Lister and Pasteur","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following 4HI1 Breadth study B2, key topic 2."},"learn":{"intro":"Pasteur's germ theory transformed understanding of disease. Lister used it to fight infection in surgery, Parliament passed a compulsory Public Health Act, and Elizabeth Garrett broke into the male world of medicine.","sections":[{"id":"s1","title":"1. Pasteur and the germ theory","blocks":[{"p":"Louis Pasteur, a French chemist, was asked to find out why wine and beer went sour. He showed that microbes (germs) in the air caused decay. In 1861, using swan-necked flasks, he showed that liquid stayed fresh when microbes from the air could not reach it — disproving spontaneous generation."},{"p":"Effects: germ theory showed that microbes cause decay and, as later work proved, disease. It gave a scientific reason for cleanliness, led to antiseptics in surgery, and made identifying specific germs and developing vaccines possible. Many doctors were slow to accept it."}],"terms":["germ theory","microbe","spontaneous generation"],"evidence":["1861: Pasteur's germ theory published."]},{"id":"s2","title":"2. Lister and antiseptics","blocks":[{"p":"Joseph Lister, a surgeon in Glasgow, read Pasteur's work and thought germs might cause infection in wounds. In 1865 he used carbolic acid on the wound of an 11-year-old boy, James Greenlees, who had a compound fracture; the wound healed without infection."},{"p":"Lister soaked dressings and instruments in carbolic acid and sprayed it in the air during operations. He published his results in 1867: death rates in his operations fell sharply. There was opposition: carbolic acid irritated skin, the methods slowed operations, and many surgeons did not accept germ theory."}],"terms":["antiseptic","carbolic acid","compound fracture"],"evidence":["1865: Lister treats James Greenlees with carbolic acid.","1867: Lister publishes his results."]},{"id":"s3","title":"3. The Public Health Act 1875","blocks":[{"p":"By the 1870s attitudes were changing: working men in towns had the vote from 1867, so politicians needed their support; germ theory and Snow's work showed the link between dirt and disease; and Bazalgette's new London sewers (built after the 'Great Stink' of 1858) showed what could be done."},{"p":"The Public Health Act of 1875 was compulsory. Councils had to provide clean water, remove sewage, and appoint a Medical Officer of Health and sanitary inspectors. It marked the end of laissez-faire in public health."}],"terms":["compulsory","Medical Officer of Health","Great Stink"],"evidence":["1858: the Great Stink.","1867: more working men get the vote.","1875: Public Health Act (compulsory)."]},{"id":"s4","title":"4. Hospitals, nursing and women in medicine","blocks":[{"p":"Nightingale's influence continued: trained nurses spread, and new hospitals used her pavilion design with light, airy, easily cleaned wards."},{"p":"Elizabeth Garrett was refused entry to medical schools because she was a woman. She found a loophole: the Society of Apothecaries had not banned women, and in 1865 she gained its licence, becoming the first woman to qualify in Britain. She opened a dispensary for women in London and later gained a medical degree in Paris (1870). The Medical Act of 1876 allowed women to qualify as doctors."}],"terms":["Society of Apothecaries","Medical Act 1876"],"evidence":["1865: Garrett qualifies through the Society of Apothecaries.","1870: Garrett's medical degree from Paris.","1876: Medical Act lets women qualify."]}],"timeline":[{"date":"1858","event":"The 'Great Stink' in London"},{"date":"1861","event":"Pasteur publishes his germ theory"},{"date":"1865","event":"Lister uses carbolic acid; Garrett qualifies"},{"date":"1867","event":"Lister publishes his results"},{"date":"1870","event":"Garrett gains her medical degree in Paris"},{"date":"1875","event":"Public Health Act"},{"date":"1876","event":"Medical Act allows women to become doctors"}],"people":[{"name":"Louis Pasteur","role":"French chemist; germ theory (1861)."},{"name":"Joseph Lister","role":"Surgeon; carbolic acid antiseptics (1865)."},{"name":"Elizabeth Garrett","role":"First woman to qualify as a doctor in Britain (1865)."},{"name":"Joseph Bazalgette","role":"Engineer of London's sewers."}],"vocab":[{"term":"Antiseptic","def":"Chemical that kills germs on wounds and instruments."},{"term":"Germ theory","def":"The idea that microbes cause decay and disease."},{"term":"Medical Officer of Health","def":"Official responsible for a town's health."}],"misconceptions":[{"wrong":"Everyone accepted Lister's antiseptics quickly.","right":"Many surgeons resisted: carbolic was unpleasant and germ theory was doubted."},{"wrong":"Pasteur proved germs caused human disease in 1861.","right":"He showed microbes caused decay; the link to specific diseases was proved later, especially by Koch."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"What did Pasteur's swan-necked flask experiment disprove?","options":["Germ theory","Spontaneous generation","Anaesthesia","Miasma"],"answer":1,"why":"1861."},{"id":"m2","s":"s2","q":"What did Lister use as an antiseptic?","options":["Chloroform","Carbolic acid","Penicillin","Ether"],"answer":1,"why":"From 1865."},{"id":"m3","s":"s3","q":"What made the 1875 Public Health Act different from 1848?","options":["It was compulsory","It was permissive","It only covered London","It created the NHS"],"answer":0,"why":"Councils had to act."},{"id":"m4","s":"s4","q":"How did Elizabeth Garrett qualify?","options":["Through a London medical school","Through the Society of Apothecaries","Through the army","Through Nightingale's school"],"answer":1,"why":"A loophole in 1865."}],"short":[{"id":"a1","s":"s2","q":"Which boy did Lister treat with carbolic acid in 1865?","accept":["james greenlees","greenlees"],"answer":"James Greenlees"},{"id":"a2","s":"s3","q":"What was the 1858 London smell crisis called?","accept":["great stink","the great stink"],"answer":"The Great Stink"},{"id":"a3","s":"s4","q":"Which 1876 Act allowed women to qualify as doctors?","accept":["medical act","the medical act","medical act 1876"],"answer":"The Medical Act"}],"chronology":[{"id":"c1","title":"Put these in order","items":["Great Stink","Germ theory","Lister's carbolic acid","Garrett's Paris degree","Public Health Act 1875","Medical Act 1876"]}],"matching":[{"id":"x1","title":"Match the person to their achievement","pairs":[["Pasteur","Germ theory"],["Lister","Antiseptic surgery"],["Garrett","First qualified woman doctor in Britain"],["Bazalgette","London sewers"]]}],"evidence":[{"id":"e1","s":"s3","q":"Give precise evidence of what the 1875 Public Health Act required.","keywords":[["clean water","sewage","medical officer","compulsory","inspector"]],"model":"Councils had to provide clean water, remove sewage and appoint a Medical Officer of Health."}]},"flashcards":[{"id":"f1","s":"s1","q":"What did germ theory change?","a":"It explained decay and disease scientifically, leading to antiseptics, bacteriology and vaccines.","hint":"Microbes."},{"id":"f2","s":"s2","q":"How did Lister use carbolic acid?","a":"On wounds, dressings and instruments, and as a spray in the air during operations.","hint":"Spray."},{"id":"f3","s":"s2","q":"Why did some surgeons oppose Lister?","a":"Carbolic irritated skin and slowed operations; many doubted germ theory.","hint":"Unpleasant + doubt."},{"id":"f4","s":"s3","q":"Give two causes of the 1875 Public Health Act.","a":"Working men's votes (1867); germ theory and Snow's evidence; successful sewers; continued epidemics.","hint":"Votes + science."},{"id":"f5","s":"s4","q":"Why was Elizabeth Garrett significant?","a":"First woman to qualify in Britain (1865); opened a dispensary; paved the way for the 1876 Act.","hint":"Apothecaries."}],"checklist":[{"id":"k1","level":"explain","text":"I can explain Pasteur's germ theory and its effects.","sections":["s1"]},{"id":"k2","level":"explain","text":"I can explain Lister's work and the impact of antiseptics.","sections":["s2"]},{"id":"k3","level":"judge","text":"I can judge the significance of the Public Health Act 1875.","sections":["s3"]},{"id":"k4","level":"describe","text":"I can describe continuing improvements in hospitals and nursing and Elizabeth Garrett's progress.","sections":["s4"]}],"exam":{"questions":[{"id":"q1","qtype":"p2ba","label":"Teacher-created practice question","sections":["s3"],"q":"Explain TWO ways in which the Public Health Act of 1875 was different from the Public Health Act of 1848.","markscheme":null},{"id":"q2","qtype":"p2bb","label":"Teacher-created practice question","sections":["s2"],"q":"Explain TWO causes of the fall in deaths after surgery in the years 1865–75.","markscheme":null}]},"stretch":[{"id":"t1","kind":"Relative significance","task":"Pasteur or Lister — who was more important for surgery? Explain why one depended on the other."},{"id":"t2","kind":"Change and continuity","task":"How much had changed for women in medicine between 1854 and 1876?"}]},"y11-med-3":{"id":"y11-med-3","course":"y11","area":"med","kt":"Key topic 3","order":23,"title":"Accelerating change, 1875–1905: Ehrlich, Koch and chemistry","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following 4HI1 Breadth study B2, key topic 3."},"learn":{"intro":"Scientists began to identify the germs behind specific diseases. Surgery moved from killing germs to keeping them out altogether, public health improved under the 1875 Act, and chemistry and physics opened new possibilities.","sections":[{"id":"s1","title":"1. Koch and bacteriology","blocks":[{"p":"Robert Koch, a German doctor, proved that specific germs cause specific diseases. He identified the anthrax bacterium (1876), the tuberculosis bacterium (1882) and the cholera bacterium (1883). He developed methods to grow bacteria on solid agar and to stain them with dyes so they could be seen under a microscope."},{"p":"Rivalry between France (Pasteur) and Germany (Koch) speeded up research. Pasteur developed vaccines for chicken cholera (1879), anthrax (1881) and rabies (1885), building on Edward Jenner's earlier smallpox vaccine."}],"terms":["bacteriology","bacterium","agar","staining","vaccine"],"evidence":["1876: anthrax; 1882: tuberculosis; 1883: cholera — all identified by Koch.","1881: Pasteur's anthrax vaccine; 1885: rabies vaccine."]},{"id":"s2","title":"2. Aseptic surgery","blocks":[{"p":"Antiseptic surgery killed germs with chemicals. From the 1880s surgeons moved to aseptic surgery — preventing germs from entering the wound at all. Instruments were sterilised with steam, operating theatres were cleaned thoroughly, and surgeons wore gowns, masks and caps. Rubber gloves were introduced in 1890 (by the American surgeon William Halsted)."},{"p":"With pain controlled by anaesthetics and infection reduced by aseptic methods, surgeons could attempt longer and more complex operations inside the body. Bleeding remained the main problem."}],"terms":["aseptic surgery","sterilise","antiseptic"],"evidence":["1880s: steam sterilisation.","1890: rubber gloves introduced."]},{"id":"s3","title":"3. The impact of the Public Health Act 1875","blocks":[{"p":"Because the 1875 Act was compulsory, towns built sewers and reservoirs, provided clean water, and appointed Medical Officers of Health. Cholera epidemics ended in Britain after 1866. Death rates in towns fell, though poor housing and poverty still caused high infant mortality."}],"terms":["Medical Officer of Health","infant mortality"],"evidence":["No major cholera epidemic in Britain after 1866.","Councils provided sewers and clean water under the 1875 Act."]},{"id":"s4","title":"4. Science and medicine: blood, magic bullets and radiation","blocks":[{"p":"Blood transfusions: early transfusions often failed because the patient's body rejected the blood. In 1901 Karl Landsteiner discovered blood groups, explaining why — though blood could not yet be stored because it clotted."},{"p":"Magic bullets: Paul Ehrlich, who had worked with Koch, searched for chemicals that would kill a specific germ without harming the patient. After hundreds of tests, his team found Salvarsan 606 (1909), the first 'magic bullet', which cured syphilis."},{"p":"Radioactivity: Wilhelm Röntgen discovered X-rays in 1895, allowing doctors to see bones and objects inside the body. Marie Curie and Pierre Curie discovered radium and polonium in 1898; radium was used to treat cancer. Marie Curie later developed mobile X-ray units in the First World War."}],"terms":["blood group","magic bullet","Salvarsan 606","X-ray","radium"],"evidence":["1895: Röntgen discovers X-rays.","1898: the Curies discover radium.","1901: Landsteiner discovers blood groups.","1909: Salvarsan 606."]}],"timeline":[{"date":"1876","event":"Koch identifies the anthrax bacterium"},{"date":"1881","event":"Pasteur's anthrax vaccine"},{"date":"1882","event":"Koch identifies the tuberculosis bacterium"},{"date":"1885","event":"Pasteur's rabies vaccine"},{"date":"1890","event":"Rubber gloves introduced in surgery"},{"date":"1895","event":"Röntgen discovers X-rays"},{"date":"1898","event":"Marie and Pierre Curie discover radium"},{"date":"1901","event":"Landsteiner discovers blood groups"},{"date":"1909","event":"Ehrlich's Salvarsan 606"}],"people":[{"name":"Robert Koch","role":"Identified the germs causing anthrax, TB and cholera."},{"name":"Louis Pasteur","role":"Developed vaccines in the 1880s."},{"name":"Paul Ehrlich","role":"Found the first magic bullet, Salvarsan 606."},{"name":"Karl Landsteiner","role":"Discovered blood groups (1901)."},{"name":"Wilhelm Röntgen","role":"Discovered X-rays (1895)."},{"name":"Marie Curie","role":"Discovered radium; mobile X-ray units in WWI."}],"vocab":[{"term":"Bacteriology","def":"The study of bacteria."},{"term":"Aseptic","def":"Germ-free — keeping germs out."},{"term":"Magic bullet","def":"A chemical cure that targets one germ."},{"term":"Blood group","def":"Type of blood (A, B, AB, O); must match for transfusion."}],"misconceptions":[{"wrong":"Aseptic and antiseptic mean the same.","right":"Antiseptic kills germs; aseptic keeps germs out in the first place."},{"wrong":"Blood transfusions were routine by 1905.","right":"Blood groups were known, but blood could not be stored until the First World War."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"Which bacterium did Koch identify in 1882?","options":["Cholera","Tuberculosis","Anthrax","Syphilis"],"answer":1,"why":"Cholera followed in 1883."},{"id":"m2","s":"s2","q":"What is aseptic surgery?","options":["Killing germs with carbolic spray","Preventing germs entering the wound","Using anaesthetics","Operating without gloves"],"answer":1,"why":"Steam sterilisation, gowns, gloves."},{"id":"m3","s":"s4","q":"What was Salvarsan 606?","options":["A vaccine","The first magic bullet, curing syphilis","An anaesthetic","A blood group"],"answer":1,"why":"Ehrlich's team, 1909."},{"id":"m4","s":"s4","q":"Who discovered blood groups?","options":["Koch","Landsteiner","Curie","Röntgen"],"answer":1,"why":"1901."},{"id":"m5","s":"s4","q":"Who discovered X-rays in 1895?","options":["Marie Curie","Röntgen","Ehrlich","Lister"],"answer":1,"why":"Wilhelm Röntgen."}],"short":[{"id":"a1","s":"s1","q":"What did Koch use to grow bacteria?","accept":["agar","agar jelly"],"answer":"Agar"},{"id":"a2","s":"s4","q":"Which element did the Curies discover in 1898 that was used against cancer?","accept":["radium"],"answer":"Radium"},{"id":"a3","s":"s2","q":"In what year were rubber gloves introduced in surgery?","accept":["1890"],"answer":"1890"}],"chronology":[{"id":"c1","title":"Put these in order","items":["Anthrax bacterium identified","TB bacterium identified","Rubber gloves","X-rays discovered","Radium discovered","Blood groups discovered","Salvarsan 606"]}],"matching":[{"id":"x1","title":"Match the scientist to the discovery","pairs":[["Koch","Germs of specific diseases"],["Ehrlich","Magic bullets"],["Landsteiner","Blood groups"],["Röntgen","X-rays"],["Curie","Radium"]]}],"evidence":[{"id":"e1","s":"s2","q":"Give precise evidence of aseptic surgery.","keywords":[["steam","steril","gloves","1890","gown","mask"]],"model":"Steam sterilisation of instruments from the 1880s; rubber gloves from 1890; gowns and masks."}]},"flashcards":[{"id":"f1","s":"s1","q":"Why was Koch important?","a":"He proved specific germs cause specific diseases and developed agar and staining.","hint":"Anthrax, TB, cholera."},{"id":"f2","s":"s1","q":"How did rivalry help medicine?","a":"French–German competition between Pasteur and Koch speeded discoveries and vaccines.","hint":"France v Germany."},{"id":"f3","s":"s2","q":"How did aseptic surgery change operations?","a":"Fewer infections, allowing longer and more complex operations inside the body.","hint":"Keep germs out."},{"id":"f4","s":"s3","q":"What was the impact of the 1875 Act?","a":"Sewers, clean water, Medical Officers; cholera epidemics ended; town death rates fell.","hint":"Compulsory."},{"id":"f5","s":"s4","q":"Why did early blood transfusions often fail?","a":"Blood groups were unknown until Landsteiner (1901), so the body rejected unmatched blood.","hint":"Groups."}],"checklist":[{"id":"k1","level":"explain","text":"I can explain the fight against germs, including Koch and bacteriology.","sections":["s1"]},{"id":"k2","level":"explain","text":"I can explain aseptic surgery and how it differed from antiseptic surgery.","sections":["s2"]},{"id":"k3","level":"describe","text":"I can describe the impact of the 1875 Public Health Act.","sections":["s3"]},{"id":"k4","level":"explain","text":"I can explain blood transfusions, magic bullets, Ehrlich, radioactivity and Marie Curie.","sections":["s4"]}],"exam":{"questions":[{"id":"q1","qtype":"p2bb","label":"Past paper: 4HI1/02, June 2025, B2(b) (wording from the published mark scheme)","sections":["s2"],"q":"Explain TWO causes of the lower death rate from surgery in the years 1848–1905.","markscheme":null},{"id":"q2","qtype":"p2ba","label":"Teacher-created practice question","sections":["s2"],"q":"Explain TWO ways in which surgery in the 1890s was different from surgery in the 1860s.","markscheme":null}]},"stretch":[{"id":"t1","kind":"Relative significance","task":"Which was more important by 1905: Koch's bacteriology or aseptic surgery? Who benefited from each?"},{"id":"t2","kind":"Causal links","task":"Show how science and technology (microscopes, dyes, X-rays) linked the discoveries of 1875–1905."}]},"y11-med-4":{"id":"y11-med-4","course":"y11","area":"med","kt":"Key topic 4","order":24,"title":"Government action and war, 1905–20","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following 4HI1 Breadth study B2, key topic 4."},"learn":{"intro":"The Liberal governments of 1906–11 took new responsibility for people's health. Then the First World War created terrible wounds — and pushed forward surgery, X-rays, blood transfusion and the role of women in medicine.","sections":[{"id":"s1","title":"1. The Liberal reforms, 1906–11","blocks":[{"p":"Why? Surveys by Charles Booth (London) and Seebohm Rowntree (York) showed that about a third of people lived in poverty. During the Boer War (1899–1902) many volunteers were rejected as unfit, worrying the government about national strength. The new Labour Party competed for working-class votes, and Liberal politicians such as David Lloyd George and Winston Churchill wanted reform."},{"ul":["1906: free school meals for poor children.","1907: school medical inspections — the School Medical Service.","1908: old-age pensions for over-70s.","1911: National Insurance Act — workers paid in to receive sick pay and free treatment from a doctor (but not their families)."]},{"p":"Impact: the government accepted responsibility for health and welfare, children's health improved, and some sick workers were protected. But wives, children and the unemployed were often left out, and hospital treatment was not covered."}],"terms":["Liberal reforms","National Insurance","School Medical Service"],"evidence":["1906: free school meals.","1907: school medical inspections.","1908: old-age pensions.","1911: National Insurance Act."]},{"id":"s2","title":"2. The First World War: surgery and treatment","blocks":[{"p":"Trench warfare caused huge numbers of wounds from shells and bullets, often infected by soil bacteria (gas gangrene). Doctors developed debridement (cutting away dead tissue), and Carrel–Dakin solution to irrigate wounds."},{"p":"The Thomas splint kept broken legs still and greatly reduced deaths from fractures of the thigh bone. Harold Gillies pioneered plastic surgery to rebuild faces at Queen's Hospital, Sidcup (1917)."},{"p":"X-rays: mobile X-ray units — including those organised by Marie Curie — found bullets and shrapnel near the front line."},{"p":"Blood transfusion: adding sodium citrate stopped blood clotting, so blood could be stored. In 1917 a blood depot was set up before the Battle of Cambrai."}],"terms":["debridement","Thomas splint","plastic surgery","sodium citrate"],"evidence":["Thomas splint reduced deaths from thigh fractures.","1917: Gillies at Sidcup; blood stored before Cambrai.","Mobile X-ray units."]},{"id":"s3","title":"3. The war and women in medicine","blocks":[{"p":"Thousands of women served as nurses, including volunteers in the Voluntary Aid Detachments (VADs) and the First Aid Nursing Yeomanry (FANY), who drove ambulances. Women doctors such as Elsie Inglis set up the Scottish Women's Hospitals, which worked in France and Serbia, after the War Office initially refused her help."},{"p":"The war showed women's skill and courage, and more medical schools admitted women — though many restrictions returned after 1918."}],"terms":["VAD","FANY","Scottish Women's Hospitals"],"evidence":["Elsie Inglis and the Scottish Women's Hospitals.","FANY drove ambulances."]}],"timeline":[{"date":"1899–1902","event":"Boer War reveals unfit recruits"},{"date":"1906","event":"Free school meals"},{"date":"1907","event":"School Medical Service"},{"date":"1908","event":"Old-age pensions"},{"date":"1911","event":"National Insurance Act"},{"date":"1914","event":"First World War begins"},{"date":"1917","event":"Gillies opens Queen's Hospital, Sidcup; blood stored before Cambrai"},{"date":"1918","event":"War ends"}],"people":[{"name":"David Lloyd George","role":"Chancellor; introduced National Insurance (1911)."},{"name":"Charles Booth and Seebohm Rowntree","role":"Surveyed poverty in London and York."},{"name":"Harold Gillies","role":"Pioneer of plastic surgery."},{"name":"Elsie Inglis","role":"Founded the Scottish Women's Hospitals."},{"name":"Marie Curie","role":"Organised mobile X-ray units."}],"vocab":[{"term":"National Insurance","def":"Workers, employers and government paid in; workers received sick pay."},{"term":"Debridement","def":"Cutting away dead or infected tissue."},{"term":"Plastic surgery","def":"Rebuilding damaged parts of the body."}],"misconceptions":[{"wrong":"National Insurance covered everyone.","right":"It covered insured workers, not their families or the unemployed."},{"wrong":"War only destroys — it did not help medicine.","right":"It speeded developments in surgery, X-rays and blood storage, though at terrible cost."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"What did the 1911 National Insurance Act provide?","options":["Free hospitals for all","Sick pay and a doctor for insured workers","Old-age pensions","Free school meals"],"answer":1,"why":"Families were not covered."},{"id":"m2","s":"s1","q":"Why did the Boer War worry the government?","options":["Too many doctors","Many volunteers were unfit","It caused cholera","It ended National Insurance"],"answer":1,"why":"A sign of poor national health."},{"id":"m3","s":"s2","q":"What did sodium citrate do?","options":["Killed germs","Stopped blood clotting so it could be stored","Numbed pain","Showed bullets"],"answer":1,"why":"Allowing blood depots by 1917."},{"id":"m4","s":"s2","q":"Who pioneered plastic surgery at Sidcup?","options":["Lister","Gillies","McIndoe","Fleming"],"answer":1,"why":"1917."},{"id":"m5","s":"s3","q":"Who set up the Scottish Women's Hospitals?","options":["Elizabeth Garrett","Elsie Inglis","Florence Nightingale","Marie Curie"],"answer":1,"why":"Worked in France and Serbia."}],"short":[{"id":"a1","s":"s1","q":"In which year was the School Medical Service introduced?","accept":["1907"],"answer":"1907"},{"id":"a2","s":"s2","q":"Which splint reduced deaths from broken thigh bones?","accept":["thomas splint","the thomas splint","thomas"],"answer":"The Thomas splint"},{"id":"a3","s":"s1","q":"Name one person who surveyed poverty before 1906.","accept":["booth","charles booth","rowntree","seebohm rowntree"],"answer":"Charles Booth or Seebohm Rowntree"}],"chronology":[{"id":"c1","title":"Put these in order","items":["Boer War","Free school meals","School Medical Service","Old-age pensions","National Insurance Act","Queen's Hospital, Sidcup"]}],"matching":[{"id":"x1","title":"Match the wartime development to its purpose","pairs":[["Thomas splint","Keeping broken legs still"],["Mobile X-rays","Finding bullets and shrapnel"],["Sodium citrate","Storing blood"],["Plastic surgery","Rebuilding faces"]]}],"evidence":[{"id":"e1","s":"s1","q":"Give precise evidence of Liberal public health measures.","keywords":[["1906","1907","1908","1911","school meals","medical","pension","national insurance"]],"model":"Free school meals (1906), school medical inspections (1907), old-age pensions (1908), National Insurance (1911)."}]},"flashcards":[{"id":"f1","s":"s1","q":"Give three reasons for the Liberal reforms.","a":"Booth and Rowntree's surveys; unfit Boer War recruits; competition from Labour; reforming Liberal politicians.","hint":"Poverty, war, votes."},{"id":"f2","s":"s1","q":"What were the limits of National Insurance?","a":"Only insured workers; not families, the unemployed or hospital treatment.","hint":"Who was left out?"},{"id":"f3","s":"s2","q":"How did the war improve treatment of infected wounds?","a":"Debridement and Carrel–Dakin solution to irrigate wounds.","hint":"Gas gangrene."},{"id":"f4","s":"s2","q":"Why was blood storage important?","a":"Sodium citrate stopped clotting, so blood could be stored and given to wounded soldiers quickly.","hint":"Cambrai 1917."},{"id":"f5","s":"s3","q":"How did the war affect women in medicine?","a":"Nurses, VADs, FANY drivers, women doctors like Elsie Inglis showed their abilities; more medical schools admitted women.","hint":"Inglis."}],"checklist":[{"id":"k1","level":"explain","text":"I can explain the reasons for and impact on public health of the Liberal reforms (1906–11).","sections":["s1"]},{"id":"k2","level":"explain","text":"I can explain how the First World War improved surgery, X-rays, blood transfusion and fighting infection.","sections":["s2"]},{"id":"k3","level":"describe","text":"I can describe the importance of the First World War for women in medicine.","sections":["s3"]}],"exam":{"questions":[{"id":"q1","qtype":"p2bc","label":"Past paper: 4HI1/02, June 2025, B2(c)(i) (wording from the published mark scheme)","sections":["s1"],"q":"How far did public health provision improve in the years 1848–1911?\nExplain your answer.","prompts":["the Public Health Act (1848)","the School Medical Service (1907)"],"markscheme":null},{"id":"q2","qtype":"p2bb","label":"Teacher-created practice question","sections":["s1"],"q":"Explain TWO causes of the Liberal government's public health reforms of 1906–11.","markscheme":null}]},"stretch":[{"id":"t1","kind":"Relative significance","task":"Was war or government action more important for medicine in 1905–20? Judge by how many people benefited."},{"id":"t2","kind":"Change and continuity","task":"Compare the Public Health Acts of 1848 and 1875 with the Liberal reforms. What new idea of government responsibility appeared?"}]},"y11-med-5":{"id":"y11-med-5","course":"y11","area":"med","kt":"Key topic 5","order":25,"title":"Advances in medicine, surgery and public health, 1920–48: the NHS","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following 4HI1 Breadth study B2, key topic 5."},"learn":{"intro":"Penicillin became the first mass-produced antibiotic, the Second World War pushed surgery forward again, and the Beveridge Report led to the creation of the NHS in 1948.","sections":[{"id":"s1","title":"1. Penicillin: Fleming, Florey and Chain","blocks":[{"p":"In 1928 Alexander Fleming noticed that mould (penicillium) had killed bacteria on a culture plate at St Mary's Hospital, London. He published his findings but lacked the funding and chemists to produce enough penicillin to use as a medicine."},{"p":"From 1938 Howard Florey and Ernst Chain at Oxford worked out how to purify penicillin and tested it on mice (1940) and then on a patient, the policeman Albert Alexander (1941), who improved before supplies ran out."},{"p":"British firms were busy with war production, so Florey went to the USA. After the USA entered the war, the government funded mass production; by D-Day (June 1944) there was enough penicillin to treat Allied casualties. After the war it became widely available and led to other antibiotics."}],"terms":["antibiotic","penicillin","mass production"],"evidence":["1928: Fleming discovers penicillin.","1940–41: Florey and Chain's tests; Albert Alexander.","1944: enough penicillin for D-Day casualties."]},{"id":"s2","title":"2. The Second World War: surgery, blood and women","blocks":[{"p":"Skin grafts: Archibald McIndoe treated badly burned RAF pilots at East Grinstead, developing new skin-graft techniques. His patients formed the 'Guinea Pig Club' and he helped them return to normal life."},{"p":"Blood transfusion: blood banks stored large amounts of blood for air-raid victims and soldiers; the National Blood Transfusion Service followed in 1946."},{"p":"Women in medicine: more women trained and worked as doctors and nurses during the war, and the Goodenough Report (1944) recommended that all medical schools should admit women."}],"terms":["skin graft","Guinea Pig Club","blood bank"],"evidence":["McIndoe at East Grinstead; the Guinea Pig Club.","1946: National Blood Transfusion Service."]},{"id":"s3","title":"3. Beveridge and the NHS","blocks":[{"p":"The Beveridge Report (1942) identified 'five giants' to defeat — Want, Disease, Ignorance, Squalor and Idleness — and proposed a welfare state with a national health service. The war had shown what government organisation could do (the Emergency Medical Service), and people wanted a fairer society."},{"p":"The Labour government elected in 1945 introduced the NHS. Aneurin Bevan, the Health Minister, overcame opposition from many doctors by allowing them to keep private patients. The NHS began on 5 July 1948, free at the point of use for everyone."},{"p":"Importance for public health: everyone could see a doctor, get hospital treatment, glasses and dentures without paying; demand was huge; vaccination and health visiting were organised nationally. Access to health care was transformed — though costs rose quickly."}],"terms":["Beveridge Report","welfare state","NHS","free at the point of use"],"evidence":["1942: Beveridge Report — five giants.","1945: Labour government.","5 July 1948: NHS begins."]}],"timeline":[{"date":"1928","event":"Fleming discovers penicillin"},{"date":"1940","event":"Florey and Chain test penicillin on mice"},{"date":"1941","event":"Penicillin used on Albert Alexander"},{"date":"1942","event":"Beveridge Report"},{"date":"1944","event":"Mass-produced penicillin available for D-Day"},{"date":"1945","event":"Labour government elected"},{"date":"1946","event":"National Blood Transfusion Service"},{"date":"5 July 1948","event":"NHS begins"}],"people":[{"name":"Alexander Fleming","role":"Discovered penicillin (1928)."},{"name":"Howard Florey and Ernst Chain","role":"Developed penicillin as a medicine."},{"name":"Archibald McIndoe","role":"Skin grafts for burned airmen."},{"name":"William Beveridge","role":"Wrote the 1942 report."},{"name":"Aneurin Bevan","role":"Health Minister who created the NHS."}],"vocab":[{"term":"Antibiotic","def":"A drug that kills bacteria."},{"term":"Welfare state","def":"Government providing health, education and benefits for all."},{"term":"Skin graft","def":"Moving healthy skin to repair damage."}],"misconceptions":[{"wrong":"Fleming developed penicillin into a medicine.","right":"He discovered it; Florey and Chain developed it, and US funding mass-produced it."},{"wrong":"All doctors welcomed the NHS.","right":"Many opposed it until Bevan let them keep private patients."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"Who discovered penicillin in 1928?","options":["Florey","Chain","Fleming","Ehrlich"],"answer":2,"why":"At St Mary's Hospital."},{"id":"m2","s":"s1","q":"Why was penicillin mass-produced in the USA?","options":["Fleming moved there","British firms were busy with war production and the US government funded it","It was invented there","The NHS required it"],"answer":1,"why":"By D-Day 1944 there was enough for casualties."},{"id":"m3","s":"s2","q":"Who treated burned pilots with skin grafts?","options":["Gillies","McIndoe","Bevan","Lister"],"answer":1,"why":"At East Grinstead — the Guinea Pig Club."},{"id":"m4","s":"s3","q":"What were the 'five giants'?","options":["Five diseases","Want, Disease, Ignorance, Squalor, Idleness","Five hospitals","Five doctors"],"answer":1,"why":"Beveridge Report, 1942."},{"id":"m5","s":"s3","q":"How did Bevan win doctors' support for the NHS?","options":["Doubling their pay","Letting them keep private patients","Closing hospitals","Making the NHS optional"],"answer":1,"why":"He 'stuffed their mouths with gold'."}],"short":[{"id":"a1","s":"s3","q":"On what date did the NHS begin?","accept":["5 july 1948","5th july 1948","july 5 1948","5 july"],"answer":"5 July 1948"},{"id":"a2","s":"s3","q":"Which minister created the NHS?","accept":["bevan","aneurin bevan","nye bevan"],"answer":"Aneurin Bevan"},{"id":"a3","s":"s1","q":"Who was the first patient treated with penicillin by Florey's team?","accept":["albert alexander","alexander"],"answer":"Albert Alexander"}],"chronology":[{"id":"c1","title":"Put these in order","items":["Fleming's discovery","Tests on mice","Albert Alexander treated","Beveridge Report","Penicillin for D-Day","NHS begins"]}],"matching":[{"id":"x1","title":"Match the person to their contribution","pairs":[["Fleming","Discovered penicillin"],["Florey and Chain","Developed penicillin"],["McIndoe","Skin grafts"],["Beveridge","Five giants report"],["Bevan","Created the NHS"]]}],"evidence":[{"id":"e1","s":"s1","q":"Give precise evidence of how penicillin was developed.","keywords":[["1928","fleming","florey","chain","1941","alexander","usa","d-day","1944"]],"model":"Fleming discovered it (1928); Florey and Chain purified and tested it (1940–41); US government funding mass-produced it for D-Day (1944)."}]},"flashcards":[{"id":"f1","s":"s1","q":"Why couldn't Fleming develop penicillin himself?","a":"He lacked funding and chemists to produce and purify it.","hint":"Money and chemists."},{"id":"f2","s":"s1","q":"How did the Second World War help penicillin?","a":"Demand for treating wounds led the US government to fund mass production.","hint":"D-Day."},{"id":"f3","s":"s2","q":"What was the Guinea Pig Club?","a":"McIndoe's burned RAF patients who had experimental skin grafts.","hint":"East Grinstead."},{"id":"f4","s":"s3","q":"Why was the NHS created in 1948?","a":"Beveridge Report; wartime experience of state organisation; desire for fairness; Labour's 1945 victory.","hint":"Five giants."},{"id":"f5","s":"s3","q":"Why was the NHS important for public health?","a":"Free care for everyone — doctors, hospitals, glasses, dentures; national vaccination and health visiting.","hint":"Free for all."}],"checklist":[{"id":"k1","level":"explain","text":"I can explain the development of penicillin and the roles of Fleming, Florey and Chain.","sections":["s1"]},{"id":"k2","level":"explain","text":"I can explain the importance of the Second World War for surgery, blood transfusion and women in medicine.","sections":["s2"]},{"id":"k3","level":"judge","text":"I can judge the importance of Beveridge and the NHS for public health.","sections":["s3"]}],"exam":{"questions":[{"id":"q1","qtype":"p2bc","label":"Past paper: 4HI1/02, June 2025, B2(c)(ii) (wording from the published mark scheme)","sections":["s1","s2"],"q":"How far were technological advances the main reason for improvements in surgery in the years 1905–45?\nExplain your answer.","prompts":["X-rays","the Second World War"],"markscheme":null},{"id":"q2","qtype":"p2bc","label":"Adapted from the Arcadia IGCSE model paragraphs","sections":["s1"],"q":"How far was the discovery of penicillin in the 1920s a key turning point in the treatment of disease?\nExplain your answer.","prompts":["Fleming's discovery (1928)","the Second World War"],"model":[{"t":"The discovery of penicillin was a turning point to a large extent because it transformed the treatment of infection.","n":"Topic sentence with qualifier."},{"t":"Firstly, Alexander Fleming identified penicillin in 1928 as the first effective antibiotic. This shows that treatment could now kill bacteria, rather than just manage symptoms.","n":"Time connective + precise evidence + explanation."},{"t":"Secondly, in the 1940s Florey and Chain developed methods to mass-produce penicillin, which saved thousands of lives during the Second World War.","n":"Second piece of evidence."},{"t":"Finally, after the war penicillin became widely available and inspired other antibiotics such as streptomycin. This was significant because it marked a permanent change in the treatment of disease, making bacterial infections curable rather than fatal.","n":"Criteria to justify (duration, impact)."}],"model_note":"From the Arcadia IGCSE model paragraphs.","markscheme":null}]},"stretch":[{"id":"t1","kind":"Relative significance","task":"Individuals, war or government: which mattered most for medicine in 1920–48? Use penicillin and the NHS as test cases."},{"id":"t2","kind":"Change and continuity","task":"Compare health care in 1848 and 1948. What were the three biggest changes?"}]},"y11-us-1":{"id":"y11-us-1","course":"y11","area":"us","kt":"Key topic 1","order":11,"title":"The Red Scare and McCarthyism","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following 4HI1 Depth study 7, key topic 1. No class textbook uploaded for this option yet."},"learn":{"intro":"After 1945 Americans feared communism abroad and spies at home. Senator Joseph McCarthy exploited that fear — until television helped bring him down.","sections":[{"id":"s1","title":"1. Reasons for the Red Scare","blocks":[{"p":"The Cold War, 1945–50: the USSR took control of Eastern Europe; the Berlin Blockade (1948–49) raised tension; in 1949 the USSR tested an atomic bomb and China became communist; in June 1950 the Korean War began. Many Americans felt communism was spreading and feared enemies inside the USA."},{"p":"Spy cases seemed to prove the danger. Alger Hiss, a former State Department official, was accused in 1948 of spying for the USSR and convicted of perjury (lying under oath) in 1950. Julius and Ethel Rosenberg were arrested in 1950 for passing atomic secrets and executed in 1953."},{"p":"Government action: President Truman's Loyalty Program (1947) investigated millions of federal employees. The FBI under J. Edgar Hoover watched suspected communists. The House Un-American Activities Committee (HUAC) investigated Hollywood: in 1947 the 'Hollywood Ten' refused to answer its questions, were jailed and blacklisted."}],"terms":["Cold War","Red Scare","HUAC","Hollywood Ten","blacklist"],"evidence":["1947: Loyalty Program; Hollywood Ten.","1949: Soviet atomic bomb; communist China.","1950: Hiss convicted; Korean War.","1953: Rosenbergs executed."]},{"id":"s2","title":"2. McCarthy's methods and the growth of opposition","blocks":[{"p":"On 9 February 1950, in a speech at Wheeling, West Virginia, Senator Joseph McCarthy claimed to have a list of 205 communists working in the State Department. He never produced proof."},{"p":"His methods: making accusations without evidence, changing his numbers, smearing opponents as 'soft on communism', bullying witnesses at hearings, and using the press to spread his claims. From 1953 he chaired a Senate investigations subcommittee. People feared that if they criticised him they would be accused next."},{"p":"Opposition grew. In June 1950 Senator Margaret Chase Smith made her 'Declaration of Conscience' speech against his tactics. In March 1954 journalist Edward R. Murrow's television programme See It Now exposed McCarthy's methods."}],"terms":["McCarthyism","smear","Declaration of Conscience"],"evidence":["9 February 1950: Wheeling speech — '205' names.","June 1950: Margaret Chase Smith's 'Declaration of Conscience'.","March 1954: Murrow's See It Now."]},{"id":"s3","title":"3. McCarthy's downfall and the impact of McCarthyism","blocks":[{"p":"McCarthy went too far when he accused the US Army of hiding communists. The Army–McCarthy hearings (April–June 1954) were shown on television to millions. Viewers saw him bully witnesses; the Army's lawyer Joseph Welch asked, 'Have you no sense of decency, sir?' His popularity collapsed. In December 1954 the Senate voted to censure him. He died in 1957."},{"p":"Impact: thousands lost their jobs; blacklists damaged careers in film, education and government; loyalty oaths spread; people were afraid to express opinions or join organisations, and free speech suffered. It also made anti-communism a central part of US politics for decades."}],"terms":["Army–McCarthy hearings","censure","loyalty oath"],"evidence":["April–June 1954: televised Army–McCarthy hearings.","December 1954: Senate censures McCarthy.","1957: McCarthy dies."]}],"timeline":[{"date":"1947","event":"Truman's Loyalty Program; HUAC and the Hollywood Ten"},{"date":"1948","event":"Alger Hiss accused of spying"},{"date":"1949","event":"Soviet atomic bomb; China becomes communist"},{"date":"Feb 1950","event":"McCarthy's Wheeling speech"},{"date":"June 1950","event":"Korean War begins; 'Declaration of Conscience'"},{"date":"1953","event":"Rosenbergs executed"},{"date":"March 1954","event":"Murrow's See It Now attacks McCarthy"},{"date":"April–June 1954","event":"Army–McCarthy hearings televised"},{"date":"Dec 1954","event":"Senate censures McCarthy"}],"people":[{"name":"Joseph McCarthy","role":"Republican Senator for Wisconsin."},{"name":"J. Edgar Hoover","role":"Director of the FBI."},{"name":"Alger Hiss","role":"Former State Department official convicted of perjury in 1950."},{"name":"Julius and Ethel Rosenberg","role":"Executed in 1953 for passing atomic secrets."},{"name":"Edward R. Murrow","role":"TV journalist who exposed McCarthy."},{"name":"Joseph Welch","role":"Army lawyer at the 1954 hearings."},{"name":"Margaret Chase Smith","role":"Senator who spoke out in 1950."}],"vocab":[{"term":"Red Scare","def":"Fear of communism in the USA."},{"term":"HUAC","def":"House Un-American Activities Committee."},{"term":"Blacklist","def":"A list of people refused work because of suspected communism."},{"term":"Censure","def":"Formal criticism by the Senate."}],"misconceptions":[{"wrong":"McCarthy started the Red Scare.","right":"It began before him — the Loyalty Program and HUAC date from 1947."},{"wrong":"McCarthy's accusations were based on solid evidence.","right":"He never proved his claims and changed his numbers."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"Which 1949 events increased American fear of communism?","options":["Korean War and Watergate","Soviet atomic bomb and communist China","Berlin Wall and Cuba","Hiss and Rosenbergs executed"],"answer":1,"why":"Both in 1949."},{"id":"m2","s":"s1","q":"Who were the Hollywood Ten?","options":["Film stars who supported McCarthy","Writers and directors jailed for refusing to answer HUAC","FBI agents","Soviet spies"],"answer":1,"why":"1947; they were blacklisted."},{"id":"m3","s":"s2","q":"How many communists did McCarthy claim were in the State Department in 1950?","options":["12","57","205","1,000"],"answer":2,"why":"Wheeling speech, February 1950."},{"id":"m4","s":"s3","q":"What turned public opinion against McCarthy?","options":["The Korean War","The televised Army–McCarthy hearings","The Rosenberg trial","The Hollywood Ten"],"answer":1,"why":"Millions saw his bullying."},{"id":"m5","s":"s3","q":"What did the Senate do in December 1954?","options":["Promote McCarthy","Censure McCarthy","Ban the Communist Party","Abolish HUAC"],"answer":1,"why":"A formal condemnation."}],"short":[{"id":"a1","s":"s2","q":"Which journalist exposed McCarthy on See It Now?","accept":["murrow","edward murrow","edward r murrow","ed murrow"],"answer":"Edward R. Murrow"},{"id":"a2","s":"s1","q":"Who led the FBI?","accept":["hoover","j edgar hoover","edgar hoover"],"answer":"J. Edgar Hoover"},{"id":"a3","s":"s1","q":"Which couple were executed in 1953 for spying?","accept":["rosenbergs","the rosenbergs","julius and ethel rosenberg","rosenberg"],"answer":"Julius and Ethel Rosenberg"}],"chronology":[{"id":"c1","title":"Put these in order","items":["Hollywood Ten","Soviet atomic bomb","Wheeling speech","Rosenbergs executed","Army–McCarthy hearings","McCarthy censured"]}],"matching":[{"id":"x1","title":"Match the person to their role","pairs":[["McCarthy","Senator who made accusations"],["Murrow","TV journalist"],["Welch","Army lawyer"],["Hoover","FBI director"],["Hiss","Accused State Department official"]]}],"evidence":[{"id":"e1","s":"s3","q":"Give precise evidence of the media's role in McCarthy's downfall.","keywords":[["murrow","see it now","television","televised","hearings","welch","1954"]],"model":"Murrow's See It Now (March 1954) and the televised Army–McCarthy hearings (April–June 1954) showed millions his methods."}]},"flashcards":[{"id":"f1","s":"s1","q":"Give three Cold War reasons for the Red Scare.","a":"Soviet control of Eastern Europe; Soviet atomic bomb 1949; communist China 1949; Korean War 1950.","hint":"1949."},{"id":"f2","s":"s1","q":"What was HUAC?","a":"The House Un-American Activities Committee, which investigated suspected communists, including in Hollywood.","hint":"Committee."},{"id":"f3","s":"s2","q":"Describe two of McCarthy's methods.","a":"Accusations without evidence; changing numbers; bullying witnesses; smearing opponents; using the press.","hint":"Smear."},{"id":"f4","s":"s3","q":"Give two reasons for McCarthy's downfall.","a":"He attacked the army; televised hearings exposed him; Murrow's programme; Senate censure.","hint":"Army + TV."},{"id":"f5","s":"s3","q":"Give two effects of McCarthyism.","a":"Lost jobs and blacklists; loyalty oaths; fear and conformity; anti-communism central to politics.","hint":"Fear."}],"checklist":[{"id":"k1","level":"explain","text":"I can explain the reasons for the Red Scare, including the Cold War, Hiss, the Rosenbergs, the FBI and HUAC.","sections":["s1"]},{"id":"k2","level":"describe","text":"I can describe McCarthy's methods and the growth of opposition.","sections":["s2"]},{"id":"k3","level":"explain","text":"I can explain the reasons for McCarthy's downfall.","sections":["s3"]},{"id":"k4","level":"judge","text":"I can judge the overall impact of McCarthyism on the USA.","sections":["s3"]}],"exam":{"questions":[{"id":"q1","qtype":"p1c","label":"Past paper: 4HI1/01, June 2025, Q7(c)(i)","sections":["s2","s3"],"q":"‘The main reason for the downfall of McCarthy was the media.’\nHow far do you agree? Explain your answer.","prompts":["the media","the army"],"markscheme":null},{"id":"q2","qtype":"p1b","label":"Teacher-created practice question","sections":["s3"],"q":"Explain two effects of McCarthyism on the USA.","markscheme":null}]},"stretch":[{"id":"t1","kind":"Competing arguments","task":"Was McCarthy the cause of McCarthyism or a symptom of the Red Scare? Use dates to argue."},{"id":"t2","kind":"Relative significance","task":"Media, the army or McCarthy himself — which mattered most to his downfall?"}]},"y11-us-2":{"id":"y11-us-2","course":"y11","area":"us","kt":"Key topic 2","order":12,"title":"Civil rights in the 1950s","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following 4HI1 Depth study 7, key topic 2. Kept separate from Year 13 IAL civil rights."},"learn":{"intro":"In 1950 black Americans in the South lived under segregation and most could not vote. In the 1950s the Supreme Court, ordinary people and courageous campaigns began to challenge this.","sections":[{"id":"s1","title":"1. Segregation, discrimination, the courts and Congress","blocks":[{"p":"In the southern states 'Jim Crow' laws segregated schools, transport, restaurants and even water fountains. Most black southerners could not vote because of literacy tests, poll taxes and intimidation. In the North there was no legal segregation, but discrimination in housing and jobs kept many black Americans in poor areas (ghettos)."},{"p":"The Supreme Court could overturn unfair laws, and the NAACP used court cases to challenge segregation. Congress was slow to act, because southern Democrats held powerful positions and used the filibuster to block civil rights bills."}],"terms":["segregation","discrimination","Jim Crow laws","NAACP","filibuster"],"evidence":["Southern segregation in schools, transport and public places.","Literacy tests and poll taxes kept black southerners from voting."]},{"id":"s2","title":"2. Brown v Board of Education and Emmett Till","blocks":[{"p":"In 1954 the NAACP's lawyer Thurgood Marshall won Brown v Board of Education of Topeka. The Supreme Court, led by Chief Justice Earl Warren, ruled unanimously that segregated schools were unconstitutional. But in 1955 it only said desegregation should happen 'with all deliberate speed', so many southern states delayed."},{"p":"In August 1955 Emmett Till, a 14-year-old black boy from Chicago, was murdered in Mississippi for supposedly whistling at a white woman. His mother insisted on an open-casket funeral, and photographs shocked the nation. His killers were found not guilty by an all-white jury and later admitted the murder. The case pushed many to act."}],"terms":["Brown v Board","unconstitutional","all deliberate speed"],"evidence":["1954: Brown v Board (unanimous).","August 1955: Emmett Till murdered; killers acquitted."]},{"id":"s3","title":"3. Montgomery and Little Rock","blocks":[{"p":"On 1 December 1955 Rosa Parks, an NAACP secretary, was arrested in Montgomery, Alabama, for refusing to give up her bus seat to a white man. Black residents boycotted the buses for 381 days, organised by the Montgomery Improvement Association led by Martin Luther King. In 1956 the Supreme Court ruled bus segregation unconstitutional. The boycott showed the power of peaceful mass protest and made King a national leader."},{"p":"In September 1957 nine black students tried to attend Central High School in Little Rock, Arkansas. Governor Orval Faubus used the National Guard to keep them out and white mobs abused them. President Eisenhower sent federal troops to protect the 'Little Rock Nine' — showing the federal government would enforce the law, although it acted reluctantly."}],"terms":["boycott","Montgomery Improvement Association","Little Rock Nine"],"evidence":["1 December 1955: Rosa Parks arrested.","381-day bus boycott.","September 1957: Little Rock; Eisenhower sends troops."]},{"id":"s4","title":"4. The Civil Rights Act 1957 and the revival of the KKK","blocks":[{"p":"The Civil Rights Act of 1957 was the first civil rights law since Reconstruction. It set up a Civil Rights Commission and a Civil Rights Division in the Justice Department to deal with voting rights. It was weakened by southern senators and did little in practice, but it was a significant start."},{"p":"White resistance grew: White Citizens' Councils organised against desegregation, and the Ku Klux Klan revived, using intimidation, bombings and murder."}],"terms":["Civil Rights Act 1957","Ku Klux Klan","White Citizens' Councils"],"evidence":["1957: Civil Rights Act — Commission and Justice Department division."]}],"timeline":[{"date":"May 1954","event":"Brown v Board of Education"},{"date":"Aug 1955","event":"Murder of Emmett Till"},{"date":"Dec 1955","event":"Rosa Parks arrested; boycott begins"},{"date":"Dec 1956","event":"Montgomery buses desegregated"},{"date":"Sept 1957","event":"Little Rock crisis; Civil Rights Act"}],"people":[{"name":"Thurgood Marshall","role":"NAACP lawyer in Brown v Board."},{"name":"Earl Warren","role":"Chief Justice of the Supreme Court."},{"name":"Emmett Till","role":"14-year-old murdered in Mississippi, 1955."},{"name":"Rosa Parks","role":"Her arrest began the Montgomery Bus Boycott."},{"name":"Martin Luther King","role":"Led the Montgomery Improvement Association."},{"name":"Orval Faubus","role":"Governor of Arkansas who resisted integration."},{"name":"Dwight Eisenhower","role":"President who sent troops to Little Rock."}],"vocab":[{"term":"Segregation","def":"Keeping people apart by race."},{"term":"Boycott","def":"Refusing to use a service as a protest."},{"term":"NAACP","def":"National Association for the Advancement of Colored People."},{"term":"Desegregation","def":"Ending segregation."}],"misconceptions":[{"wrong":"Rosa Parks was simply a tired woman who refused to move.","right":"She was an experienced NAACP activist; the boycott was carefully organised."},{"wrong":"Brown v Board ended school segregation immediately.","right":"'All deliberate speed' let southern states delay for years."}]},"quizzes":{"mcq":[{"id":"m1","s":"s2","q":"What did Brown v Board (1954) rule?","options":["Bus segregation was illegal","Segregated schools were unconstitutional","Black Americans could vote","Lynching was illegal"],"answer":1,"why":"A unanimous decision."},{"id":"m2","s":"s3","q":"How long did the Montgomery Bus Boycott last?","options":["38 days","381 days","3 years","1 week"],"answer":1,"why":"December 1955 – December 1956."},{"id":"m3","s":"s3","q":"Who sent troops to Little Rock in 1957?","options":["Truman","Eisenhower","Kennedy","Faubus"],"answer":1,"why":"To protect the Little Rock Nine."},{"id":"m4","s":"s4","q":"What did the Civil Rights Act 1957 set up?","options":["Desegregated schools","A Civil Rights Commission","The NAACP","Voting at 18"],"answer":1,"why":"Plus a Justice Department division."},{"id":"m5","s":"s2","q":"Why did the Emmett Till case matter?","options":["It led to Brown v Board","Photographs shocked the nation and pushed people to act","Till became a lawyer","The killers were jailed for life"],"answer":1,"why":"His mother's open-casket funeral."}],"short":[{"id":"a1","s":"s3","q":"Whose arrest began the Montgomery Bus Boycott?","accept":["rosa parks","parks"],"answer":"Rosa Parks"},{"id":"a2","s":"s3","q":"Which governor tried to stop the Little Rock Nine?","accept":["faubus","orval faubus"],"answer":"Orval Faubus"},{"id":"a3","s":"s2","q":"Which NAACP lawyer won Brown v Board?","accept":["thurgood marshall","marshall"],"answer":"Thurgood Marshall"}],"chronology":[{"id":"c1","title":"Put these in order","items":["Brown v Board","Emmett Till murdered","Rosa Parks arrested","Buses desegregated","Little Rock crisis"]}],"matching":[{"id":"x1","title":"Match the event to its place","pairs":[["Bus boycott","Montgomery, Alabama"],["School crisis 1957","Little Rock, Arkansas"],["Emmett Till murdered","Mississippi"],["Brown v Board","Topeka, Kansas"]]}],"evidence":[{"id":"e1","s":"s3","q":"Give precise evidence of the success of the Montgomery
