","marks":50,"weighting":"50% of IA2; 25% of IAL","structure":"Section A: one compulsory question on two extracts by historians about the causes of the Cold War, 1943–53 — 25 marks (AO3 20 + AO1 5). Section B: ONE essay from a choice of two on 1953–90, 25 marks (AO1).","qtypes":["u4a","u4b"]}],"themes":["The role of Congress, the presidency and the Supreme Court","Pressure groups and individuals campaigning for civil rights","Forces resisting civil rights","Changing economic and educational opportunities for black Americans","Changing patterns of settlement and housing"],"aos":[{"ao":"AO1","text":"Demonstrate, organise and communicate knowledge and understanding to analyse and evaluate the key features related to the periods studied, making substantiated judgements","weight":"Section B (25 marks)"},{"ao":"AO2","text":"Analyse and evaluate appropriate source material, primary and/or contemporary to the period, within its historical context","weight":"Section A (25 marks)"},{"ao":"AO3","text":"Analyse and evaluate, in relation to the historical context, different ways in which aspects of the past have been interpreted","weight":"Unit 4 Section A (20 of 25 marks)"}],"sources":[{"title":"IAL History specification, Issue 6, July 2021","url":"https://qualifications.pearson.com/content/dam/pdf/International%20Advanced%20Level/history/2015/specification-and-sample-assessments/IAL-History-Specification.pdf"},{"title":"WHI03/1D question paper, January 2022","url":"https://qualifications.pearson.com/content/dam/pdf/International%20Advanced%20Level/history/2015/Exam-materials/WHI03_1D_que_20220108.pdf"},{"title":"WHI03/1D mark scheme, January 2021","url":"https://qualifications.pearson.com/content/dam/pdf/International%20Advanced%20Level/history/2015/Exam-materials/WHI03_1D_msc_20210304.pdf"},{"title":"Getting Ready to Teach IAL History Module 2 delegate booklet (uploaded) — generic Unit 3 mark schemes"},{"title":"Civil Rights Question 2 essay steps (uploaded)"},{"title":"WHI04/1C mark scheme, June 2025 — AO1 5 + AO3 20; five levels","url":"https://pmt.physicsandmathstutor.com/download/History/A-level/Past-Papers/Edexcel-IAL/Paper-4/Option-1C/MS/June%202025%20(IAL)%20MS%201C.pdf"},{"title":"IAL History specification Issue 6 — Unit 4 Option 1C content (uploaded copy)"}],"conflicts":["Section B levels: the training booklet's Unit 3 Section B table shows four levels (1–6 … 19–25), but its own examiner commentary refers to Level 5, and the January 2021 WHI03/1D mark scheme has five levels (1–4, 5–8, 9–14, 15–20, 21–25). The site uses the five-level ranges from the published mark scheme.","Your Question 2 deck says 'Use the PEEJ writing frame and SPEND throughout'. Your saved preference is PEEJ, never SPEND, and your factor sheet uses SPEDA (statistics, key people, events, dates, acts/laws). The site uses PEEJ with SPEDA — tell me if you want SPEND instead."],"open_questions":["You said the class probably takes Unit 4 Superpowers. The exam guide is ready; I will write the four topics once you confirm."]},"qtypes":{"u3a":{"label":"Section A — use two sources together","paper":"Unit 3 Section A","marks":25,"minutes":60,"ao":"AO2","requires_sources":true,"template":"How far could the historian make use of Sources 1 and 2 together to investigate …? Explain your answer, using both sources, the information given about them and your own knowledge of the historical context.","asks":"Judge how useful the two sources are, together, for the specific enquiry. Interrogate what each source shows (inference), test it against context, weigh the provenance, and explain how the sources complement or limit each other.","steps":["Decode the enquiry (5 minutes): underline exactly what the historian is investigating and the dates.","Read both sources and their provenance; annotate who, when, why, for whom.","Source 1: make 2–3 developed inferences relevant to the enquiry; support or challenge each with precise context.","Source 2: the same, then show how it adds to, confirms or contradicts Source 1.","Evaluate weight: how do nature, purpose, audience and the author's position affect how far each can be trusted for this enquiry? Separate information from claim or opinion.","Judgement: how far the sources together can be used, and with what degree of certainty."],"plan":"About 60 minutes: 10 minutes reading and planning, 45 minutes writing, 5 minutes checking.","success":["Interrogates both sources with reasoned inferences, separating information from claim or opinion","Uses precise contextual knowledge to illuminate and test the sources' limitations","Shows understanding of the values and concerns of the society the sources come from","Evaluates with justified criteria, weighing the evidence and the degree of certainty it supports"],"mistakes":["Summarising or paraphrasing the sources instead of making inferences","Adding context as a separate block instead of applying it to the sources","Stereotypical provenance comments ('it's biased because he was there')","Treating the sources separately with no comment on using them together","Drifting into answering the history question instead of judging the sources"],"frames":[{"name":"Two-source frame","full":["Introduction: Together, Sources 1 and 2 are useful to a large / some / limited extent for investigating … because …","Source 1 suggests that … (inference). This is supported / challenged by [context] … The author, …, writing in … for …, means that …","Source 2 adds that … This is reliable for … because … However, its purpose was …, so the claim that … should be treated with caution.","Using them together: Source 1 shows …, whereas Source 2 reveals … Together they … but neither shows …","Judgement: Overall, the historian can use the sources together with confidence for … but less for … because …"],"some":["Overall judgement on the enquiry","Source 1: inference + context + provenance","Source 2: inference + context + provenance","Together: complement / contradict / gaps","Judgement with degree of certainty"]}],"markscheme":{"verified":false,"source":"Pearson generic mark scheme for Unit 3 Section A (training booklet; ranges match the January 2021 WHI03/1D mark scheme). Tick verified once you are happy.","max_marks":25,"ao_separate":false,"levels":[{"level":"1","marks":"1–4","descriptor":"Demonstrates surface level comprehension of the source material without analysis, selecting some material relevant to the question, but in the form of direct quotations or paraphrases. Some relevant contextual knowledge is included, but presented as information rather than applied to the source material. Evaluation of the source material is assertive with little or no supporting evidence. Concepts of reliability or utility may be addressed, but by making stereotypical judgements."},{"level":"2","marks":"5–8","descriptor":"Demonstrates some understanding of the source material and attempts analysis by selecting and summarising information and making inferences relevant to the question. Contextual knowledge is added to information from the source material, but mainly to expand, confirm or challenge matters of detail. Evaluation of the source material is related to the specified enquiry but with limited support for judgement. Concepts of reliability or utility are addressed mainly by noting aspects of source provenance and some judgements may be based on questionable assumptions."},{"level":"3","marks":"9–14","descriptor":"Demonstrates understanding of the source material and shows some analysis by selecting key points relevant to the question, explaining their meaning and selecting material to support valid developed inferences. Detailed knowledge of the historical context is deployed to explain or support inferences as well as to expand, confirm or challenge matters of detail. Evaluation of the source material is related to the specified enquiry and explanation of utility takes into account relevant considerations such as nature or purpose of the source material or the position of the author. Judgements are based on valid criteria with some justification."},{"level":"4","marks":"15–20","descriptor":"Analyses the source material, interrogating the evidence to make reasoned inferences and to show a range of ways the material can be used, for example by distinguishing between information and claim or opinion, although treatment of the two sources may be uneven. Deploys well-selected knowledge of the historical context, but mainly to illuminate or discuss the limitations of what can be gained from the content of the source material. Displays some understanding of the need to interpret source material in the context of the values and concerns of the society from which it is drawn. Evaluation of the source material uses valid criteria which are justified and applied, although some of the evaluation may not be fully substantiated. Evaluation takes into account the weight the evidence will bear as part of coming to a judgement."},{"level":"5","marks":"21–25","descriptor":"Interrogates the evidence of both sources with confidence and discrimination, making reasoned inferences and showing a range of ways the material can be used, for example by distinguishing between information and claim or opinion. Deploys knowledge of the historical context with precision to illuminate and discuss the limitations of what can be gained from the content of the source material, displaying secure understanding of the need to interpret source material in the context of the values and concerns of the society from which it is drawn. Evaluation of the source material uses valid criteria which are justified and fully applied. Evaluation takes into account the weight the evidence will bear as part of coming to a judgement and, where appropriate, distinguishes between the degree of certainty with which aspects of it can be used as the basis for claims."}],"notes":"Best fit; one mark out of 25 (AO2)."}},"u3b":{"label":"Section B — thematic essay across periods","paper":"Unit 3 Section B","marks":25,"minutes":60,"ao":"AO1","template":"‘[Statement about two or more periods, or the whole period].’ How far do you agree with this statement?","asks":"Make a sustained, criteria-based judgement across the named periods or themes. Compare periods and factors rather than treating each in isolation.","steps":["Decode (3 minutes): underline the claim, the comparison and EVERY date range. Define what would make something 'main' or 'most significant'.","Plan (7 minutes): plan four PEEJ paragraphs — e.g. stated factor and alternative in period 1, then in period 2 — with two precise examples each.","Introduce (5 minutes): define the debate and criteria; give a provisional answer that can differ between periods.","Develop (about 32 minutes): four PEEJ paragraphs — specific evidence, its effect, and a comparative judgement at the end of each.","Conclude (8 minutes) and check (5 minutes): answer 'how far' across BOTH periods using your criteria; check dates and comparisons."],"plan":"About 60 minutes: 55 minutes writing time (decode 3, plan 7, introduce 5, develop 32, conclude 8) + 5 minutes checking — from the department Question 2 essay-steps guide.","success":["Sustained analysis of the relationships between key features of the periods","Precisely selected knowledge from every period named","Valid criteria established, applied and weighed to reach the judgement","Logical, coherent, precise argument throughout"],"mistakes":["Covering only one of the named periods, or drifting outside the dates","Narrating each period in turn without comparing them","Assuming every black American's experience was identical (most examples concern the South)","A conclusion that repeats evidence instead of weighing it with criteria"],"frames":[{"name":"PEEJ two-period frame (department)","full":["Introduction: [Factor A] affected black Americans through … while [factor B] involved … I will judge which mattered most by severity, persistence and effect on the ability to secure change. Overall, I agree to a … extent, although the balance changed between the periods because …","PEEJ 1 — [Factor A], period 1: P: '… was especially serious in … because …' E: two precise examples. E: 'This limited … because …' J: 'Compared with …, this was more/less significant because …'","PEEJ 2 — [Factor B], period 1: P: 'However, … also …' E: … E: 'This undermined …' J: 'By [date] …, making … more/less serious than … because …'","PEEJ 3 — [Factor A], period 2: P / E / E / J","PEEJ 4 — [Factor B], period 2: P / E / E / J","Conclusion: Overall, I agree to a large/some/limited extent because … The claim is stronger for … because … In …, the balance shifted/remained because … Judged by …, but judged by …, … was ultimately more significant because …"],"some":["Introduction: definitions, criteria, provisional judgement","PEEJ: factor A, period 1","PEEJ: factor B, period 1","PEEJ: factor A, period 2","PEEJ: factor B, period 2","Conclusion across both periods"]},{"name":"Department factor-question frame","full":["Introduction: Some historians argue that … Whilst others argue that … In assessing [topic], key criteria such as [duration / scope / effectiveness / impact] will be employed to argue that …","Not the most important factor: Despite my judgement, it could be argued that … For example, … This meant that … However, this argument is weak because … Thus we must assert that …","Most important factor: In line with my judgement, … For example, … A dissenting view might point to … On the balance however, … Thus we must assert that …","Conclusion: rank the factors and link each back to the criteria."],"some":["Introduction","Weaker factor(s)","Strongest factor","Conclusion with criteria"]}],"criteria_list":["Duration — which factor mattered for longest?","Scope — which affected the most people or places?","Effectiveness — which achieved most?","Impact — which led to the most fundamental change?","From the Question 2 guide: severity, persistence, ability to secure change"],"evidence_tip":"When selecting evidence think SPEDA: statistics, key people, events, dates and acts/laws.","frame_note":"Department approach: PEEJ paragraphs (Point, Evidence, Explain, Judgement) organised by factor and period, criteria stated in the introduction (duration, scope, effectiveness, impact; or severity, persistence, ability to secure change), comparative judgement at the end of every paragraph, conclusion weighing both periods. Evidence: statistics, key people, events, dates and acts/laws.","markscheme":{"verified":false,"source":"Level ranges from the January 2021 WHI03/1D mark scheme; descriptor wording from Pearson's generic Unit 3 Section B mark scheme in the training booklet (Levels 1–4) and its Level 5 description. Tick verified once checked.","max_marks":25,"ao_separate":false,"levels":[{"level":"1","marks":"1–4","descriptor":"Simple or generalised statements are made about the topic. Some accurate and relevant knowledge is included, but it lacks range and depth and does not directly address the question. The overall judgement is missing or asserted. There is little, if any, evidence of attempts to structure the answer, and the answer overall lacks coherence and precision."},{"level":"2","marks":"5–8","descriptor":"There is some analysis of some key features of the period relevant to the question, but descriptive passages are included that are not clearly shown to relate to the focus of the question. Mostly accurate and relevant knowledge is included but lacks range or depth and has only implicit links to the demands and conceptual focus of the question. An overall judgement is given but with limited support and the criteria for judgement are left implicit. The answer shows some attempts at organisation, but most of the answer is lacking in coherence, clarity and precision."},{"level":"3","marks":"9–14","descriptor":"There is some analysis of, and attempt to explain links between, the relevant key features of the period and the question, although some mainly descriptive passages may be included. Mostly accurate and relevant knowledge is included to demonstrate some understanding of the demands and conceptual focus of the question, but material lacks range or depth. Attempts are made to establish criteria for judgement and to relate the overall judgement to them, although with weak substantiation. The answer shows some organisation. The general trend of the argument is clear, but parts of it lack logic, coherence or precision."},{"level":"4","marks":"15–20","descriptor":"Key issues relevant to the question are explored by an analysis of the relationships between key features of the period. Sufficient knowledge is deployed to demonstrate understanding of the demands and conceptual focus of the question and to meet most of its demands. Valid criteria by which the question can be judged are established and applied in the process of coming to a judgement. Although some of the evaluations may be only partly substantiated, the overall judgement is supported. The answer is generally well organised. The argument is logical and is communicated with clarity, although in a few places it may lack coherence or precision."},{"level":"5","marks":"21–25","descriptor":"Key issues relevant to the question are explored by a sustained analysis and discussion of the relationships between key features of the period. Sufficient knowledge is precisely selected and deployed to demonstrate understanding of the demands and conceptual focus of the question, and to respond fully to its demands. Valid criteria by which the question can be judged are established and applied and their relative significance evaluated in the process of reaching and substantiating the overall judgement. The answer is well organised. The argument is logical and coherent throughout and is communicated with clarity and precision."}],"notes":"Best fit; one mark out of 25 (AO1)."}},"u4a":{"label":"Unit 4 Section A — evaluating two interpretations","paper":"Unit 4 Section A","marks":25,"minutes":60,"ao":"AO3 (20) + AO1 (5)","requires_sources":true,"template":"How far do you agree with the view that …? Explain your answer using Extracts 1 and 2 and your knowledge of the issues related to this controversy.","asks":"Analyse the two historians' arguments, test each against your own knowledge, and reach a substantiated judgement on how convincing the view is. This is about the historians' arguments, not the provenance of the extracts.","steps":["Identify the view in the question and which extract supports or challenges it.","Summarise each extract's argument and the evidence it uses.","Test Extract 1 against your own knowledge — where is it convincing, where is it not?","Test Extract 2 the same way, and compare the two directly.","Establish criteria (e.g. weight of evidence, scope of explanation) and reach a judgement on the view."],"plan":"About 60 minutes: 10 minutes reading and planning, 45 minutes writing, 5 minutes checking.","success":["Analyses the issues of interpretation in both extracts and compares them","Integrates own knowledge with the extracts to test their arguments","Applies valid criteria to reach a substantiated judgement","Shows understanding that the issues are matters of historical debate"],"mistakes":["Evaluating the extracts' provenance (author, date, type) — the examiner notes this is not credited","Treating the extracts as sources of information rather than arguments","Comparing extracts repetitively without a clear judgement","Weaker treatment of the second extract"],"frames":[{"name":"Two-interpretations frame","full":["Introduction: Extract 1 argues that … whereas Extract 2 suggests … I will judge which is more convincing by … Overall, the view is convincing to a large / some / limited extent.","Extract 1: its argument is … This is convincing because [own knowledge] … However, it overlooks …","Extract 2: its argument is … This is supported by … but is weaker on …","Comparison: Extract 1 is stronger on … whereas Extract 2 …","Conclusion: On balance, the view is … convincing because [criteria]."],"some":["Introduction: both arguments + criteria + judgement","Extract 1 tested","Extract 2 tested","Direct comparison","Judgement"]}],"markscheme":{"verified":false,"source":"Pearson generic mark scheme for Unit 4 Section A (training booklet); ranges match the June 2025 WHI04/1C mark scheme. Tick verified once checked.","max_marks":25,"ao_separate":false,"levels":[{"level":"1","marks":"1–4","descriptor":"Demonstrates only limited comprehension of the extracts, selecting some material relevant to the debate. Some accurate and relevant knowledge is included and presented as information, rather than being linked with the extracts. Judgement on the view is assertive, with little supporting evidence."},{"level":"2","marks":"5–8","descriptor":"Demonstrates some understanding and attempts analysis of the extracts by describing some points within them that are relevant to the debate. Mostly accurate knowledge is included, but lacks range or depth. It is added to information from the extracts, but mainly to expand on matters of detail or to note some aspects which are not included. A judgement on the view is given with limited support, but the criteria for judgement are left implicit."},{"level":"3","marks":"9–14","descriptor":"Demonstrates understanding and some analysis of the extracts by selecting and explaining some key points of interpretation they contain and indicating differences. Knowledge of some issues related to the debate is included to link to, or expand, some views given in the extracts. Attempts are made to establish criteria for judgement and discussion of the extracts is attempted. A judgement is given, although with limited substantiation, and is related to some key points of view in the extracts."},{"level":"4","marks":"15–20","descriptor":"Demonstrates understanding of the extracts, analysing the issues of interpretation raised within them and by a comparison of them. Sufficient knowledge is deployed to explore most of the relevant aspects of the debate, although treatment of some aspects may lack depth. Integrates issues raised by extracts with those from own knowledge. Valid criteria by which the view can be judged are established and applied and the evidence provided in the extracts discussed in the process of coming to a substantiated overall judgement, although treatment of the extracts may be uneven. Demonstrates understanding that the issues are matters of interpretation."},{"level":"5","marks":"21–25","descriptor":"Interprets the extracts with confidence and discrimination, analysing the issues raised and demonstrating understanding of the basis of arguments offered by both authors. Sufficient knowledge is precisely selected and deployed to explore fully the matter under debate. Integrates issues raised by extracts with those from own knowledge when discussing the presented evidence and differing arguments. A sustained evaluative argument is presented, applying valid criteria and reaching fully substantiated judgements on the views given in both extracts and demonstrating understanding of the nature of historical debate."}],"notes":"Best fit; AO1 5 + AO3 20 marked together. Provenance of the extracts is not credited."}},"u4b":{"label":"Unit 4 Section B — essay on 1953–90","paper":"Unit 4 Section B","marks":25,"minutes":60,"ao":"AO1","template":"How accurate is it to say that …? / To what extent …? (one from a choice of two)","asks":"A depth essay on superpower relations 1953–90, usually about change and continuity or the success of a policy. Establish criteria for change or success and reach a substantiated judgement.","steps":["Underline the claim and the date range.","Plan 3–4 analytical paragraphs across the period (phases or factors).","Introduction: define your criteria (e.g. scale and permanence of change).","PEEJ paragraphs comparing phases or factors.","Conclusion: weigh the evidence using your criteria."],"plan":"About 60 minutes: 10 minutes planning, 45 minutes writing, 5 minutes checking.","success":["Sustained analysis of the relationships between key features of the periods","Precisely selected knowledge from every period named","Valid criteria established, applied and weighed to reach the judgement","Logical, coherent, precise argument throughout"],"mistakes":["Narrating events in order without judging the extent of change","Covering only part of the date range","A conclusion without criteria"],"frames":[{"name":"PEEJ two-period frame (department)","full":["Introduction: [Factor A] affected black Americans through … while [factor B] involved … I will judge which mattered most by severity, persistence and effect on the ability to secure change. Overall, I agree to a … extent, although the balance changed between the periods because …","PEEJ 1 — [Factor A], period 1: P: '… was especially serious in … because …' E: two precise examples. E: 'This limited … because …' J: 'Compared with …, this was more/less significant because …'","PEEJ 2 — [Factor B], period 1: P: 'However, … also …' E: … E: 'This undermined …' J: 'By [date] …, making … more/less serious than … because …'","PEEJ 3 — [Factor A], period 2: P / E / E / J","PEEJ 4 — [Factor B], period 2: P / E / E / J","Conclusion: Overall, I agree to a large/some/limited extent because … The claim is stronger for … because … In …, the balance shifted/remained because … Judged by …, but judged by …, … was ultimately more significant because …"],"some":["Introduction: definitions, criteria, provisional judgement","PEEJ: factor A, period 1","PEEJ: factor B, period 1","PEEJ: factor A, period 2","PEEJ: factor B, period 2","Conclusion across both periods"]},{"name":"Department factor-question frame","full":["Introduction: Some historians argue that … Whilst others argue that … In assessing [topic], key criteria such as [duration / scope / effectiveness / impact] will be employed to argue that …","Not the most important factor: Despite my judgement, it could be argued that … For example, … This meant that … However, this argument is weak because … Thus we must assert that …","Most important factor: In line with my judgement, … For example, … A dissenting view might point to … On the balance however, … Thus we must assert that …","Conclusion: rank the factors and link each back to the criteria."],"some":["Introduction","Weaker factor(s)","Strongest factor","Conclusion with criteria"]}],"criteria_list":["Duration — which factor mattered for longest?","Scope — which affected the most people or places?","Effectiveness — which achieved most?","Impact — which led to the most fundamental change?","From the Question 2 guide: severity, persistence, ability to secure change"],"evidence_tip":"When selecting evidence think SPEDA: statistics, key people, events, dates and acts/laws.","frame_note":"Department approach: PEEJ paragraphs (Point, Evidence, Explain, Judgement) organised by factor and period, criteria stated in the introduction (duration, scope, effectiveness, impact; or severity, persistence, ability to secure change), comparative judgement at the end of every paragraph, conclusion weighing both periods. Evidence: statistics, key people, events, dates and acts/laws.","markscheme":{"verified":false,"source":"Pearson generic mark scheme for Unit 4 Section B (training booklet); ranges match the June 2025 WHI04/1C mark scheme. Tick verified once checked.","max_marks":25,"ao_separate":false,"levels":[{"level":"1","marks":"1–4","descriptor":"Simple or generalised statements are made about the topic. Some accurate and relevant knowledge is included, but it lacks range and depth and does not directly address the question. The overall judgement is missing or asserted. There is little, if any, evidence of attempts to structure the answer, and the answer overall lacks coherence and precision."},{"level":"2","marks":"5–8","descriptor":"There is some analysis of some key features of the period relevant to the question, but descriptive passages are included that are not clearly shown to relate to the focus of the question. Mostly accurate and relevant knowledge is included but lacks range or depth and has only implicit links to the demands and conceptual focus of the question. An overall judgement is given but with limited support and the criteria for judgement are left implicit. The answer shows some attempts at organisation, but most of the answer is lacking in coherence, clarity and precision."},{"level":"3","marks":"9–14","descriptor":"There is some analysis of, and attempt to explain links between, the relevant key features of the period and the question, although some mainly descriptive passages may be included. Mostly accurate and relevant knowledge is included to demonstrate some understanding of the demands and conceptual focus of the question, but material lacks range or depth. Attempts are made to establish criteria for judgement and to relate the overall judgement to them, although with weak substantiation. The answer shows some organisation. The general trend of the argument is clear, but parts of it lack logic, coherence or precision."},{"level":"4","marks":"15–20","descriptor":"Key issues relevant to the question are explored by an analysis of the relationships between key features of the period. Sufficient knowledge is deployed to demonstrate understanding of the demands and conceptual focus of the question and to meet most of its demands. Valid criteria by which the question can be judged are established and applied in the process of coming to a judgement. Although some of the evaluations may be only partly substantiated, the overall judgement is supported. The answer is generally well organised. The argument is logical and is communicated with clarity, although in a few places it may lack coherence or precision."},{"level":"5","marks":"21–25","descriptor":"Key issues relevant to the question are explored by a sustained analysis and discussion of the relationships between key features of the period. Sufficient knowledge is precisely selected and deployed to demonstrate understanding of the demands and conceptual focus of the question, and to respond fully to its demands. Valid criteria by which the question can be judged are established and applied and their relative significance evaluated in the process of reaching and substantiating the overall judgement. The answer is well organised. The argument is logical and coherent throughout and is communicated with clarity and precision."}],"notes":"Best fit; one mark out of 25 (AO1)."}}},"resources_received":["Civil Rights Question 2 essay steps (PPTX)","Factor-question structure sheet (DOCX)","Getting Ready to Teach IAL History Module 2 booklet and slides"],"resources_needed":["Confirmation of the Unit 4 option (Superpowers assumed)","Class textbook or lesson decks for Unit 3 (to align explanations and add page references)","Teacher-marked Year 13 essays and source answers (to check AI feedback)"]}]},"topics":{"y11-de-1":{"id":"y11-de-1","course":"y11","area":"de","kt":"Key topic 1","order":1,"title":"The establishment of the Weimar Republic and its early problems","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following 4HI1 Depth study 3, key topic 1. Read more: Payne, Pearson Edexcel International GCSE Germany, chapter 1 (pp. 2–23)."},"learn":{"intro":"In November 1918 the Kaiser abdicated and Germany became a democracy. Within five years the new Weimar Republic faced a hated peace treaty, uprisings from left and right, a French invasion of the Ruhr and hyperinflation.","sections":[{"id":"s1","title":"1. The Kaiser's abdication and the German Revolution, 1918–19","blocks":[{"p":"By autumn 1918 Germany was losing the war and its people were starving because of the British naval blockade. In late October sailors at Kiel mutinied rather than sail on a final mission. Workers' and soldiers' councils took control in many cities."},{"p":"On 9 November 1918 Kaiser Wilhelm II abdicated and fled to the Netherlands. Friedrich Ebert, leader of the Social Democrats (SPD), became head of government and a republic was declared. Two days later, on 11 November, the new government signed the armistice ending the fighting."},{"p":"Elections in January 1919 chose a National Assembly. Because Berlin was dangerous, it met in the quiet town of Weimar — giving the Republic its name."}],"terms":["abdication","armistice","Social Democrats (SPD)","National Assembly"],"evidence":["Late October 1918: Kiel mutiny.","9 November 1918: Kaiser abdicates.","11 November 1918: armistice signed.","January 1919: National Assembly elected; meets at Weimar."],"refs":["Payne, IGCSE Germany, ch. 1"]},{"id":"s2","title":"2. The Weimar Constitution: strengths and weaknesses","blocks":[{"ul":["Strength: very democratic — men and women over 20 could vote; the Reichstag was elected every four years.","Strength: a Bill of Rights guaranteed freedoms such as free speech and religion.","Weakness: proportional representation meant many small parties, so governments were coalitions that often collapsed.","Weakness: Article 48 let the President rule by decree in an emergency — later used to bypass the Reichstag.","Weakness: judges, army officers and civil servants from the Kaiser's time stayed in their jobs, and many disliked the Republic."]}],"terms":["constitution","proportional representation","coalition","Article 48"],"evidence":["Votes for men and women over 20.","President elected every 7 years; Article 48 emergency powers."],"refs":["Payne, IGCSE Germany, ch. 1"]},{"id":"s3","title":"3. Reactions to the Treaty of Versailles","blocks":[{"p":"The Treaty of Versailles was signed on 28 June 1919. Germany lost about 13 per cent of its land, including Alsace-Lorraine and land given to Poland, and all its colonies. Its army was limited to 100,000 men, with no tanks, air force or submarines, and the Rhineland was demilitarised. Under the 'war guilt' clause (Article 231) Germany accepted blame for the war, and in 1921 reparations were set at £6,600 million."},{"p":"Germans were furious. They called it a Diktat — a dictated peace — because they had not been allowed to negotiate. The politicians who signed it were called the 'November criminals', and many believed the 'stab in the back' myth that the army had been betrayed by politicians. The Republic was linked with humiliation from the start."}],"terms":["Treaty of Versailles","Diktat","war guilt clause","reparations","November criminals","stab in the back"],"evidence":["28 June 1919: Treaty signed.","Army limited to 100,000.","Reparations £6,600 million (1921)."],"refs":["Payne, IGCSE Germany, ch. 1"]},{"id":"s4","title":"4. Challenges from the Left and Right","blocks":[{"p":"Left: in January 1919 the communist Spartacists, led by Rosa Luxemburg and Karl Liebknecht, tried to seize power in Berlin. Ebert used the army and the Freikorps — ex-soldiers who hated communism — to crush the rising. Luxemburg and Liebknecht were murdered."},{"p":"Right: in March 1920 Wolfgang Kapp led Freikorps units into Berlin in the Kapp Putsch. The army refused to stop them and the government fled. Workers in Berlin called a general strike; with the city at a standstill, Kapp gave up within days."},{"p":"Right-wing extremists also murdered politicians, including Matthias Erzberger (1921) and Foreign Minister Walther Rathenau (1922). Judges often gave right-wing offenders light sentences."}],"terms":["Spartacists","Freikorps","putsch","general strike"],"evidence":["January 1919: Spartacist rising.","March 1920: Kapp Putsch defeated by a general strike.","1922: Rathenau assassinated."],"refs":["Payne, IGCSE Germany, ch. 1"]},{"id":"s5","title":"5. The Ruhr occupation and hyperinflation, 1923","blocks":[{"p":"When Germany failed to make a reparations payment, French and Belgian troops occupied the Ruhr, Germany's main industrial area, in January 1923, to take goods instead. The government told workers to use passive resistance — to go on strike — and kept paying them by printing more money."},{"p":"Causes of hyperinflation: the government had already printed money to pay for the war; reparations drained gold and goods; the Ruhr occupation cut production while the government printed even more money. By November 1923 a loaf of bread cost about 200 billion marks."},{"p":"Effects: savers, pensioners and people on fixed incomes were ruined; wages could not keep up with prices; some people bartered goods. But some gained: people who had borrowed money paid off debts cheaply, and some businessmen bought up property. Many middle-class Germans blamed the Republic."}],"terms":["Ruhr","passive resistance","hyperinflation","fixed income"],"evidence":["January 1923: French and Belgian troops occupy the Ruhr.","November 1923: a loaf of bread cost about 200 billion marks."],"refs":["Payne, IGCSE Germany, ch. 1"]}],"timeline":[{"date":"Oct–Nov 1918","event":"Kiel mutiny and revolution spread"},{"date":"9 Nov 1918","event":"Kaiser Wilhelm II abdicates"},{"date":"11 Nov 1918","event":"Armistice signed"},{"date":"Jan 1919","event":"Spartacist rising crushed"},{"date":"28 June 1919","event":"Treaty of Versailles signed"},{"date":"March 1920","event":"Kapp Putsch"},{"date":"1922","event":"Walther Rathenau assassinated"},{"date":"Jan 1923","event":"French and Belgian troops occupy the Ruhr"},{"date":"Nov 1923","event":"Hyperinflation at its worst"}],"people":[{"name":"Kaiser Wilhelm II","role":"German Emperor; abdicated 9 November 1918."},{"name":"Friedrich Ebert","role":"SPD leader; first President of the Republic."},{"name":"Rosa Luxemburg and Karl Liebknecht","role":"Spartacist leaders, killed January 1919."},{"name":"Wolfgang Kapp","role":"Led the right-wing putsch of 1920."},{"name":"Walther Rathenau","role":"Foreign Minister murdered by right-wing extremists in 1922."}],"vocab":[{"term":"Republic","def":"A country with an elected head of state instead of a monarch."},{"term":"Reparations","def":"Payments for war damage."},{"term":"Putsch","def":"An attempt to seize power by force."},{"term":"Hyperinflation","def":"Extremely rapid price rises; money becomes almost worthless."},{"term":"Freikorps","def":"Armed volunteer units of ex-soldiers."}],"misconceptions":[{"wrong":"Hyperinflation was caused only by reparations.","right":"Money printing during the war and in 1923 to pay striking Ruhr workers were also key causes."},{"wrong":"Everyone lost out from hyperinflation.","right":"Borrowers and some businessmen gained."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"When did the Kaiser abdicate?","options":["11 November 1918","9 November 1918","28 June 1919","January 1919"],"answer":1,"why":"Two days before the armistice."},{"id":"m2","s":"s1","q":"Why did the National Assembly meet in Weimar?","options":["It was the capital","Berlin was too dangerous","The Kaiser lived there","The French demanded it"],"answer":1,"why":"Unrest in Berlin."},{"id":"m3","s":"s2","q":"Which was a weakness of the constitution?","options":["Votes for women","Proportional representation led to unstable coalitions","A Bill of Rights","Elections every four years"],"answer":1,"why":"Many small parties."},{"id":"m4","s":"s3","q":"What was the size limit on the German army?","options":["10,000","100,000","500,000","1 million"],"answer":1,"why":"Plus no tanks, air force or submarines."},{"id":"m5","s":"s4","q":"How was the Kapp Putsch defeated?","options":["By the army","By a general strike","By the French","By the Freikorps"],"answer":1,"why":"Workers brought Berlin to a halt."},{"id":"m6","s":"s5","q":"Why did France and Belgium occupy the Ruhr?","options":["To stop the Spartacists","Germany failed to pay reparations","To protect the Kaiser","To help the Weimar government"],"answer":1,"why":"They took goods instead — January 1923."},{"id":"m7","s":"s5","q":"Who gained from hyperinflation?","options":["Pensioners","Savers","People with debts to pay off","Workers on fixed wages"],"answer":2,"why":"Debts became worthless."}],"short":[{"id":"a1","s":"s1","q":"Who led the SPD and became President?","accept":["ebert","friedrich ebert"],"answer":"Friedrich Ebert"},{"id":"a2","s":"s2","q":"Which article let the President rule by decree?","accept":["48","article 48"],"answer":"Article 48"},{"id":"a3","s":"s3","q":"What word did Germans use for the 'dictated' treaty?","accept":["diktat"],"answer":"Diktat"},{"id":"a4","s":"s4","q":"Which communist group rose in January 1919?","accept":["spartacists","spartacist","spartacus league","the spartacists"],"answer":"The Spartacists"}],"chronology":[{"id":"c1","title":"Put these events in order","items":["Kaiser abdicates","Armistice","Spartacist rising","Treaty of Versailles","Kapp Putsch","Ruhr occupied"]}],"matching":[{"id":"x1","title":"Match the term to its meaning","pairs":[["Diktat","A peace imposed without negotiation"],["Freikorps","Ex-soldier volunteer units"],["Passive resistance","Refusing to work for the occupiers"],["Hyperinflation","Money becomes almost worthless"]]}],"evidence":[{"id":"e1","s":"s5","q":"Give precise evidence of how bad hyperinflation became.","keywords":[["200 billion","billion","bread","november 1923","trillion"]],"model":"By November 1923 a loaf of bread cost about 200 billion marks."},{"id":"e2","s":"s3","q":"Give two precise terms of the Treaty of Versailles.","keywords":[["100,000","100000","alsace","colonies","231","6,600","rhineland","13"]],"model":"Army limited to 100,000; reparations of £6,600 million; loss of Alsace-Lorraine and colonies; Article 231 war guilt."}]},"flashcards":[{"id":"f1","s":"s1","q":"What happened at Kiel in 1918?","a":"Sailors mutinied; revolution spread across Germany.","hint":"Navy."},{"id":"f2","s":"s2","q":"Give two strengths of the Weimar Constitution.","a":"Votes for men and women over 20; Bill of Rights; regular elections.","hint":"Democratic."},{"id":"f3","s":"s2","q":"Give two weaknesses of the Weimar Constitution.","a":"Proportional representation → weak coalitions; Article 48; old elites kept their jobs.","hint":"PR + 48."},{"id":"f4","s":"s3","q":"Why did Germans hate Versailles?","a":"No negotiation (Diktat); war guilt; land, army and reparations losses; seen as humiliation.","hint":"Blame and loss."},{"id":"f5","s":"s3","q":"What was the 'stab in the back' myth?","a":"The false belief that the army had been betrayed by politicians at home.","hint":"November criminals."},{"id":"f6","s":"s4","q":"How did Ebert defeat the Spartacists?","a":"He used the army and Freikorps.","hint":"Ex-soldiers."},{"id":"f7","s":"s5","q":"Give three causes of hyperinflation.","a":"War debts and printing money; reparations; the Ruhr occupation and paying strikers.","hint":"War, reparations, Ruhr."},{"id":"f8","s":"s5","q":"Give two effects of hyperinflation.","a":"Savers and pensioners ruined; wages lagged behind prices; middle classes blamed the Republic; debtors gained.","hint":"Winners and losers."}],"checklist":[{"id":"k1","level":"describe","text":"I can describe the Kaiser's abdication and the revolution of 1918–19.","sections":["s1"]},{"id":"k2","level":"explain","text":"I can explain the strengths and weaknesses of the Weimar Constitution.","sections":["s2"]},{"id":"k3","level":"explain","text":"I can explain why Germans reacted angrily to the Treaty of Versailles.","sections":["s3"]},{"id":"k4","level":"describe","text":"I can describe the challenges from the Left and Right, including the Spartacists and the Kapp Putsch.","sections":["s4"]},{"id":"k5","level":"explain","text":"I can explain the causes and effects of hyperinflation, including the Ruhr occupation.","sections":["s5"]},{"id":"k6","level":"judge","text":"I can judge which was the biggest problem for the Weimar governments in 1919–23.","sections":["s3","s4","s5"]}],"exam":{"questions":[{"id":"q1","qtype":"p1c","label":"Past paper: 4HI1/01, June 2025, Q3(c)(i)","sections":["s3","s4","s5"],"q":"‘Hyperinflation was the main reason why the governments of the Weimar Republic had problems in the years 1919–23.’\nHow far do you agree? Explain your answer.","prompts":["hyperinflation","the Treaty of Versailles"],"markscheme":null},{"id":"q2","qtype":"p1b","label":"Teacher-created practice question","sections":["s5"],"q":"Explain two effects of hyperinflation on the German people in 1923.","markscheme":null}]},"stretch":[{"id":"t1","kind":"Relative significance","task":"Rank Versailles, the Kapp Putsch and hyperinflation as threats to the Republic. Use how long each problem lasted and how many people it affected."},{"id":"t2","kind":"Causal links","task":"Draw a chain linking Versailles → reparations → the Ruhr → hyperinflation. Explain each arrow."},{"id":"t3","kind":"Competing arguments","task":"'The Weimar Republic was doomed from the start.' Write one paragraph for and one against."}]},"y11-de-2":{"id":"y11-de-2","course":"y11","area":"de","kt":"Key topic 2","order":2,"title":"The recovery of Germany, 1924–29","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following 4HI1 Depth study 3, key topic 2. Figures checked against Payne, Pearson Edexcel International GCSE Germany, chapter 2 (pp. 24–38)."},"learn":{"intro":"After the chaos of 1923, Germany recovered. Gustav Stresemann stabilised the currency, reorganised reparations with American help and won back Germany's international standing. But how strong was the recovery?","sections":[{"id":"s1","title":"1. Stresemann and the economy","blocks":[{"p":"Gustav Stresemann was Chancellor for a few months in 1923 and Foreign Minister from 1923 until his death in October 1929. In 1923 he called off passive resistance in the Ruhr and introduced a new temporary currency, the Rentenmark, in November 1923; it was replaced by the Reichsmark in 1924. Hyperinflation ended."},{"p":"The Dawes Plan (1924): reparations payments were lowered to 1,000 million marks a year for the first five years, rising later to 2,500 million; the USA loaned Germany 800 million gold marks; and French and Belgian troops left the Ruhr. Over the next six years Germany received more than 25 billion marks in American loans, which paid for new factories, roads, housing and public buildings."},{"p":"The Young Plan (1929) reduced the total reparations bill to around $8 billion, to be paid over 59 years. Nationalists including Hitler campaigned against it and collected 4 million signatures for a referendum, but it went ahead."}],"terms":["Rentenmark","Reichsmark","Dawes Plan","Young Plan","US loans"],"evidence":["November 1923: Rentenmark.","1924: Dawes Plan — US loan of 800 million gold marks.","More than 25 billion marks of US loans over six years.","1929: Young Plan — around $8 billion over 59 years."],"refs":["Payne, IGCSE Germany, ch. 2"]},{"id":"s2","title":"2. Successes abroad","blocks":[{"ul":["Locarno Treaties (1925): Germany accepted its western borders with France and Belgium. Germany was treated as an equal again.","League of Nations (1926): Germany joined and was given a permanent seat on the Council — a sign it was a great power again.","Kellogg–Briand Pact (1928): Germany was one of over 60 countries that agreed not to use war to settle disputes."]},{"p":"These successes restored pride and showed that co-operation could win changes. Nationalists, however, attacked Stresemann for accepting Versailles' borders in the west and for not demanding more."}],"terms":["Locarno Treaties","League of Nations","Kellogg–Briand Pact"],"evidence":["1925: Locarno.","1926: Germany joins the League of Nations.","1928: Kellogg–Briand Pact."],"refs":["Payne, IGCSE Germany, ch. 2"]},{"id":"s3","title":"3. How strong was the recovery?","blocks":[{"p":"Signs of strength: stable money, rising industrial output, new building, fewer political murders, and extremist parties did badly — the Nazis won only 12 seats in 1928."},{"p":"Signs of weakness: the recovery depended on American loans that could be recalled at short notice; unemployment never fell much below about 1.3 million; farmers suffered from falling prices; and the middle classes who had lost their savings in 1923 did not get them back. Coalition governments still changed often."}],"terms":["dependence","short-term loans"],"evidence":["Nazis won only 12 seats in 1928.","Recovery depended on short-term US loans."],"refs":["Payne, IGCSE Germany, ch. 2"]}],"timeline":[{"date":"Aug 1923","event":"Stresemann becomes Chancellor"},{"date":"Nov 1923","event":"Rentenmark introduced"},{"date":"1924","event":"Dawes Plan; Reichsmark introduced"},{"date":"1925","event":"Locarno Treaties"},{"date":"1926","event":"Germany joins the League of Nations"},{"date":"1928","event":"Kellogg–Briand Pact"},{"date":"1929","event":"Young Plan; Stresemann dies (October)"}],"people":[{"name":"Gustav Stresemann","role":"Chancellor 1923; Foreign Minister 1923–29."},{"name":"Charles Dawes","role":"American banker who led the 1924 plan."},{"name":"Owen Young","role":"American businessman who led the 1929 plan."},{"name":"Paul von Hindenburg","role":"Elected President in 1925."}],"vocab":[{"term":"Rentenmark","def":"Temporary currency of 1923 backed by land and industry."},{"term":"Locarno Treaties","def":"1925 agreements accepting Germany's western borders."},{"term":"League of Nations","def":"International organisation to keep peace; Germany joined in 1926."},{"term":"Kellogg–Briand Pact","def":"1928 agreement to give up war as a way to solve disputes."}],"misconceptions":[{"wrong":"The Dawes Plan cancelled reparations.","right":"It rearranged payments and brought loans; the Young Plan cut the total but payments continued."},{"wrong":"By 1929 Germany was economically secure.","right":"Recovery relied on American loans, which were recalled after the Wall Street Crash."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"What did the Dawes Plan provide?","options":["An end to reparations","Lower payments and an American loan","The return of colonies","Membership of the League"],"answer":1,"why":"800 million gold marks loaned by the USA."},{"id":"m2","s":"s1","q":"How long was the Young Plan payment period?","options":["5 years","20 years","59 years","100 years"],"answer":2,"why":"Total reduced to around $8 billion."},{"id":"m3","s":"s2","q":"What did Germany accept at Locarno (1925)?","options":["Its western borders","War guilt","The Ruhr occupation","A smaller navy"],"answer":0,"why":"With France and Belgium."},{"id":"m4","s":"s2","q":"When did Germany join the League of Nations?","options":["1919","1924","1926","1929"],"answer":2,"why":"With a permanent Council seat."},{"id":"m5","s":"s3","q":"What was the biggest weakness of the recovery?","options":["Too many tanks","Dependence on American loans","High taxes on the rich","Too few political parties"],"answer":1,"why":"Loans could be recalled — as in 1929."}],"short":[{"id":"a1","s":"s1","q":"Which currency replaced the Rentenmark in 1924?","accept":["reichsmark","the reichsmark"],"answer":"Reichsmark"},{"id":"a2","s":"s1","q":"How many signatures did nationalists collect against the Young Plan?","accept":["4 million","4000000","four million","4,000,000"],"answer":"4 million"},{"id":"a3","s":"s2","q":"Which 1928 pact rejected war as a way to settle disputes?","accept":["kellogg-briand","kellogg briand","kellogg-briand pact","kellogg briand pact"],"answer":"Kellogg–Briand Pact"}],"chronology":[{"id":"c1","title":"Put Stresemann's achievements in order","items":["Rentenmark","Dawes Plan","Locarno Treaties","Joins the League of Nations","Kellogg–Briand Pact","Young Plan"]}],"matching":[{"id":"x1","title":"Match the agreement to what it did","pairs":[["Dawes Plan","Lower payments and US loan"],["Young Plan","Reparations cut to around $8 billion"],["Locarno","Western borders accepted"],["League of Nations","Permanent Council seat"]]}],"evidence":[{"id":"e1","s":"s1","q":"Give precise evidence that American money helped the recovery.","keywords":[["800 million","25 billion","loan","dawes"]],"model":"Under the Dawes Plan the USA loaned 800 million gold marks, and Germany received more than 25 billion marks in US loans over six years."},{"id":"e2","s":"s3","q":"Give precise evidence that extremists were weaker in 1924–29.","keywords":[["12 seats","12","1928","nazi"]],"model":"The Nazis won only 12 seats in the 1928 election."}]},"flashcards":[{"id":"f1","s":"s1","q":"How did Stresemann end hyperinflation?","a":"Called off passive resistance and introduced the Rentenmark (November 1923).","hint":"New money."},{"id":"f2","s":"s1","q":"Give two terms of the Dawes Plan.","a":"Payments lowered to 1,000 million marks a year at first; US loan of 800 million gold marks; troops left the Ruhr.","hint":"1924."},{"id":"f3","s":"s1","q":"What did the Young Plan do?","a":"Reduced reparations to around $8 billion over 59 years.","hint":"1929."},{"id":"f4","s":"s2","q":"Why did joining the League matter?","a":"Germany was accepted as a great power again with a permanent Council seat.","hint":"1926."},{"id":"f5","s":"s3","q":"Give two weaknesses of the recovery.","a":"Reliance on US loans; unemployment around 1.3 million; struggling farmers; middle-class savings not restored.","hint":"Loans."},{"id":"f6","s":"s2","q":"Why did nationalists criticise Stresemann?","a":"They thought he accepted Versailles by agreeing borders at Locarno.","hint":"Borders."}],"checklist":[{"id":"k1","level":"describe","text":"I can describe Stresemann's work, including the Rentenmark.","sections":["s1"]},{"id":"k2","level":"explain","text":"I can explain how the Dawes and Young Plans and US loans helped recovery.","sections":["s1"]},{"id":"k3","level":"explain","text":"I can explain Germany's successes abroad: Locarno, the League and Kellogg–Briand.","sections":["s2"]},{"id":"k4","level":"judge","text":"I can judge how strong Germany's recovery really was by 1929.","sections":["s3"]}],"exam":{"questions":[{"id":"q1","qtype":"p1b","label":"Teacher-created practice question","sections":["s1"],"q":"Explain two effects of the Dawes Plan on Germany.","markscheme":null},{"id":"q2","qtype":"p1c","label":"Teacher-created practice question","sections":["s1","s2","s3"],"q":"‘The main reason for Germany's recovery in the years 1924–29 was the Dawes Plan.’\nHow far do you agree? Explain your answer.","prompts":["the Dawes Plan","the Locarno Treaties"],"markscheme":null}]},"stretch":[{"id":"t1","kind":"Competing arguments","task":"Golden Years or a dangerous illusion? Use one statistic for each side."},{"id":"t2","kind":"Relative significance","task":"Which mattered more for recovery: economic measures or foreign-policy successes? Decide using how many Germans each affected."}]},"y11-de-3":{"id":"y11-de-3","course":"y11","area":"de","kt":"Key topic 3","order":3,"title":"The rise of Hitler and the Nazis to January 1933","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following 4HI1 Depth study 3, key topic 3. Read more: Payne, Pearson Edexcel International GCSE Germany, chapter 3 (pp. 39–59)."},"learn":{"intro":"How did a small Munich party become the largest in Germany, and how did Hitler become Chancellor in January 1933 without ever winning a majority?","sections":[{"id":"s1","title":"1. Hitler and the early party, 1919–22","blocks":[{"p":"Hitler joined the German Workers' Party (DAP), led by Anton Drexler, in September 1919. He was a powerful speaker and soon became its leading figure. In 1920 the party published its 25-Point Programme and renamed itself the National Socialist German Workers' Party (NSDAP), or Nazi Party."},{"p":"Changes 1920–22: Hitler became party leader in 1921; the party adopted the swastika symbol and bought a newspaper, the Völkischer Beobachter; and the SA (stormtroopers or 'Brownshirts') was set up in 1921, led by Ernst Röhm, to protect Nazi meetings and disrupt opponents'."}],"terms":["NSDAP","25-Point Programme","SA","swastika"],"evidence":["September 1919: Hitler joins the DAP.","1920: 25-Point Programme; renamed NSDAP.","1921: Hitler becomes leader; SA set up."],"refs":["Payne, IGCSE Germany, ch. 3"]},{"id":"s2","title":"2. The Munich Putsch, 1923","blocks":[{"p":"Causes: Germans were angry about the Ruhr occupation and hyperinflation; Hitler wanted to copy Mussolini's March on Rome; and the Bavarian government was right-wing, so he hoped its leaders would join him."},{"p":"Events: on 8 November 1923 Hitler and the SA burst into a meeting at a Munich beer hall and forced the Bavarian leaders Kahr, Lossow and Seisser to support him. They later changed their minds. On 9 November Hitler, with the war hero General Ludendorff, marched into Munich; police opened fire and 16 Nazis were killed."},{"p":"Results: the Nazi Party was banned and Hitler was put on trial. The trial gave him national publicity; the judge sentenced him to five years but he served only nine months in Landsberg prison, where he wrote Mein Kampf. He decided to win power legally, through elections."}],"terms":["putsch","Mein Kampf","Landsberg"],"evidence":["8–9 November 1923: Munich Putsch; 16 Nazis killed.","Sentenced to 5 years; served 9 months."],"refs":["Payne, IGCSE Germany, ch. 3"]},{"id":"s3","title":"3. Reorganisation and the Depression","blocks":[{"p":"Reorganisation 1924–28: Hitler refounded the party in 1925 and set up branches across Germany run by Gauleiters; the SS was formed as his bodyguard; the Hitler Youth was set up; Joseph Goebbels ran propaganda. But in the stable 'Golden Years' the Nazis won only 12 seats in 1928."},{"p":"The Great Depression: after the Wall Street Crash (October 1929), American banks recalled their loans. German businesses closed and unemployment rose to 6 million by 1932. Coalition governments could not agree what to do, so Chancellor Brüning ruled by decree using Article 48 and cut spending, which made people suffer more."},{"p":"Many Germans turned to extreme parties. The Nazis rose from 12 seats (1928) to 107 (1930) and 230 (July 1932), becoming the largest party. The Communists grew too, which frightened the middle classes and business owners."}],"terms":["Great Depression","Wall Street Crash","unemployment","rule by decree"],"evidence":["October 1929: Wall Street Crash.","Unemployment 6 million by 1932.","Nazi seats: 12 (1928), 107 (1930), 230 (July 1932)."],"refs":["Payne, IGCSE Germany, ch. 3"]},{"id":"s4","title":"4. Nazi methods and the role of the SA","blocks":[{"ul":["Propaganda: Goebbels used posters, newspapers, radio, rallies and films with simple slogans such as 'Work and Bread'.","Hitler's image: a strong leader who would make Germany great again; in 1932 he flew around Germany to speak at rallies.","Promises to everyone: jobs for workers, protection for farmers and small businesses, action against communists for the middle classes and industrialists.","Scapegoats: blaming Jews, communists and the 'November criminals' for Germany's problems.","The SA: hundreds of thousands of Brownshirts marched, protected Nazi meetings and attacked opponents, especially communists, giving an image of order and strength — while causing violence on the streets."]}],"terms":["propaganda","scapegoat","Brownshirts"],"evidence":["1932: Hitler's flights to rallies across Germany.","SA street violence against communists."],"refs":["Payne, IGCSE Germany, ch. 3"]},{"id":"s5","title":"5. From 1932 to January 1933","blocks":[{"p":"In the presidential election of 1932 Hitler won about 13 million votes but lost to Hindenburg. Brüning was replaced by Franz von Papen in May 1932. After the July 1932 election the Nazis were the largest party, but Hindenburg refused to make Hitler Chancellor."},{"p":"In the November 1932 election the Nazis lost seats (196) and money was running short. Hindenburg appointed General Kurt von Schleicher as Chancellor in December, but he could not win support in the Reichstag."},{"p":"Papen persuaded Hindenburg to appoint Hitler as Chancellor with Papen as Vice-Chancellor, believing that with only three Nazis in the cabinet they could control him. Hitler became Chancellor on 30 January 1933."}],"terms":["Chancellor","Vice-Chancellor","backstairs deal"],"evidence":["1932: Hitler wins about 13 million votes in the presidential election.","November 1932: Nazis fall to 196 seats.","30 January 1933: Hitler appointed Chancellor."],"refs":["Payne, IGCSE Germany, ch. 3"]}],"timeline":[{"date":"Sept 1919","event":"Hitler joins the German Workers' Party"},{"date":"1920","event":"25-Point Programme; party renamed NSDAP"},{"date":"1921","event":"Hitler becomes leader; SA set up"},{"date":"Nov 1923","event":"Munich Putsch"},{"date":"1925","event":"Party refounded; SS formed"},{"date":"1928","event":"Nazis win only 12 seats"},{"date":"Oct 1929","event":"Wall Street Crash"},{"date":"1930","event":"Nazis win 107 seats"},{"date":"July 1932","event":"Nazis win 230 seats — the largest party"},{"date":"Nov 1932","event":"Nazis fall to 196 seats"},{"date":"Dec 1932","event":"Schleicher becomes Chancellor"},{"date":"30 Jan 1933","event":"Hitler becomes Chancellor"}],"people":[{"name":"Anton Drexler","role":"Founder of the German Workers' Party."},{"name":"Ernst Röhm","role":"Leader of the SA."},{"name":"Joseph Goebbels","role":"Nazi propaganda chief."},{"name":"Heinrich Brüning","role":"Chancellor 1930–32; ruled by decree."},{"name":"Franz von Papen","role":"Chancellor 1932; persuaded Hindenburg to appoint Hitler."},{"name":"Kurt von Schleicher","role":"Chancellor December 1932–January 1933."},{"name":"Paul von Hindenburg","role":"President who appointed Hitler."}],"vocab":[{"term":"SA","def":"Stormtroopers or Brownshirts — the Nazi private army."},{"term":"SS","def":"Hitler's elite bodyguard, formed 1925."},{"term":"Propaganda","def":"Information designed to persuade people."},{"term":"Depression","def":"A severe economic slump with mass unemployment."}],"misconceptions":[{"wrong":"Hitler was voted in as Chancellor.","right":"Hindenburg appointed him; the Nazis never had a majority of votes."},{"wrong":"The Munich Putsch was a total failure for Hitler.","right":"It failed as a revolt but the trial made him famous and changed his strategy."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"Who led the SA?","options":["Goebbels","Röhm","Himmler","Drexler"],"answer":1,"why":"Ernst Röhm."},{"id":"m2","s":"s2","q":"What did Hitler write in prison?","options":["The 25-Point Programme","Mein Kampf","The Völkischer Beobachter","The Nuremberg Laws"],"answer":1,"why":"In Landsberg prison, 1924."},{"id":"m3","s":"s2","q":"How many Nazis were killed in the Munich Putsch?","options":["2","16","60","400"],"answer":1,"why":"Police opened fire on 9 November 1923."},{"id":"m4","s":"s3","q":"How many unemployed were there in Germany by 1932?","options":["1 million","3 million","6 million","10 million"],"answer":2,"why":"After US loans were recalled."},{"id":"m5","s":"s3","q":"How many seats did the Nazis win in July 1932?","options":["12","107","196","230"],"answer":3,"why":"The largest party."},{"id":"m6","s":"s5","q":"Who persuaded Hindenburg to appoint Hitler?","options":["Brüning","Papen","Schleicher","Stresemann"],"answer":1,"why":"Papen became Vice-Chancellor."}],"short":[{"id":"a1","s":"s1","q":"What was the German Workers' Party renamed in 1920?","accept":["nsdap","nazi party","national socialist german workers party","national socialist german workers' party"],"answer":"NSDAP (Nazi Party)"},{"id":"a2","s":"s4","q":"Who ran Nazi propaganda?","accept":["goebbels","joseph goebbels"],"answer":"Joseph Goebbels"},{"id":"a3","s":"s5","q":"On what date did Hitler become Chancellor?","accept":["30 january 1933","30th january 1933","january 30 1933","30 january"],"answer":"30 January 1933"}],"chronology":[{"id":"c1","title":"Put these in order","items":["Hitler joins the DAP","SA set up","Munich Putsch","Wall Street Crash","Nazis become largest party","Schleicher becomes Chancellor","Hitler becomes Chancellor"]}],"matching":[{"id":"x1","title":"Match the election to Nazi seats","pairs":[["1928","12 seats"],["1930","107 seats"],["July 1932","230 seats"],["November 1932","196 seats"]]}],"evidence":[{"id":"e1","s":"s3","q":"Give precise evidence that the Depression helped the Nazis.","keywords":[["6 million","six million","12","107","230","loans"]],"model":"Unemployment rose to 6 million by 1932 and Nazi seats rose from 12 (1928) to 230 (July 1932)."},{"id":"e2","s":"s5","q":"Give precise evidence that Hitler came to power through a deal.","keywords":[["papen","hindenburg","three","vice"]],"model":"Papen persuaded Hindenburg to appoint Hitler with Papen as Vice-Chancellor and only three Nazis in the cabinet."}]},"flashcards":[{"id":"f1","s":"s1","q":"Name two changes to the party in 1920–22.","a":"Renamed NSDAP; 25-Point Programme; swastika; own newspaper; SA set up; Hitler as leader.","hint":"Name, flag, paper, army."},{"id":"f2","s":"s2","q":"Give two causes of the Munich Putsch.","a":"Anger at the Ruhr occupation and hyperinflation; copying Mussolini; hoping Bavarian leaders would join.","hint":"1923 crisis."},{"id":"f3","s":"s2","q":"Give two results of the Munich Putsch.","a":"Party banned; Hitler's trial gave him publicity; Mein Kampf; decision to use elections.","hint":"Trial."},{"id":"f4","s":"s3","q":"How did the party reorganise 1924–28?","a":"Gauleiters ran regional branches; SS and Hitler Youth set up; Goebbels's propaganda.","hint":"Branches."},{"id":"f5","s":"s3","q":"How did the Depression affect Germany?","a":"US loans recalled; businesses closed; 6 million unemployed by 1932; rule by decree.","hint":"1929."},{"id":"f6","s":"s4","q":"Give three Nazi methods of winning support.","a":"Propaganda; Hitler's image and rallies; promises to each group; scapegoats; SA marches and violence.","hint":"Goebbels."},{"id":"f7","s":"s5","q":"Why did Papen and Hindenburg appoint Hitler?","a":"They thought they could control him with only three Nazis in the cabinet, and needed Reichstag support.","hint":"Control."}],"checklist":[{"id":"k1","level":"describe","text":"I can describe Hitler's early career and changes to the party in 1920–22.","sections":["s1"]},{"id":"k2","level":"explain","text":"I can explain the causes, events and results of the Munich Putsch.","sections":["s2"]},{"id":"k3","level":"explain","text":"I can explain how the party was reorganised in 1924–28.","sections":["s3"]},{"id":"k4","level":"explain","text":"I can explain the impact of the Great Depression and Nazi methods, including the SA.","sections":["s3","s4"]},{"id":"k5","level":"judge","text":"I can judge why Hitler became Chancellor in January 1933, including the roles of Papen, Schleicher and Hindenburg.","sections":["s5"]}],"exam":{"questions":[{"id":"q1","qtype":"p1b","label":"Teacher-created practice question","sections":["s2"],"q":"Explain two effects of the Munich Putsch on the Nazi Party.","markscheme":null},{"id":"q2","qtype":"p1c","label":"Teacher-created practice question","sections":["s3","s4","s5"],"q":"‘The main reason why Hitler became Chancellor in January 1933 was the Great Depression.’\nHow far do you agree? Explain your answer.","prompts":["the Great Depression","Nazi propaganda"],"markscheme":null}]},"stretch":[{"id":"t1","kind":"Relative significance","task":"Rank the Depression, propaganda, the SA and the actions of Papen and Hindenburg. Which was necessary for Hitler to become Chancellor?"},{"id":"t2","kind":"Counterfactual","task":"If the Wall Street Crash had not happened, would Hitler have become Chancellor? Use the 1928 election result."}]},"y11-de-4":{"id":"y11-de-4","course":"y11","area":"de","kt":"Key topic 4","order":4,"title":"Nazi Germany, 1933–39","status":"published","review":{"state":"awaiting-teacher-check","note":"Original content following 4HI1 Depth study 3, key topic 4. Figures checked against Payne, Pearson Edexcel International GCSE Germany, chapter 4 (pp. 60–92)."},"learn":{"intro":"How did Hitler turn his position as Chancellor into a dictatorship, how did the Nazis control Germany, and how did their policies affect young people, women, the Churches, Jews and workers?","sections":[{"id":"s1","title":"1. Setting up the dictatorship","blocks":[{"p":"The Reichstag Fire (27 February 1933): a Dutch communist, Marinus van der Lubbe, was arrested. Hitler claimed a communist plot; Hindenburg signed an emergency decree suspending civil rights, and thousands of communists were arrested before the March election."},{"p":"The Enabling Act (23 March 1933) gave Hitler the power to make laws without the Reichstag for four years. Communist deputies were banned and the SA intimidated others. Trade unions were banned in May 1933 and by July 1933 the Nazis were the only legal party."},{"p":"The Night of the Long Knives (30 June 1934): Hitler had Ernst Röhm and other SA leaders, plus political rivals, killed by the SS. The SA, which had over 2 million members, had threatened the army and wanted a 'second revolution'. The army was reassured."},{"p":"When Hindenburg died on 2 August 1934, Hitler combined the posts of Chancellor and President as Führer. The army swore an oath of personal loyalty to him."}],"terms":["Reichstag Fire","Enabling Act","Night of the Long Knives","Führer"],"evidence":["27 February 1933: Reichstag Fire.","23 March 1933: Enabling Act.","30 June 1934: Night of the Long Knives.","2 August 1934: Hitler becomes Führer."],"refs":["Payne, IGCSE Germany, ch. 4"]},{"id":"s2","title":"2. Methods of control","blocks":[{"p":"The police state: the SS, led by Heinrich Himmler, and the Gestapo (secret police) arrested opponents; informers reported on neighbours; concentration camps such as Dachau (1933) held political prisoners; judges had to follow Nazi ideas."},{"p":"Propaganda and censorship: Joseph Goebbels controlled newspapers, radio, films, books and art. Cheap radios spread Hitler's speeches; huge rallies at Nuremberg showed Nazi power; books by Jewish or 'un-German' writers were burned in 1933; the 1936 Berlin Olympics showed off Germany."},{"p":"How successful? There was little open opposition, but some continued: Pastor Martin Niemöller and the Confessing Church, some young people who rejected the Hitler Youth, and underground communist and socialist groups. Many Germans conformed through fear, while others supported the regime because it brought jobs and order."}],"terms":["police state","Gestapo","censorship","propaganda"],"evidence":["1933: Dachau opens; book burnings.","1936: Berlin Olympics."],"refs":["Payne, IGCSE Germany, ch. 4"]},{"id":"s3","title":"3. Young people, education, women and the Churches","blocks":[{"p":"Young people: boys joined the Hitler Youth and girls the League of German Maidens, with camping, sport, marching and Nazi ideas. By 1939 8 million young people were members, and membership became compulsory in 1939. In schools, teachers had to join the Nazi Teachers' League; subjects such as history and biology taught Nazi ideas about race."},{"p":"Women: the Nazis wanted women to focus on 'children, kitchen, church'. Marriage loans encouraged women to leave work and have children; the Mother's Cross rewarded large families; women were removed from jobs such as doctors, lawyers and civil servants."},{"p":"The Churches: Hitler signed a Concordat with the Pope in 1933, promising not to interfere with the Catholic Church, but later broke it. The Nazis set up a Reich Church for Protestants; Pastor Niemöller's Confessing Church opposed it, and Niemöller was sent to a concentration camp."}],"terms":["Hitler Youth","League of German Maidens","Kinder, Küche, Kirche","Concordat","Confessing Church"],"evidence":["8 million young people in Nazi youth groups by 1939.","1933: Concordat with the Pope.","Marriage loans; Mother's Cross."],"refs":["Payne, IGCSE Germany, ch. 4"]},{"id":"s4","title":"4. Racial policy and the persecution of Jews","blocks":[{"p":"The Nazis believed in an 'Aryan' master race and treated Jews as enemies. Persecution increased step by step:"},{"ul":["April 1933: a boycott of Jewish shops; Jews dismissed from the civil service.","September 1935: the Nuremberg Laws took away Jews' German citizenship and banned marriages between Jews and non-Jews.","9–10 November 1938: Kristallnacht ('Night of Broken Glass') — synagogues, shops and homes attacked; around 100 Jews killed and about 30,000 Jewish men sent to concentration camps. Jews were then fined 1 billion marks."]}],"terms":["Aryan","boycott","Nuremberg Laws","Kristallnacht"],"evidence":["April 1933: boycott.","September 1935: Nuremberg Laws.","November 1938: Kristallnacht; 1 billion mark fine."],"refs":["Payne, IGCSE Germany, ch. 4"]},{"id":"s5","title":"5. Reducing unemployment and controlling workers","blocks":[{"p":"When Hitler came to power 6 million Germans were unemployed; by 1939 this was reduced to about half a million. Methods: the National Labour Service (RAD) gave young men work on projects such as autobahns; rearmament created jobs in factories; conscription (from 1935) took nearly 1 million men into the armed forces; and women and Jews dismissed from jobs were not counted ('invisible unemployment')."},{"p":"Trade unions were replaced by the German Labour Front (DAF), which controlled wages and hours. Strength Through Joy (KdF) offered cheap holidays, concerts and sport, and a scheme to save for a Volkswagen 'people's car'. Workers had jobs, but longer hours and no right to strike."}],"terms":["National Labour Service (RAD)","German Labour Front (DAF)","Strength Through Joy (KdF)","invisible unemployment"],"evidence":["Unemployment 6 million (1933) → half a million (1939).","1935: conscription."],"refs":["Payne, IGCSE Germany, ch. 4"]}],"timeline":[{"date":"27 Feb 1933","event":"Reichstag Fire"},{"date":"23 March 1933","event":"Enabling Act"},{"date":"April 1933","event":"Boycott of Jewish shops"},{"date":"July 1933","event":"Nazis the only legal party; Concordat with the Pope"},{"date":"30 June 1934","event":"Night of the Long Knives"},{"date":"Aug 1934","event":"Hitler becomes Führer"},{"date":"1935","event":"Conscription; Nuremberg Laws"},{"date":"1936","event":"Berlin Olympics"},{"date":"Nov 1938","event":"Kristallnacht"},{"date":"1939","event":"Hitler Youth membership compulsory"}],"people":[{"name":"Heinrich Himmler","role":"Leader of the SS and police."},{"name":"Joseph Goebbels","role":"Minister of Propaganda."},{"name":"Ernst Röhm","role":"SA leader killed in 1934."},{"name":"Martin Niemöller","role":"Protestant pastor who opposed Nazi control of the Church."},{"name":"Marinus van der Lubbe","role":"Dutch communist arrested for the Reichstag Fire."}],"vocab":[{"term":"Dictatorship","def":"Rule by one person or party with no opposition allowed."},{"term":"Gestapo","def":"The Nazi secret police."},{"term":"Censorship","def":"Controlling what people can read, hear and see."},{"term":"Kristallnacht","def":"'Night of Broken Glass' — attacks on Jews, November 1938."},{"term":"Autobahn","def":"Motorway — built to create jobs."}],"misconceptions":[{"wrong":"Nobody opposed the Nazis.","right":"Some did — Niemöller, the Confessing Church and some young people — but opposition was small and dangerous."},{"wrong":"All unemployed people got real jobs.","right":"Women and Jews removed from work were simply not counted."}]},"quizzes":{"mcq":[{"id":"m1","s":"s1","q":"What did the Enabling Act allow Hitler to do?","options":["Become President","Make laws without the Reichstag","Ban the army","Join the League"],"answer":1,"why":"For four years, from March 1933."},{"id":"m2","s":"s1","q":"Why did Hitler purge the SA in 1934?","options":["It was too small","It threatened the army and wanted a second revolution","It supported the communists","It was run by Himmler"],"answer":1,"why":"Night of the Long Knives, 30 June 1934."},{"id":"m3","s":"s2","q":"Who controlled Nazi propaganda?","options":["Himmler","Goebbels","Röhm","Göring"],"answer":1,"why":"Minister of Propaganda."},{"id":"m4","s":"s3","q":"How many young people were in Nazi youth groups by 1939?","options":["800,000","2 million","8 million","20 million"],"answer":2,"why":"Membership became compulsory in 1939."},{"id":"m5","s":"s4","q":"What did the Nuremberg Laws do?","options":["Banned the SA","Took away Jews' citizenship and banned mixed marriages","Created the Gestapo","Ended unemployment"],"answer":1,"why":"September 1935."},{"id":"m6","s":"s5","q":"What was Strength Through Joy?","options":["A propaganda film","Cheap holidays and leisure for workers","A youth group","A police unit"],"answer":1,"why":"Part of the DAF."}],"short":[{"id":"a1","s":"s1","q":"Who was blamed for the Reichstag Fire?","accept":["van der lubbe","marinus van der lubbe","communists","a communist"],"answer":"Marinus van der Lubbe (a communist)"},{"id":"a2","s":"s4","q":"What is the English name for Kristallnacht?","accept":["night of broken glass","the night of broken glass"],"answer":"Night of Broken Glass"},{"id":"a3","s":"s3","q":"Which pastor led opposition in the Protestant Church?","accept":["niemoller","niemöller","martin niemoller","martin niemöller","niemoeller"],"answer":"Martin Niemöller"},{"id":"a4","s":"s5","q":"What replaced trade unions in 1933?","accept":["daf","german labour front","the german labour front","labour front"],"answer":"The German Labour Front (DAF)"}],"chronology":[{"id":"c1","title":"Put the steps to dictatorship in order","items":["Reichstag Fire","Enabling Act","Trade unions banned","Only one legal party","Night of the Long Knives","Hitler becomes Führer"]}],"matching":[{"id":"x1","title":"Match the group to the Nazi policy","pairs":[["Young people","Hitler Youth and League of German Maidens"],["Women","Marriage loans and the Mother's Cross"],["Workers","German Labour Front and Strength Through Joy"],["Jews","Nuremberg Laws"],["Catholic Church","Concordat of 1933"]]}],"evidence":[{"id":"e1","s":"s5","q":"Give precise evidence of the fall in unemployment.","keywords":[["6 million","half a million","500,000","0.5"]],"model":"Unemployment fell from 6 million in 1933 to about half a million by 1939."},{"id":"e2","s":"s4","q":"Give precise evidence of increasing persecution of Jews.","keywords":[["1933","boycott","1935","nuremberg","1938","kristallnacht","30,000","1 billion"]],"model":"April 1933 boycott; Nuremberg Laws (1935); Kristallnacht (November 1938), with about 30,000 Jewish men sent to camps."}]},"flashcards":[{"id":"f1","s":"s1","q":"How did Hitler use the Reichstag Fire?","a":"Claimed a communist plot; emergency decree suspended civil rights; thousands of communists arrested.","hint":"Blame the communists."},{"id":"f2","s":"s1","q":"What happened when Hindenburg died?","a":"Hitler became Führer (Chancellor and President); the army swore loyalty to him.","hint":"August 1934."},{"id":"f3","s":"s2","q":"Name three parts of the Nazi police state.","a":"SS, Gestapo, concentration camps, informers, Nazi-controlled courts.","hint":"Himmler."},{"id":"f4","s":"s2","q":"Give three propaganda methods.","a":"Radio, Nuremberg rallies, films, posters, book burning, the 1936 Olympics.","hint":"Goebbels."},{"id":"f5","s":"s3","q":"How did the Nazis control education?","a":"Teachers joined the Nazi Teachers' League; the curriculum taught Nazi race ideas; Hitler Youth outside school.","hint":"Teachers + subjects."},{"id":"f6","s":"s3","q":"What did the Nazis expect of women?","a":"Children, kitchen, church — marry, have children and stay at home.","hint":"Three Ks."},{"id":"f7","s":"s4","q":"What happened on Kristallnacht?","a":"Attacks on synagogues, shops and homes; around 100 Jews killed; about 30,000 men to camps; a 1 billion mark fine on Jews.","hint":"November 1938."},{"id":"f8","s":"s5","q":"How did the Nazis reduce unemployment?","a":"Labour Service (autobahns), rearmament, conscription, and not counting women and Jews.","hint":"Roads, weapons, army."}],"checklist":[{"id":"k1","level":"describe","text":"I can describe how Hitler
